# 筋書き no-faces: 審査が穴を挙げない（faces 空・faces_none に確かめたこと）。spec.revise は写しの条件 spec_revise_due で na になり、
# revise-route が go: false を返して直す役の輪を飛ばし、そのまま関所へ行く。
# スクリプトの節は全部 stub（盤面は dry-run の対象に無い。スクリプトの中身は tests/test_blk_spec.py が子のプロセスで回す）。
# 関所 spec-gate は stub を取らず、模擬実行では自動で通る（--pause-at-gates 無し）。答えは spec-answer の stub に書く。
write-route: {go: true, node: spec.write, why: spec.write が ready}
write-prep:
  prompt_file: board/prompts/r1/spec.write.md
  attempt: 1
  out_path: board/out/r1/spec.write.json
  node: spec.write
  already: false
spec-write:
  requirements:
  - {key: R1, text: mean は 3 つの数の平均を返す}
  acceptance:
  - {key: A1, requirement: R1, file: test_spec_accept.py, name: test_mean_is_middle, run: python3 -m unittest test_spec_accept}
  out_of_scope: []
write-accept: {ok: true, done: true, give_up: false, reason: '', node: spec.write}
review-route: {go: true, node: spec.review, why: spec.review が ready}
review-prep:
  prompt_file: board/prompts/r1/spec.review.md
  attempt: 1
  out_path: board/out/r1/spec.review.json
  node: spec.review
  already: false
spec-review:
  faces: []
  faces_none: 要件 R1 と A1 の Then は依頼の 2 つ目と同じ値を見ている。範囲の外も無い
  reason: 要件 R1 と受け入れ条件 A1 を読み、境目の入力を確かめた
review-accept: {ok: true, done: true, give_up: false, reason: '', node: spec.review}
revise-route: {go: false, node: spec.revise, why: 'spec.revise は na（na: 仕様の審査が挙げた穴は 0 件）'}
spec-ask:
  ask: true
  stop: false
  gate_text: "修正の前の関所（盤面の問い spec.approve・種類: spec_approval）\n\n仕様（要件と受け入れ条件）を承認するか。…\n"
  why: ''
spec-answer: {answered: true, decision: approve, stop: false, why: ''}
collect:
  ok: true
  reason: ''
  spec_file: board/r1/spec.json
  tests:
  - {file: test_spec_accept.py, sha: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0}
  approved_by: human:spec-gate
  approval_note: 受け入れ条件 A1 で進めてよい
  frozen_rev: 1f0e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c
  requirements: 1
  acceptance: 1
  faces: 0
  handled: 0
fixture:
  expect: completed
  reached:
  - write-route
  - write-prep
  - spec-write
  - write-accept
  - review-route
  - review-prep
  - spec-review
  - review-accept
  - revise-route
  - spec-ask
  - spec-gate
  - spec-answer
  - collect
