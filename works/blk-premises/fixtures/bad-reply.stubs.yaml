# 実測役が毎回同じ悪い返答（kind=実測 なのに measured_output が無い）を返し、受け付けが写した規則
# （measured_needs_output）で拒む筋書き。premises の中身は tests/replies/premises_no_output.json と同じ。
# 本番の run では輪が上限（3 回）で premises-loop が落ちる。dry-run は until_bash を回さず輪を 1 回で済んだと
# みなす（Archon 0.11.1）ので、筋書きでは受け付けが premises.json を書かなかったことを collect が見つけて落ちる。
# どちらでも出口は返らない（ラインでは判定役が起きない）。
fixture:
  expect: failed
  fail-node: collect
  reached:
  - intake
  - premises
  - premises-accept
  inputs:
    request: request_ok.json
exec-code: true
premises:
  constraints:
  - text: CI の定義はリポジトリに無い
    measured_how: 覚えている構成から
    kind: 実測
