# 筋書き green: 宣言の段とテストのコマンドの段がどちらも緑で、p4.ci が clean。節 run は盤面を開くので stub（中身は
# tests/test_blk_tests_delta.py の TestTestsModes が子のプロセスで回す）
run:
  ok: true
  green: true
  log: board/r1/p4.ci.log
  suites:
  - name: suite
    exit: 0
  - name: test_cmd
    exit: 0
  by: engine
fixture:
  inputs:
    cmd: "test -f stats.py"
  expect: completed
  reached: [run]
