name: blk-tests
description: |
  最後のテストのブロック（盤面の p4.ci）。対象リポジトリで宣言（.review-checks.json）と、在ればテストのコマンドを走らせ、
  緑か赤かとログのパスを出す。ラインから include で使う。赤でも節は通る（ok: true・green: false）——赤を人の関所に見せるのが
  この段の仕事で、赤で run を止めない。宣言が無く cmd も空なら by: role_needed（p4.ci は任せ先に落ちたまま待つ）。

inputs:
  cmd:
    required: true
    description: テストのコマンド（対象リポジトリの根で走らせる 1 行。空でよい——空なら宣言だけ。自分のプロセスグループで走り、止めるときは木ごと止める）

returns: run
outcome_field: ok

nodes:
  # scripts/run_tests.py が盤面の p4.ci を entry.run_ci で走らせる（宣言の段と cmd の段）。コマンドは本文に差し込まず環境変数
  # INPUTS_CMD で受け取る——値がシェルの記号を含んでもデータのまま届く。テストは自分のプロセスグループで走り、run が止められたら
  # （Ctrl-C・SIGTERM・期限・直下の親 uv の消失）テストが背景に起こした孫まで木ごと止める（.shared/core/tree_run.py）。Archon は
  # 直下の子しか止めないので、孫が止めた後も作業ツリーに書き続けた（試作で実測）。テストのコマンドには uv run が足した物（PATH の頭の
  # python の bin・VIRTUAL_ENV・UV_RUN_RECURSION_DEPTH）を外した環境を渡す（外さないと python3 が uv の python を指して偽の赤になる）。
  # 木ごと止める殻を pack の中から引くため bash の節でなく script の節（bash の節は対象リポジトリで走り、pack の場所を知らない）
  - id: run
    script: run_tests
    runtime: uv
    with:
      cmd: $INPUTS.cmd
    timeout: 1728000000
    output_format:
      type: object
      additionalProperties: false
      required: [ok, green, log]
      properties:
        ok: {type: boolean}
        green: {type: boolean}
        log: {type: string}
        suites:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, exit]
            properties:
              name: {type: string}
              exit: {type: [integer, "null"]}   # null は起こせなかった段（関所と報告は環境の失敗としてコードの赤と分けて出す）
              launch: {type: string, enum: [broken]}   # tree_run.launch_kind（clean・red の段には無い）
              how: {type: string, enum: [direct, shell]}   # 走った時の起こし方（宣言の段は direct。cmd・test_cmd の段は起こす前に tree_run.command_argv で決めた値）
        by: {type: string, enum: [engine, role, role_needed]}
        # test_cmd が宣言の段と同じコマンドだった時、その段の名（1 度だけ走らせた）
        test_cmd_same_as: {type: string}
        # test_cmd を宣言の段と別に走らせた時、走った時の起こし方（run_ci の返り。読む時に規則で作り直さない）
        test_cmd_how: {type: string, enum: [direct, shell]}
