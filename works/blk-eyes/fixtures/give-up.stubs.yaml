# 筋書き give-up: r2.design の返答が 3 回とも受け付けで拒まれ、3 回目に諦めの印（done: true・give_up: true）を出す。
# r2.design は省けない（表で skippable でない）ので r2.compare・stop.premise_check は待たない。collect は目が待ちのまま残った盤面を
# 見て、最後の拒否の文で盤面を止め（by works:eyes）、ok: false を返す（輪は max_iterations で落ちないので、collect まで届く）。
# 注意: dry-run は until_bash を回さず、輪を 1 回で済んだとみなす（Archon 0.11.1）。だからこの筋書きは、輪が抜けた後の配線
# （後ろの route → collect）しか見ない。3 回目の拒否で輪が抜ける式（until_bash の done）は tests/test_blk_eyes.py の
# test_loop_gives_up_after_three_rejections が、Archon と同じ順でスクリプトを回し、until_bash の式を sh で評価して見る。
