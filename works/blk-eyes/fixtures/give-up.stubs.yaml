# 筋書き give-up: 修正の前に作る独立設計（r2.design）の役が 3 回とも拒まれ、設計が盤面へ渡っていない（設計の輪は止めずに先へ進む）。
# r2.compare は設計を待ったまま出ず、stop.premise_check も待たない。collect は目が待ちのまま残った盤面を見て、『独立設計が
# 取れなかった』と設計の最後の拒否の文で盤面を止め（by works:eyes）、ok: false を返す（今までと同じく目の層で止まる）。
# 目の輪が 3 回目の拒否で抜ける式（until_bash の done）は、dry-run は until_bash を回さず輪を 1 回で済んだとみなす（Archon 0.11.1）
# ので、tests/test_blk_eyes.py の test_loop_gives_up_after_three_rejections が、Archon と同じ順でスクリプトを回し、until_bash の
# 式を sh で評価して見る。
eyes-enter:
  ok: true
  round: 1
  stopped: false
  asking: false
  ready:
  - r1-comments
  snapshot_file: board/r1/eyes-snapshot.json
  why: ''
