  - id: r4-scope-loop
    depends_on: [r4-scope-route]
    when: "$r4-scope-route.output.go == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $r4-scope-accept.output.done = true   # 通った時か、3 回目の拒否で諦めた時（max_iterations で落とさない）
      nodes:
        - id: r4-scope-prep
          script: prep
          runtime: uv
          timeout: 1728000000
          with:
            role: r4-scope
            round: $eyes-enter.output.round
          output_format:
            type: object
            additionalProperties: false
            required:
            - prompt
            - prompt_file
            - node
            - attempt
            - already
            - role_def
            - role_def_missing
            properties:
              prompt:
                type: string
              prompt_file:
                type: string
              node:
                type: string
              attempt:
                type: integer
              already:
                type: boolean
              role_def:
                type: string
              role_def_missing:
                type: string
        - id: r4-scope
          model: sonnet               # 役 inspector の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
          command: r4-scope
          depends_on: [r4-scope-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: ["Read", "Grep", "Glob"]   # 読むだけ（graphloops の inspector の定義の道具）
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # eyes.output_format("r4.hidden_scope")（写しの schema に印）を貼った物（tests/test_blk_eyes.py が一致を見る）
          output_format:
            description: 'works-node: r4-scope'
            type: object
            required:
            - status
            - reason
            - capability_inventory
            - policy_conflicts
            - surfaced
            additionalProperties: false
            properties:
              status:
                type: string
                enum:
                - pass
                - redesign-needed
                - unverifiable
              reason:
                type: string
                minLength: 1
              capability_inventory:
                type: object
                required:
                - fired
                additionalProperties: false
                properties:
                  fired:
                    type: boolean
                  lost:
                    type: array
                    items:
                      type: string
                  note:
                    type: string
              policy_conflicts:
                type: array
                items:
                  type: string
                  minLength: 1
              surfaced:
                type: array
                items:
                  type: object
                  required:
                  - where
                  - text
                  additionalProperties: false
                  properties:
                    where:
                      type: string
                    text:
                      type: string
                    mechanism:
                      type: string
                    measured:
                      type: string
                    false_positive_if:
                      type: string
        - id: r4-scope-accept
          script: accept
          runtime: uv
          timeout: 1728000000
          depends_on: [r4-scope]
          with:
            role: r4-scope
            reply: {from: "$r4-scope.output"}
          output_format:
            type: object
            additionalProperties: false
            required:
            - ok
            - done
            - give_up
            - skipped
            - reason
            - node
            - reason_file
            properties:
              ok:
                type: boolean
              done:
                type: boolean
              give_up:
                type: boolean
              skipped:
                type: boolean
              reason:
                type: string
              node:
                type: string
              reason_file:
                type: string

  # 出口。入口の周の箱で目の状態を見る。人に聞いていれば止めずに asking。目が残れば（3 回とも拒まれた）盤面を止めて ok: false
  - id: eyes-collect
    script: collect
    runtime: uv
    timeout: 1728000000
    depends_on: [r1-minimality-route, r1-minimality-loop, premise-check-route, premise-check-loop, r3-coherence-route, r3-coherence-loop, r4-scope-route, r4-scope-loop]
    trigger_rule: none_failed_min_one_success
    with:
      round: $eyes-enter.output.round
    output_format:
      type: object
      additionalProperties: false
      required:
      - ok
      - reason
      - complete
      - asking
      - stopped
      - eyes
      - gave_up
      - after_fix
      - open_units
      - r1_refire
      - r2_refire
      - purpose_known
      - purpose_unusable
      - reviews
      - premise
      - retaken_for_reviews
      - exit_file
      properties:
        ok:
          type: boolean
        reason:
          type: string
        complete:
          type: boolean
        asking:
          type: boolean
        stopped:
          type: boolean
        eyes:
          type: object
          additionalProperties:
            type: string
        gave_up:
          type: array
          items:
            type: string
        after_fix:
          type: object
          additionalProperties: false
          required:
          - rev
          - diff_file
          - changed_files
          - diff_lines
          properties:
            rev:
              type: string
            diff_file:
              type: string
            changed_files:
              type: array
              items:
                type: string
            diff_lines:
              type: integer
        open_units:
          type: integer
        r1_refire:
          type: boolean
        r2_refire:
          type: boolean
        purpose_known:
          type: boolean
        purpose_unusable:
          type: string
        reviews:
          type: object
          additionalProperties: false
          required:
          - R1
          - R2
          - R3
          - R4
          properties:
            R1: &id001
              type:
              - object
              - 'null'
              properties:
                status:
                  type: string
                reason:
                  type: string
            R2: *id001
            R3: *id001
            R4: *id001
        premise:
          type: object
          additionalProperties: false
          required:
          - facts_to_add
          properties:
            facts_to_add:
              type: array
              items:
                type: string
        retaken_for_reviews:
          type: string
        exit_file:
          type: string
