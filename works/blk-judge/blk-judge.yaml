name: blk-judge
description: |
  判定のブロック。人の修正依頼（findings の JSON の配列か、{findings, pr, issue} の形）を受け付けて、判定役（読むだけ）に根本の単位へまとめさせ
  （ラインの盤面が在れば、凍結した目的の文と素材も盤面から描いて読ませる。judge-brief）、
  受け付けの規則に通るまで同じ会話で出し直させる（上限 3 回。ラインの盤面が在れば受け付けは盤面の p2.diagnose の done——本線と同じ）。
  判定の根を開く（線の木の段 3。設計 docs/plans/2026-10-06-judge-verify.md）: 開いた単位が 2 つ以上なら（入力 verify が off なら回さない）、受け付けた判定の後に
  束ね役（judge-verify）が単位ごとの裏取りの下請け（根本か・証拠・場所）と単位どうしの相乗りの下請け（重複・関わり・順番）を
  Agent で並べて起こし、機械がその答えを今の周の申し送り judge-verify.json にまとめる。単位は消さない（申し送りになるだけ）。
  ラインから include で使う。
  出口は盤面の judgment.json のパスと、直す義務の残る単位の key の一覧と、直す物が在るか（need_fix）。

inputs:
  request:
    default: ""
    description: 人の修正依頼（findings の JSON の配列か、{findings, pr, issue} の形）のファイルのパス。対象リポジトリの根からの相対か絶対。空を受けるのはラインが依頼を持たずに変更から入った run だけ（intake が盤面の start の控えで確かめる）
  base_rev:
    default: ""
    description: 周の頭で固めた版。空なら受け付けの時の HEAD（Ruling R2）
  policy_paste:
    default: ""
    # 渡すときは前の節の出力の欄の直の参照（$<節>.output.<欄>）1 つにする（tests/test_policy.py が見る）。run の入力や
    # $INPUTS 経由で渡すと、Archon が差し込んだ後に指示書全体を置き換え直し、方針の中の $CONTEXT・$<節>.output が消えるか、
    # 走っていない節への $<節>.output.<欄> で判定役の節が落ちる（Task 2 の直し 1 の試し。Archon v0.11.1 の dry-run）
    description: 人の方針（固めた版の本文。役は代償として決めない）。空なら方針の文書は無い（仕様 3.1）
  premises_file:
    default: ""
    description: 前提の実測のファイル（盤面の p0.premises の出力）。空なら無い（仕様 3.6）
  verify:
    default: ""
    description: >-
      判定の裏取り（開いた単位ごとの裏取りと単位どうしの相乗りの下請け）を回すか。on（空も on。今どおり）か off。off なら
      支度が単位の数に依らず go 偽で束ね役を起こさず、申し送りを置かない（前の残りも消す）。ほかの語は支度が 2 で落ちる

returns: collect
outcome_field: ok

nodes:
  # 依頼の型を graphloops の add と同じ規則で確かめ、盤面の request.json に積む。
  # 読めない・JSON でない・規則が拒むなら終了コード 1 で run を止める（AI を起こす前に止める）
  - id: intake
    script: intake
    runtime: uv
    timeout: 1728000000
    with:
      request: $INPUTS.request

  # 判定役を起こす前に、ラインの盤面から本線の判定の「入力」の節（凍結した目的・素材の 15 欄・P1 の所見・前の決定の突合・
  # 依頼・差分・観点の正本）と問いの台帳の段を engine の描き方で描き、判定役が Read するファイルに置く（R61 judgeread・run 27）。
  # 作業ツリーの姿と起こした印も置く（受け付けが盤面へ渡す）。ラインの盤面が無ければ（ブロックを単独で回した）空。
  # 盤面が止まっていれば（同じ境の節の後ろの素材集めが止めた。run 30）go: false で判定役を起こさない。
  # 止まっていない盤面で p2.diagnose が待っていなければ 2（線の順の誤り）
  - id: judge-brief
    script: brief
    runtime: uv
    timeout: 1728000000
    depends_on: [intake]
    output_format:
      type: object
      additionalProperties: false
      required: [ok, go, materials_file]
      properties:
        ok: {type: boolean}
        go: {type: boolean}
        materials_file: {type: string}

  # 判定役 → 受け付け。受け付けが拒めば、拒んだ理由のファイルのパスを渡して同じ会話で出し直させる（R44）。
  # 輪は受け付けの done（通った時か 3 回目の拒否）で抜ける（max_iterations で落とさない。R50）
  - id: judge-loop
    depends_on: [judge-brief]
    when: "$judge-brief.output.go == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $judge-accept.output.done = true
      nodes:
        - id: judge
          model: opus                 # 役 judge の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
          effort: high                # 役 judge の前付けの effort（段は前付けを読まない。tests/test_tool_parity.py の RoleModelCase が縛る）
          command: diagnose
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # node_marker.mark(role_schema("p2.diagnose"), "judge") を 1 度出して貼った物（tests/test_blk_judge.py が印を外して一致を見る）。
          # 一番上の description は節の印（包みが argv の --json-schema から読む。裁定 TA20）で、返答の型の検査には効かない
          output_format:
            description: "works-node: judge"
            type: object
            required: [units, questions, framing, one_shot, materials_missing, carried_r1, one_shot_closes, precedents]
            additionalProperties: false
            properties:
              units:
                type: array
                items:
                  type: object
                  required: [key, label]
                  additionalProperties: true
                  properties:
                    key: {type: string, minLength: 1}
                    label:
                      type: string
                      enum: [block, suggest, nit, question, info]
                    disposition:
                      type: string
                      enum: [do-now, defer]
                    reason: {type: string}
                    reopen_evidence: {type: string}
                    origin_analysis: {type: string}
                    why_chain:
                      type: array
                      items: {type: string}
                    prescriptions:
                      type: array
                      items: {type: string}
                    closed_note: {type: string}
                    class_query:
                      type: object
                      required: [how, counts, total]
                      additionalProperties: false
                      properties:
                        how:
                          type: object
                          required: [patterns, paths, count]
                          additionalProperties: false
                          properties:
                            patterns:
                              type: array
                              minItems: 1
                              maxItems: 20
                              items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]+$'}
                            fixed: {type: boolean}
                            paths:
                              type: array
                              minItems: 1
                              maxItems: 50
                              items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]+$'}
                            count:
                              type: string
                              enum: [lines, files]
                            untracked: {type: boolean}
                            ignore_case: {type: boolean}
                            word: {type: boolean}
                        counts:
                          type: string
                          enum: [defects, population]
                        total: {type: integer, minimum: 0}
                        note: {type: string}
                        hits:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]+$'}
                        misses:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]+$'}
                        examples_unavailable: {type: string, minLength: 10}
                        misses_omitted_why: {type: string, minLength: 10}
              questions:
                type: array
                items:
                  type: object
                  required: [key, kind, status, reason]
                  additionalProperties: false
                  properties:
                    key: {type: string, minLength: 1}
                    kind:
                      type: string
                      enum: [fork, split, rule, stuck, thrash, premise, unverifiable, awaiting, field]
                    status:
                      type: string
                      enum: [held, decided, resolved, escalate]
                    reason: {type: string}
                    resolution: {type: string}
                    options:
                      type: array
                      items: {type: string}
                    depends:
                      type: array
                      items: {type: string}
                    origin: {type: string}
              framing: {type: string}
              one_shot: {type: string}
              materials_missing:
                type: array
                items: {type: string}
              carried_r1:
                type: array
                items:
                  type: object
                  required: [where, disposition]
                  additionalProperties: false
                  properties:
                    where: {type: string, minLength: 1}
                    disposition:
                      type: string
                      enum: [promote, decline]
                    unit_key: {type: string}
                    why: {type: string}
              router:
                type: array
                items:
                  type: object
                  required: [key, route, note]
                  additionalProperties: false
                  properties:
                    key: {type: string}
                    route: {type: string}
                    note: {type: string}
              reburn_causes:
                type: array
                items:
                  type: object
                  required: [key, cause]
                  additionalProperties: false
                  properties:
                    key: {type: string}
                    cause:
                      type: string
                      enum: [コード, レビュアー, 規約, 前の周の修正]
                    note: {type: string}
              one_shot_closes:
                type: array
                items: {type: string}
              precedents:
                type: array
                items:
                  type: object
                  required: [key, problem, source, verdict, reason]
                  additionalProperties: false
                  properties:
                    key: {type: string, minLength: 1}
                    problem: {type: string, minLength: 4}
                    source: {type: string}
                    verdict:
                      type: string
                      enum: [adopt, adapt, does_not_apply, not_found]
                    reason: {type: string, minLength: 4}
                    searched: {type: string}
                    undecided_because: {type: string}
              # 凍結した目的の外として単位にしなかった材料の所見（outpurpose.with_field。受け付けが外して材料の行に当て、次の run の依頼に運ぶ）
              out_of_purpose:
                type: array
                items:
                  type: object
                  required: [source, where, why_outside]
                  additionalProperties: false
                  properties:
                    source: {type: string, minLength: 1}
                    where: {type: string, minLength: 1}
                    why_outside: {type: string, minLength: 10}
                    text: {type: string, minLength: 1}
        - id: judge-accept
          script: accept
          runtime: uv
          timeout: 1728000000
          depends_on: [judge]
          with:
            reply: {from: "$judge.output"}
            base_rev: $INPUTS.base_rev
          output_format:
            type: object
            properties:
              ok: {type: boolean}
              done: {type: boolean}           # 輪を抜ける旗（通った時か 3 回目の拒否。R50）
              reason: {type: string}
              reason_file: {type: string}     # 拒否の理由の本文を書いた盤面のファイル（通れば空。script_io・rolekit）
              open_units: {type: array, items: {type: string}}
            required: [ok, done, reason, reason_file, open_units]

  # 判定の根を開く（線の木の段 3）の支度: 受け付けた判定の開いた単位ごとの裏取りの下請けのファイル・相乗りのファイル・束ね役の
  # 指示書を書き、申し送りの初めの形（全部「確かめられなかった」）を置く。開いた単位が 2 つ未満・盤面が無い・止まった盤面・判定が
  # 無い（輪が 3 回とも拒んだ）なら go: false で束ね役を起こさない（1 単位は相乗りが無く、事前審査の下請けと重なる。設計書）
  - id: verify-prep
    script: verify
    runtime: uv
    timeout: 1728000000
    depends_on: [judge-brief, judge-loop]
    trigger_rule: none_failed_min_one_success   # 止まった盤面では輪が飛ぶ（支度の go 偽）
    with:
      stage: prep
      verify: $INPUTS.verify
    output_format:
      type: object
      additionalProperties: false
      required: [ok, go, prompt_file]
      properties:
        ok: {type: boolean}
        go: {type: boolean}
        prompt_file: {type: string}

  # 裏取りの束ね役: 下請けを Agent で 1 つのメッセージに並べて起こし（型は全部 general-purpose）、下請けは答えを盤面の外の run ごとの
  # 置き場に Write で書く。返答は 1 行の要約だけ（答えの中身は機械がまとめる）。判定役とは別の目なので判定役の会話を継がない
  # （context: fresh）。作業ツリーは書かない（mutates_checkout: false。変わればまとめが盤面を止める）
  - id: judge-verify
    model: opus                 # 確かめる目の役（本線の judge に当たる。tests/test_tool_parity.py の RoleModelCase が縛る）
    effort: high
    prompt: 指示書 `$verify-prep.output.prompt_file` を Read で読み、その指示に従え。返すのは指示書の JSON Schema に合う JSON だけ。
    depends_on: [verify-prep]
    when: "$verify-prep.output.go == true"
    context: fresh
    settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
    allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch, Agent, Write]
    mutates_checkout: false
    sandbox: {enabled: true, allowUnsandboxedCommands: false}
    idle_timeout: 1728000000
    # judgeverify.output_format()（tests/test_blk_judge.py が一致を見る）
    output_format:
      description: 'works-node: judge-verify'
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary: {type: string, minLength: 10}

  # 裏取りのまとめ: 束ね役が通った時だけ走る（落ちた・飛んだ時は支度の置いた初めの申し送りが残る）。答えのファイルを型で確かめ、
  # 単位ごとの行と相乗り（番号を単位の key に戻す）を今の周の judge-verify.json に書く。作業ツリーが変わっていれば盤面を止める
  - id: verify-merge
    script: verify
    runtime: uv
    timeout: 1728000000
    depends_on: [judge-verify]
    with:
      stage: merge
      verify: $INPUTS.verify   # まとめは読まない（同じスクリプトの入力の組を揃える。支度が off なら番号の控えが無く空を返す）
    output_format:
      type: object
      additionalProperties: false
      required: [ok, verify_file, verified, unverified]
      properties:
        ok: {type: boolean}
        verify_file: {type: string}
        verified: {type: integer, minimum: 0}
        unverified: {type: integer, minimum: 0}

  # loop_group の出力は型を持てないので、輪の後ろで盤面の judgment.json から出口を組む。受け付けを通った判定が無ければ
  # （輪が 3 回とも拒んで抜けた・止まった盤面で輪が飛んだ）ラインの盤面は（止まっていなければ最後の拒否の文で止めて）ok: false、単独の run は 1
  - id: collect
    script: collect
    runtime: uv
    timeout: 1728000000
    depends_on: [judge-brief, judge-loop, verify-merge]
    trigger_rule: none_failed_min_one_success   # 止まった盤面では輪が飛ぶ（支度の go 偽）。裏取りのまとめが飛んでも走る
    output_format:
      type: object
      properties:
        ok: {type: boolean}
        open_units: {type: array, items: {type: string}}
        need_fix: {type: boolean}
        judgment_file: {type: string}
        one_shot: {type: string}
      required: [ok, open_units, need_fix, judgment_file, one_shot]
