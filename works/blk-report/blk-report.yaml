name: blk-report
description: |
  報告のブロック（本線 review-graph の R13。graph の節 report＋finalize）。周の締め（converge）の後か、人が run を止めた後に、
  盤面が報告の節を出す。役は書き手 1 つ（report-write。読むだけ）: 報告の頭——平易な 3 行と人が決めること——と、記録から写す
  本文の全部を書く。書いた物の頭を、道具を持たない初見の読み手（report-write-cold。毎回新しい会話）が頭だけを読み、
  redesign-needed なら受け付けが書き手に返す（上限の回は受け取り、報告の冒頭に「初見の確かめを通っていない」と出す）。
  本線の頭だけの書き手（report.human_items）と初見検査の節（report.cold_check）はこのラインの表で absent（2026-10-09 の片付け:
  後の書き手が頭を書き直し、初見検査は 56 本とも redesign-needed で、AI の起動 2 回を使うだけだった）。数の出どころは盤面から
  機械が組んだ事実（線 A の機械の報告を machine_report で渡せばそれ）で、出口の報告の最後に機械がそのまま付ける。
  書き手を回すかは盤面の ready だけで決まる（rp-route）。report を出す前の検証器の関所（pre: finalize）は盤面の settle が
  踏み、通らなければ書き手は起きない。指示書は本線 a1202d0 の写し（prompts/。台帳の手直しのほかは同じ）を盤面の値で描いた物で、
  持ち主の書式の決まり（冒頭 3 行・セルに文を入れない など）は commands/ の側に足す。ラインから include で使う（darkfactory の
  節 reporting）。出口 collect: 盤面の report-ai.md（来歴の 1 行＋本文＋語の定義の節＋機械の事実）と、初見の読み手の最後の判定と、
  種類ごとの拒否の回数（rejects）。AI の報告を作れなかった時も、理由と機械の事実を付けた報告を書いて ok: false。

inputs:
  machine_report:
    default: ""
    description: |
      線 A の機械の報告（Task 15 の report.md）のパス。空なら盤面から機械が数えた事実を使う。どちらも書き手の数の出どころで、
      出口の報告の最後に字のまま付く

returns: collect
outcome_field: ok

nodes:
  # report — 報告の頭と本文の全部（書き手。盤面の settle が検証器の関所を通した時だけ ready）
  - id: rp-route
    script: route
    runtime: uv
    timeout: 1728000000
    with:
      role: report-write
    output_format:
      type: object
      additionalProperties: false
      required: [next, node, why]
      properties:
        next: {type: string}
        node: {type: string}
        why: {type: string}

  - id: report-write-loop
    depends_on: [rp-route]
    when: "$rp-route.output.next == 'report-write'"
    loop_group:
      max_iterations: 3
      fresh_context: false        # 書き手は同じ会話で出し直す（印の旗 self-resume）。中の初見の読み手は節の context: fresh
      until_bash: test $report-write-accept.output.done = true   # 通った時か、3 回目の拒否で諦めた時（max_iterations で落とさない）
      nodes:
        - id: report-write-prep
          script: prep
          runtime: uv
          timeout: 1728000000
          with:
            role: report-write
            machine_report: $INPUTS.machine_report
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, attempt, node, facts_file, already]
            properties:
              prompt_file: {type: string}
              attempt: {type: integer}
              node: {type: string}
              facts_file: {type: string}
              already: {type: boolean}
        - id: report-write
          model: sonnet               # 読んで確かめる・まとめる役（前付けの無い役。表 .shared/core/stage-models.json の値で tests/test_tool_parity.py が縛る。WORKS_DEV_MODEL の明示で替わる。持ち主 2026-10-06）
          effort: medium              # 同じ表の effort（段に書かないと run の既定で黙って走る）
          command: report-write
          depends_on: [report-write-prep]
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # report_roles.output_format("report-write")（本文の型に印）を貼った物（tests/test_blk_report.py が一致を見る）
          output_format:
            description: 'works-node: report-write self-resume'
            type: object
            required: [text]
            additionalProperties: false
            properties:
              text: {type: string, minLength: 1}
              terms:
                type: array
                items:
                  type: object
                  required: [term, definition]
                  additionalProperties: false
                  properties:
                    term: {type: string, minLength: 1}
                    definition: {type: string, minLength: 1}
        # 書き手の出した物の頭を、道具を持たない初見の読み手が読む。redesign-needed なら受け付けが書き手に返す（上限の回は
        # 受け取り、報告の冒頭に「初見の確かめを通っていない」と出す）
        - id: report-write-cold-prep
          script: cold_prep
          runtime: uv
          timeout: 1728000000
          depends_on: [report-write]
          with:
            writer: {from: "$report-write.output"}   # reply の鍵は受け付けの節だけが持つ（受け付けではない）
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, prompt]
            properties:
              prompt_file: {type: string}
              prompt: {type: string}
        - id: report-write-cold
          model: sonnet               # 役 cold-reader の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
          effort: medium              # 役 cold-reader の前付けの effort（段は前付けを読まない。tests/test_tool_parity.py の RoleModelCase が縛る）
          # 指示は commands/report-write-cold.md（初見の読み手の決まり）に書き手の頭を描いた本文を入れた物（支度が組む）
          prompt: $report-write-cold-prep.output.prompt
          depends_on: [report-write, report-write-cold-prep]
          # どの周も新しい会話（初見の読み手）。Archon の輪は直前の AI の節の会話を次の AI の節に継がせるので、書かないと書き手の
          # 会話の続きで読み、1 回目から初見でなくなる（run f57a5374）。書き手は印の旗 self-resume で自分の会話に戻る
          context: fresh
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: []           # 道具を一切持たない（本線の cold-reader の tools: []。貼られた本文だけを読む）
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # report_roles.output_format("report-write-cold")（写しの report.cold_check の schema に印）を貼った物（tests/test_blk_report.py が一致を見る）
          output_format:
            description: 'works-node: report-write-cold'
            type: object
            required: [verdict, stops, guessed, decidable]
            additionalProperties: false
            properties:
              verdict:
                type: string
                enum: [pass, redesign-needed]
              stops:
                type: array
                items: {type: string}
              guessed:
                type: array
                items: {type: string}
              decidable: {type: boolean}
        - id: report-write-accept
          script: accept
          runtime: uv
          timeout: 1728000000
          depends_on: [report-write, report-write-cold]
          with:
            role: report-write
            reply: {from: "$report-write.output"}
            cold: {from: "$report-write-cold.output"}
          output_format:
            type: object
            required: [ok, done, give_up, reason, reason_file, node, record_invalid]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}     # 拒否の理由の本文を書いた盤面のファイル（通れば空。script_io。裁定 R44）
              node: {type: string}
              record_invalid: {type: boolean}

  # 出口。AI の報告を作れなかった時も、理由と受けた分と機械の事実を付けた報告を書いて ok: false
  - id: collect
    script: collect
    runtime: uv
    timeout: 1728000000
    depends_on: [rp-route, report-write-loop]
    trigger_rule: none_failed_min_one_success
    with:
      machine_report: $INPUTS.machine_report
    output_format:
      type: object
      required: [ok, reason, report_file, text_file, facts_file, cold_check, record_invalid, rejects]
      properties:
        ok: {type: boolean}
        reason: {type: string}
        report_file: {type: string}
        text_file: {type: string}
        facts_file: {type: string}
        cold_check:              # 書き手の頭を読んだ初見の読み手の最後の判定（読んでいなければ verdict 空）
          type: object
          required: [verdict, stops, guessed, decidable]
          properties:
            verdict: {type: string}
            stops:
              type: array
              items: {type: string}
            guessed:
              type: array
              items: {type: string}
            decidable: {type: boolean}
        record_invalid: {type: boolean}
        # この周の拒否の回数 {節: {cold（書き手の輪の中で頭を読んだ初見の読み手）, format（表のセル）, answer（返答の型・take）}}
        rejects:
          type: object
          additionalProperties:
            type: object
            required: [cold, format, answer]
            properties:
              cold: {type: integer}
              format: {type: integer}
              answer: {type: integer}
