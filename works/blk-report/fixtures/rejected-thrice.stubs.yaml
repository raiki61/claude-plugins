# 筋書き rejected-thrice: 書き手の返答を受け付けが 3 回拒み（表のセルに説明の文）、3 回目に諦めの印（done: true・
# give_up: true）を出す。collect が理由と機械の事実だけの報告を書いて ok: false。
# 注意: dry-run は until_bash を回さず、輪を 1 回で済んだとみなす（Archon 0.11.1）。だからこの筋書きは、輪が抜けた後の配線
# （collect）しか見ない。3 回目の拒否で輪が抜ける式（until_bash の done）は tests/test_blk_report.py の
# test_loop_gives_up_after_three が、Archon と同じ順でスクリプトを回し、until_bash の式を sh で評価して見る。
rp-route:
  next: report-write
  node: report
  why: report が ready
report-write-prep:
  prompt_file: board/prompts/r3/report.md
  attempt: 3
  node: report
  facts_file: board/r3/report-facts.md
  already: false
report-write:
  text: "| 項目 | 説明 |\n|---|---|\n| 収束 | 3 周で収束し、直す物は残っていない。 |\n"
report-write-cold-prep:
  prompt_file: board/prompts/r3/report-write-cold.md
  prompt: "お前は cold-reader。……（書き手の返答の頭を描いた本文）"
report-write-cold:
  verdict: pass
  stops: []
  guessed: []
  decidable: true
report-write-accept:
  ok: false
  done: true
  give_up: true
  reason: "表のセルに説明の文を入れない（持ち主の決まり）。\n- 3 行目のセル「3 周で収束し、直す物は残っていない。」（19 字）"
  reason_file: board/reject-report_report-3.txt
  node: report
  record_invalid: false
collect:
  ok: false
  reason: 'report の返答が 3 回とも受け付けで拒まれた（最後の拒否: 表のセルに説明の文を入れない）'
  report_file: board/report-ai.md
  text_file: ''
  facts_file: board/r3/report-facts.md
  cold_check:
    verdict: pass
    stops: []
    guessed: []
    decidable: true
  record_invalid: false
  rejects:
    report: {cold: 0, format: 3, answer: 0}
fixture:
  expect: completed
  reached:
  - rp-route
  - report-write-prep
  - report-write
  - report-write-cold-prep
  - report-write-cold
  - report-write-accept
  - collect
