# 筋書き pass: 周の締めの後に書き手が 1 回で受け付けを通り（書き手の頭を読んだ初見の読み手は pass）、collect が盤面の
# report-ai.md を組む。スクリプトの節は全部 stub（盤面は dry-run の対象に無い。スクリプトの中身は tests/test_blk_report.py が
# 子のプロセスで回す）。書き手の返答の本文は graphloops の台本 test_converges の最終報告の返答を縮めた物。
rp-route:
  next: report-write
  node: report
  why: report が ready
report-write-prep:
  prompt_file: board/prompts/r3/report.md
  attempt: 1
  node: report
  facts_file: board/r3/report-facts.md
  already: false
report-write:
  text: "レビューは 3 周で収束し、直す物は残っていない。\n直した欠陥は 1 件で、テストは緑。\n次の周に回した物は無い。\n\n## 各周の記録\n\n- 周 1: 欠陥 1 件を判定し、直した"
report-write-cold-prep:
  prompt_file: board/prompts/r3/report-write-cold.md
  prompt: "お前は cold-reader。……（書き手の返答の頭を描いた本文）"
report-write-cold:
  verdict: pass
  stops: []
  guessed: []
  decidable: true
report-write-accept:
  ok: true
  done: true
  give_up: false
  reason: ''
  reason_file: ''
  node: report
  record_invalid: false
collect:
  ok: true
  reason: ''
  report_file: board/report-ai.md
  text_file: board/out/r3/report.json
  facts_file: board/r3/report-facts.md
  cold_check:
    verdict: pass
    stops: []
    guessed: []
    decidable: true
  record_invalid: false
  rejects:
    report: {cold: 0, format: 0, answer: 0}
fixture:
  expect: completed
  reached:
  - rp-route
  - report-write-prep
  - report-write
  - report-write-cold-prep
  - report-write-cold
  - report-write-accept
  - collect
