# 筋書き pass: 周の締めの後に 3 つの役が 1 回ずつ受け付けを通り、collect が盤面の report-ai.md を組む。
# スクリプトの節は全部 stub（盤面は dry-run の対象に無い。スクリプトの中身は tests/test_blk_report.py が子のプロセスで回す）。
# 役の返答の本文は graphloops の台本 test_converges の最終報告の返答を縮めた物。
rp-route1:
  next: report-items
  node: report.human_items
  why: report.human_items が ready
report-items-prep:
  prompt_file: board/prompts/r3/report.human_items.md
  prompt: ''
  attempt: 1
  node: report.human_items
  facts_file: ''
  already: false
report-items:
  text: "レビューは 3 周で収束し、直す物は残っていない。\n直した欠陥は 1 件で、テストは緑。\n次の周に回した物は無い。"
report-items-accept:
  ok: true
  done: true
  give_up: false
  reason: ''
  reason_file: ''
  node: report.human_items
  record_invalid: false
rp-route2:
  next: report-cold
  node: report.cold_check
  why: report.cold_check が ready
report-cold-prep:
