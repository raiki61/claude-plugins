  prompt: "お前は文脈を持たない初見の読み手。……（描いた本文）"
  attempt: 1
  node: report.cold_check
  facts_file: ''
  already: false
report-cold:
  verdict: pass
  stops: []
  guessed: []
  decidable: true
report-cold-accept:
  ok: true
  done: true
  give_up: false
  reason: ''
  reason_file: ''
  node: report.cold_check
  record_invalid: false
rp-route3:
  next: report-write
  node: report
  why: report が ready
report-write-prep:
  prompt_file: board/prompts/r3/report.md
  prompt: ''
  attempt: 1
  node: report
  facts_file: board/r3/report-facts.md
