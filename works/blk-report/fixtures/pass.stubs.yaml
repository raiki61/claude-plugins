    stops: []
    guessed: []
    decidable: true
  record_invalid: false
fixture:
  expect: completed
  reached:
  - rp-route1
  - report-items-prep
  - report-items
  - report-items-accept
  - rp-route2
  - report-cold-prep
  - report-cold
  - report-cold-accept
  - rp-route3
  - report-write-prep
  - report-write
  - report-write-accept
