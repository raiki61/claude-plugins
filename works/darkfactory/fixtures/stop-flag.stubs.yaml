# 筋書き stop-flag: 止め札（dev/stop.sh）を h-review が見て止める（stop 真）。差分の審査から後のブロックは飛び、
# 境の節と報告は走る。報告は stopped_by_request。止めた盤面は報告の役の節を出すので AI の報告も回る
# 生成の元: tests/linekit.LINE_ORDER の線とブロックの見本（役の返答は tests/replies/）。関所は模擬実行で自動で通るので、
# 関所の後の答えは境の節の stub で差す（P1 計画 Task 29 の持ち越し 7）
# blk-plan の壁打ちの輪 converge-loop の中の節（plan-revise-snap・直しの輪の中・plan-review-snap・事前審査の輪の中・converge-check）
# の鍵は、入れ子の深さに依らず名前空間なし（依頼 231 の測り 3・6）。blk-plan を 2 度 include すると（依頼 226 の replanning）
# 同じ鍵を両方の include が引き、1 つの stub の値が両方の go・done に効く（include ごとに違う値を置けない）。1 周目は返した
# block が無いので直しの輪は飛ぶ（plan-revise-snap の go は偽。輪の中の stub は使われない）
h-review:
  stop: true
  go: false
  why: 止め札
h-refix:
  stop: true
  go: false
  why: 止め札
h-tests:
  stop: true
  go: false
  why: 止め札
h-ci:
  stop: true
  why: 止め札
h-look:
  stop: true
  go: false
  why: 止め札
h-final:
  stop: true
  ask: false
  gate_text: ''
  why: 止め札
  gate_file: ''
h-eyes:
  stop: true
  why: 止め札
report:
  outcome: stopped_by_request
  tests_green: false
result:
  outcome: stopped_by_request
  tests_green: false
fixture:
  expect: completed
  inputs:
    request: request_ok.json
    test_cmd: python3 -m unittest
    adapter: optional
  reached:
  - entering__open
  - h-entry
  - premising__collect
  - h-judge
  - purposing__collect
  - h-mat
  - gathering__collect
  - judging__collect
  - h-plan
  - planning__collect
  - h-gate
  - h-fix
  - fixing__collect
  - h-replan
  - h-regate
  - h-refit
  - h-rejudge
  - h-review
  - h-refix
  - h-tests
  - h-ci
  - h-look
  - h-final
  - h-eyes
  - report
  - reporting__collect
  - result
