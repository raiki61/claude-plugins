# 筋書き final-when-needed-green: final_gate when_needed で最後のテストが緑・問い無し・異議無し → h-final が
# 関所を開かない（ask 偽）。final-gate は飛び、h-eyes は答え null を受けて報告へ
# 生成の元: tests/linekit.LINE_ORDER の線とブロックの見本（役の返答は tests/replies/）。関所は模擬実行で自動で通るので、
# 関所の後の答えは境の節の stub で差す（P1 計画 Task 29 の持ち越し 7）
# blk-plan の壁打ちの輪 converge-loop の中の節（plan-revise-snap・直しの輪の中・plan-review-snap・事前審査の輪の中・converge-check）
# の鍵は、入れ子の深さに依らず名前空間なし（依頼 231 の測り 3・6）。blk-plan を 2 度 include すると（依頼 226 の replanning）
# 同じ鍵を両方の include が引き、1 つの stub の値が両方の go・done に効く（include ごとに違う値を置けない）。1 周目は返した
# block が無いので直しの輪は飛ぶ（plan-revise-snap の go は偽。輪の中の stub は使われない）
h-final:
  ask: false
  gate_text: ''
  gate_file: ''
fixture:
  expect: completed
  inputs:
    request: request_ok.json
    test_cmd: python3 -m unittest
    adapter: optional
    final_gate: when_needed
  reached:
  - entering__open
  - h-entry
  - premising__collect
  - h-judge
  - purposing__collect
  - h-mat
  - gathering__collect
  - judging__collect
  - h-plan
  - planning__collect
  - h-gate
  - h-fix
  - fixing__collect
  - h-replan
  - h-regate
  - h-refit
  - h-rejudge
  - h-review
  - lensing__lens-exit
  - reviewing__collect
  - h-refix
  - refixing__collect
  - h-tests
  - testing__run
  - h-ci
  - h-look
  - eyeing__eyes-collect
  - h-final
  - h-eyes
  - report
  - reporting__collect
  - result
