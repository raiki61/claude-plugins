# 筋書き policy-stop: policy-gate の答え stop（reject も同じ）を h-fix が盤面へ渡して止め（stop 真）、後ろのブロックは
# 全部飛ぶ。境の節と報告は走り、報告は stopped_by_human
# 生成の元: tests/linekit.LINE_ORDER の線とブロックの見本（役の返答は tests/replies/）。関所は模擬実行で自動で通るので、
# 関所の後の答えは境の節の stub で差す（P1 計画 Task 29 の持ち越し 7）
# blk-plan の壁打ちの輪 converge-loop の中の節（plan-revise-snap・直しの輪の中・plan-review-snap・事前審査の輪の中・converge-check）
# の鍵は、入れ子の深さに依らず名前空間なし（依頼 231 の測り 3・6）。blk-plan を 2 度 include すると（依頼 226 の replanning）
# 同じ鍵を両方の include が引き、1 つの stub の値が両方の go・done に効く（include ごとに違う値を置けない）。1 周目は返した
# block が無いので直しの輪は飛ぶ（plan-revise-snap の go は偽。輪の中の stub は使われない）
h-gate:
  ask: true
  gate_text: （文）
  gate_file: board/r1/gate.md
h-fix:
  stop: true
  go: false
  plan_file: ''
  why: 人が関所で止めた
h-replan:
  stop: true
  why: 人が関所で止めた
h-regate:
  stop: true
  why: 人が関所で止めた
h-refit:
  stop: true
  why: 人が関所で止めた
h-rejudge:
  stop: true
  why: 人が関所で止めた
h-review:
  stop: true
  go: false
  why: 人が関所で止めた
h-refix:
  stop: true
  go: false
  why: 人が関所で止めた
h-tests:
  stop: true
  go: false
  why: 人が関所で止めた
h-ci:
  stop: true
  why: 人が関所で止めた
h-look:
  stop: true
  go: false
  why: 人が関所で止めた
h-final:
  stop: true
  ask: false
  gate_text: ''
  why: 人が関所で止めた
  gate_file: ''
h-eyes:
  stop: true
  why: 人が関所で止めた
report:
  outcome: stopped_by_human
  tests_green: false
  ai_report_go: false
# ai_report を null の値で持つ（報告の役を出さない）。入れ子の null は基の欄を外す印なので、流れの形 {…} で丸ごと置き替える
result: {ok: true, outcome: stopped_by_human, judgment_file: board/judgment.json, report_file: board/report.md,
  next_request_file: board/next-request.json, tests_green: false, validator_exit: 0, ai_report_go: false,
  machine_report_file: board/report.md, ai_report: null}
fixture:
  expect: completed
  inputs:
    request: request_ok.json
    test_cmd: python3 -m unittest
    adapter: optional
  reached:
  - entering__open
  - h-entry
  - premising__collect
  - h-judge
  - purposing__collect
  - h-mat
  - gathering__collect
  - judging__collect
  - h-plan
  - planning__collect
  - h-gate
  - h-fix
  - h-replan
  - h-regate
  - h-refit
  - h-rejudge
  - h-review
  - h-refix
  - h-tests
  - h-ci
  - h-look
  - h-final
  - h-eyes
  - report
  - result
