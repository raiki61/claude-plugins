# 筋書き spec: 入力 spec=on の run（依頼だけの入口で仕様の段を挟む）。h-entry の spec_go が真で仕様の段 speccing（blk-spec）が
# 回り、関所 spec-gate は模擬実行で自動で通る（答えは spec-answer の stub）。h-spec が並行 PR を回すかを出し（この筋書きは偽）、
# 後ろは policy-continue と同じ道（事前審査が人に聞き、policy-gate の continue で修正へ）
# 生成の元: tests/linekit.LINE_ORDER の線とブロックの見本（役の返答は tests/replies/、仕様の段は blk-spec/fixtures/pass）
entering__open:
  input:
    spec: true
  head_line: '入口: 差分なし（HEAD）・依頼 2 件——P1 の役は起こさない・仕様の段あり・段: 標準（既定）・gates: 空'
h-entry:
  spec_go: true
h-gate:
  ask: true
  gate_text: （文）
  gate_file: board/r1/gate.md
h-fix:
  notes: 範囲
  notes_file: board/r1/human-notes.md
fixture:
  expect: completed
  inputs:
    request: request_ok.json
    spec: 'on'
    test_cmd: python3 -m unittest
    adapter: optional
  reached:
  - entering__open
  - h-entry
  - speccing__write-route
  - spec-write
  - speccing__spec-ask
  - speccing__spec-gate
  - speccing__spec-answer
  - speccing__collect
  - h-spec
  - premising__collect
  - h-judge
  - purposing__collect
  - h-mat
  - gathering__collect
  - judging__collect
  - h-plan
  - planning__collect
  - h-gate
  - h-fix
  - fixing__collect
  - h-replan
  - h-regate
  - h-refit
  - h-rejudge
  - h-review
  - lensing__lens-exit
  - reviewing__collect
  - h-refix
  - refixing__collect
  - h-tests
  - testing__run
  - h-ci
  - h-look
  - eyeing__eyes-collect
  - h-final
  - h-eyes
  - report
  - reporting__collect
  - result
