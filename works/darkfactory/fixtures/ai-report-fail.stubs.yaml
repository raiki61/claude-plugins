# 筋書き ai-report-fail: final-stop と同じ道で、AI の報告のブロックが諦めた（collect の ok 偽）。
# 出口 result は all_done で走り、機械の報告（report.md）を最後の報告に選ぶ（結末は機械の報告のまま）。模擬実行は include の
# ok 偽を run の失敗にしない（Archon 0.11.1 の workflow test で確かめた）。本物の run で include が落ちても result は all_done で走る
# 生成の元: tests/linekit.LINE_ORDER の線とブロックの見本（役の返答は tests/replies/）。関所は模擬実行で自動で通るので、
# 関所の後の答えは境の節の stub で差す（P1 計画 Task 29 の持ち越し 7）
# blk-plan の壁打ちの輪 converge-loop の中の節（plan-revise-snap・直しの輪の中・plan-review-snap・事前審査の輪の中・converge-check）
# の鍵は、入れ子の深さに依らず名前空間なし（依頼 231 の測り 3・6）。blk-plan を 2 度 include すると（依頼 226 の replanning）
# 同じ鍵を両方の include が引き、1 つの stub の値が両方の go・done に効く（include ごとに違う値を置けない）。1 周目は返した
# block が無いので直しの輪は飛ぶ（plan-revise-snap の go は偽。輪の中の stub は使われない）
h-eyes:
  stop: true
  why: 最後の関所で止めた
report:
  outcome: stopped_by_human
  tests_green: false
reporting__collect:
  ok: false
  reason: 書き手の返答が 3 回とも拒まれた
  rejects:
    report: {cold: 0, format: 3, answer: 0}
result:
  outcome: stopped_by_human
  report_file: board/report.md
  tests_green: false
  ai_report_go: false
  ai_report:
    ok: false
    reason: 書き手の返答が 3 回とも拒まれた
    report_file:
    text_file:
    facts_file:
    cold_check:
    record_invalid:
fixture:
  expect: completed
  inputs:
    request: request_ok.json
    test_cmd: python3 -m unittest
    adapter: optional
  reached:
  - entering__open
  - h-entry
  - premising__collect
  - h-judge
  - purposing__collect
  - h-mat
  - gathering__collect
  - judging__collect
  - h-plan
  - planning__collect
  - h-gate
  - h-fix
  - fixing__collect
  - h-replan
  - h-regate
  - h-refit
  - h-rejudge
  - h-review
  - lensing__lens-exit
  - reviewing__collect
  - h-refix
  - refixing__collect
  - h-tests
  - testing__run
  - h-ci
  - h-look
  - eyeing__eyes-collect
  - h-final
  - h-eyes
  - report
  - reporting__collect
  - result
