# 筋書き final-stop: 独立の目の後に開いた最後の関所の答え stop を h-eyes が盤面へ渡して止め（周を締めた後なので trace の
# 1 行）、機械の報告は stopped_by_human。止めた盤面は報告の役の節を出すので AI の報告（reporting）が回り、出口の報告は report-ai.md
# 生成の元: tests/linekit.LINE_ORDER の線とブロックの見本（役の返答は tests/replies/）。関所は模擬実行で自動で通るので、
# 関所の後の答えは境の節の stub で差す（P1 計画 Task 29 の持ち越し 7）
# blk-plan の壁打ちの輪 converge-loop の中の節（plan-revise-snap・直しの輪の中・plan-review-snap・事前審査の輪の中・converge-check）
# の鍵は、入れ子の深さに依らず名前空間なし（依頼 231 の測り 3・6）。blk-plan を 2 度 include すると（依頼 226 の replanning）
# 同じ鍵を両方の include が引き、1 つの stub の値が両方の go・done に効く（include ごとに違う値を置けない）。1 周目は返した
# block が無いので直しの輪は飛ぶ（plan-revise-snap の go は偽。輪の中の stub は使われない）
h-eyes:
  stop: true
  why: 最後の関所で止めた
report:
  outcome: stopped_by_human
  tests_green: false
result:
  outcome: stopped_by_human
  tests_green: false
fixture:
  expect: completed
  inputs:
    request: request_ok.json
    test_cmd: python3 -m unittest
    adapter: optional
  reached:
  - entering__open
  - h-entry
  - premising__collect
  - h-judge
  - purposing__collect
  - h-mat
  - gathering__collect
  - judging__collect
  - h-plan
  - planning__collect
  - h-gate
  - h-fix
  - fixing__collect
  - h-replan
  - h-regate
  - h-refit
  - h-rejudge
  - h-review
  - lensing__lens-exit
  - reviewing__collect
  - h-refix
  - refixing__collect
  - h-tests
  - testing__run
  - h-ci
  - h-look
  - eyeing__eyes-collect
  - h-final
  - h-eyes
  - report
  - reporting__collect
  - result
