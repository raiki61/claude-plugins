  - unit_key: 'stats.py mean: 分母が len(xs) - 1 になっている'
    what: mean の分母を len(xs) - 1 から len(xs) に直した（算術平均の定義どおり）。python3 -m unittest test_stats で test_mean_of_three が緑
    files:
