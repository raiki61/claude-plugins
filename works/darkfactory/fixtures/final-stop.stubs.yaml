      - site: stats.py clamp の x < lo の枝（正しく lo を返す。直す必要が無いことを確かめた）
        red_seen: false
    precedent:
      verdict: adopt
      reason: '判定者の先行例の行（stats.py clamp: 上限を超えた値に lo を返す）の numpy.clip をそのまま採った'
      from_judge_row: true
    root_or_symptom:
      kind: root
      why: 上限の枝の戻り値の取り違えそのものを直した
    bypass_tried: 修正を残したまま clamp(10, 0, 10)・clamp(11, 0, 10)・clamp(-1, 0, 10) を呼んだ——境目の値もそれぞれ 10・10・0 を返した
    breaks:
