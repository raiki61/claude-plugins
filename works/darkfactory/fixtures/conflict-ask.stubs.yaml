# 筋書き conflict-ask: final_gate when_needed・最後のテストは緑。修正役が mean を食い違いとして申し出（名指しが現物に在る）、
# 裁定役が ask_human に回した → 2 回目の修正役は clamp だけを返し（mean は直す義務から外れる）、h-final が関所を開き（ask 真）、
# 報告は needs_human（冒頭 1 に件数、next-request.json に単位）。関所は模擬実行で自動で通る
# 生成の元: final-when-needed-green の筋書きに食い違いの申し出の節の stub を足した物
# blk-plan の壁打ちの輪 converge-loop の中の節（plan-revise-snap・直しの輪の中・plan-review-snap・事前審査の輪の中・converge-check）
# の鍵は、入れ子の深さに依らず名前空間なし（依頼 231 の測り 3・6）。blk-plan を 2 度 include すると（依頼 226 の replanning）
# 同じ鍵を両方の include が引き、1 つの stub の値が両方の go・done に効く（include ごとに違う値を置けない）。1 周目は返した
# block が無いので直しの輪は飛ぶ（plan-revise-snap の go は偽。輪の中の stub は使われない）
fix:
  changes:
  - unit_key: 'stats.py clamp: 上限を超えた値に lo を返す'
    what: clamp の x > hi の枝の戻り値を lo から hi に直した。python3 -m unittest test_stats で test_clamp_above_range が緑
    files:
    - stats.py
    closure:
      mechanism: 下限の枝を写して上限の枝を作ったとき、戻り値を lo のまま残した
      fix_mechanism: 上限の枝は hi を返し、下限の枝は lo を返す形に揃えた
      verified_how: 'return lo の 2 行（下限の枝と上限の枝）を 1 行ずつ確かめた: 上限の枝を lo に戻す退行を注入して test_clamp_above_range の赤を見て復元して緑、下限の枝は clamp(-5,
        0, 10) が 0 を返すことを見た'
      sites:
      - site: stats.py clamp の x > hi の枝
        red_seen: true
      - site: stats.py clamp の x < lo の枝（正しく lo を返す。直す必要が無いことを確かめた）
        red_seen: false
    precedent:
      verdict: adopt
      reason: '判定者の先行例の行（stats.py clamp: 上限を超えた値に lo を返す）の numpy.clip をそのまま採った'
      from_judge_row: true
    root_or_symptom:
      kind: root
      why: 上限の枝の戻り値の取り違えそのものを直した
    bypass_tried: 修正を残したまま clamp(10, 0, 10)・clamp(11, 0, 10)・clamp(-1, 0, 10) を呼んだ——境目の値もそれぞれ 10・10・0 を返した
    breaks:
      how: git grep -n 'clamp(' -- '*.py'
      result: clamp を呼ぶのは test_stats.py の 2 か所だけで、python3 -m unittest test_stats が 3 件とも緑
  interactions: []
  conflicts:
  - unit_key: 'stats.py mean: 分母が len(xs) - 1 になっている'
    between:
    - stats.py:9
    - test_stats.py:9
    why_both_cannot_hold: テストは分母 len(xs) - 1 の値を期待しているが、依頼は算術平均を求めている
    which_is_right: request
    kind: unnamed_test_broke
