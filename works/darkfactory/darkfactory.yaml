name: darkfactory
description: |
  ダークファクトリーのライン（C18 の順。P1 計画 Task 28・29）。人の修正依頼を、盤面（graphloops の review-loop の写しの
  graph と規則。works/.shared/core/board.py）の上で 1 周回す:
  起動の関所 → start（盤面・CI・並行 PR の engine の節）→ 並行 PR の任せ先 → 前提の実測 → 目的の文 → 素材集め（P1 の目）→ 判定 →
  独立設計（R2 の設計の半分。目的だけから）と修正案と事前審査（設計と突き合わせる）→ 修正の前の人の関所（要る時だけ）→ 修正（TDD の輪）→ 判定への異議の再審（異議が在る時だけ）→
  中の検査の枠 → 修正の後のレンズ（局所レビュー）→ 差分の審査 → 手直し →
  最後のテスト → 独立の目 → 最後の人の関所（目の結果を載せる）→ 機械の報告 → AI の報告と初見の検査（盤面が報告の節を出した時）→ 出口。
  境の節（h-*。scripts/edge.py を at を替えて使う。いつも走る）が盤面の ready から次のブロックを回すかを決め、関所の答えと
  止め札を盤面へ渡す。when: と関所の文言は、いつも走る節（start・境の節）の欄だけを読む。
  仕様から入る道はこの版のラインに無い
  （nodes.json の absent。報告の「このラインに無い節」に出る）。
  出口は result（機械の報告 report の欄の全部）: 結末（fixed・no_fix_needed・round_limit・stopped_by_*・needs_human・record_invalid）と最後の報告のパス。
  人の関所があるので interactive。

interactive: true

inputs:
  request:
    default: ""
    description: 人の修正依頼（findings の JSON の配列か、{findings, pr, issue} の形。名指した PR・issue は殻が github_reads で読む）のファイルの絶対パス（対象の外でよい）。相対なら run の worktree の根から。request・base・pr の少なくとも 1 つが要る。依頼だけなら判定から入る run
  base:
    default: ""
    description: 変更の根の版（枝・タグ・commit）。base と HEAD の merge-base から HEAD までを差分にし、依頼を積まない通常の run で P1 の目を差分に回す（依頼も在れば 1 周目の版が固まった後に積む）。pr と一緒には名指さない
  pr:
    default: ""
    description: PR の番号。base の版と head は github_reads（殻が隔離の前に読んだ物）から読み（start は gh を呼ばない。投稿もしない）、写しに無ければ・head が run の HEAD と違えば止める。差分は base の版と HEAD の merge-base から（GitHub の PR と同じ）。base と一緒には名指さない
  github_reads:
    default: ""
    description: 依頼の欄 pr・issue と pr の番号が名指した PR・issue を、殻（use.sh・dogfood.sh）が Archon を起こす前に利用者の gh で読んだファイル（.shared/core/ghreads.py の read が書く形）。start が盤面の根の github.json へ写して元を消す。空なら名指しを読まない（pr を名指す run では要る）
  test_cmd:
    default: ""
    description: テストのコマンド（対象リポジトリの根で bash が走らせる 1 行）。在れば、対象の .review-checks.json の宣言が在っても宣言の一式に加えて走らせ、両方が緑の時だけ緑（宣言の段と同じコマンドなら 1 度だけ）。宣言が無ければ test_cmd だけ。空なら宣言を engine が走らせ、宣言も無ければ CI の任せ先の役（blk-ci）
  thickness:
    default: ""
    description: 手厚さ。空は標準（軽量・重厚は受けない。持ち主の決定 2026-09-27）
  gates:
    default: ""
    description: graphloops の gates（空か merge）
  final_gate:
    default: ""
    description: 最後の人の関所。always（空の既定。いつも開く）か when_needed（最後のテストが緑でない・盤面が人に聞いている・止めずに残った異議がある時だけ）か protected_only（守りのファイルを触った時だけ。ほかの理由は報告の冒頭に並ぶ）
  adapter:
    default: ""
    description: 包み（Claude の包み claude-adapter）。空は包みを通した run だけを受ける（h-judge が確かめる）。optional は包み無しで回し、報告に出す
  policy_md:
    default: ""
    description: 人の方針の文書のパス（空なら既定の置き場。graphloops の policy_md と同じ）
  lang:
    default: ""
    description: 報告と、関所・報告に載る役の文の言語（AI の報告の指示書と、ほかの役の指示書の末尾の言語の 1 行が読む inputs.lang。graphloops の --lang と同じ）。空は依頼文の言語（利用者の言語）
  unattended:
    default: ""
    description: 無人の run か。空は人の居る run。true は人が答えない run（use.sh の WORKS_USE_UNATTENDED=1）で、判定の保留の問いだけでは修正前の関所を開かず、問いの出どころを飛ばして修正へ進み、問いを報告の冒頭に並べる（design_only=true と組めば関所は開き、use.sh が stop で報告へ進める）
  design_only:
    default: ""
    description: 設計だけの run か。空は今どおり。true は修正前の関所を項目の有無に関わらず開けて止める（殻の WORKS_DESIGN_ONLY=1）。continue で今どおり修正へ進み、stop で報告へ進む（判定・修正案・事前審査・独立設計が報告の見る所に並ぶ）。直す義務が 0 件の周は関所が走らず、修正もしない
  fix_shape:
    default: ""
    description: 修正の形。current（比べの基準。修正案の欄を修正の段で使わない）・af（works 自身の文で回す今の形）・g3（af に借りたスキルの座を足した形）・g1（修正役 1 つが SDD の型で下請けを回す形）のどれか。空は既定の g3。start が確かめて盤面の控え r1/start.json に置き、呼び直しで替えれば止める
  tdd_suite:
    default: ""
    description: テストの実行器（JUnit XML の書き先を第 1 引数に受ける実行ファイル。対象の根から。後ろに試験のファイル・node id（絶対パス）と -k を足して呼ぶことがある）。空なら修正の段の TDD の輪を飛ばす

returns: result
outcome_field: ok

nodes:
  # 起動の関所。越えると run が続き、cancel で木ごと止められる（線 A 仕様 5.3）。利用者の PATH に archon は無いので、文は run を
  # 起こした殻が出す行を指す（approval の文は $WORKFLOW_ID も $<節>.output も置き換える（h-gate・h-final の文）が、launch は最初の節で
  # 置ける前の節の出力がまだ無いので、殻の行はここに組めない。殻ごとに家が違い、use.sh show は use.sh の家の run しか引けない）
  - id: launch
    approval:
      message: |
        darkfactory を始める（run $WORKFLOW_ID）。進める・止める・取り消す行は、run を起こした殻が起動の後に出した行を使う。
        use.sh の run は use.sh show <対象リポジトリ> $WORKFLOW_ID で出し直し、進める行を背景で打って use.sh wait <対象リポジトリ> $WORKFLOW_ID で戻る。

  # 盤面を作り（DiskBoard.begin）、CI と並行 PR の engine の節を回す（entry.start）。入力を受けなければ 1 で止まる（AI の前）
  - id: start
    script: start
    runtime: uv
    timeout: 1728000000
    depends_on: [launch]
    with:
      request: $INPUTS.request
      base: $INPUTS.base
      pr: $INPUTS.pr
      github_reads: $INPUTS.github_reads
      test_cmd: $INPUTS.test_cmd
      thickness: $INPUTS.thickness
      gates: $INPUTS.gates
      final_gate: $INPUTS.final_gate
      adapter: $INPUTS.adapter
      policy_md: $INPUTS.policy_md
      lang: $INPUTS.lang
      unattended: $INPUTS.unattended
      design_only: $INPUTS.design_only
      fix_shape: $INPUTS.fix_shape
    output_format:
      type: object
      required: [ok, base_rev, test_cmd, policy_paste, policy_path, final_gate, adapter, ci_role_go, head_line]
      properties:
        ok: {type: boolean}
        entry: {type: string, enum: [request, change, both]}
        base_rev: {type: string}
        test_cmd: {type: string}
        policy_paste: {type: string}
        policy_path: {type: string}
        final_gate: {type: string}
        adapter: {type: string}
        thickness: {type: string}
        gates: {type: string}
        fix_shape: {type: string}
        ci_role_go: {type: boolean}
        head_line: {type: string}

  # CI の任せ先の役（宣言も test_cmd も無い run で p0.local_checks が任せ先に落ちた時だけ。裁定 R52）
  - id: ci-checking
    include: blk-ci
    depends_on: [start]
    when: "$start.output.ci_role_go == true"
    with:
      node: "p0.local_checks"
      base_rev: $start.output.base_rev

  # 境の節（いつも走る）。盤面の ready から並行 PR・前提の実測を回すかを出す
  - id: h-entry
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, ci-checking]
    trigger_rule: none_failed_min_one_success
    with:
      at: "entry"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 並行 PR の任せ先（engine が 1〜5 段を済ませられなかった・交差が在った時だけ）
  - id: pr-checking
    include: blk-pr
    depends_on: [h-entry]
    when: "$h-entry.output.pr_go == true"

  # 前提の実測（p0.premises が待っている時）
  - id: premising
    include: blk-premises
    depends_on: [h-entry, pr-checking]
    trigger_rule: none_failed_min_one_success
    when: "$h-entry.output.premises_go == true"
    with:
      request: $INPUTS.request
      base_rev: $start.output.base_rev

  # 包みの確かめと、前提の実測の出口を盤面へ渡す（P1-R9）
  - id: h-judge
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-entry, premising]
    trigger_rule: none_failed_min_one_success
    with:
      at: "judge"
      judged: "null"
      premised: {from: $premising.output, if_skipped: null}
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 目的の文（p0.purpose が待っている時。前提の実測の後に 1 度。判定と独立の目の R1・R2 が読む）
  - id: purposing
    include: blk-purpose
    depends_on: [h-judge]
    when: "$h-judge.output.purpose_go == true"
    with:
      request: $INPUTS.request
      constraints_file: $h-judge.output.premises_file
      base_rev: $start.output.base_rev

  # 目的の文を盤面へ渡し、P1 の目（素材集め）を回すかを出す
  - id: h-mat
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-judge, purposing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "mat"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # P1 の目と素材集め（前の決定の読み出し・目的の審査・P1 の 9 本。どれを回すかは盤面の条件。判定から入る 1 周目の P1 は na）
  - id: gathering
    include: blk-material
    depends_on: [h-mat]
    when: "$h-mat.output.mat_go == true"
    with:
      base_rev: $start.output.base_rev
      adapter: $start.output.adapter
      purpose_file: $h-mat.output.purpose_file

  # 判定
  - id: judging
    include: blk-judge
    depends_on: [h-mat, gathering]
    trigger_rule: none_failed_min_one_success
    when: "$h-mat.output.go == true"
    with:
      request: $INPUTS.request
      base_rev: $start.output.base_rev
      policy_paste: $start.output.policy_paste
      premises_file: $h-judge.output.premises_file

  # 判定を盤面へ渡し替え、直す物の無い周は修正を機械が空で埋める
  - id: h-plan
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-mat, judging]
    trigger_rule: none_failed_min_one_success
    with:
      at: "plan"
      judged: {from: $judging.output, if_skipped: null}
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 判定の単位が名指すファイルを機械で実測する（構造のブロック）。h-plan が契約の形に写した単位のファイルを受ける
  - id: structuring
    include: blk-structure
    depends_on: [h-plan]
    when: "$h-plan.output.go == true"
    with:
      units: $h-plan.output.structure_units_file
      policy_path: $start.output.policy_path

  # 構造の境。構造のブロックが落ちても走り（all_done。Airflow の teardown と同じ）、出口を盤面の根の控えにする。落ちた周は
  # status failed で、planning は構造の目の行なしで走る。この節そのものが落ちた周は h-gate が飛び、計画なしで修正へ進まない。
  # when を持たない（planning がこの節に依るので、持つと planning の trigger_rule を変えることになる）。計画を起こさない周
  # （h-plan の go が偽）は控えを書かずに status skipped で抜ける
  - id: h-structure
    script: structure
    runtime: uv
    timeout: 1728000000
    depends_on: [h-plan, structuring]
    trigger_rule: all_done
    with:
      structured: {from: $structuring.output, if_skipped: null}
      plan_go: $h-plan.output.go
    output_format:
      type: object
      additionalProperties: false
      required: [ok, status, reason, design_file, wall_s]
      properties:
        ok: {type: boolean}
        status: {type: string, enum: [ok, failed, skipped]}
        reason: {type: string}
        design_file: {type: string}
        wall_s: {type: number}

  # 独立設計と修正案と事前審査。独立設計（r2.design）は修正の前にここで作って盤面の根に控え、h-look が盤面へ渡す（最後の R2 は
  # 比較だけを回す）。直す物の無い判定でも、設計を作りに入る（h-plan の go）。構造の境を待ち、修正案の指示書の頭がその控えから
  # 構造の目の行（落ちた周は行なしで計画した印）を貼る
  - id: planning
    include: blk-plan
    depends_on: [h-plan, h-structure]
    when: "$h-plan.output.go == true"
    with:
      judgment_file: $h-plan.output.judgment_file
      base_rev: $start.output.base_rev
      policy_paste: $start.output.policy_paste
      policy_path: $start.output.policy_path
      include_id: "planning"

  # 盤面が人に聞いていれば関所を開く（文は r<N>/gate.md。文言には置き場だけを載せる）
  - id: h-gate
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-plan, h-structure, planning]
    trigger_rule: none_failed_min_one_success
    with:
      at: "gate"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 修正の前の人の関所（要る時だけ）。approve・continue は通す、stop・reject は止める（R32）
  - id: policy-gate
    depends_on: [h-gate]
    when: "$h-gate.output.ask == true"
    approval:
      message: |
        修正の前に人に聞くことがある（狭める能力・事前審査の後退と方針の穴・方針の文書の変化・判定の保留の問い・設計だけの run）。
        全文と答え方: $h-gate.output.gate_file（Read して答える）。
        continue "<通す範囲と条件>" で修正へ、stop "<理由>" で止めて報告へ。approve は continue、reject は stop と同じ。
      decisions:
        - {id: approve}
        - {id: continue}
        - {id: stop}
        - {id: reject}
      # decisions を書いた関所の出口はいつも {decision, text}（capture_response は Archon が捨てる古い鍵なので書かない）

  # 関所の答えを盤面へ（一言は human_items と notes_file）
  - id: h-fix
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-gate, policy-gate]
    trigger_rule: none_failed_min_one_success
    with:
      at: "fix"
      judged: "null"
      premised: "null"
      gate: {from: $policy-gate.output, if_skipped: null}
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 修正（テストの実行器 tdd_suite が在れば単位ごとの TDD の輪）
  - id: fixing
    include: blk-fix
    depends_on: [h-fix]
    when: "$h-fix.output.go == true"
    with:
      judgment_file: $h-fix.output.judgment_file
      open_units: $h-fix.output.open_units
      plan_file: $h-fix.output.plan_file
      notes_file: $h-fix.output.notes_file
      base_rev: $start.output.base_rev
      policy_path: $start.output.policy_path
      tdd_suite: $INPUTS.tdd_suite

  # 修正役が判定に異議を出した周の再審を回すか（盤面が p2.rejudge を待つ時。判定役の会話が無ければ止める）
  - id: h-rejudge
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-fix, fixing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "rejudge"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 同じ周の再審（判定役の会話の続きで異議を考え直す。p4.ci は再審の節を待つので、回さないと最後のテストが出ない）
  - id: rejudging
    include: blk-rejudge
    depends_on: [h-rejudge]
    when: "$h-rejudge.output.go == true"
    with:
      base_rev: $start.output.base_rev
      policy_paste: $start.output.policy_paste

  # 中の検査の枠（C18。動かす確かめ・holdout・変異はこの版に無い。mid_note が報告に載る）
  - id: h-mid
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-rejudge, rejudging]
    trigger_rule: none_failed_min_one_success
    with:
      at: "mid"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 差分の審査を回すか
  - id: h-review
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-mid]
    trigger_rule: none_failed_min_one_success
    with:
      at: "review"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 修正の後のレンズ（修正が差分を作った run だけ）。集め役が終わらなければブロックの境が盤面を止め、後ろの境の節が stop する
  - id: lensing
    include: blk-lens
    depends_on: [h-review]
    when: "$h-review.output.go == true"

  # 修正差分の審査（レンズの集め役を待つ。レンズの節が落ちても集め役は ok で終わるので走る）
  - id: reviewing
    include: blk-delta
    depends_on: [h-review, lensing]
    trigger_rule: none_failed_min_one_success
    when: "$h-review.output.go == true"
    with:
      base_rev: $start.output.base_rev

  # 手直しを回すか
  - id: h-refix
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-review, reviewing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "refix"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 差分の審査の後の手直し（2 往復まで）
  - id: refixing
    include: blk-refix
    depends_on: [h-refix]
    when: "$h-refix.output.go == true"
    with:
      base_rev: $start.output.base_rev
      policy_paste: $start.output.policy_paste
      policy_path: $start.output.policy_path

  # 最後のテストを回すか
  - id: h-tests
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-refix, refixing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "tests"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 最後のテスト（盤面の p4.ci。graphloops と同じく修正と手直しの全部の後）
  - id: testing
    include: blk-tests
    depends_on: [h-tests]
    when: "$h-tests.output.go == true"
    with:
      cmd: $start.output.test_cmd
      mode: "final"

  # 独立の目を回すか（最後のテストの後・最後の関所の前。目が盤面で待っていれば go）。先に、修正の前に作った独立設計を盤面へ渡す
  - id: h-look
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-tests, testing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "look"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 独立の目（R1〜R4。修正と最後のテストの後の、書き手と別の目）。結果は最後の関所の文に載る。r4.human_gate が人に聞けば止めずに
  # 抜け、問いは関所の文に載り、報告が needs_human と問いを次の run へ渡す
  - id: eyeing
    include: blk-eyes
    depends_on: [h-look]
    when: "$h-look.output.go == true"
    with:
      base_rev: $start.output.base_rev

  # 最後の人の関所を開くか（final_gate: always か when_needed。C18・P1-R3。独立の目が阻害を返しても開く）
  - id: h-final
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-tests, testing, h-look, eyeing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "final"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: {from: $testing.output, if_skipped: null}
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # 最後の人の関所。continue・approve は報告へ、stop・reject は止めて報告へ
  - id: final-gate
    depends_on: [h-final]
    when: "$h-final.output.ask == true"
    approval:
      message: |
        最後のテストと独立の目まで済んだ。報告へ進めてよいか。
        全文（テストの緑赤・ログ・差分の置き場・残った異議・独立の目の判定と問い）と答え方: $h-final.output.gate_file
        continue "<一言>" で報告へ、stop "<理由>" で止めて報告へ。approve は continue、reject は stop と同じ。
      decisions:
        - {id: approve}
        - {id: continue}
        - {id: stop}
        - {id: reject}
      # decisions を書いた関所の出口はいつも {decision, text}（capture_response は Archon が捨てる古い鍵なので書かない）

  # 最後の関所の答えを盤面へ（守りのファイル・食い違いの行が答えを待つのに関所が開かなかったら止める）。go はまだ目が待っているか
  # （報告が blk-eyes の落ちを見分ける）。名は目の後ろに置いていた前の並びのまま
  - id: h-eyes
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-final, final-gate]
    trigger_rule: none_failed_min_one_success
    with:
      at: "eyes"
      judged: "null"
      premised: "null"
      gate: {from: $final-gate.output, if_skipped: null}
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, runtime_go, holdout_go, mid_note, purpose_file, mat_go, structure_units_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        runtime_go: {type: boolean}
        holdout_go: {type: boolean}
        mid_note: {type: string}
        purpose_file: {type: string}
        mat_go: {type: boolean}
        structure_units_file: {type: string}

  # いつも走る機械の報告。report.md と次の run の依頼の下書き next-request.json。ai_report_go は盤面が報告の役の節を出したか。
  # 上流の節が落ちた run でも走る（all_done。Airflow の teardown と同じ。Ruling R21 の改め: run 30・31 は飛ばされて報告が残らなかった）。
  # start のほかの節の出力は落ちても飛ばされても if_skipped: null で受ける。start が落ちた run は盤面が無く、ここも落ちる
  - id: report
    script: report
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-eyes, eyeing]
    trigger_rule: all_done
    with:
      judged: {from: $judging.output, if_skipped: null}
      tests: {from: $testing.output, if_skipped: null}
      start: {from: $start.output}
      mid: {from: $h-mid.output, if_skipped: null}
      ci: {from: $ci-checking.output, if_skipped: null}
      eyes: {from: $h-eyes.output, if_skipped: null}
      eyeing: {from: $eyeing.output, if_skipped: null}
    output_format:
      type: object
      required: [ok, outcome, judgment_file, report_file, next_request_file, tests_green, validator_exit]
      properties:
        ok: {type: boolean}
        outcome: {type: string, enum: [fixed, no_fix_needed, round_limit, stopped_by_request, stopped_by_human, stopped_by_line, needs_human, record_invalid, interrupted]}
        judgment_file: {type: string}
        review_file: {type: string}
        diff_file: {type: string}
        faces: {type: integer, minimum: 0}
        report_file: {type: string}
        next_request_file: {type: string}
        tests_green: {type: boolean}
        validator_exit: {type: integer}
        ai_report_go: {type: boolean}
        export_input: {type: object}

  # AI が書く報告と初見の検査（盤面が報告の節を出した run だけ。いつ出るかの正本は report.gate_record の docstring——
  # stop_after_round で周を締めた普通の 1 周の run でも出る。R61 の B）
  - id: reporting
    include: blk-report
    depends_on: [report]
    when: "$report.output.ai_report_go == true"
    with:
      machine_report: $report.output.report_file

  # 出口（returns）。機械の報告の欄を全部残し、最後の報告を選ぶ（AI の報告が ok なら report-ai.md、そうでなければ report.md）。AI の報告が落ちても走る（all_done）
  - id: result
    script: result
    runtime: uv
    timeout: 1728000000
    depends_on: [report, reporting]
    trigger_rule: all_done
    with:
      machine: {from: $report.output}
      ai: {from: $reporting.output, if_skipped: null}
    output_format:
      type: object
      required: [ok, outcome, judgment_file, report_file, next_request_file, tests_green, validator_exit]
      properties:
        ok: {type: boolean}
        outcome: {type: string, enum: [fixed, no_fix_needed, round_limit, stopped_by_request, stopped_by_human, stopped_by_line, needs_human, record_invalid, interrupted]}
        judgment_file: {type: string}
        review_file: {type: string}
        diff_file: {type: string}
        faces: {type: integer, minimum: 0}
        report_file: {type: string}
        next_request_file: {type: string}
        tests_green: {type: boolean}
        validator_exit: {type: integer}
        ai_report_go: {type: boolean}
        machine_report_file: {type: string}
        ai_report: {type: [object, "null"]}
        export_input: {type: object}
