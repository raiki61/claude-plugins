name: darkfactory
description: |
  ダークファクトリーのライン（C18 の順。P1 計画 Task 28・29）。人の修正依頼を、盤面（graphloops の review-loop の写しの
  graph と規則。works/.shared/core/board.py）の上で 1 周回す:
  起動の関所 → start（盤面・CI・並行 PR の engine の節）→ 並行 PR の任せ先 → 前提の実測 → 目的の文 → 素材集め（P1 の目）→ 判定 →
  独立設計（R2 の設計の半分。目的だけから）と修正案と事前審査（設計と突き合わせる）→ 修正の前の人の関所（要る時だけ）→
  単位ごとの深さ（h-depth）→ 修正（TDD の輪）→（裁定が案の項目の誤りなら）案の直し → 案の直しの関所（要る時だけ）→ 2 回目の修正 → 判定への異議の再審（異議が在る時だけ）→
  深さの上げ（h-redepth）→ 修正の後のレンズ（局所レビュー）→ 差分の審査 → 手直し →
  最後のテスト → 独立の目 → 最後の人の関所（目の結果を載せる）→ 機械の報告 → AI の報告と初見の検査（盤面が報告の節を出した時）→ 出口。
  境の節（h-*。scripts/edge.py を at を替えて使う。いつも走る）が盤面の ready から次のブロックを回すかを決め、関所の答えと
  止め札を盤面へ渡す。when: と関所の文言は、いつも走る節（start・境の節）の欄だけを読む。
  仕様から入る道はこの版のラインに無い
  （nodes.json の absent。報告の「このラインに無い節」に出る）。
  出口は result（機械の報告 report の欄の全部）: 結末（fixed・no_fix_needed・round_limit・stopped_by_*・needs_human・record_invalid）と最後の報告のパス。
  人の関所があるので interactive。

interactive: true

inputs:
  request:
    default: ""
    description: 人の修正依頼（findings の JSON の配列か、{findings, pr, issue} の形。名指した PR・issue は start が run の中で gh で読む）のファイルの絶対パス（対象の外でよい）。相対なら run の worktree の根から。request・base・pr の少なくとも 1 つが要る。依頼だけなら判定から入る run
  base:
    default: ""
    description: 変更の根の版（枝・タグ・commit）。base と HEAD の merge-base から HEAD までを差分にし、依頼を積まない通常の run で P1 の目を差分に回す（依頼も在れば 1 周目の版が固まった後に積む）。pr と一緒には名指さない
  pr:
    default: ""
    description: PR の番号。base の版と head は start が run の中で gh で読み（利用者の gh のログインを継ぐ。投稿はしない）、読めなければ・head が run の HEAD と違えば止める。差分は base の版と HEAD の merge-base から（GitHub の PR と同じ）。base と一緒には名指さない
  test_cmd:
    default: ""
    description: テストのコマンド（対象リポジトリの根で bash が走らせる 1 行）。在れば、対象の .review-checks.json の宣言が在っても宣言の一式に加えて走らせ、両方が緑の時だけ緑（宣言の段と同じコマンドなら 1 度だけ）。宣言が無ければ test_cmd だけ。空なら宣言を engine が走らせ、宣言も無ければ CI の任せ先の役（blk-ci）
  thickness:
    default: ""
    description: 手厚さ（深さ）。空は自動（h-depth が判定の単位ごとに軽量か標準を機械で決める）。軽量・標準は全部の単位をその深さに固定する（軽量でも修正の後の信号で標準へ上がる）。標準は今の振る舞いのすべてで、軽量は全部の単位が軽量の run だけ差分の審査（とレンズ・手直し）と独立の目（コメントの削除候補と R1〜R4）を省き、報告の冒頭 2 に名指す（AI の報告は省かない）。重厚は受けない（足す工程がまだ無い）。持ち主の依頼 2026-10-06（docs/plans/2026-10-06-variable-depth.md）
  gates:
    default: ""
    description: graphloops の gates（空か merge）
  final_gate:
    default: ""
    description: 最後の人の関所。always（空の既定。いつも開く）か when_needed（最後のテストが緑でない・盤面が人に聞いている・止めずに残った異議がある時だけ）か protected_only（守りのファイルを触った時だけ。ほかの理由は報告の冒頭に並ぶ）
  adapter:
    default: ""
    description: 包み（Claude の包み claude-adapter）。空は包みを通した run だけを受ける（h-judge が確かめる）。optional は包み無しで回し、報告に出す
  policy_md:
    default: ""
    description: 人の方針の文書のパス（空なら既定の置き場。graphloops の policy_md と同じ）
  lang:
    default: ""
    description: 報告と、関所・報告に載る役の文の言語（AI の報告の指示書と、ほかの役の指示書の末尾の言語の 1 行が読む inputs.lang。graphloops の --lang と同じ）。空は依頼文の言語（利用者の言語）
  unattended:
    default: ""
    description: 無人の run か。空は人の居る run。true は人が答えない run（use.sh の WORKS_USE_UNATTENDED=1）で、判定の保留の問いだけでは修正前の関所を開かず、問いの出どころを飛ばして修正へ進み、問いを報告の冒頭に並べる（design_only=true と組めば関所は開き、use.sh が stop で報告へ進める）
  design_only:
    default: ""
    description: 設計だけの run か。空は今どおり。true は修正前の関所を項目の有無に関わらず開けて止める（殻の WORKS_DESIGN_ONLY=1）。continue で今どおり修正へ進み、stop で報告へ進む（判定・修正案・事前審査・独立設計が報告の見る所に並ぶ）。直す義務が 0 件の周は関所が走らず、修正もしない。事前審査の壁打ちが止まった run も、入力に依らず同じ行で止まる
  features_off:
    default: ""
    description: >-
      切る機能（同じ依頼を機能を替えて回して比べる口。持ち主の依頼 2026-10-07）。語をカンマか空白で区切った 1 行で、空は
      既定（judge_verify は off・review_tree は auto・ほかは on。持ち主の決め 2026-10-08）。語は judge_verify（判定の裏取り。
      切ると単位の裏取りと相乗りの下請けを起こさず、修正案の役に申し送りを貼らない。既定で off）・review_tree（事前審査の
      項目ごとの木。切ると審査役 1 つが案の全体を審査する。既定の auto は開いた項目が 2 つ以上の往復だけ木）・tdd_lanes（TDD の
      輪の並べの周。切ると tdd の単位を順に回す）・fix_lanes（修正役の並べの枝。切ると項目を作業ツリーで順に直す）・graph_map（工程の地図。
      切ると包みが旗 map の役の system prompt に地図を足さない）。知らない語は start が
      AI の前で拒む。start が機能ごとの on・off・auto を出口に出し、線がブロックの切り替えの入力へ写す。切った機能は start の控え・
      版の控え versions.json の settings・報告の冒頭 2 に残る。呼び直しで替えれば止める（固定材料の run は替えてよい）
  features_on:
    default: ""
    description: >-
      入れる機能（features_off と同じ語）。既定で off・auto の機能を on にする（judge_verify を回す・review_tree を開いた項目の
      数に依らず木にする）。既定で on の語は名指しても同じ。名指した語は既定に勝ち、features_off と同じ語を名指せば start が
      AI の前で拒む。知らない語も拒む。start の控え・versions.json の settings・報告の冒頭 2 に残り、呼び直しで替えれば止める
      （固定材料の run は替えてよい）
  fix_fixture:
    default: ""
    description: 固定材料のフォルダ（前の run の h-fix が $ARTIFACTS_DIR/fix-fixture に写した盤面と控え。相対なら対象の根から）。空は今どおり。在れば start が写しを取り込み、判定と修正案を作り直さずに修正から始める。木・依頼・test_cmd が写した時と違う・写しを書き換えた なら止める。同じ所から回し直して比べるのに使う
  cleaned_runs:
    default: ""
    description: 殻（use.sh start）が Archon を起こす前に片付けた同じ対象の前の run（「<id>（<状態>）」を・で並べた 1 行）。報告の冒頭 2 に 1 行で出す。空なら出さない
  launch_mark:
    default: ""
    description: 殻（use.sh start）が起動ごとに付ける一意の印（依頼を省いて --pr で起こした起動だけ）。どの節も読まない。Archon が run の metadata.inputs に残し、殻がこの起動の run を 1 つに結ぶのに使う（依頼の写しの無い起動の目印）
  tdd_suite:
    default: ""
    description: テストの実行器（JUnit XML の書き先を第 1 引数に受ける実行ファイル。対象の根から。後ろに試験のファイル・node id（絶対パス）と -k を足して呼ぶことがある）。空なら修正の段の TDD の輪を飛ばす

returns: result
outcome_field: ok

nodes:
  # 起動の関所。越えると run が続き、cancel で木ごと止められる（線 A 仕様 5.3）。利用者の PATH に archon は無いので、文は run を
  # 起こした殻が出す行を指す（approval の文は $WORKFLOW_ID も $<節>.output も置き換える（h-gate・h-final の文）が、launch は最初の節で
  # 置ける前の節の出力がまだ無いので、殻の行はここに組めない。殻ごとに家が違い、use.sh show は use.sh の家の run しか引けない）
  - id: launch
    description: '起動の関所（人が依頼と入力を見て始める）'
    approval:
      message: |
        darkfactory を始める（run $WORKFLOW_ID）。進める・止める・取り消す行は、run を起こした殻が起動の後に出した行を使う。
        use.sh の run は use.sh show <対象リポジトリ> $WORKFLOW_ID で出し直し、進める行を背景で打って use.sh wait <対象リポジトリ> $WORKFLOW_ID で戻る。

  # 盤面を作り（DiskBoard.begin）、CI と並行 PR の engine の節を回す（entry.start）。入力を受けなければ 1 で止まる（AI の前）
  - id: start
    description: '入力を確かめ、盤面と修正前の CI の段を開く'
    script: start
    runtime: uv
    timeout: 1728000000
    depends_on: [launch]
    with:
      request: $INPUTS.request
      base: $INPUTS.base
      pr: $INPUTS.pr
      test_cmd: $INPUTS.test_cmd
      thickness: $INPUTS.thickness
      gates: $INPUTS.gates
      final_gate: $INPUTS.final_gate
      adapter: $INPUTS.adapter
      policy_md: $INPUTS.policy_md
      lang: $INPUTS.lang
      unattended: $INPUTS.unattended
      design_only: $INPUTS.design_only
      fix_fixture: $INPUTS.fix_fixture
      features_off: $INPUTS.features_off
      features_on: $INPUTS.features_on
    output_format:
      type: object
      required: [ok, base_rev, test_cmd, policy_paste, policy_path, final_gate, adapter, ci_role_go, head_line]
      properties:
        ok: {type: boolean}
        entry: {type: string, enum: [request, change, both]}
        base_rev: {type: string}
        test_cmd: {type: string}
        policy_paste: {type: string}
        policy_path: {type: string}
        final_gate: {type: string}
        adapter: {type: string}
        thickness: {type: string}
        gates: {type: string}
        fix_lanes: {type: string, enum: ["on", "off"]}      # 機能（入力 features_off・features_on と既定）ごとの on・off（entry.feature_words）
        graph_map: {type: string, enum: ["on", "off"]}      # ブロックへは写さない（包みが start の控えの features_off を読む）
        judge_verify: {type: string, enum: ["on", "off"]}
        review_tree: {type: string, enum: ["on", "off", "auto"]}   # 既定の auto はブロックが開いた項目の数で決める
        tdd_lanes: {type: string, enum: ["on", "off"]}
        ci_role_go: {type: boolean}
        head_line: {type: string}

  # CI の任せ先の役（宣言も test_cmd も無い run で p0.local_checks が任せ先に落ちた時だけ。裁定 R52）
  - id: ci-checking
    description: '宣言の CI を機械で走らせられない run で、CI を任せ先の役が回す'
    include: blk-ci
    depends_on: [start]
    when: "$start.output.ci_role_go == true"
    with:
      node: "p0.local_checks"

  # 境の節（いつも走る）。盤面の ready から並行 PR・前提の実測を回すかを出す
  - id: h-entry
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, ci-checking]
    trigger_rule: none_failed_min_one_success
    with:
      at: "entry"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 並行 PR の任せ先（engine が 1〜5 段を済ませられなかった・交差が在った時だけ）
  - id: pr-checking
    description: '並行して開いている PR との重なりを確かめる'
    include: blk-pr
    depends_on: [h-entry]
    when: "$h-entry.output.pr_go == true"

  # 前提の実測（p0.premises が待っている時）
  - id: premising
    description: '依頼の数値・在る無いの主張をコマンドで実測する'
    include: blk-premises
    depends_on: [h-entry, pr-checking]
    trigger_rule: none_failed_min_one_success
    when: "$h-entry.output.premises_go == true"
    with:
      request: $INPUTS.request
      base_rev: $start.output.base_rev

  # 包みの確かめと、前提の実測の出口を盤面へ渡す（P1-R9）
  - id: h-judge
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-entry, premising]
    trigger_rule: none_failed_min_one_success
    with:
      at: "judge"
      judged: "null"
      premised: {from: $premising.output, if_skipped: null}
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 目的の文（p0.purpose が待っている時。前提の実測の後に 1 度。判定と独立の目の R1・R2 が読む）
  - id: purposing
    description: '依頼の元の目的を 1 つの文に固める'
    include: blk-purpose
    depends_on: [h-judge]
    when: "$h-judge.output.purpose_go == true"
    with:
      request: $INPUTS.request
      constraints_file: $h-judge.output.premises_file
      base_rev: $start.output.base_rev

  # 目的の文を盤面へ渡し、P1 の目（素材集め）を回すかを出す
  - id: h-mat
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-judge, purposing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "mat"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # P1 の目と素材集め（前の決定の読み出し・目的の審査・P1 の 9 本。どれを回すかは盤面の条件。判定から入る 1 周目の P1 は na）
  - id: gathering
    description: '判定の前に、差分を P1 の目と先行議論に見せて素材を集める'
    include: blk-material
    depends_on: [h-mat]
    when: "$h-mat.output.mat_go == true"
    with:
      adapter: $start.output.adapter

  # 判定
  - id: judging
    description: '依頼を根本の単位にまとめる判定（直す義務の元）'
    include: blk-judge
    depends_on: [h-mat, gathering]
    trigger_rule: none_failed_min_one_success
    when: "$h-mat.output.go == true"
    with:
      request: $INPUTS.request
      base_rev: $start.output.base_rev
      policy_paste: $start.output.policy_paste
      premises_file: $h-judge.output.premises_file
      verify: $start.output.judge_verify   # 判定の裏取り（既定で off。入力 features_on の judge_verify で on）

  # 判定を盤面へ渡し替え、直す物の無い周は修正を機械が空で埋める
  - id: h-plan
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-mat, judging]
    trigger_rule: none_failed_min_one_success
    with:
      at: "plan"
      judged: {from: $judging.output, if_skipped: null}
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 判定の単位が名指すファイルを機械で実測する（構造のブロック）。h-plan が契約の形に写した単位のファイルを受ける
  - id: structuring
    description: '判定の単位が名指すファイルの構造を実測し、汚れるかを判定する'
    include: blk-structure
    depends_on: [h-plan]
    when: "$h-plan.output.go == true"
    with:
      units: $h-plan.output.structure_units_file
      policy_path: $start.output.policy_path

  # 構造の境。構造のブロックが落ちても走り（all_done。Airflow の teardown と同じ）、出口を盤面の根の控えにする。落ちた周は
  # status failed で、planning は構造の目の行なしで走る。この節そのものが落ちた周は h-gate が飛び、計画なしで修正へ進まない。
  # when を持たない（planning がこの節に依るので、持つと planning の trigger_rule を変えることになる）。計画を起こさない周
  # （h-plan の go が偽）は控えを書かずに status skipped で抜ける。h-plan そのものが飛ばされた周（start が入力を拒んだ run）も
  # go を偽として受ける（if_skipped。字の参照のままだと解けずにこの節が落ちる）
  - id: h-structure
    script: structure
    runtime: uv
    timeout: 1728000000
    depends_on: [h-plan, structuring]
    trigger_rule: all_done
    with:
      structured: {from: $structuring.output, if_skipped: null}
      plan_go: {from: $h-plan.output.go, if_skipped: false}
    output_format:
      type: object
      additionalProperties: false
      required: [ok, status, reason, design_file, wall_s]
      properties:
        ok: {type: boolean}
        status: {type: string, enum: [ok, failed, skipped]}
        reason: {type: string}
        design_file: {type: string}
        wall_s: {type: number}

  # 独立設計と修正案と事前審査。独立設計（r2.design）は修正の前にここで作って盤面の根に控え、h-look が盤面へ渡す（最後の R2 は
  # 比較だけを回す）。直す物の無い判定でも、設計を作りに入る（h-plan の go）。構造の境を待ち、修正案の指示書の頭がその控えから
  # 構造の目の行（落ちた周は行なしで計画した印）を貼る
  - id: planning
    description: '独立設計・修正案（項目ごとの範囲とテスト）・事前審査の壁打ち'
    include: blk-plan
    depends_on: [h-plan, h-structure]
    when: "$h-plan.output.go == true"
    with:
      verify_file: $h-plan.output.verify_file   # 判定の単位の裏取りの申し送り（線の木の段 3。単位が 2 つ未満の周は空）
      review_tree: $start.output.review_tree   # 事前審査の項目ごとの木（既定で auto。入力 features_on・features_off の review_tree で on・off）

  # 盤面が人に聞いていれば関所を開く（文は r<N>/gate.md。文言には置き場だけを載せる）
  - id: h-gate
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-plan, h-structure, planning]
    trigger_rule: none_failed_min_one_success
    with:
      at: "gate"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 修正の前の人の関所（要る時だけ）。approve・continue は通す、stop・reject は止める（R32）
  - id: policy-gate
    description: '修正の前の人の関所（要る時だけ）'
    depends_on: [h-gate]
    when: "$h-gate.output.ask == true"
    approval:
      message: |
        修正の前に人に聞くことがある（狭める能力・事前審査の後退と方針の穴・方針の文書の変化・判定の保留の問い・設計だけの run・事前審査の block が残った案）。
        全文と答え方: $h-gate.output.gate_file（Read して答える）。
        continue "<通す範囲と条件>" で修正へ、stop "<理由>" で止めて報告へ。approve は continue、reject は stop と同じ。
      decisions:
        - {id: approve}
        - {id: continue}
        - {id: stop}
        - {id: reject}
      # decisions を書いた関所の出口はいつも {decision, text}（capture_response は Archon が捨てる古い鍵なので書かない）

  # 関所の答えを盤面へ（一言は human_items と notes_file）
  - id: h-fix
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-gate, policy-gate]
    trigger_rule: none_failed_min_one_success
    with:
      at: "fix"
      judged: "null"
      premised: "null"
      gate: {from: $policy-gate.output, if_skipped: null}
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 単位ごとの深さを決める（いつも走る。計画 docs/plans/2026-10-06-variable-depth.md の決め 3・8）。直す義務の単位ごとに、修正案の
  # 項目の欄の形（触るファイル・テストの数・約束の形のファイル。配線だけの単位は約束の形に数えない）と機械の確かめの有無から軽量か標準を決め、盤面の根の depth.json に
  # 書く。入力 thickness が軽量・標準なら全部をその深さに固定する。unit_depths は修正のブロックへのつなぎ目（計画の「blk-fix へのつなぎ目」）
  - id: h-depth
    script: depth
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-fix]
    trigger_rule: none_failed_min_one_success
    with:
      at: "decide"
      open_units: $h-fix.output.open_units
      tdd_suite: $INPUTS.tdd_suite
      replanned: "false"
      rejudged: "false"
    output_format:
      type: object
      additionalProperties: false
      required: [ok, why, depth, unit_depths, skip, lines, depth_file]
      properties:
        ok: {type: boolean}
        why: {type: string}
        depth: {type: string, enum: [軽量, 標準]}
        unit_depths: {type: string}
        skip: {type: string}
        lines: {type: array, items: {type: string}}
        depth_file: {type: string}

  # 修正（テストの実行器 tdd_suite が在れば単位ごとの TDD の輪）
  - id: fixing
    description: '修正: 単位ごとの TDD の輪（枝を並べて 3 方向で合わせる）と修正役'
    include: blk-fix
    depends_on: [h-fix, h-depth]
    when: "$h-fix.output.go == true"
    with:
      judgment_file: $h-fix.output.judgment_file
      open_units: $h-fix.output.open_units
      plan_file: $h-fix.output.plan_file
      notes_file: $h-fix.output.notes_file
      base_rev: $start.output.base_rev
      policy_path: $start.output.policy_path
      tdd_suite: $INPUTS.tdd_suite
      test_cmd: $start.output.test_cmd
      unit_depths: $h-depth.output.unit_depths   # 軽量の単位は TDD の輪の緑の後の test_cmd を省く（最後のテストが木の全部で走らせる）
      ripple_file: $h-fix.output.ripple_file   # 修正案のブロックの波及の一覧（項目が変える名の呼び出し元と試験。範囲の外の当たりの名指し）
      plan_session: plan   # 範囲の相談の相手: blk-plan の役の節の印 works-node: plan（修正案を書いた会話。案の直しの後はその会話）
      tdd_lanes: $start.output.tdd_lanes   # TDD の輪の並べの周（入力 features_off の tdd_lanes で off）
      fix_lanes: $start.output.fix_lanes   # 修正役の項目ごとの並べ（入力 features_off の fix_lanes で off）

  # 案の直しを回すか（依頼 226。修正の段で裁定役が fix_plan_item と裁いた項目を束ねる。1 run に 1 回。replan.material）
  - id: h-replan
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-fix, fixing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "replan"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 同じ run の中の案の直し（blk-plan の 2 度目の include。replan の口: 修正案と事前審査の役は fix_plan_item と裁かれた項目だけを
  # 直し・審査し、盤面の節へ渡さずに今の周の replan.json に置く）
  - id: replanning
    description: '案の直し（修正の段の裁定が案の項目の誤りとした時だけ）'
    include: blk-plan
    depends_on: [h-replan]
    when: "$h-replan.output.go == true"
    with:
      replan: "true"
      review_tree: $start.output.review_tree

  # 直した項目に関所の 1 つの決まりを当てる（約束の欄が同じで人に聞く穴が無い直しだけを聞かずに通す。無人の run では範囲を広げる
  # だけの直し（allowed_paths に足す・out_of_scope から外すだけ）も聞かずに通し、trace と報告に残す。replan.gate）
  - id: h-regate
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-replan, replanning]
    trigger_rule: none_failed_min_one_success
    with:
      at: "regate"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 案の直しの関所（要る時だけ）。approve・continue は直した項目を使って修正に戻る、stop・reject は run を止める
  - id: replan-gate
    description: '案の直しの人の関所（要る時だけ）'
    depends_on: [h-regate]
    when: "$h-regate.output.ask == true"
    approval:
      message: |
        修正の段で誤りと裁いた修正案の項目を、run の中で直した。約束の欄が変わったか、事前審査が人に聞く穴を挙げた。
        全文と答え方: $h-regate.output.gate_file（Read して答える）。
        continue "<一言>" で直した項目を使って修正に戻る。stop "<理由>" で run を止める（1 回目に直した単位の差分は報告に残る）。approve は continue、reject は stop と同じ。
      decisions:
        - {id: approve}
        - {id: continue}
        - {id: stop}
        - {id: reject}
      # decisions を書いた関所の出口はいつも {decision, text}（capture_response は Archon が捨てる古い鍵なので書かない）

  # 関所の答えを当て（関所が開かなかった周も）、直した項目を承認済みの案に差し替えて、戻った単位だけを 2 回目の修正の段へ渡す
  # （replan.answer。stop は盤面を止める）
  - id: h-refit
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-regate, replan-gate]
    trigger_rule: none_failed_min_one_success
    with:
      at: "refit"
      judged: "null"
      premised: "null"
      gate: {from: $replan-gate.output, if_skipped: null}
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 2 回目の修正の段（blk-fix の 2 度目の include。指示書・拒否の理由・読んだ証拠は include の名 refitting の置き場（scope）で
  # 1 回目と分かれ、直す義務は案を直して戻った単位だけ。1 回目に受け付けた行は機械が合わせて盤面に渡す）
  - id: refitting
    description: '直した案で 2 回目の修正'
    include: blk-fix
    depends_on: [h-refit]
    when: "$h-refit.output.go == true"
    with:
      judgment_file: $h-refit.output.judgment_file
      open_units: $h-refit.output.open_units
      plan_file: $h-refit.output.plan_file
      notes_file: $h-refit.output.notes_file
      base_rev: $start.output.base_rev
      policy_path: $start.output.policy_path
      tdd_suite: $INPUTS.tdd_suite
      test_cmd: $start.output.test_cmd
      ripple_file: $h-refit.output.ripple_file   # 修正案のブロックの波及の一覧（案の直しの 2 度目の include が直した項目から作り直した ripple/replan.json。無ければ 1 回目の物）
      plan_session: plan   # 範囲の相談の相手: blk-plan の役の節の印 works-node: plan（修正案を書いた会話。案の直しの後はその会話）
      tdd_lanes: $start.output.tdd_lanes   # TDD の輪の並べの周（入力 features_off の tdd_lanes で off）
      fix_lanes: $start.output.fix_lanes   # 修正役の項目ごとの並べ（入力 features_off の fix_lanes で off）

  # 修正役が判定に異議を出した周の再審を回すか（盤面が p2.rejudge を待つ時。判定役の会話が無ければ止める）
  - id: h-rejudge
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-fix, fixing, h-refit, refitting]
    trigger_rule: none_failed_min_one_success
    with:
      at: "rejudge"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 同じ周の再審（判定役の会話の続きで異議を考え直す。p4.ci は再審の節を待つので、回さないと最後のテストが出ない）
  - id: rejudging
    description: '修正役が判定に異議を出した時の再審'
    include: blk-rejudge
    depends_on: [h-rejudge]
    when: "$h-rejudge.output.go == true"

  # 修正の後の信号で深さを標準へ上げる（いつも走る。決め 4・5）。食い違いの申し出・止めた単位・答えていない問い・案の直し・再審。
  # 全部の単位が軽量のままなら、待っている差分の審査（p3.delta_review）を盤面で省き（h-review が差分の審査・レンズ・手直しを回さない）、
  # skip に省く理由を出して独立の目（skip_optional）に平の入力で渡す（決め 6・9。レンズは h-review が回さないので渡さない）。lines は機械の報告の冒頭 2
  - id: h-redepth
    script: depth
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-rejudge, rejudging, h-depth]
    trigger_rule: none_failed_min_one_success
    with:
      at: "raise"
      open_units: ""
      tdd_suite: ""
      replanned: {from: $h-replan.output.go, if_skipped: false}
      rejudged: {from: $h-rejudge.output.go, if_skipped: false}
    output_format:
      type: object
      additionalProperties: false
      required: [ok, why, depth, unit_depths, skip, lines, depth_file]
      properties:
        ok: {type: boolean}
        why: {type: string}
        depth: {type: string, enum: [軽量, 標準]}
        unit_depths: {type: string}
        skip: {type: string}
        lines: {type: array, items: {type: string}}
        depth_file: {type: string}

  # 差分の審査を回すか
  - id: h-review
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-rejudge, rejudging, h-redepth]
    trigger_rule: none_failed_min_one_success
    with:
      at: "review"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 修正の後のレンズ（修正が差分を作った run だけ）。集め役が終わらなければブロックの境が盤面を止め、後ろの境の節が stop する。
  # 全部の単位が軽量の run は h-redepth が差分の審査を盤面で省くので、h-review の go が偽でレンズも回らない
  - id: lensing
    description: '修正の後の局所レビュー（レンズ）'
    include: blk-lens
    depends_on: [h-review]
    when: "$h-review.output.go == true"

  # 修正差分の審査（レンズの集め役を待つ。レンズの節が落ちても集め役は ok で終わるので走る）
  - id: reviewing
    description: '修正の差分の審査（新しい穴と塞いだ穴の検算）'
    include: blk-delta
    depends_on: [h-review, lensing]
    trigger_rule: none_failed_min_one_success
    when: "$h-review.output.go == true"
    with:
      base_rev: $start.output.base_rev

  # 手直しを回すか
  - id: h-refix
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-review, reviewing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "refix"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 差分の審査の後の手直し（2 往復まで）
  - id: refixing
    description: '差分の審査の穴の手直し'
    include: blk-refix
    depends_on: [h-refix]
    when: "$h-refix.output.go == true"
    with:
      base_rev: $start.output.base_rev
      policy_paste: $start.output.policy_paste
      policy_path: $start.output.policy_path

  # 最後のテストを回すか
  - id: h-tests
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-refix, refixing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "tests"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 最後のテスト（盤面の p4.ci。graphloops と同じく修正と手直しの全部の後）
  - id: testing
    description: '最後のテスト（木の全部で 1 回）'
    include: blk-tests
    depends_on: [h-tests]
    when: "$h-tests.output.go == true"
    with:
      cmd: $start.output.test_cmd

  # 独立の目を回すか（最後のテストの後・最後の関所の前。目が盤面で待っていれば go）。先に、修正の前に作った独立設計を盤面へ渡す
  - id: h-look
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-tests, testing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "look"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 独立の目（R1〜R4。修正と最後のテストの後の、書き手と別の目）。結果は最後の関所の文に載る。r4.human_gate が人に聞けば止めずに
  # 抜け、問いは関所の文に載り、報告が needs_human と問いを次の run へ渡す
  - id: eyeing
    description: '独立の目（冗長と最小性・独立設計との比較・整合・範囲）'
    include: blk-eyes
    depends_on: [h-look]
    when: "$h-look.output.go == true"
    with:
      skip_optional: $h-redepth.output.skip   # 全部の単位が軽量の run は表で skippable の目（コメントの削除候補と R1〜R4。持ち主の決定 2026-10-06）を省く

  # 最後の人の関所を開くか（final_gate: always か when_needed。C18・P1-R3。独立の目が阻害を返しても開く）
  - id: h-final
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-tests, testing, h-look, eyeing]
    trigger_rule: none_failed_min_one_success
    with:
      at: "final"
      judged: "null"
      premised: "null"
      gate: "null"
      tests: {from: $testing.output, if_skipped: null}
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # 最後の人の関所。continue・approve は報告へ、stop・reject は止めて報告へ
  - id: final-gate
    description: '最後の人の関所'
    depends_on: [h-final]
    when: "$h-final.output.ask == true"
    approval:
      message: |
        最後のテストと独立の目まで済んだ。報告へ進めてよいか。
        全文（テストの緑赤・ログ・差分の置き場・残った異議・独立の目の判定と問い）と答え方: $h-final.output.gate_file
        continue "<一言>" で報告へ、stop "<理由>" で止めて報告へ。approve は continue、reject は stop と同じ。
      decisions:
        - {id: approve}
        - {id: continue}
        - {id: stop}
        - {id: reject}
      # decisions を書いた関所の出口はいつも {decision, text}（capture_response は Archon が捨てる古い鍵なので書かない）

  # 最後の関所の答えを盤面へ（守りのファイル・食い違いの行が答えを待つのに関所が開かなかったら止める）。go はまだ目が待っているか
  # （報告が blk-eyes の落ちを見分ける）。名は目の後ろに置いていた前の並びのまま
  - id: h-eyes
    script: edge
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-final, final-gate]
    trigger_rule: none_failed_min_one_success
    with:
      at: "eyes"
      judged: "null"
      premised: "null"
      gate: {from: $final-gate.output, if_skipped: null}
      tests: "null"
      adapter: $start.output.adapter
      final_gate: $INPUTS.final_gate
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop, go, ask, gate_text, judgment_file, open_units, plan_file, notes, notes_file, why, gate_file, premises_file, pr_go, premises_go, purpose_go, spec_go, mat_go, structure_units_file, ripple_file, verify_file]
      properties:
        ok: {type: boolean}
        stop: {type: boolean}
        go: {type: boolean}
        ask: {type: boolean}
        gate_text: {type: string}
        judgment_file: {type: string}
        open_units: {type: string}
        plan_file: {type: string}
        notes: {type: string}
        notes_file: {type: string}
        why: {type: string}
        gate_file: {type: string}
        premises_file: {type: string}
        pr_go: {type: boolean}
        premises_go: {type: boolean}
        purpose_go: {type: boolean}
        spec_go: {type: boolean}
        mat_go: {type: boolean}
        structure_units_file: {type: string}
        ripple_file: {type: string}
        verify_file: {type: string}

  # いつも走る機械の報告。report.md と次の run の依頼の下書き next-request.json（{findings, prior_failures}）と、この run で最後まで
  # 通らなかった物 prior-failures.json。ai_report_go は盤面が報告の役の節を出したか。
  # 上流の節が落ちた run でも走る（all_done。Airflow の teardown と同じ。Ruling R21 の改め: run 30・31 は飛ばされて報告が残らなかった）。
  # start のほかの節の出力は落ちても飛ばされても if_skipped: null で受ける。start が落ちた run は盤面が無く、ここも落ちる
  # Archon の resume のたびに回し直す（always_run）: 上流の落ちを all_done の節（tdd-join・fix-join）が受け止めて最後まで進んだ run は
  # 結末 interrupted で落ちて残り、resume は落ちた節とそれに依る節だけを回し直す。ここの依り先の出口は替わらないので、前の試みの
  # interrupted が使い回されて result が何度 resume しても落ちた（canary run 7d95d3bc。落ちた枝の輪は resume で済んだ）
  - id: report
    description: '機械の報告を書く'
    script: report
    runtime: uv
    timeout: 1728000000
    depends_on: [start, h-eyes, eyeing]
    trigger_rule: all_done
    always_run: true
    with:
      judged: {from: $judging.output, if_skipped: null}
      tests: {from: $testing.output, if_skipped: null}
      start: {from: $start.output}
      ci: {from: $ci-checking.output, if_skipped: null}
      eyes: {from: $h-eyes.output, if_skipped: null}
      eyeing: {from: $eyeing.output, if_skipped: null}
      cleaned_runs: $INPUTS.cleaned_runs
      depth: {from: $h-redepth.output, if_skipped: null}
      # 修正の段ごとの TDD の輪の単位の結末（修正のブロックの出口 tdd。keep-essence の 11: 単位ごとの記録が報告に届く）
      fix_tdd: {from: $fixing.output.tdd, if_skipped: null}
      refit_tdd: {from: $refitting.output.tdd, if_skipped: null}
    output_format:
      type: object
      required: [ok, outcome, judgment_file, report_file, next_request_file, tests_green, validator_exit]
      properties:
        ok: {type: boolean}
        outcome: {type: string, enum: [fixed, no_fix_needed, round_limit, stopped_by_request, stopped_by_human, stopped_by_line, needs_human, record_invalid, interrupted]}
        judgment_file: {type: string}
        review_file: {type: string}
        diff_file: {type: string}
        faces: {type: integer, minimum: 0}
        report_file: {type: string}
        next_request_file: {type: string}
        prior_failures_file: {type: string}
        tests_green: {type: boolean}
        validator_exit: {type: integer}
        ai_report_go: {type: boolean}
        export_input: {type: object}

  # AI が書く報告と初見の検査（盤面が報告の節を出した run だけ。いつ出るかの正本は report.gate_record の docstring——
  # stop_after_round で周を締めた普通の 1 周の run でも出る。R61 の B）
  - id: reporting
    description: 'AI の報告と初見の検査'
    include: blk-report
    depends_on: [report]
    when: "$report.output.ai_report_go == true"
    with:
      machine_report: $report.output.report_file

  # 出口（returns）。機械の報告の欄を全部残し、最後の報告を選ぶ（AI の報告が ok なら report-ai.md、そうでなければ report.md）。AI の報告が落ちても走る（all_done）
  - id: result
    description: '出口（結末と報告のパス）'
    script: result
    runtime: uv
    timeout: 1728000000
    depends_on: [report, reporting]
    trigger_rule: all_done
    with:
      machine: {from: $report.output}
      ai: {from: $reporting.output, if_skipped: null}
    output_format:
      type: object
      required: [ok, outcome, judgment_file, report_file, next_request_file, tests_green, validator_exit]
      properties:
        ok: {type: boolean}
        outcome: {type: string, enum: [fixed, no_fix_needed, round_limit, stopped_by_request, stopped_by_human, stopped_by_line, needs_human, record_invalid, interrupted]}
        judgment_file: {type: string}
        review_file: {type: string}
        diff_file: {type: string}
        faces: {type: integer, minimum: 0}
        report_file: {type: string}
        next_request_file: {type: string}
        prior_failures_file: {type: string}
        tests_green: {type: boolean}
        validator_exit: {type: integer}
        ai_report_go: {type: boolean}
        machine_report_file: {type: string}
        ai_report: {type: [object, "null"]}
        export_input: {type: object}
