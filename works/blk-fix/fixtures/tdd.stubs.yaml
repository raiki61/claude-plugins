# 筋書き tdd: 実行器が在る run の配線だけを見る。tdd-start（stub）が go: true を返し、tdd-loop が 1 周で済む
# （tdd-step の stub が done: true。until_bash で抜ける）。その後の fix-loop・clean・collect は pass と同じ stub。
# 輪の中の赤・緑の確かめの実物は tests/test_blk_fix_tdd.py が種の git と小さな実行器で回す。
tdd-start:
  go: true
  reason: ""
  suite: suite.py
  state_file: board/tdd-1/state.json
  summary_file: board/tdd-1/summary.md
tdd-prep:
  prompt_file: board/tdd-1/next.md
tdd:
  phase: refactor
  unit_key: "stats.py mean: 分母が len(xs) - 1 になっている"
  what: 整える物は無い
tdd-step:
  ok: true
  done: true
  reason: ""
  reason_file: ""
  phase: done
fix-prep:   # 支度の節は盤面を要るので stub（中身は tests/test_blk_fix.py の TestFixPrep）
  prompt_file: board/r1/prompt-p3.fix.md
  attempt: 1
  out_path: board/out/r1/p3.fix.json
  node: p3.fix
  already: false
  variants_file: board/r1/prompt-p3.fix.variants.json
  iteration: 1
# 修正役の返答は写しの p3.fix の型（tests/replies/fix2_ok.json と同じ中身。〔線A計〕T17 で役の output_format を替えた）
fix: {"changes": [{"unit_key": "stats.py mean: 分母が len(xs) - 1 になっている", "what": "mean の分母を len(xs) - 1 から len(xs) に直した（算術平均の定義どおり）。python3 -m unittest test_stats で test_mean_of_three が緑", "files": ["stats.py"], "closure": {"mechanism": "mean が総和をデータ点の数より 1 少ない数で割り、算術平均でなく不偏分散の分母で平均を出していた", "fix_mechanism": "分母をデータ点の数 len(xs) にして、算術平均の定義に揃えた", "verified_how": "分母を len(xs) - 1 に戻す退行を注入して test_mean_of_three の赤を見て、復元して緑を見た", "sites": [{"site": "stats.py mean の return 行（分母）", "red_seen": true}]}, "precedent": {"verdict": "adopt", "reason": "判定者の先行例の行（stats.py mean: 分母が len(xs) - 1 になっている）の statistics.mean をそのまま採った", "from_judge_row": true}, "root_or_symptom": {"kind": "root", "why": "分母の取り違えそのものを直した"}, "bypass_tried": "修正を残したまま mean([5]) と mean([1.5, 2.5]) と mean([-1, 1]) を呼んだ——どれも算術平均を返した", "breaks": {"how": "git grep -n 'mean(' -- '*.py'", "result": "mean を呼ぶのは test_stats.py の 1 か所だけで、python3 -m unittest test_stats が 3 件とも緑"}}, {"unit_key": "stats.py clamp: 上限を超えた値に lo を返す", "what": "clamp の x > hi の枝の戻り値を lo から hi に直した。python3 -m unittest test_stats で test_clamp_above_range が緑", "files": ["stats.py"], "closure": {"mechanism": "下限の枝を写して上限の枝を作ったとき、戻り値を lo のまま残した", "fix_mechanism": "上限の枝は hi を返し、下限の枝は lo を返す形に揃えた", "verified_how": "return lo の 2 行（下限の枝と上限の枝）を 1 行ずつ確かめた: 上限の枝を lo に戻す退行を注入して test_clamp_above_range の赤を見て復元して緑、下限の枝は clamp(-5, 0, 10) が 0 を返すことを見た", "sites": [{"site": "stats.py clamp の x > hi の枝", "red_seen": true}, {"site": "stats.py clamp の x < lo の枝（正しく lo を返す。直す必要が無いことを確かめた）", "red_seen": false}]}, "precedent": {"verdict": "adopt", "reason": "判定者の先行例の行（stats.py clamp: 上限を超えた値に lo を返す）の numpy.clip をそのまま採った", "from_judge_row": true}, "root_or_symptom": {"kind": "root", "why": "上限の枝の戻り値の取り違えそのものを直した"}, "bypass_tried": "修正を残したまま clamp(10, 0, 10)・clamp(11, 0, 10)・clamp(-1, 0, 10) を呼んだ——境目の値もそれぞれ 10・10・0 を返した", "breaks": {"how": "git grep -n 'clamp(' -- '*.py'", "result": "clamp を呼ぶのは test_stats.py の 2 か所だけで、python3 -m unittest test_stats が 3 件とも緑"}}], "not_done": [], "interactions": [{"surface": "stats.py", "checked": "mean の分母の修正と clamp の上限の枝の修正は別の関数の別の行で、一方が他方を不要にせず、当てる順序でも結果は変わらない"}], "fix_closure": {"status": "clean", "checked": "2 つの単位とも退行を注入して赤を見て、復元して緑を見た"}, "mechanism_changed": false, "premise_drift": false, "gates_changed": false, "seams_changed": false, "security_surface_changed": false, "path_changed": false, "wrote_refs": [], "plan_faces": []}
fix-accept:
  ok: true
  done: true
  reason: ""
  reason_file: ""
  changes:
    - unit_key: "stats.py mean: 分母が len(xs) - 1 になっている"
      files: [stats.py]
      what: "mean の分母を len(xs) に直した"
    - unit_key: "stats.py clamp: 上限を超えた値に lo を返す"
      files: [stats.py]
      what: "clamp の上限の枝で hi を返すように直した"
assert-changed:
  ok: true
  files: [stats.py]
collect:
  ok: true
  files: [stats.py]
  changes_file: board/r<N>/changes.json
  removed: []
  fix_file: board/out/r<N>/p3.fix.json
  not_done: 0
  coverage: {}
  reads_file: ""
  tdd:
    ran: true
    suite: suite.py
    reason: ""
    units:
      - {unit_key: "stats.py mean: 分母が len(xs) - 1 になっている", route: tdd, why: "", tests: ["test_stats.py::TestStats::test_mean_of_two"], test_files: [test_stats.py], red: ok, green: ok, refactor: none, gave_up: "", problems: []}
      - {unit_key: "stats.py clamp: 上限を超えた値に lo を返す", route: direct, why: "試験のための direct の理由（10 字以上）", tests: [], test_files: [], red: "", green: "", refactor: "", gave_up: "", problems: []}
fix-reads:   # 読んだ証拠の節は盤面を要るので stub（中身は tests/test_reads.py）
  ok: true
  reads_file: ""
# 食い違いの申し出が無い run（裁定の輪と 2 回目の修正の輪は飛ぶ）
conflict-check:
  go: false
  count: 0
  file: ''
fixture:
  expect: completed
  reached: [tdd-step, collect]
  inputs:
    judgment_file: board/judgment.json
    tdd_suite: suite.py
    open_units: '["stats.py mean: 分母が len(xs) - 1 になっている", "stats.py clamp: 上限を超えた値に lo を返す"]'
exec-code: true
