# 筋書き pass: 修正役が 2 つの単位を直したと返し、受け付け（stub）が通し、集める節（実物）が出口を組む。
# exec-code の作業ツリーは HEAD のままで差分が無いので、assert-changed は stub する（実物で回すのは no-change）。
# fix-accept（受け付け）も stub する: 盤面の judgment.json は同じ run の blk-judge が書く物で、このブロック単体の run には無い。
fix:
  changes:
    - unit_key: "stats.py mean: 分母が len(xs) - 1 になっている"
      files: [stats.py]
      what: "mean の分母を len(xs) に直した"
    - unit_key: "stats.py clamp: 上限を超えた値に lo を返す"
      files: [stats.py]
      what: "clamp の上限の枝で hi を返すように直した"
fix-accept:
  ok: true
  reason: ""
  changes:
    - unit_key: "stats.py mean: 分母が len(xs) - 1 になっている"
      files: [stats.py]
      what: "mean の分母を len(xs) に直した"
    - unit_key: "stats.py clamp: 上限を超えた値に lo を返す"
      files: [stats.py]
      what: "clamp の上限の枝で hi を返すように直した"
assert-changed:
  ok: true
  files: [stats.py]
fixture:
  expect: completed
  reached: [collect]
  inputs:
    judgment_file: board/judgment.json
    open_units: '["stats.py mean: 分母が len(xs) - 1 になっている", "stats.py clamp: 上限を超えた値に lo を返す"]'
exec-code: true
