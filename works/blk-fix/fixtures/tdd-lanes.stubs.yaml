# 筋書き tdd-lanes: 形 g3 で振り分けの後に 2 本の枝を切った run の配線だけを見る（docs/plans/2026-10-07-lane-nodes.md）。
# tdd-loop は振り分けの 1 周で抜け（tdd-step の stub が done: true・phase: lanes。dry-run は until_bash を回さず、輪を 1 回で済んだとみなす）、
# tdd-fork（stub）が枝 1・2 を起こし、枝の輪 tdd-lane-loop-1・2 が同時に 1 周（枝 3 は when: で飛ぶ）、tdd-join（stub）が枝 1 の
# 単位を当てて枝 2 の単位を順に戻し（go: true）、tdd-rest-loop が 1 周で残りを済ませる。その後の fix-loop・clean・collect は tdd と同じ stub。
# 枝の中の赤・緑の確かめ・締めの実物は tests/test_tdd_lanes.py、包みが枝の役を単位の worktree で起こすのは tests/test_adapter_lane.py が見る。
tdd-start:
  go: true
  reason: ""
  suite: suite.py
  state_file: board/tdd-1/state.json
  summary_file: board/tdd-1/summary.md
tdd-prep:
  prompt_file: board/tdd-1/next.md
  go: true
tdd:   # 振り分けの返答（2 単位とも tdd）
  phase: route
  units:
    - {unit_key: "stats.py mean: 分母が len(xs) - 1 になっている", route: tdd}
    - {unit_key: "stats.py clamp: 上限を超えた値に lo を返す", route: tdd}
tdd-step:   # 振り分けを受け、2 本の枝を切った（段 lanes。done を立てて輪はここで抜ける）
  ok: true
  done: true
  reason: ""
  reason_file: ""
  phase: lanes
tdd-fork:
  go: true
  lanes: 2
  lane_1: true
  lane_2: true
  lane_3: false
tdd-lane-prep-1:
  prompt_file: board/tdd-1/lane-1.next.md
  go: true
tdd-lane-1:   # 枝 1 の fix の段の返答（cwd は枝 1 の単位の worktree）
  phase: fix
  unit_key: "stats.py mean: 分母が len(xs) - 1 になっている"
  files: [stats.py]
  what: 分母を len(xs) にした
  refactor: {declared: false, why: ""}
tdd-lane-step-1:
  ok: true
  done: true
  reason: ""
  reason_file: ""
  phase: done
  unit_key: "stats.py mean: 分母が len(xs) - 1 になっている"
tdd-lane-prep-2:
  prompt_file: board/tdd-1/lane-2.next.md
  go: true
tdd-lane-2:
  phase: fix
  unit_key: "stats.py clamp: 上限を超えた値に lo を返す"
  files: [stats.py]
  what: 上限の枝で hi を返すようにした
  refactor: {declared: false, why: ""}
tdd-lane-step-2:
  ok: true
  done: true
  reason: ""
  reason_file: ""
  phase: done
  unit_key: "stats.py clamp: 上限を超えた値に lo を返す"
tdd-lane-prep-3:   # 枝 3 は when: で飛ぶ（stub は置くだけ）
  prompt_file: board/tdd-1/lane-3.next.md
  go: true
tdd-lane-3:
  phase: fix
  unit_key: ""
  files: []
  what: ""
  refactor: {declared: false, why: ""}
tdd-lane-step-3:
  ok: true
  done: true
  reason: ""
  reason_file: ""
  phase: done
  unit_key: ""
tdd-join:   # 枝 1 を当て、枝 2 の単位を順に戻した
  go: true
  done: false
  phase: test
  merged: 1
  back: 1
tdd-rest-prep:
  prompt_file: board/tdd-1/next.md
  go: true
tdd-rest:
  phase: fix
  unit_key: "stats.py clamp: 上限を超えた値に lo を返す"
  files: [stats.py]
  what: 上限の枝で hi を返すようにした
  refactor: {declared: false, why: ""}
tdd-rest-step:
  ok: true
  done: true
  reason: ""
  reason_file: ""
  phase: done
fix-fork:   # 修正役の並べの枝を切るかの節は盤面を要るので stub（並べない run。中身は tests/test_fix_lanes.py）
  go: false
  lanes: 0
