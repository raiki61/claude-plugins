          model: opus                 # plan-answer と同じ（表 .shared/core/stage-models.json の plan_writer）
          effort: medium
          prompt: 指示書 `$fix-lane-consult-3.output.prompt_file` を Read で全部読み、その相談に答えよ。返すのは指示書の JSON だけ。
          depends_on: [fix-lane-consult-3]
          when: "$fix-lane-consult-3.output.go == true"
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          output_format:
            description: 'works-node: plan-answer-lane-3 continue=fix-planner fork map'
            type: object
            additionalProperties: false
            required: [answers]
            properties:
              answers:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [ask, decision, paths, tests, spec, reason]
                  properties:
                    ask: {type: integer, minimum: 1}
                    decision: {type: string, enum: [allow, deny, defer]}
                    paths: {type: array, items: {type: string, minLength: 1}}
                    tests: {type: array, items: {type: string, minLength: 1}}
                    spec: {type: string}
                    reason: {type: string, minLength: 10}

        - id: fix-lane-consult-check-3
          script: consult_check
          runtime: uv
          depends_on: [fix-lane-consult-3, plan-answer-lane-3]
          trigger_rule: none_failed_min_one_success   # 頼みの無い周・聞く頼みの無い周は答えの節が飛ばされる
          timeout: 1728000000
          with:
            answer: {from: "$plan-answer-lane-3.output", if_skipped: null}
            pass: "lane-3"
            answer_node: "plan-answer-lane-3"
          output_format:
            type: object
            additionalProperties: false
            required: [consulted, turn, answer_file, counts]
            properties:
              consulted: {type: boolean}
              turn: {type: integer, minimum: 0}
              answer_file: {type: string}
              counts: {type: object}

        - id: fix-lane-step-3
          script: fix_lane_step
          runtime: uv
          depends_on: [fix-lane-prep-3, fix-lane-consult-check-3]
          trigger_rule: none_failed_min_one_success   # 済んだ枝の周は役と相談の節が飛ばされる（返答は null。確かめは何も動かさずに done）
          timeout: 1728000000
          with:
            reply: {from: "$fix-lane-3.output", if_skipped: null}
            lane: "3"
            consulted: {from: "$fix-lane-consult-check-3.output.consulted", if_skipped: false}   # 範囲の相談の周は確かめない（数えるだけ）
            base_rev: $INPUTS.base_rev
            tdd_state: $tdd-start.output.state_file   # 凍ったテストのファイル・選んで回す試験の元の結末（空は実行器の無い run）
          output_format:
            type: object
            required: [ok, done, consulted, reason, reason_file, item]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              consulted: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              item: {type: integer}

  # 修正役の並べを締める（fixlanes.join）。枝の輪が 1 本落ちても締めて（all_done）、通った項目の差分を run の作業ツリーへ 3 方向で
  # 当て、書き込みの記録を写し、申し出を盤面に積み、結末（盤面の作業ファイル fix-lanes-out.json・fix-lanes.md）を修正の輪の支度が読む
  # Archon の resume は落ちた枝の輪とそれに依るこの節を回し直す: 済んだ枝の輪は支度の go: false で役を起こさずに抜け、この節は
  # 結末に残した出口を返す（fixlanes.join。当てた差分と後の修正の輪の直しを戻さない）
  - id: fix-join
    description: '枝の差分を 3 方向で当てる（残りは修正役の輪へ） [needs: fix_lanes]'
    script: fix_join
    runtime: uv
    depends_on: [fix-fork, fix-lane-loop-1, fix-lane-loop-2, fix-lane-loop-3]
    trigger_rule: all_done
    when: "$fix-fork.output.go == true"
    timeout: 1728000000
    output_format:
      type: object
      additionalProperties: false
      required: [ok, merged, back, parked, shared, union]
      properties:
        ok: {type: boolean}
        merged: {type: array, items: {type: integer}}   # 当てた修正案の項目
        back: {type: array, items: {type: integer}}     # 修正の輪に戻した項目
        parked: {type: integer, minimum: 0}             # 盤面に積んだ食い違いの申し出の数
        shared: {type: array, items: {type: string}}    # 2 本以上の枝の差分を合わせたファイル
        union: {type: array, items: {type: string}}     # 同じ試験のファイルに足した行を枝の順に並べたファイル

  - id: fix-loop
    description: '修正役の輪（受け付けに通るまで出し直す）'
    depends_on: [tdd-start, tdd-loop, tdd-fork, tdd-join, tdd-rest-loop, fix-fork, fix-join]
    trigger_rule: none_failed_min_one_success   # 実行器の無い run は tdd-loop が、並べない run は tdd-join・tdd-rest-loop・fix-join が飛ばされる
    loop_group:
      max_iterations: 12   # 受け付けの 3 回（accept.GIVE_UP_AFTER）と範囲の相談の周の枠 9（consult.BUDGET）の和
      fresh_context: false
      until_bash: test $fix-accept.output.done = true   # 通った時か、3 回目の拒否で結べる単位を止めて通した時（max_iterations で落とさない。R50）
      nodes:
        # 指示書を組み（fixrules.prep: 修正の決まりの正本・直す役の決まり・run の値）、起こした印を置く（盤面は印の無い返答を受けない）。
        # 同じ試行の出し直しなら、前の回の受け付けが書いた拒否の理由のファイルを指示書の 1 行目で名指す（理由の文は貼らない。R44）
        - id: fix-prep
          script: fix_prep
          runtime: uv
          timeout: 1728000000
          with:
            judgment_file: $INPUTS.judgment_file
            open_units: $INPUTS.open_units
            plan_file: $INPUTS.plan_file
            policy_path: $INPUTS.policy_path
            notes_file: $INPUTS.notes_file
            summary_file: $tdd-start.output.summary_file
            base_rev: $INPUTS.base_rev   # 下請けの審査役の型の [BASE_SHA]（fixrules.g1_values）
            plan_session: $INPUTS.plan_session   # 範囲の相談の相手（空は相談しない）
            ripple_file: $INPUTS.ripple_file   # 波及の一覧（範囲の相談の節が名指す。空は名指さない）
            pass: "first"
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, attempt, out_path, node, already, iteration]
            properties:
              prompt_file: {type: string}      # 組んだ指示書（役の節の 1 行が Read させる）
              attempt: {type: integer}
              out_path: {type: string}
              node: {type: string}
              already: {type: boolean}
              iteration: {type: integer, minimum: 1}   # この周の輪の何回目か（fix-accept が 3 回目の拒否で done を立てる）

        - id: fix
          description: '修正役: TDD の輪と枝で直していない単位を直す'
          model: sonnet               # コードとテストを書く役（前付けの無い役。表 .shared/core/stage-models.json の値で tests/test_tool_parity.py が縛る。WORKS_DEV_MODEL の明示で替わる。持ち主 2026-10-06）
          effort: high                # 同じ表の effort（段に書かないと run の既定で黙って走る）
          prompt: 指示書 `$fix-prep.output.prompt_file` を Read で全部読み、その指示に従え。返すのは指示書が名指す欄の JSON だけ。
          depends_on: [fix-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          # Agent は単位ごとの下請けを起こす口（seat.g1_section）
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Agent]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # recount.FIX_OUTPUT_FORMAT（写しの p3.fix の schema に印 works-node: fix）を貼った物（tests/test_blk_fix.py が一致を見る）。
          # 欄の本体は前に在る枝の役 fix-lane-1 の YAML のアンカー（&fix_required・&fix_properties。アンカーは先に書いた物しか引けない）
          output_format:
            description: 'works-node: fix self-resume'
            type: object
            required: *fix_required
            additionalProperties: false
            properties: *fix_properties

        # 範囲の相談（docs/plans/2026-10-06-ask-planner.md）。役が返答の欄 consult で範囲の外を頼んだ周だけ働く: 頼みの節が機械の先の
        # 確かめをして、聞く頼みが在れば相手の会話（入力 plan_session の印の名の会話の id を、ブロックの中の名 fix-planner として包みの
        # 置き場へ写す）に答えの節を続けさせ、確かめの節が答えを確かめて盤面の trace に残す。その周は締める節と受け付けを回さず
        # （consulted）、次の周の支度が答えのファイルを名指す続きの指示書で役を同じ会話の続きで起こす。頼みの無い周は何もしない
        - id: fix-consult
          script: consult_prep
          runtime: uv
          depends_on: [fix]
          timeout: 1728000000
          with:
            reply: {from: "$fix.output"}
            plan_session: $INPUTS.plan_session   # 相談の相手の会話の印の名（空は相手の無い run。頼みは聞けない行になる）
            pass: "first"
            answer_node: "plan-answer"
          output_format:
            type: object
            additionalProperties: false
            required: [consulted, go, prompt_file, turn, spent]
            properties:
              consulted: {type: boolean}   # 返答が consult を持ち、枠の中（この周は相談の周）
              go: {type: boolean}          # 聞く頼みが在り、相手の会話を写した（答えの節を起こす）
              prompt_file: {type: string}  # 答えの節の指示書（go の時だけ）
              turn: {type: integer, minimum: 0}
              spent: {type: boolean}       # 枠を使い切った後の consult（受け付けが拒む）

        # 答えの節: 修正案を書いた役の会話の続き（印 continue=fix-planner。包みが fix-consult の写した id で --resume する）。読むだけ。
        # 出力は blk-fix/lib/consult.py の answer_format（tests/test_consult.py が一致を見る）
        - id: plan-answer
          description: '範囲の相談に答える（修正案を書いた会話の続き。読むだけ）'
          model: opus                 # 修正案・仕様を書く役と同じ（表 .shared/core/stage-models.json の plan_writer。tests/test_tool_parity.py が縛る）
          effort: medium              # 同じ表の effort
          prompt: 指示書 `$fix-consult.output.prompt_file` を Read で全部読み、その相談に答えよ。返すのは指示書の JSON だけ。
          depends_on: [fix-consult]
          when: "$fix-consult.output.go == true"
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]   # 修正案を書いた役と同じ読むだけの道具（書く道具・Bash は持たない）
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          output_format:
            description: 'works-node: plan-answer continue=fix-planner map'
            type: object
            additionalProperties: false
            required: [answers]
            properties:
              answers:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [ask, decision, paths, tests, spec, reason]
                  properties:
                    ask: {type: integer, minimum: 1}
                    decision: {type: string, enum: [allow, deny, defer]}
                    paths: {type: array, items: {type: string, minLength: 1}}
                    tests: {type: array, items: {type: string, minLength: 1}}
                    spec: {type: string}
                    reason: {type: string, minLength: 10}

        - id: fix-consult-check
          script: consult_check
          runtime: uv
          depends_on: [fix-consult, plan-answer]
          trigger_rule: none_failed_min_one_success   # 頼みの無い周・聞く頼みの無い周は答えの節が飛ばされる
          timeout: 1728000000
          with:
            answer: {from: "$plan-answer.output", if_skipped: null}
            pass: "first"
            answer_node: "plan-answer"
          output_format:
            type: object
            additionalProperties: false
            required: [consulted, turn, answer_file, counts]
            properties:
              consulted: {type: boolean}   # この周は相談の周（締める節と受け付けは回さない）
              turn: {type: integer, minimum: 0}
              answer_file: {type: string}  # 修正役が次の周に読む答え（盤面の今の scope の周の作業ファイル）
              counts: {type: object}       # 答えごとの数（allow・deny・defer・refused・invalid・unavailable）

        - id: fix-accept
          script: accept
          runtime: uv
          depends_on: [fix-consult-check]
          timeout: 1728000000
          with:
            reply: {from: "$fix.output"}
            base_rev: $INPUTS.base_rev
            tdd_state: $tdd-start.output.state_file   # 輪で凍ったテストのファイルを修正役が変えていないか・選んで回す試験の元の結末（空は実行器の無い run）
            iteration: $fix-prep.output.iteration     # 輪の何回目か（3 回目の拒否で done。R50）
            pass: "first"
            tdd_suite: $INPUTS.tdd_suite              # 事後の関門の束の実行器（空は受け入れのテストの赤緑を確かめない run）
            consulted: $fix-consult-check.output.consulted   # 範囲の相談の周は受け付けを回さない（done も立てない）
          output_format:
            type: object
            required: [ok, reason, reason_file, changes, done]
            properties:
              ok: {type: boolean}
              done: {type: boolean}           # 輪を抜ける旗（通った時か 3 回目。3 回目は拒否の行を単位に結んで止め、受けた単位で通す）
              consulted: {type: boolean}      # 範囲の相談の周（受け付けを回していない）
              reason: {type: string}
              reason_file: {type: string}     # 拒否の理由の本文を書いた盤面のファイル（通れば空。script_io）
              changes: {type: array}
              rejects: {type: array}          # 拒否の行ごとの確かめの id と文（[{check, text}]。reason の行と同じ並び。表は accept.CHECKS）
              parked: {type: boolean}         # 食い違いの申し出で単位を止め、盤面に渡さずに抜けた（裁定の輪の後に渡す）

  # 食い違いの申し出（修正役か TDD の輪の役が返し、名指しが現物に在った物）で止めた単位が在るか。裁定の輪と 2 回目の修正役の
  # when: はこの欄だけを読む（盤面の今の周の conflicts.json）
  - id: conflict-check
    description: '食い違いの申し出の名指しを現物で確かめる'
    script: conflict_check
    runtime: uv
    depends_on: [fix-loop]
    timeout: 1728000000
    output_format:
      type: object
      additionalProperties: false
      required: [go, count, file]
      properties:
        go: {type: boolean}
        count: {type: integer, minimum: 0}
        file: {type: string}

  # 裁定の輪（持ち主 2026-09-28「おしで」）。役 rule は輪のただ 1 つの AI の節（TA13）で読むだけ。持ち主の決まり
  # （rules/principles.md）で fix_test_scope・fix_code_as・ask_human・replace_query（置き換えた問いは機械が例で試す）・fix_plan_item のどれかに裁く。3 回目の拒否で裁かれていない申し出を人へ回し、
  # done で抜ける（max_iterations で落とさない。R50）。理由の文は rule-prep が次の指示書の 1 行目でパスを名指す（R44）
  - id: rule-loop
    description: '裁定の輪'
    depends_on: [conflict-check]
    when: "$conflict-check.output.go == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $rule-accept.output.done = true
      nodes:
        - id: rule-prep
          script: rule_prep
          runtime: uv
          timeout: 1728000000
          with:
            judgment_file: $INPUTS.judgment_file
            policy_path: $INPUTS.policy_path
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, iteration]
            properties:
              prompt_file: {type: string}
              iteration: {type: integer, minimum: 1}

        - id: rule
          description: '裁定役: 食い違いを持ち主の決まりで裁く（読むだけ）'
          model: opus                 # 役 judge の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
          effort: high                # 役 judge の前付けの effort（段は前付けを読まない。tests/test_tool_parity.py の RoleModelCase が縛る）
          prompt: 指示書 `$rule-prep.output.prompt_file` を Read で全部読み、その指示に従え。返すのは指示書の「返す JSON」の形の JSON だけ。
          depends_on: [rule-prep]
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]   # 読むだけ。本線の judge の定義の道具（web を含む）
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # ruling.RULE_OUTPUT_FORMAT（tests/test_blk_fix_conflict.py が一致を見る）
          output_format:
            description: 'works-node: rule'
            type: object
            additionalProperties: false
            required: [rulings]
            properties:
              rulings:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [id, decision, text, limits]
                  properties:
                    id: {type: string, minLength: 1}
                    decision: {type: string, enum: [fix_test_scope, fix_code_as, ask_human, replace_query, fix_plan_item]}
                    text: {type: string, minLength: 10}
                    limits:
                      type: array
                      items: {type: string, minLength: 1}
                    grounds:                       # 裁きの出どころ（<パス>:<行>。依頼の行・判定・テスト・コード。機械が現物に在るかを見る）
                      type: array
                      items: {type: string, minLength: 3}
                    request_searched: {type: string, minLength: 10}   # 依頼で何を探して答えが無かったか（依頼の在る run の ask_human）
                    query:
                      type: object
                      additionalProperties: false
                      required: [how, counts, hits, misses]
                      properties:
                        how: {type: object}
                        counts: {type: string, enum: [defects, population]}
                        hits:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1}
                          minItems: 1
                        misses:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1}

        - id: rule-accept
          script: rule_accept
          runtime: uv
          depends_on: [rule]
          timeout: 1728000000
          with:
            reply: {from: "$rule.output"}
            base_rev: $INPUTS.base_rev
            iteration: $rule-prep.output.iteration
          output_format:
            type: object
            required: [ok, done, reason, reason_file, rulings_file, counts]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              rulings_file: {type: string}   # 裁定の文（2 回目の修正役の指示書の 1 行目が名指す）
              counts: {type: object}         # {parked, unruled, fix_test_scope, fix_code_as, ask_human[, replace_query][, fix_plan_item]}

  # 裁定の後の 2 回目の修正役（印 continue=fix: 包みが修正役の会話を継ぐ）。1 回目は裁定の文のファイルを名指し、直す裁定でない
  # 裁定（ask_human・fix_plan_item。fix_plan_item は案を直して戻るまで）の単位は直す義務から外れる（conflict.owed_units_but_asked）。盤面の p3.fix に渡すのはここ（1 回目は申し出で止めて渡していない）
  - id: fix-ruled-loop
    description: '裁定の後の 2 回目の修正の輪'
    depends_on: [conflict-check, rule-loop]
    when: "$conflict-check.output.go == true"
    loop_group:
      max_iterations: 12   # 受け付けの 3 回と範囲の相談の周の枠 9 の和（fix-loop と同じ）
      fresh_context: false
      until_bash: test $fix-ruled-accept.output.done = true
      nodes:
        - id: fix-ruled-prep
          script: fix_prep
          runtime: uv
          timeout: 1728000000
          with:
            judgment_file: $INPUTS.judgment_file
            open_units: $INPUTS.open_units
            plan_file: $INPUTS.plan_file
            policy_path: $INPUTS.policy_path
            notes_file: $INPUTS.notes_file
            summary_file: $tdd-start.output.summary_file
            base_rev: $INPUTS.base_rev
            plan_session: $INPUTS.plan_session   # 範囲の相談の相手（空は相談しない）
            ripple_file: $INPUTS.ripple_file   # 波及の一覧（範囲の相談の節が名指す。空は名指さない）
            pass: "ruled"
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, attempt, out_path, node, already, iteration]
            properties:
              prompt_file: {type: string}
              attempt: {type: integer}
              out_path: {type: string}
              node: {type: string}
              already: {type: boolean}
              iteration: {type: integer, minimum: 1}

        - id: fix-ruled
          description: '裁定の文を読んで直す（修正役の会話の続き）'
          model: sonnet               # コードとテストを書く役（前付けの無い役。表 .shared/core/stage-models.json の値で tests/test_tool_parity.py が縛る。WORKS_DEV_MODEL の明示で替わる。持ち主 2026-10-06）
          effort: high                # 同じ表の effort（段に書かないと run の既定で黙って走る）
          prompt: 指示書 `$fix-ruled-prep.output.prompt_file` を Read で全部読み、その指示に従え。返すのは指示書が名指す欄の JSON だけ。
          depends_on: [fix-ruled-prep]
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Agent]   # 修正役と同じ
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # recount.RULED_OUTPUT_FORMAT（修正役と同じ欄。印だけが違う）
          output_format:
            description: 'works-node: fix-ruled continue=fix'
            type: object
            required: *fix_required
            additionalProperties: false
            properties: *fix_properties

        # 範囲の相談（docs/plans/2026-10-06-ask-planner.md）。役が返答の欄 consult で範囲の外を頼んだ周だけ働く: 頼みの節が機械の先の
        # 確かめをして、聞く頼みが在れば相手の会話（入力 plan_session の印の名の会話の id を、ブロックの中の名 fix-planner として包みの
        # 置き場へ写す）に答えの節を続けさせ、確かめの節が答えを確かめて盤面の trace に残す。その周は締める節と受け付けを回さず
        # （consulted）、次の周の支度が答えのファイルを名指す続きの指示書で役を同じ会話の続きで起こす。頼みの無い周は何もしない
        - id: fix-ruled-consult
          script: consult_prep
          runtime: uv
          depends_on: [fix-ruled]
          timeout: 1728000000
          with:
            reply: {from: "$fix-ruled.output"}
            plan_session: $INPUTS.plan_session   # 相談の相手の会話の印の名（空は相手の無い run。頼みは聞けない行になる）
            pass: "ruled"
            answer_node: "plan-answer-ruled"
          output_format:
            type: object
            additionalProperties: false
            required: [consulted, go, prompt_file, turn, spent]
            properties:
              consulted: {type: boolean}   # 返答が consult を持ち、枠の中（この周は相談の周）
              go: {type: boolean}          # 聞く頼みが在り、相手の会話を写した（答えの節を起こす）
              prompt_file: {type: string}  # 答えの節の指示書（go の時だけ）
              turn: {type: integer, minimum: 0}
              spent: {type: boolean}       # 枠を使い切った後の consult（受け付けが拒む）

        # 答えの節: 修正案を書いた役の会話の続き（印 continue=fix-planner。包みが fix-ruled-consult の写した id で --resume する）。読むだけ。
        # 出力は blk-fix/lib/consult.py の answer_format（tests/test_consult.py が一致を見る）
        - id: plan-answer-ruled
          description: '範囲の相談に答える（修正案を書いた会話の続き。読むだけ）'
          model: opus                 # 修正案・仕様を書く役と同じ（表 .shared/core/stage-models.json の plan_writer。tests/test_tool_parity.py が縛る）
          effort: medium              # 同じ表の effort
          prompt: 指示書 `$fix-ruled-consult.output.prompt_file` を Read で全部読み、その相談に答えよ。返すのは指示書の JSON だけ。
          depends_on: [fix-ruled-consult]
          when: "$fix-ruled-consult.output.go == true"
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]   # 修正案を書いた役と同じ読むだけの道具（書く道具・Bash は持たない）
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          output_format:
            description: 'works-node: plan-answer-ruled continue=fix-planner map'
            type: object
            additionalProperties: false
            required: [answers]
            properties:
              answers:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [ask, decision, paths, tests, spec, reason]
                  properties:
                    ask: {type: integer, minimum: 1}
                    decision: {type: string, enum: [allow, deny, defer]}
                    paths: {type: array, items: {type: string, minLength: 1}}
                    tests: {type: array, items: {type: string, minLength: 1}}
                    spec: {type: string}
                    reason: {type: string, minLength: 10}

        - id: fix-ruled-consult-check
          script: consult_check
          runtime: uv
          depends_on: [fix-ruled-consult, plan-answer-ruled]
          trigger_rule: none_failed_min_one_success   # 頼みの無い周・聞く頼みの無い周は答えの節が飛ばされる
          timeout: 1728000000
          with:
            answer: {from: "$plan-answer-ruled.output", if_skipped: null}
            pass: "ruled"
            answer_node: "plan-answer-ruled"
          output_format:
            type: object
            additionalProperties: false
            required: [consulted, turn, answer_file, counts]
            properties:
              consulted: {type: boolean}   # この周は相談の周（締める節と受け付けは回さない）
              turn: {type: integer, minimum: 0}
              answer_file: {type: string}  # 修正役が次の周に読む答え（盤面の今の scope の周の作業ファイル）
              counts: {type: object}       # 答えごとの数（allow・deny・defer・refused・invalid・unavailable）

        - id: fix-ruled-accept
          script: accept
          runtime: uv
          depends_on: [fix-ruled-consult-check]
          timeout: 1728000000
          with:
            reply: {from: "$fix-ruled.output"}
            base_rev: $INPUTS.base_rev
            tdd_state: $tdd-start.output.state_file
            iteration: $fix-ruled-prep.output.iteration
            pass: "ruled"
            tdd_suite: $INPUTS.tdd_suite
            consulted: $fix-ruled-consult-check.output.consulted   # 範囲の相談の周は受け付けを回さない
          output_format:
            type: object
            required: [ok, reason, reason_file, changes, done]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              consulted: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              changes: {type: array}
              rejects: {type: array}
              parked: {type: boolean}

  # 修正役が残した git が無視するファイル（控えに無かった物だけ）を消す。差分には載らないが、テストの緑赤を左右する
  - id: clean
    script: clean
    runtime: uv
    depends_on: [fix-loop, conflict-check, rule-loop, fix-ruled-loop]
    trigger_rule: none_failed_min_one_success   # 申し出が無い run は裁定の輪と 2 回目の修正の輪が飛ばされる
    timeout: 1728000000
    # 消したパスの全件は盤面の今の scope の根の fix-removed.json に書き、出口は件数とそのパスだけ（件数に上限が無く、子の stdout には上限が在る）
    output_format:
      type: object
      required: [ok, count, file]
      properties:
        ok: {type: boolean}
        count: {type: integer, minimum: 0}
        file: {type: string}

  - id: assert-changed
    script: assert_changed
    runtime: uv
    depends_on: [clean]
    timeout: 1728000000
    with:
      base_rev: $INPUTS.base_rev
      accepted: $fix-loop.output
      ruled: {from: "$fix-ruled-loop.output", if_skipped: null}   # 2 回目の修正の輪が走れば、その受け付けの出力を使う
    # 通らない（申告が空（直す義務が残らず、答え待ち・ask_human で外れた単位が在る時を除く）・申告したのに変わっていない）時は run を落とさずに盤面を理由つきで止め
    # （by works:fix。R50）、ok: false と reason を出す。後ろの段は境の節が飛ばし、報告と書き出しは走る（run 26）
    output_format:
      type: object
      required: [ok, files]
      properties:
        ok: {type: boolean}
        files:
          type: array
          items: {type: string}
        reason: {type: string}

  # 読んだ証拠（受け付けの条件にしない。今の scope の周の reads-fix.json。collect が reads_file で出口に出す）。機械が渡したパスは判定のファイルと、
  # fix-prep が今の周に組んだ指示書（fixrules.reads_more。輪の外の節は輪の中の出力を引けないので盤面の置き場から）
  - id: fix-reads
    script: reads
    runtime: uv
    depends_on: [assert-changed]
    timeout: 1728000000
    with:
      must: '["$INPUTS.judgment_file"]'
    output_format:
      type: object
      additionalProperties: false
      required: [ok, reads_file]
      properties:
        ok: {type: boolean}
        sources: {type: object}
        missing: {type: array, items: {type: string}}
        reads_file: {type: string}

  - id: collect
    script: collect
    runtime: uv
    depends_on: [fix-reads]
    timeout: 1728000000
    with:
      accepted: $fix-loop.output
      ruled: {from: "$fix-ruled-loop.output", if_skipped: null}
      changed: {from: "$assert-changed.output"}
      cleaned: {from: "$clean.output"}
      tdd: {from: "$tdd-start.output"}   # tdd-start はいつも走る（飛ばされない）
    output_format:
      type: object
      required: [ok, files, changes_file, removed, tdd]
      properties:
        ok: {type: boolean}
        files:
          type: array
          items: {type: string}
        changes_file: {type: string}
        removed:   # clean の出口の件数と全件のファイルをそのまま通す
          type: object
          required: [count, file]
          properties:
            count: {type: integer, minimum: 0}
            file: {type: string}
        # TDD の輪の結果 {ran, suite, reason, units: [{unit_key, route, why, tests, test_files, red, green, refactor,
        # gave_up, problems, red_kinds, test_cmd, refactor_why}], test_cmd: {gate, note}, calls: [{n, phase, unit_key, ok, runs,
        # secs}], reused?: {suite, test_cmd}}。reused は輪の頭で同じ run の中の控えから使い回した結果の出どころの句（使った物だけ）。
        # 実行器の無い run は ran: false・units は空で test_cmd・calls の欄も無い（tddloop.exit_fields・FIELDS）
        tdd: {type: object}
        # 盤面の欄（〔線A計〕T17。recount.collect）: 受けた修正の返答のファイル・直せなかった単位の数・単位ごとの前後の件数・読んだ証拠
        fix_file: {type: string}
        not_done: {type: integer, minimum: 0}
        coverage: {type: object}
        reads_file: {type: string}
        reason: {type: string}          # 止めた出口（ok: false。assert-changed が止めた盤面の理由）
