name: blk-fix
description: |
  修正のブロック（support workflow。ラインから include で使う）。
  修正役の前に git が無視するファイルを控え（ignored-before）、テストの実行器（入力 tdd_suite）が在る run だけ単位ごとの
  TDD の輪を回し（tdd-start → tdd-loop。振り分け → 単位ごとにテスト・赤（機械）・直し・緑（機械）・整え・確かめ直し（機械）。
  実行器が無い run は輪を飛ばし、今と同じに動く。既定の形 g3 では、振り分けの直後に書いてよい範囲の引ける tdd の単位の枝（修正案の
  項目を共にする単位の組）が 2 本以上あれば、確かめの節が枝ごとに小さい worktree を切って輪を抜け、枝ごとの輪（tdd-lane-loop-<n>。
  3 本まで。枝の役の節を包みが枝の worktree を cwd に起こす）が同時に回り（枝の中は順に、単位ごとに新しい会話で）、確かめの節が段ごとに
  赤・緑を確かめる。締めの節 tdd-join が差分を作業ツリーへ 3 方向で当てて緑を確かめ直し、食い違った枝・済まなかった単位・枝に入らな
  かった単位は輪 tdd-rest-loop が順に回す。依頼 243 の並べ。範囲が重なる枝も並べる）、判定のブロックが受け付けた根本の単位を修正役に直させ（fix。輪で直した単位は
  changes に行を書くだけ。残りの単位を 1 つの会話に積まず、単位（修正案の項目）ごとに新しい会話の
  下請けを Agent で起こす。依頼 243 の 2。修正の輪の前に、書いてよい範囲の在る項目（重なってもよい）が単位を共にしない 2 本以上の
  枝に分かれれば、節 fix-fork が枝ごとに小さい worktree を切り、枝の輪 fix-lane-loop-<n>（3 本まで。枝の役の節を包みが枝の worktree を
  cwd に起こす。項目ごとに新しい会話。範囲の相談と受け付けと同じ事実の確かめを枝の中で回す）が同時に直し、締めの節 fix-join が差分を
  作業ツリーへ 3 方向で当てる。当たらない枝・諦めた項目・枝に入らなかった項目は修正の輪が順に直す。依頼 243 の並べの 5 段目。
  docs/plans/2026-10-07-fix-lane-nodes.md。入力 tdd_lanes・fix_lanes が off なら、それぞれ輪の並べの周・修正役の並べを使わずに順に回す）、
  2 つの役（tdd・fix）の指示書は、その前の script の節（tdd-prep・fix-prep）が修正の決まりの正本（.shared/core/writerules/common.md）と道ごとの決まりと
  run の値から機械で組む（lib/fixrules.py。裁定 R65。役の節の指示は「組んだ指示書を Read で読め」の 1 行）、
  返答を写した規則で受け付け（fix-accept。拒めば理由を貼って同じ会話で出し直し、上限 3 回。3 回目の拒否は行を名指しの単位・テストが
  import で届く単位に結んで、その単位だけを段の頭の木に戻して控えに残し、ほかの単位は受けて先へ進む。受け付けと輪の緑の回が
  走らせる試験は変更に直に関わる物だけ——変えた・足した試験、変えたファイルを直に読む・言及する試験、修正案の受け入れ・書き換えの
  テスト。届くだけの先の試験は回さず、最後のテストの段に任せた試験として最後の関所に名前で並べる。一式を回すのは分からない物が直に関わる所に在る時だけ（遠くの物は最後の関所に並べる）。一式は線の最後のテストで 1 回）、修正役が残した git が
  無視するファイル（テストを回して出来た __pycache__ など）のうち控えに無かった物だけを消し（clean。後のテストの節を
  生成物の無い木で回す）、申告したファイルが実際に変わったかを確かめ（assert-changed。何も変えずに済んだと言えば
  run が落ちる）、出口に集める（collect。消した件数と、全件を書いた盤面のファイルも渡す）。
  食い違いの申し出（持ち主 2026-09-28）: 修正役と TDD の輪の役は、緑にするためにテスト・依頼・コードのどれかを曲げる代わりに、
  名指しつき（<パス>:<行>）の食い違いを返してよい。名指しが現物に在れば拒否に数えずその単位を止め（conflict-check）、読むだけの
  裁定役（rule-loop。持ち主の決まり rules/principles.md）が fix_test_scope・fix_code_as・ask_human・replace_query・fix_plan_item に裁き、2 回目の修正役
  （fix-ruled-loop。修正役の会話の続き）が裁定の文のファイルを読んで直して盤面に渡す。ask_human の単位は直す義務から外れ、
  最後の人の関所に届く。fix_plan_item の単位も直す義務から外れ、同じ run の中で修正案の役がその項目を直してから、この
  ブロックの 2 度目の include（2 回目の修正の段。その物は include の名の置き場 scope で 1 回目と分かれる）で直す
  （.shared/core/conflict.py・replan.py）。
  範囲の相談（持ち主 2026-10-07。docs/plans/2026-10-06-ask-planner.md）: 修正役は修正案の項目の範囲の外や凍ったテストの書き換えが
  要る時、返答の欄 consult で頼む。2 つの修正の輪の中で、頼みの節（機械の先の確かめ）→ 答えの節（入力 plan_session の会話の続き。
  読むだけ）→ 確かめの節（盤面の trace に記録）が答え、その周は締める節と受け付けを回さず、次の周の修正役が同じ会話の続きで
  答えを読んで直しを続ける（修正役の印の旗 self-resume）。

inputs:
  judgment_file:
    required: true
    description: 受け付けた判定のファイルのパス（blk-judge の出口 judgment_file。盤面の judgment.json）
  open_units:
    required: true
    description: 直す義務の単位の key の JSON の配列の文字列（blk-judge の出口 open_units）
  base_rev:
    default: ""
    description: 周の頭で固めた版。触ったファイルはこの版からの差分で数える。空はその場の HEAD
  # 線 A（仕様 3.2）の入口。fix-prep・tdd-prep が指示書に組む（パスを書き、役が Read する）。どれも空でよい
  plan_file:
    default: ""
    description: 盤面が受けた修正案（p2.fix_plan）のファイルのパス。事前審査（p2.plan_review）の返答は同じフォルダ。空は修正案の無い run
  notes_file:
    default: ""
    description: 人が関所で答えた一言（盤面の record.process.human_items の今の周の note）を書いたファイルのパス。空は聞いていない。一言の本文はファイルにだけ置く（R44。with の値に文を貼らない）
  policy_path:
    default: ""
    description: 人の方針の文書（盤面が固めた写し）のパス。空は方針の無い run
  tdd_suite:
    default: ""
    description: |
      テストの実行器（JUnit XML の書き先を第 1 引数に受け、リポジトリの根で走る実行ファイル。本線の tdd_suite と同じ約束。
      相対なら対象リポジトリの根から。後ろに試験のファイル・node id（絶対パス）と -k を足して呼ぶことがある。TDD の輪の赤・緑の回は
      env TDD_SUITE_ONLY=1 を付けて呼び、その時は後ろに足した試験だけを走らせてよい（既定の一式を集めない。解かない実行器は無視してよい））。空は実行器の無い run で、TDD の輪を飛ばして全部の単位を今どおり直す。
      実行器を探して決めるのはラインの start（設計 6 節）で、ここはその結果を受けるだけ
  plan_session:
    default: ""
    description: |
      範囲の相談の相手の会話の印の名（包みが `<包みの家>/sessions/<cwd の hash>/<印の名>.id` に会話の id を記録する役の節の
      `works-node:` の名。承認済みの修正案を書いた役の物）。空なら相談しない。修正役は、修正案の項目の範囲の外や凍ったテストの
      書き換えが要る時、返答の欄 consult で頼み（下請けはまとめ役に報告する）、修正の輪の答えの節がその会話の続きで答え、許された
      範囲は受け付けが範囲に入れる（設計 docs/plans/2026-10-06-ask-planner.md）。ブロックはこの名の会話の id を、ブロックの中の名
      fix-planner の id として包みの置き場に写して継ぐ（答えの節の印 continue=fix-planner。ほかのブロックの節の名を YAML に書かない）
  ripple_file:
    default: ""
    description: |
      波及の一覧のパス（承認済みの修正案の項目ごとに、変える名の呼び出し元と試験と、範囲に入っていない当たりを並べた JSON。
      {"items": [{item, unit_keys, names, uncovered: [{id, name, kind, at}]}], "overlaps", "error"}）。空なら名指さない。修正役と
      下請けの範囲の相談の節が名指し、範囲の外の当たりを触る前に相談させる
  test_cmd:
    default: ""
    description: 緑の後に TDD の輪が走らせるテストのコマンド（線の入力 `test_cmd`）。空は走らせない。実行器がこのコマンドそのものを包んだ物なら 2 度走らせない
  unit_depths:
    default: ""
    description: |
      単位ごとの深さ。`{"<単位の key>": "軽量" | "標準"}` の JSON の文字列。空・名指しの無い単位・標準は今どおり。軽量の単位だけ、TDD の輪が緑の後に test_cmd を走らせない（赤・緑の確かめ・受け付けの選んで回す試験・裁定の輪は省かない）。形が違えば tdd-start が 2 で落ちる
  tdd_lanes:
    default: ""
    description: |
      TDD の輪の並べの周（形 g3 で、範囲の引ける tdd の枝を枝ごとの worktree で同時に直す段 lanes）を使うか。on（空も on。今どおり）か off。
      off なら tdd-start が輪の状態の lanes_on を偽にし、振り分けの後も並べずに tdd の単位を順に回す（ほかは今どおり）。ほかの語は tdd-start が 2 で落ちる
  fix_lanes:
    default: ""
    description: |
      修正役の並べ（形 g3 で、範囲の在る項目を修正の輪の前の枝の輪 fix-lane-loop-<n> で単位の worktree ごとに同時に直す）を使うか。on（空も on。今どおり）か off。
      off なら節 fix-fork が枝を切らず、修正役は項目の下請けを作業ツリーで順に起こす（項目ごとに新しい会話の下請けは今どおり）。ほかの語は fix-fork が 2 で落ちる

returns: collect
outcome_field: ok

nodes:
  # 修正役の前の git が無視するファイルの控え（盤面の今の scope の根の fix-ignored-before.json）。
  # clean はこれに無かった物だけを消す
  - id: ignored-before
    script: ignored_before
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      required: [ok, count, file]
      properties:
        ok: {type: boolean}
        count: {type: integer, minimum: 0}
        file: {type: string}

  # TDD の輪の頭。実行器が無ければ何も書かずに go: false（輪は飛ぶ）。在れば一式を 1 回走らせて元の結末を取り、
  # test_cmd の関門（緑の後に毎回走らせるか）を 1 回だけ決める（unit_depths が軽量と名指す単位は、関門が on でも走らせない）
  - id: tdd-start
    script: tdd_start
    runtime: uv
    depends_on: [ignored-before]
    timeout: 1728000000
    with:
      tdd_suite: $INPUTS.tdd_suite
      open_units: $INPUTS.open_units
      test_cmd: $INPUTS.test_cmd
      unit_depths: $INPUTS.unit_depths
      tdd_lanes: $INPUTS.tdd_lanes   # 並べの周を使うか（off なら lanes_on を偽に）
    output_format:
      type: object
      additionalProperties: false
      required: [go, reason, suite, state_file, summary_file]
      properties:
        go: {type: boolean}
        reason: {type: string}
        suite: {type: string}
        state_file: {type: string}     # 輪の状態（盤面の tdd-<k>/state.json）。実行器の無い run は空（g1 は go: false でも元の結末の状態を持つ）
        summary_file: {type: string}   # 輪の結果（修正役が読む）。go: false なら空

  # 単位ごとの TDD の輪（設計 2 節 3・案 (i)。graph は変えない）。役 tdd は輪のただ 1 つの AI の節（TA13）で、振り分け・
  # テスト・直し・整えを返す（C17）。fresh_context は false のままで、同じ単位の段は 1 つの会話を継ぎ、単位が替わる周だけ包みが
  # 新しい会話で起こす（tdd-prep が run ごとの置き場に書く単位の鍵。前の単位の物は指示書の引き継ぎの節で渡す。依頼 243 の 2）。
  # 赤・緑は tdd-step が写しの red_problems・green_problems で決める。
  # 拒否の理由は tdd-prep が次の指示書に書く（$LOOP_PREV で貼らない。R44）。段ごとに 3 回目の拒否で諦め（その単位は direct）、
  # 実行器が走らない・回数が max_iterations に届く周では残りを direct にして done を立てる（max_iterations で落とさない。R50）。
  # 形 g3 で振り分けの後に範囲の引ける tdd の枝（項目を共にする単位の組）が 2 本以上なら、tdd-step が枝ごとの worktree を切って
  # 段を lanes にし、輪はそこで抜ける（tdd-step が done を立てる。出口の phase は lanes）。並べの周は輪の外の節が回す: tdd-fork → 枝の輪 tdd-lane-loop-<n>
  # （枝ごとに AI の節。同時に走る）→ tdd-join（差分を 3 方向で当てて緑を確かめ直し、食い違った枝・済まなかった単位を順に戻す）→
  # 残りの順の単位を回す輪 tdd-rest-loop（この輪と同じ支度・確かめ）。docs/plans/2026-10-07-lane-nodes.md
  - id: tdd-loop
    description: 'TDD の輪: 単位ごとにテスト→赤→直し→緑→整え（実行器の在る run だけ）'
    depends_on: [tdd-start]
    when: "$tdd-start.output.go == true"
    loop_group:
      max_iterations: 40
      fresh_context: false
      until_bash: test $tdd-step.output.done = true
      nodes:
        # 指示書を組む（tddloop.prep → fixrules.tdd_render: 修正の決まりの正本・TDD の決まり・今の段・run の値）を next.md に書く
        - id: tdd-prep
          script: tdd_prep
          runtime: uv
          timeout: 1728000000
          with:
            state_file: $tdd-start.output.state_file
            judgment_file: $INPUTS.judgment_file
            plan_file: $INPUTS.plan_file
            policy_path: $INPUTS.policy_path
            notes_file: $INPUTS.notes_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, go]
            properties:
              prompt_file: {type: string}
              go: {type: boolean}   # 偽は輪が済んでいる（resume で 1 周目から回し直された輪）。役を起こさず、確かめが輪を抜ける

        - id: tdd
          description: 'TDD の役（今の単位を直す）'
          model: sonnet               # コードとテストを書く役（前付けの無い役。表 .shared/core/stage-models.json の値で tests/test_tool_parity.py が縛る。WORKS_DEV_MODEL の明示で替わる。持ち主 2026-10-06）
          effort: high                # 同じ表の effort（段に書かないと run の既定で黙って走る）
          prompt: 指示書 `$tdd-prep.output.prompt_file` を Read で毎回全部読み（回ごとに中身が替わる）、その指示に従え。返すのは指示書の「返す JSON」の形の JSON だけ。
          depends_on: [tdd-prep]
          when: "$tdd-prep.output.go == true"
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          # 借りたスキルの座（.shared/core/seat.py）: tdd-prep が指示書に座と読み替えを載せる
          skills: [test-driven-development]
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Skill]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # 印 works-node: tdd（包みが会話を節の名で分け、続きの起動で指示書の形を選ぶ）
          output_format:
            description: 'works-node: tdd'
            type: object
            additionalProperties: false
            required: [phase]
            properties: &tdd_reply   # 輪 tdd-rest-loop の役 tdd-rest も同じ形
              phase: {type: string, enum: [route, test, fix, refactor, conflict]}
              units:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [unit_key, route]
                  properties:
                    unit_key: {type: string, minLength: 1}
                    route: {type: string, enum: [tdd, direct]}
                    why: {type: string}
              unit_key: {type: string}
              test_files:
                type: array
                items: {type: string}
              tests:
                type: array
                items: {type: string}
              direct_why: {type: string}
              files:
                type: array
                items: {type: string}
              what: {type: string}
              # 整えの申告（phase fix の任意の欄。declared が true の単位か、修正案の項目が refactor.declared の単位だけ refactor の段が来る。
              # tddloop._declared・_plan_refactor_why）
              refactor:
                type: object
                additionalProperties: false
                required: [declared, why]
                properties:
                  declared: {type: boolean}
                  why: {type: string}
              # 食い違いの申し出（phase conflict。どの段でも。.shared/core/conflict.py の 1 件の欄）
              between:
                type: array
                items: {type: string}
              why_both_cannot_hold: {type: string}
              which_is_right: {type: string, enum: [request, test, code, unknown, query]}
              correct_lines:
                type: array
                items: {type: string}
              kind: {type: string, enum: [brief_vs_judgment, unnamed_test_broke, not_red, scope_needed, query_hits_fixed, needs_context]}
              # Bash で書いたファイルの申告（任意。writes.BASH_WRITES_SCHEMA。tdd-step が書き込みの記録と突き合わせる）
              bash_writes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, why]
                  properties:
                    path: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}

        - id: tdd-step
          script: tdd_step
          runtime: uv
          depends_on: [tdd-prep, tdd]
          trigger_rule: none_failed_min_one_success   # 済んだ輪の周（resume）は役が飛ばされる（返答は null。確かめは何も動かさずに done）
          timeout: 1728000000
          with:
            reply: {from: "$tdd.output", if_skipped: null}
            state_file: $tdd-start.output.state_file
          output_format:
            type: object
            required: [ok, done, reason, reason_file, phase]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              phase: {type: string}

  # 並べの枝の輪を起こすか（輪 tdd-loop の状態の段が lanes の時だけ go と lane_<n>）。実行器の無い run（tdd-loop が飛ぶ）でも
  # 走って go: false を返す（tdd-join の when: がいつも引ける）
  - id: tdd-fork
    description: '範囲の引ける枝（項目を共にする単位の組）が 2 本以上なら、枝ごとに worktree を切って並べる [needs: tdd_lanes]'
    script: tdd_fork
    runtime: uv
    depends_on: [tdd-start, tdd-loop]
    trigger_rule: none_failed_min_one_success   # 実行器の無い run は tdd-loop が飛ばされる
    timeout: 1728000000
    with:
      state_file: $tdd-start.output.state_file
    output_format:
      type: object
      additionalProperties: false
      required: [go, lanes, lane_1, lane_2, lane_3]
      properties:
        go: {type: boolean}
        lanes: {type: integer, minimum: 0, maximum: 3}
        lane_1: {type: boolean}
        lane_2: {type: boolean}
        lane_3: {type: boolean}

  # 並べの枝の輪（枝 1 本に 1 つ。tdd-fork の lane_<n> で起き、枝どうしは同時に走る。この層に mutates_checkout: false の節を
  # 置かない——Archon v0.11.1 はその節と同じ層を順に回す）。役 tdd-lane-<n> は枝のただ 1 つの AI の節で、包みが印の旗 lane を見て
  # 枝の単位の worktree（tdd-lane-prep-<n> が盤面の tdd-lane-trees/ に書いた印。役の文からは取らない）を cwd に起こし、run の worktree と
  # ほかの枝の worktree を柵に足す。fresh_context は false のままで、同じ単位の段は 1 つの会話を継ぎ、単位が替わる周だけ包みが
  # 新しい会話で起こす（支度が書く単位の鍵）。赤・緑は tdd-lane-step-<n> が tddloop.step を枝の worktree で回して決める。枝の単位が
  # 全部済むか、拒否・実行器の止まりで諦めれば done で抜ける（回数の上限で落とさない。R50）
  - id: tdd-lane-loop-1
    description: '枝 1 の TDD の輪（枝の worktree で、枝の単位を順に） [needs: tdd_lanes]'
    depends_on: [tdd-fork]
    when: "$tdd-fork.output.lane_1 == true"
    loop_group:
      max_iterations: 40
      fresh_context: false
      until_bash: test $tdd-lane-step-1.output.done = true
      nodes:
        - id: tdd-lane-prep-1
          script: tdd_lane_prep
          runtime: uv
          timeout: 1728000000
          with:
            state_file: $tdd-start.output.state_file
            lane: "1"
            judgment_file: $INPUTS.judgment_file
            plan_file: $INPUTS.plan_file
            policy_path: $INPUTS.policy_path
            notes_file: $INPUTS.notes_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, go]
            properties:
              prompt_file: {type: string}
              go: {type: boolean}   # 偽は枝が済んでいる（resume で回し直された輪）。役を起こさず、確かめが輪を抜ける

        - id: tdd-lane-1
          description: '枝 1 の TDD の役（cwd は枝の worktree）'
          model: sonnet               # コードとテストを書く役（表 .shared/core/stage-models.json の値。tdd と同じ）
          effort: high
          prompt: 指示書 `$tdd-lane-prep-1.output.prompt_file` を Read で毎回全部読み（回ごとに中身が替わる）、その指示に従え。返すのは指示書の「返す JSON」の形の JSON だけ。
          depends_on: [tdd-lane-prep-1]
          when: "$tdd-lane-prep-1.output.go == true"
          settingSources: [user]
          skills: [test-driven-development]   # 座（g3 の時だけ並べる。座の文は決まりのファイルに載る）
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Skill]
          sandbox: {enabled: true, allowUnsandboxedCommands: false, failIfUnavailable: true}   # 包みの旗 lane が求める形（sandbox が立たない場で Bash を素通しさせない）
          idle_timeout: 1728000000
          # 印 works-node: tdd-lane-1 lane（包みが単位の worktree を cwd に起こし、会話を枝ごとに分ける）
          output_format:
            description: 'works-node: tdd-lane-1 lane'
            type: object
            additionalProperties: false
            required: [phase]
            properties: &lane_reply   # 枝 2・3 の役も同じ形（tdd の形から振り分けの欄 units を除き、段は test・fix・refactor・conflict）
              phase: {type: string, enum: [test, fix, refactor, conflict]}
              unit_key: {type: string}
              test_files:
                type: array
                items: {type: string}
              tests:
                type: array
                items: {type: string}
              direct_why: {type: string}
              files:
                type: array
                items: {type: string}
              what: {type: string}
              refactor:
                type: object
                additionalProperties: false
                required: [declared, why]
                properties:
                  declared: {type: boolean}
                  why: {type: string}
              between:
                type: array
                items: {type: string}
              why_both_cannot_hold: {type: string}
              which_is_right: {type: string, enum: [request, test, code, unknown, query]}
              correct_lines:
                type: array
                items: {type: string}
              kind: {type: string, enum: [brief_vs_judgment, unnamed_test_broke, not_red, scope_needed, query_hits_fixed, needs_context]}
              bash_writes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, why]
                  properties:
                    path: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}

        - id: tdd-lane-step-1
          script: tdd_lane_step
          runtime: uv
          depends_on: [tdd-lane-prep-1, tdd-lane-1]
          trigger_rule: none_failed_min_one_success   # 済んだ枝の周は役が飛ばされる（返答は null。確かめは何も動かさずに done）
          timeout: 1728000000
          with:
            reply: {from: "$tdd-lane-1.output", if_skipped: null}
            state_file: $tdd-start.output.state_file
            lane: "1"
          output_format:
            type: object
            required: [ok, done, reason, reason_file, phase, unit_key]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              phase: {type: string}
              unit_key: {type: string}

  - id: tdd-lane-loop-2
    description: '枝 2 の TDD の輪（枝の worktree で、枝の単位を順に） [needs: tdd_lanes]'
    depends_on: [tdd-fork]
    when: "$tdd-fork.output.lane_2 == true"
    loop_group:
      max_iterations: 40
      fresh_context: false
      until_bash: test $tdd-lane-step-2.output.done = true
      nodes:
        - id: tdd-lane-prep-2
          script: tdd_lane_prep
          runtime: uv
          timeout: 1728000000
          with:
            state_file: $tdd-start.output.state_file
            lane: "2"
            judgment_file: $INPUTS.judgment_file
            plan_file: $INPUTS.plan_file
            policy_path: $INPUTS.policy_path
            notes_file: $INPUTS.notes_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, go]
            properties:
              prompt_file: {type: string}
              go: {type: boolean}   # 偽は枝が済んでいる（resume で回し直された輪）。役を起こさず、確かめが輪を抜ける

        - id: tdd-lane-2
          description: '枝 2 の TDD の役（cwd は枝の worktree）'
          model: sonnet               # コードとテストを書く役（表 .shared/core/stage-models.json の値。tdd と同じ）
          effort: high
          prompt: 指示書 `$tdd-lane-prep-2.output.prompt_file` を Read で毎回全部読み（回ごとに中身が替わる）、その指示に従え。返すのは指示書の「返す JSON」の形の JSON だけ。
          depends_on: [tdd-lane-prep-2]
          when: "$tdd-lane-prep-2.output.go == true"
          settingSources: [user]
          skills: [test-driven-development]   # 座（g3 の時だけ並べる。座の文は決まりのファイルに載る）
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Skill]
          sandbox: {enabled: true, allowUnsandboxedCommands: false, failIfUnavailable: true}   # 包みの旗 lane が求める形（sandbox が立たない場で Bash を素通しさせない）
          idle_timeout: 1728000000
          # 印 works-node: tdd-lane-2 lane（包みが単位の worktree を cwd に起こし、会話を枝ごとに分ける）
          output_format:
            description: 'works-node: tdd-lane-2 lane'
            type: object
            additionalProperties: false
            required: [phase]
            properties: *lane_reply

        - id: tdd-lane-step-2
          script: tdd_lane_step
          runtime: uv
          depends_on: [tdd-lane-prep-2, tdd-lane-2]
          trigger_rule: none_failed_min_one_success   # 済んだ枝の周は役が飛ばされる（返答は null。確かめは何も動かさずに done）
          timeout: 1728000000
          with:
            reply: {from: "$tdd-lane-2.output", if_skipped: null}
            state_file: $tdd-start.output.state_file
            lane: "2"
          output_format:
            type: object
            required: [ok, done, reason, reason_file, phase, unit_key]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              phase: {type: string}
              unit_key: {type: string}

  - id: tdd-lane-loop-3
    description: '枝 3 の TDD の輪（枝の worktree で、枝の単位を順に） [needs: tdd_lanes]'
    depends_on: [tdd-fork]
    when: "$tdd-fork.output.lane_3 == true"
    loop_group:
      max_iterations: 40
      fresh_context: false
      until_bash: test $tdd-lane-step-3.output.done = true
      nodes:
        - id: tdd-lane-prep-3
          script: tdd_lane_prep
          runtime: uv
          timeout: 1728000000
          with:
            state_file: $tdd-start.output.state_file
            lane: "3"
            judgment_file: $INPUTS.judgment_file
            plan_file: $INPUTS.plan_file
            policy_path: $INPUTS.policy_path
            notes_file: $INPUTS.notes_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, go]
            properties:
              prompt_file: {type: string}
              go: {type: boolean}   # 偽は枝が済んでいる（resume で回し直された輪）。役を起こさず、確かめが輪を抜ける

        - id: tdd-lane-3
          description: '枝 3 の TDD の役（cwd は枝の worktree）'
          model: sonnet               # コードとテストを書く役（表 .shared/core/stage-models.json の値。tdd と同じ）
          effort: high
          prompt: 指示書 `$tdd-lane-prep-3.output.prompt_file` を Read で毎回全部読み（回ごとに中身が替わる）、その指示に従え。返すのは指示書の「返す JSON」の形の JSON だけ。
          depends_on: [tdd-lane-prep-3]
          when: "$tdd-lane-prep-3.output.go == true"
          settingSources: [user]
          skills: [test-driven-development]   # 座（g3 の時だけ並べる。座の文は決まりのファイルに載る）
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Skill]
          sandbox: {enabled: true, allowUnsandboxedCommands: false, failIfUnavailable: true}   # 包みの旗 lane が求める形（sandbox が立たない場で Bash を素通しさせない）
          idle_timeout: 1728000000
          # 印 works-node: tdd-lane-3 lane（包みが単位の worktree を cwd に起こし、会話を枝ごとに分ける）
          output_format:
            description: 'works-node: tdd-lane-3 lane'
            type: object
            additionalProperties: false
            required: [phase]
            properties: *lane_reply

        - id: tdd-lane-step-3
          script: tdd_lane_step
          runtime: uv
          depends_on: [tdd-lane-prep-3, tdd-lane-3]
          trigger_rule: none_failed_min_one_success   # 済んだ枝の周は役が飛ばされる（返答は null。確かめは何も動かさずに done）
          timeout: 1728000000
          with:
            reply: {from: "$tdd-lane-3.output", if_skipped: null}
            state_file: $tdd-start.output.state_file
            lane: "3"
          output_format:
            type: object
            required: [ok, done, reason, reason_file, phase, unit_key]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              phase: {type: string}
              unit_key: {type: string}

  # 並べを締める（枝の輪の全部の後に 1 回。差分を当てて緑を確かめ直し、済まなかった単位を順に戻す。食い違いの申し出は盤面に積む）。
  # all_done: 枝の輪が 1 本落ちても締めて残りを順に回す（落ちた枝の単位は済んでいないので戻る。run は落ちた節を持ったまま進む）
  # Archon の resume は落ちた枝の輪とそれに依るこの節を回し直す: 済んだ枝の輪は支度の go: false で役を起こさずに抜け、この節は
  # 締めた時の出口を返す（tddlanes.join。盤面・作業ツリーを動かさない）
  - id: tdd-join
    description: '枝の差分を作業ツリーへ 3 方向で当てて緑を確かめ直す（食い違った枝・残りは次の輪へ） [needs: tdd_lanes]'
    script: tdd_join
    runtime: uv
    depends_on: [tdd-fork, tdd-lane-loop-1, tdd-lane-loop-2, tdd-lane-loop-3]
    trigger_rule: all_done
    when: "$tdd-fork.output.go == true"
    timeout: 1728000000
    with:
      state_file: $tdd-start.output.state_file
    output_format:
      type: object
      additionalProperties: false
      required: [go, done, phase, merged, back]
      properties:
        go: {type: boolean}
        done: {type: boolean}
        phase: {type: string}
        merged: {type: integer, minimum: 0}
        back: {type: integer, minimum: 0}

  # 並べの後に残った順の単位（枝に入らなかった単位・戻した単位）を回す輪。tdd-loop と同じ支度・確かめ・段で、役 tdd-rest は
  # 役 tdd と同じ形（印の名だけ違う。包みが単位の切れ目で会話を切る）
  - id: tdd-rest-loop
    description: '並べで済まなかった単位を順に回す TDD の輪 [needs: tdd_lanes]'
    depends_on: [tdd-join]
    when: "$tdd-join.output.go == true"
    loop_group:
      max_iterations: 40
      fresh_context: false
      until_bash: test $tdd-rest-step.output.done = true
      nodes:
        - id: tdd-rest-prep
          script: tdd_prep
          runtime: uv
          timeout: 1728000000
          with:
            state_file: $tdd-start.output.state_file
            judgment_file: $INPUTS.judgment_file
            plan_file: $INPUTS.plan_file
            policy_path: $INPUTS.policy_path
            notes_file: $INPUTS.notes_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, go]
            properties:
              prompt_file: {type: string}
              go: {type: boolean}   # 偽は輪が済んでいる（resume で 1 周目から回し直された輪）。役を起こさず、確かめが輪を抜ける

        - id: tdd-rest
          description: '残りの単位の TDD の役'
          model: sonnet               # コードとテストを書く役（表 .shared/core/stage-models.json の値。tdd と同じ）
          effort: high
          prompt: 指示書 `$tdd-rest-prep.output.prompt_file` を Read で毎回全部読み（回ごとに中身が替わる）、その指示に従え。返すのは指示書の「返す JSON」の形の JSON だけ。
          depends_on: [tdd-rest-prep]
          when: "$tdd-rest-prep.output.go == true"
          settingSources: [user]
          skills: [test-driven-development]
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Skill]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          output_format:
            description: 'works-node: tdd-rest'
            type: object
            additionalProperties: false
            required: [phase]
            properties: *tdd_reply

        - id: tdd-rest-step
          script: tdd_step
          runtime: uv
          depends_on: [tdd-rest-prep, tdd-rest]
          trigger_rule: none_failed_min_one_success   # 済んだ輪の周（resume）は役が飛ばされる（返答は null。確かめは何も動かさずに done）
          timeout: 1728000000
          with:
            reply: {from: "$tdd-rest.output", if_skipped: null}
            state_file: $tdd-start.output.state_file
          output_format:
            type: object
            required: [ok, done, reason, reason_file, phase]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              phase: {type: string}

  # 修正役の並べの枝を切るか（docs/plans/2026-10-07-fix-lane-nodes.md。依頼 243 の並べの 5 段目）。既定の形 g3 で、修正役が下請けを
  # 起こす単位（TDD の輪が緑にした単位を除く）を持つ範囲の在る修正案の項目が、単位を共にしない 2 本以上の枝に分かれれば（書き込みの
  # 記録の在る run だけ。包みの無い起動は旗 lane が効かない）、単位の worktree を切って枝の控え・項目の決まりのファイルを書き go と
  # lane_<n>。ほかは go: false（修正の輪が今どおり全部の項目を直す）。入力 fix_lanes が off でも go: false。実行器の無い run（TDD の輪が
  # 飛ぶ）でも走る
  - id: fix-fork
    description: '範囲の在る項目が単位を共にしない枝 2 本以上なら並べる [needs: fix_lanes]'
    script: fix_fork
    runtime: uv
    depends_on: [tdd-start, tdd-loop, tdd-fork, tdd-join, tdd-rest-loop]
    trigger_rule: none_failed_min_one_success   # 実行器の無い run は tdd-loop が、並べない run は tdd-join・tdd-rest-loop が飛ばされる
    timeout: 1728000000
    with:
      judgment_file: $INPUTS.judgment_file
      open_units: $INPUTS.open_units
      plan_file: $INPUTS.plan_file
      policy_path: $INPUTS.policy_path
      notes_file: $INPUTS.notes_file
      summary_file: $tdd-start.output.summary_file   # 輪の要約（隣の状態から輪が緑にした単位と凍結を引く。空は輪の無い run）
      base_rev: $INPUTS.base_rev
      plan_session: $INPUTS.plan_session   # 範囲の相談の相手（空は相談しない）
      ripple_file: $INPUTS.ripple_file
      fix_lanes: $INPUTS.fix_lanes   # 修正役の並べを使うか（off なら go: false）
    output_format:
      type: object
      additionalProperties: false
      required: [go, lanes, lane_1, lane_2, lane_3, why]
      properties:
        go: {type: boolean}
        lanes: {type: integer, minimum: 0, maximum: 3}
        lane_1: {type: boolean}
        lane_2: {type: boolean}
        lane_3: {type: boolean}
        why: {type: string}   # 並べない理由（並べる時は空）

  # 修正役の並べの枝の輪（枝 1 本に 1 つ。fix-fork の lane_<n> で起き、枝どうしは同時に走る。この層に mutates_checkout: false の節を
  # 置かない——Archon v0.11.1 はその節と同じ層を順に回す）。役 fix-lane-<n> は枝の項目を 1 つずつ直す修正役（項目ごとに新しい会話。
  # 包みが印の旗 lane で枝の単位の worktree を cwd に起こし、run の worktree とほかの枝の worktree を柵に足す。旗 self-resume で範囲の
  # 相談の答えの節の後も自分の会話に戻る）。範囲の相談は修正の輪と同じ 3 節（頼み → 答え（修正案を書いた役の会話の写し）→ 確かめ）で、
  # 枝ごとの段 lane-<n>。確かめの節 fix-lane-step-<n> は受け付けと同じ事実の確かめを単位の worktree に当て、同じ項目の 3 回目の拒否で
  # 項目を諦めて（差分を盤面に控える）次の項目へ。項目が尽きるか回数の上限で done
  - id: fix-lane-loop-1
    description: '枝 1 の修正役の輪（項目を順に・範囲の相談つき） [needs: fix_lanes]'
    depends_on: [fix-fork]
    when: "$fix-fork.output.lane_1 == true"
    loop_group:
      max_iterations: 18   # 項目 3 つの受け付けの 3 回ずつと範囲の相談の周の枠 9 の和（fixlanes.MAX_ITERATIONS）
      fresh_context: false
      until_bash: test $fix-lane-step-1.output.done = true   # 枝の項目が尽きた・回数の上限（max_iterations で落とさない。R50）
      nodes:
        - id: fix-lane-prep-1
          script: fix_lane_prep
          runtime: uv
          timeout: 1728000000
          with:
            lane: "1"
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, go]
            properties:
              prompt_file: {type: string}
              go: {type: boolean}   # 偽は枝が済んでいる（resume で回し直された輪）。役を起こさず、確かめが輪を抜ける

        - id: fix-lane-1
          description: '枝 1 の修正役'
          model: sonnet               # コードとテストを書く役（表 .shared/core/stage-models.json の値。fix と同じ）
          effort: high
          prompt: 指示書 `$fix-lane-prep-1.output.prompt_file` を Read で全部読み、その指示に従え。返すのは指示書が名指す欄の JSON だけ。
          depends_on: [fix-lane-prep-1]
          when: "$fix-lane-prep-1.output.go == true"
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Agent]   # Agent は項目の審査役の下請けだけ（実装の下請けは起こさない）
          sandbox: {enabled: true, allowUnsandboxedCommands: false, failIfUnavailable: true}   # 包みの旗 lane が求める形
          idle_timeout: 1728000000
          # 印 works-node: fix-lane-1 lane self-resume（包みが単位の worktree を cwd に起こし、答えの節の後も自分の会話に戻り、項目が替われば新しい会話）
          # 返答の形は修正役 fix と同じ（recount.FIX_OUTPUT_FORMAT の欄。ここでアンカー &fix_required・&fix_properties を置き、fix・fix-ruled と枝 2・3 が引く）
          output_format:
            description: 'works-node: fix-lane-1 lane self-resume'
            type: object
            required: &fix_required
            - changes
            - fix_closure
            - gates_changed
            - interactions
            - mechanism_changed
            - not_done
            - path_changed
            - plan_faces
            - premise_drift
            - seams_changed
            - security_surface_changed
            - wrote_refs
            additionalProperties: false
            properties: &fix_properties
              changes:
                type: array
                items:
                  type: object
                  required:
                  - breaks
                  - bypass_tried
                  - closure
                  - files
                  - root_or_symptom
                  - unit_key
                  - what
                  - precedent
                  additionalProperties: false
                  properties:
                    unit_key:
                      type: string
                    what:
                      type: string
                    closure:
                      type: object
                      required:
                      - mechanism
                      - fix_mechanism
                      - verified_how
                      - sites
                      additionalProperties: false
                      properties:
                        mechanism:
                          type: string
                        fix_mechanism:
                          type: string
                        verified_how:
                          type: string
                        sites:
                          type: array
                          items:
                            type: object
                            required:
                            - site
                            - red_seen
                            additionalProperties: false
                            properties:
                              site:
                                type: string
                              red_seen:
                                type: boolean
                              path:
                                type: string
                    files:
                      type: array
                      minItems: 1
                      items:
                        type: string
                    coverage:
                      type: object
                      additionalProperties: false
                      properties:
                        how:
                          type: object
                          required:
                          - patterns
                          - paths
                          - count
                          additionalProperties: false
                          properties:
                            patterns:
                              type: array
                              minItems: 1
                              maxItems: 20
                              items:
                                type: string
                                minLength: 1
                                pattern: ^[^\n\r\x00]+$
                            fixed:
                              type: boolean
                            paths:
                              type: array
                              minItems: 1
                              maxItems: 50
                              items:
                                type: string
                                minLength: 1
                                pattern: ^[^\n\r\x00]+$
                            count:
                              type: string
                              enum:
                              - lines
                              - files
                            untracked:
                              type: boolean
                            ignore_case:
                              type: boolean
                            word:
                              type: boolean
                        counts:
                          type: string
                          enum:
                          - defects
                          - population
                        remaining:
                          type: string
                    root_or_symptom:
                      type: object
                      required:
                      - kind
                      - why
                      additionalProperties: false
                      properties:
                        kind:
                          type: string
                          enum:
                          - root
                          - symptom
                        why:
                          type: string
                          minLength: 1
                    bypass_tried:
                      type: string
                      minLength: 1
                    breaks:
                      type: object
                      required:
                      - how
                      - result
                      additionalProperties: false
                      properties:
                        how:
                          type: string
                          minLength: 1
                        result:
                          type: string
                          minLength: 1
                        accepted:
                          type: string
                    precedent:
                      type: object
                      required:
                      - verdict
                      - reason
                      additionalProperties: false
                      properties:
                        problem:
                          type: string
                        source:
                          type: string
                        verdict:
                          type: string
                          enum:
                          - adopt
                          - adapt
                          - does_not_apply
                          - not_found
                        reason:
                          type: string
                          minLength: 4
                        searched:
                          type: string
                        from_judge_row:
                          type: boolean
                      allOf:
                      - if:
                          not:
                            required:
                            - from_judge_row
                            properties:
                              from_judge_row:
                                const: true
                        then:
                          required:
                          - problem
                          properties:
                            problem:
                              type: string
                              minLength: 4
                      - if:
                          allOf:
                          - not:
                              required:
                              - from_judge_row
                              properties:
                                from_judge_row:
                                  const: true
                          - required:
                            - verdict
                            properties:
                              verdict:
                                const: not_found
                        then:
                          required:
                          - searched
                          properties:
                            searched:
                              type: string
                              minLength: 4
                      - if:
                          allOf:
                          - not:
                              required:
                              - from_judge_row
                              properties:
                                from_judge_row:
                                  const: true
                          - required:
                            - verdict
                            properties:
                              verdict:
                                not:
                                  const: not_found
                        then:
                          required:
                          - source
                          properties:
                            source:
                              type: string
                              minLength: 4
              not_done:
                type: array
                items:
                  type: object
                  required:
                  - unit_key
                  - why
                  additionalProperties: false
                  properties:
                    unit_key:
                      type: string
                    why:
                      type: string
              fix_closure:
                type: object
                required:
                - status
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - found
                    - clean
                    - carried_over
                    - not_applicable
                    - awaiting_human
                    - not_run
                  count:
                    type: integer
                    minimum: 0
                  detail:
                    type: string
                  checked:
                    type: string
                  reason:
                    type: string
                  from_round:
                    type: integer
                    minimum: 1
              mechanism_changed:
                type: boolean
              premise_drift:
                type: boolean
              premise_drift_note:
                type: string
              gates_changed:
                type: boolean
              seams_changed:
                type: boolean
              security_surface_changed:
                type: boolean
              path_changed:
                type: boolean
              decision_records_changed:
                type: boolean
              rejudge_requested:
                type: string
              interactions:
                type: array
                items:
                  type: object
                  required:
                  - surface
                  - checked
                  additionalProperties: false
                  properties:
                    surface:
                      type: string
                      minLength: 1
                    checked:
                      type: string
                      minLength: 1
                    combined_effect:
                      type: string
              wrote_refs:
                type: array
                maxItems: 50
                items:
                  type: object
                  required:
                  - kind
                  - target
                  - where
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      enum:
                      - file
                      - text
                    cite:
                      type: string
                      minLength: 1
                      maxLength: 500
                    target:
                      type: string
                      minLength: 1
                      maxLength: 300
                    where:
                      type: string
                      minLength: 1
                      maxLength: 300
              plan_faces:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - key
                  - handled
                  - how
                  properties:
                    key:
                      type: string
                      minLength: 8
                    handled:
                      type: string
                      enum:
                      - absorbed
                      - declared
                    how:
                      type: string
                      minLength: 20
              x_scalars:
                type: object
                additionalProperties: false
                patternProperties:
                  ^x_[a-z0-9_]+$:
                    type: number
              # 食い違いの申し出（任意。conflict.CONFLICTS_SCHEMA。受け付けが名指しを現物で確かめ、盤面に渡す前に外す）
              conflicts:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [unit_key, between, why_both_cannot_hold, which_is_right, kind]
                  properties:
                    unit_key: {type: string, minLength: 1}
                    between:
                      type: array
                      minItems: 2
                      items: {type: string, minLength: 3}
                    why_both_cannot_hold: {type: string, minLength: 10}
                    which_is_right: {type: string, enum: [request, test, code, unknown, query]}
                    correct_lines:
                      type: array
                      minItems: 1
                      maxItems: 20
                      items: {type: string, minLength: 1}
                    kind: {type: string, enum: [brief_vs_judgment, unnamed_test_broke, not_red, scope_needed, query_hits_fixed, needs_context]}
              # 範囲の相談の頼み（任意。conflict.CONSULT_SCHEMA。在れば受け付けはその周を回さず、範囲の相談の 3 節が答える）
              consult:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [item, paths, tests, why]
                  properties:
                    item: {type: integer, minimum: 1}
                    paths:
                      type: array
                      items: {type: string, minLength: 1}
                    tests:
                      type: array
                      items: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}
              # Bash で書いたファイルの申告（任意。writes.BASH_WRITES_SCHEMA。受け付けが書き込みの記録と突き合わせ、盤面に渡す前に外す）
              bash_writes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, why]
                  properties:
                    path: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}

        - id: fix-lane-consult-1
          script: consult_prep
          runtime: uv
          depends_on: [fix-lane-1]
          timeout: 1728000000
          with:
            reply: {from: "$fix-lane-1.output"}
            plan_session: $INPUTS.plan_session
            pass: "lane-1"   # 枝ごとの相談の段（状態・答えのファイル・枠を枝で分ける）
            answer_node: "plan-answer-lane-1"
          output_format:
            type: object
            additionalProperties: false
            required: [consulted, go, prompt_file, turn, spent]
            properties:
              consulted: {type: boolean}
              go: {type: boolean}
              prompt_file: {type: string}
              turn: {type: integer, minimum: 0}
              spent: {type: boolean}

        # 答えの節: 修正案を書いた役の会話の写しで答える（印 continue=fix-planner fork map。同時に走るほかの枝の答えの節と履歴を混ぜない。旗 map は写しの元の会話と同じ地図）
        - id: plan-answer-lane-1
          description: '枝 1 の範囲の相談に答える（修正案の会話の写し）'
          model: opus                 # plan-answer と同じ（表 .shared/core/stage-models.json の plan_writer）
          effort: medium
          prompt: 指示書 `$fix-lane-consult-1.output.prompt_file` を Read で全部読み、その相談に答えよ。返すのは指示書の JSON だけ。
          depends_on: [fix-lane-consult-1]
          when: "$fix-lane-consult-1.output.go == true"
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          output_format:
            description: 'works-node: plan-answer-lane-1 continue=fix-planner fork map'
            type: object
            additionalProperties: false
            required: [answers]
            properties:
              answers:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [ask, decision, paths, tests, spec, reason]
                  properties:
                    ask: {type: integer, minimum: 1}
                    decision: {type: string, enum: [allow, deny, defer]}
                    paths: {type: array, items: {type: string, minLength: 1}}
                    tests: {type: array, items: {type: string, minLength: 1}}
                    spec: {type: string}
                    reason: {type: string, minLength: 10}

        - id: fix-lane-consult-check-1
          script: consult_check
          runtime: uv
          depends_on: [fix-lane-consult-1, plan-answer-lane-1]
          trigger_rule: none_failed_min_one_success   # 頼みの無い周・聞く頼みの無い周は答えの節が飛ばされる
          timeout: 1728000000
          with:
            answer: {from: "$plan-answer-lane-1.output", if_skipped: null}
            pass: "lane-1"
            answer_node: "plan-answer-lane-1"
          output_format:
            type: object
            additionalProperties: false
            required: [consulted, turn, answer_file, counts]
            properties:
              consulted: {type: boolean}
              turn: {type: integer, minimum: 0}
              answer_file: {type: string}
              counts: {type: object}

        - id: fix-lane-step-1
          script: fix_lane_step
          runtime: uv
          depends_on: [fix-lane-prep-1, fix-lane-consult-check-1]
          trigger_rule: none_failed_min_one_success   # 済んだ枝の周は役と相談の節が飛ばされる（返答は null。確かめは何も動かさずに done）
          timeout: 1728000000
          with:
            reply: {from: "$fix-lane-1.output", if_skipped: null}
            lane: "1"
            consulted: {from: "$fix-lane-consult-check-1.output.consulted", if_skipped: false}   # 範囲の相談の周は確かめない（数えるだけ）
            base_rev: $INPUTS.base_rev
            tdd_state: $tdd-start.output.state_file   # 凍ったテストのファイル・選んで回す試験の元の結末（空は実行器の無い run）
          output_format:
            type: object
            required: [ok, done, consulted, reason, reason_file, item]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              consulted: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              item: {type: integer}

  - id: fix-lane-loop-2
    description: '枝 2 の修正役の輪（項目を順に・範囲の相談つき） [needs: fix_lanes]'
