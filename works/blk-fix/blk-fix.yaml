name: blk-fix
description: |
  修正のブロック（support workflow。ラインから include で使う）。
  修正役の前に git が無視するファイルを控え（ignored-before）、テストの実行器（入力 tdd_suite）が在る run だけ単位ごとの
  TDD の輪を回し（tdd-start → tdd-loop。振り分け → 単位ごとにテスト・赤（機械）・直し・緑（機械）・整え・確かめ直し（機械）。
  実行器が無い run は輪を飛ばし、今と同じに動く）、判定のブロックが受け付けた根本の単位を修正役に直させ（fix。輪で直した単位は
  changes に行を書くだけ）、
  返答を写した規則で受け付け（fix-accept。拒めば理由を貼って同じ会話で出し直し、上限 3 回）、修正役が残した git が
  無視するファイル（テストを回して出来た __pycache__ など）のうち控えに無かった物だけを消し（clean。後のテストの節を
  生成物の無い木で回す）、申告したファイルが実際に変わったかを確かめ（assert-changed。何も変えずに済んだと言えば
  run が落ちる）、出口に集める（collect。消したパスも並べる）。

inputs:
  judgment_file:
    required: true
    description: 受け付けた判定のファイルのパス（blk-judge の出口 judgment_file。盤面の judgment.json）
  open_units:
    required: true
    description: 直す義務の単位の key の JSON の配列の文字列（blk-judge の出口 open_units）
  base_rev:
    default: ""
    description: 周の頭で固めた版。触ったファイルはこの版からの差分で数える。空はその場の HEAD
  # 線 A（仕様 3.2）の入口。指示書（commands/fix.md）が読む。どれも空でよい（節の配線の切り替えは Task 17）
  plan_file:
    default: ""
    description: 盤面が受けた修正案（p2.fix_plan）のファイルのパス。事前審査（p2.plan_review）の返答は同じフォルダ。空は修正案の無い run
  human_notes:
    default: ""
    description: 人が関所で答えた一言（盤面の record.process.human_items の今の周の note を並べた文）。空は聞いていない
  policy_path:
    default: ""
    description: 人の方針の文書（盤面が固めた写し）のパス。空は方針の無い run
  tdd_suite:
    default: ""
    description: |
      テストの実行器（JUnit XML の書き先を第 1 引数に受け、リポジトリの根で走る実行ファイル。本線の tdd_suite と同じ約束。
      相対なら対象リポジトリの根から）。空は実行器の無い run で、TDD の輪を飛ばして全部の単位を今どおり直す。
      実行器を探して決めるのはラインの start（設計 6 節）で、ここはその結果を受けるだけ

returns: collect
outcome_field: ok

nodes:
  # 修正役の前の git が無視するファイルの控え（盤面の fix-ignored-before.json）。clean はこれに無かった物だけを消す
  - id: ignored-before
    script: ignored_before
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      required: [ok, count, file]
      properties:
        ok: {type: boolean}
        count: {type: integer, minimum: 0}
        file: {type: string}

  # TDD の輪の頭。実行器が無ければ何も書かずに go: false（輪は飛ぶ）。在れば一式を 1 回走らせて元の結末を取る
  - id: tdd-start
    script: tdd_start
    runtime: uv
    depends_on: [ignored-before]
    timeout: 1728000000
    with:
      tdd_suite: $INPUTS.tdd_suite
      open_units: $INPUTS.open_units
    output_format:
      type: object
      additionalProperties: false
      required: [go, reason, suite, state_file, summary_file]
      properties:
        go: {type: boolean}
        reason: {type: string}
        suite: {type: string}
        state_file: {type: string}     # 輪の状態（盤面の tdd-<k>/state.json）。go: false なら空
        summary_file: {type: string}   # 輪の結果（修正役が読む）。go: false なら空

  # 単位ごとの TDD の輪（設計 2 節 3・案 (i)。graph は変えない）。役 tdd は輪のただ 1 つの AI の節（TA13）で、振り分け・
  # テスト・直し・整えを同じ会話で返す（C17）。赤・緑は tdd-step が写しの red_problems・green_problems で決める。
  # 拒否の理由は tdd-prep が次の指示書に書く（$LOOP_PREV で貼らない。R44）。段ごとに 3 回目の拒否で諦め（その単位は direct）、
  # 実行器が走らない・回数が max_iterations に届く周では残りを direct にして done を立てる（max_iterations で落とさない。R50）
  - id: tdd-loop
    depends_on: [tdd-start]
    when: "$tdd-start.output.go == true"
    loop_group:
      max_iterations: 40
      fresh_context: false
      until_bash: test $tdd-step.output.done = true
      nodes:
        - id: tdd-prep
          script: tdd_prep
          runtime: uv
          timeout: 1728000000
          with:
            state_file: $tdd-start.output.state_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file]
            properties:
              prompt_file: {type: string}

        - id: tdd
          command: tdd
          depends_on: [tdd-prep]
          settingSources: []          # 役に利用者・対象の CLAUDE.md を読ませない
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          output_format:
            type: object
            additionalProperties: false
            required: [phase]
            properties:
              phase: {type: string, enum: [route, test, fix, refactor]}
              units:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [unit_key, route]
                  properties:
                    unit_key: {type: string, minLength: 1}
                    route: {type: string, enum: [tdd, direct]}
                    why: {type: string}
              unit_key: {type: string}
              test_files:
                type: array
                items: {type: string}
              tests:
                type: array
                items: {type: string}
              direct_why: {type: string}
              files:
                type: array
                items: {type: string}
              what: {type: string}

        - id: tdd-step
          script: tdd_step
          runtime: uv
          depends_on: [tdd]
          timeout: 1728000000
          with:
            reply: {from: "$tdd.output"}
            state_file: $tdd-start.output.state_file
          output_format:
            type: object
            required: [ok, done, reason, reason_file, phase]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              phase: {type: string}

  - id: fix-loop
    depends_on: [tdd-start, tdd-loop]
    trigger_rule: none_failed_min_one_success   # 実行器の無い run は tdd-loop が飛ばされる
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $fix-accept.output.ok = true
      nodes:
        - id: fix
          command: fix
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # 前の周の拒否の理由は、指示書（commands/fix.md）が $LOOP_PREV.fix-accept.output.reason_file（盤面のファイルのパス）を
          # 直に読み、役がそのファイルを Read する（Ruling R16）。理由の本文を $LOOP_PREV で貼ると、中の $… が置き換えに通る。
          # include は輪の中の節の id（fix-accept）を付け替えない——輪の中で解ける。宣言していない $INPUTS.<名> は読み込みで拒まれる
          output_format:
            type: object
            additionalProperties: false
            required: [changes]
            properties:
              changes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [unit_key, files, what]
                  properties:
                    unit_key: {type: string, minLength: 1}
                    files:
                      type: array
                      items: {type: string, minLength: 1}
                    what: {type: string, minLength: 1}

        - id: fix-accept
          script: accept
          runtime: uv
          depends_on: [fix]
          timeout: 1728000000
          with:
            reply: {from: "$fix.output"}
            base_rev: $INPUTS.base_rev
            tdd_state: $tdd-start.output.state_file   # 輪で凍ったテストのファイルを修正役が変えていないか（空は輪の無い run）
          output_format:
            type: object
            required: [ok, reason, reason_file, changes]
            properties:
              ok: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}     # 拒否の理由の本文を書いた盤面のファイル（通れば空。script_io）
              changes: {type: array}

  # 修正役が残した git が無視するファイル（控えに無かった物だけ）を消す。差分には載らないが、テストの緑赤を左右する
  - id: clean
    script: clean
    runtime: uv
    depends_on: [fix-loop]
    timeout: 1728000000
    output_format:
      type: object
      required: [ok, removed]
      properties:
        ok: {type: boolean}
        removed:
          type: array
          items: {type: string}

  - id: assert-changed
    script: assert_changed
    runtime: uv
    depends_on: [clean]
    timeout: 1728000000
    with:
      base_rev: $INPUTS.base_rev
      accepted: $fix-loop.output
    output_format:
      type: object
      required: [ok, files]
      properties:
        ok: {type: boolean}
        files:
          type: array
          items: {type: string}

  - id: collect
    script: collect
    runtime: uv
    depends_on: [assert-changed]
    timeout: 1728000000
    with:
      accepted: $fix-loop.output
      changed: {from: "$assert-changed.output"}
      cleaned: {from: "$clean.output"}
      tdd: {from: "$tdd-start.output"}   # tdd-start はいつも走る（飛ばされない）
    output_format:
      type: object
      required: [ok, files, changes_file, removed, tdd]
      properties:
        ok: {type: boolean}
        files:
          type: array
          items: {type: string}
        changes_file: {type: string}
        removed:
          type: array
          items: {type: string}
        # TDD の輪の結果 {ran, suite, reason, units: [{unit_key, route, why, tests, test_files, red, green, refactor,
        # gave_up, problems}]}。実行器の無い run は ran: false・units は空（tddloop.exit_fields）
        tdd: {type: object}
