name: blk-fix
description: |
  修正のブロック（support workflow。ラインから include で使う）。
  修正役の前に git が無視するファイルを控え（ignored-before）、テストの実行器（入力 tdd_suite）が在る run だけ単位ごとの
  TDD の輪を回し（tdd-start → tdd-loop。振り分け → 単位ごとにテスト・赤（機械）・直し・緑（機械）・整え・確かめ直し（機械）。
  実行器が無い run は輪を飛ばし、今と同じに動く）、判定のブロックが受け付けた根本の単位を修正役に直させ（fix。輪で直した単位は
  changes に行を書くだけ）、
  2 つの役（tdd・fix）の指示書は、その前の script の節（tdd-prep・fix-prep）が修正の決まりの正本（.shared/core/writerules/common.md）と道ごとの決まりと
  run の値から機械で組む（lib/fixrules.py。裁定 R65。役の節の指示は「組んだ指示書を Read で読め」の 1 行）、
  返答を写した規則で受け付け（fix-accept。拒めば理由を貼って同じ会話で出し直し、上限 3 回。3 回目の拒否は行を名指しの単位・テストが
  import で届く単位に結んで、その単位だけを段の頭の木に戻して控えに残し、ほかの単位は受けて先へ進む）、修正役が残した git が
  無視するファイル（テストを回して出来た __pycache__ など）のうち控えに無かった物だけを消し（clean。後のテストの節を
  生成物の無い木で回す）、申告したファイルが実際に変わったかを確かめ（assert-changed。何も変えずに済んだと言えば
  run が落ちる）、出口に集める（collect。消した件数と、全件を書いた盤面のファイルも渡す）。
  食い違いの申し出（持ち主 2026-09-28）: 修正役と TDD の輪の役は、緑にするためにテスト・依頼・コードのどれかを曲げる代わりに、
  名指しつき（<パス>:<行>）の食い違いを返してよい。名指しが現物に在れば拒否に数えずその単位を止め（conflict-check）、読むだけの
  裁定役（rule-loop。持ち主の決まり rules/principles.md）が fix_test_scope・fix_code_as・ask_human・replace_query・fix_plan_item に裁き、2 回目の修正役
  （fix-ruled-loop。修正役の会話の続き）が裁定の文のファイルを読んで直して盤面に渡す。ask_human の単位は直す義務から外れ、
  最後の人の関所に届く。fix_plan_item の単位も直す義務から外れ、同じ run の中で修正案の役がその項目を直してから、この
  ブロックの 2 度目の include（2 回目の修正の段。その物は include の名の置き場 scope で 1 回目と分かれる）で直す
  （.shared/core/conflict.py・replan.py）。

inputs:
  judgment_file:
    required: true
    description: 受け付けた判定のファイルのパス（blk-judge の出口 judgment_file。盤面の judgment.json）
  open_units:
    required: true
    description: 直す義務の単位の key の JSON の配列の文字列（blk-judge の出口 open_units）
  base_rev:
    default: ""
    description: 周の頭で固めた版。触ったファイルはこの版からの差分で数える。空はその場の HEAD
  # 線 A（仕様 3.2）の入口。fix-prep・tdd-prep が指示書に組む（パスを書き、役が Read する）。どれも空でよい
  plan_file:
    default: ""
    description: 盤面が受けた修正案（p2.fix_plan）のファイルのパス。事前審査（p2.plan_review）の返答は同じフォルダ。空は修正案の無い run
  notes_file:
    default: ""
    description: 人が関所で答えた一言（盤面の record.process.human_items の今の周の note）を書いたファイルのパス（境の節 h-fix が書く）。空は聞いていない。一言の本文はファイルにだけ置く（R44。with の値に文を貼らない）
  policy_path:
    default: ""
    description: 人の方針の文書（盤面が固めた写し）のパス。空は方針の無い run
  tdd_suite:
    default: ""
    description: |
      テストの実行器（JUnit XML の書き先を第 1 引数に受け、リポジトリの根で走る実行ファイル。本線の tdd_suite と同じ約束。
      相対なら対象リポジトリの根から。後ろに試験のファイル・node id（絶対パス）と -k を足して呼ぶことがある）。空は実行器の無い run で、TDD の輪を飛ばして全部の単位を今どおり直す。
      実行器を探して決めるのはラインの start（設計 6 節）で、ここはその結果を受けるだけ
  test_cmd:
    default: ""
    description: 緑の後に TDD の輪が走らせるテストのコマンド（線の入力 `test_cmd`）。空は走らせない。実行器がこのコマンドそのものを包んだ物なら 2 度走らせない

returns: collect
outcome_field: ok

nodes:
  # 修正役の前の git が無視するファイルの控え（盤面の今の scope の根の fix-ignored-before.json）。
  # clean はこれに無かった物だけを消す
  - id: ignored-before
    script: ignored_before
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      required: [ok, count, file]
      properties:
        ok: {type: boolean}
        count: {type: integer, minimum: 0}
        file: {type: string}

  # TDD の輪の頭。実行器が無ければ何も書かずに go: false（輪は飛ぶ）。在れば一式を 1 回走らせて元の結末を取り、
  # test_cmd の関門（緑の後に毎回走らせるか）を 1 回だけ決める
  - id: tdd-start
    script: tdd_start
    runtime: uv
    depends_on: [ignored-before]
    timeout: 1728000000
    with:
      tdd_suite: $INPUTS.tdd_suite
      open_units: $INPUTS.open_units
      test_cmd: $INPUTS.test_cmd
    output_format:
      type: object
      additionalProperties: false
      required: [go, reason, suite, state_file, summary_file]
      properties:
        go: {type: boolean}
        reason: {type: string}
        suite: {type: string}
        state_file: {type: string}     # 輪の状態（盤面の tdd-<k>/state.json）。実行器の無い run は空（g1 は go: false でも元の結末の状態を持つ）
        summary_file: {type: string}   # 輪の結果（修正役が読む）。go: false なら空

  # 単位ごとの TDD の輪（設計 2 節 3・案 (i)。graph は変えない）。役 tdd は輪のただ 1 つの AI の節（TA13）で、振り分け・
  # テスト・直し・整えを同じ会話で返す（C17）。赤・緑は tdd-step が写しの red_problems・green_problems で決める。
  # 拒否の理由は tdd-prep が次の指示書に書く（$LOOP_PREV で貼らない。R44）。段ごとに 3 回目の拒否で諦め（その単位は direct）、
  # 実行器が走らない・回数が max_iterations に届く周では残りを direct にして done を立てる（max_iterations で落とさない。R50）
  - id: tdd-loop
    depends_on: [tdd-start]
    when: "$tdd-start.output.go == true"
    loop_group:
      max_iterations: 40
      fresh_context: false
      until_bash: test $tdd-step.output.done = true
      nodes:
        # 指示書を組む（tddloop.prep → fixrules.tdd_render: 修正の決まりの正本・TDD の決まり・今の段・run の値）。next.md は
        # full の写しで、隣に next.full.md・next.delta.md・next.variants.json（会話の続きの起動で包みが delta を選ぶ）
        - id: tdd-prep
          script: tdd_prep
          runtime: uv
          timeout: 1728000000
          with:
            state_file: $tdd-start.output.state_file
            judgment_file: $INPUTS.judgment_file
            plan_file: $INPUTS.plan_file
            policy_path: $INPUTS.policy_path
            notes_file: $INPUTS.notes_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file]
            properties:
              prompt_file: {type: string}

        - id: tdd
          prompt: 指示書 `$tdd-prep.output.prompt_file` を Read で毎回全部読み（回ごとに中身が替わる）、その指示に従え。返すのは指示書の「返す JSON」の形の JSON だけ。
          depends_on: [tdd-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          # 借りたスキルの座（.shared/core/seat.py）: 修正の形 g3 の時だけ tdd-prep が指示書に座と読み替えを載せる。宣言は静的で、ほかの形の柵は包みが持つ
          skills: [test-driven-development]
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Skill]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # 印 works-node: tdd（包みが会話を節の名で分け、続きの起動で指示書の形を選ぶ）
          output_format:
            description: 'works-node: tdd'
            type: object
            additionalProperties: false
            required: [phase]
            properties:
              phase: {type: string, enum: [route, test, fix, refactor, conflict]}
              units:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [unit_key, route]
                  properties:
                    unit_key: {type: string, minLength: 1}
                    route: {type: string, enum: [tdd, direct]}
                    why: {type: string}
              unit_key: {type: string}
              test_files:
                type: array
                items: {type: string}
              tests:
                type: array
                items: {type: string}
              direct_why: {type: string}
              files:
                type: array
                items: {type: string}
              what: {type: string}
              # 整えの申告（phase fix の任意の欄。declared が true の単位か、修正案の項目が refactor.declared の単位だけ refactor の段が来る。
              # tddloop._declared・_plan_refactor_why）
              refactor:
                type: object
                additionalProperties: false
                required: [declared, why]
                properties:
                  declared: {type: boolean}
                  why: {type: string}
              # 食い違いの申し出（phase conflict。どの段でも。.shared/core/conflict.py の 1 件の欄）
              between:
                type: array
                items: {type: string}
              why_both_cannot_hold: {type: string}
              which_is_right: {type: string, enum: [request, test, code, unknown, query]}
              correct_lines:
                type: array
                items: {type: string}
              kind: {type: string, enum: [brief_vs_judgment, unnamed_test_broke, not_red, scope_needed, query_hits_fixed, needs_context]}
              # Bash で書いたファイルの申告（任意。writes.BASH_WRITES_SCHEMA。tdd-step が書き込みの記録と突き合わせる）
              bash_writes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, why]
                  properties:
                    path: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}

        - id: tdd-step
          script: tdd_step
          runtime: uv
          depends_on: [tdd]
          timeout: 1728000000
          with:
            reply: {from: "$tdd.output"}
            state_file: $tdd-start.output.state_file
          output_format:
            type: object
            required: [ok, done, reason, reason_file, phase]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              phase: {type: string}

  - id: fix-loop
    depends_on: [tdd-start, tdd-loop]
    trigger_rule: none_failed_min_one_success   # 実行器の無い run は tdd-loop が飛ばされる
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $fix-accept.output.done = true   # 通った時か、3 回目の拒否で結べる単位を止めて通した時（max_iterations で落とさない。R50）
      nodes:
        # 指示書を組み（fixrules.prep: 修正の決まりの正本・直す役の決まり・run の値。prompt_file は full の写しで、隣に .full.md・
        # .delta.md・.variants.json）、起こした印を置く（盤面は印の無い返答を受けない）。
        # 同じ試行の出し直しなら、前の回の受け付けが書いた拒否の理由のファイルを指示書の 1 行目で名指す（理由の文は貼らない。R44）
        - id: fix-prep
          script: fix_prep
          runtime: uv
          timeout: 1728000000
          with:
            judgment_file: $INPUTS.judgment_file
            open_units: $INPUTS.open_units
            plan_file: $INPUTS.plan_file
            policy_path: $INPUTS.policy_path
            notes_file: $INPUTS.notes_file
            summary_file: $tdd-start.output.summary_file
            base_rev: $INPUTS.base_rev   # 修正の形 g1 の審査役の型の [BASE_SHA]（fixrules.g1_values）
            pass: "first"
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, attempt, out_path, node, already, variants_file, iteration]
            properties:
              prompt_file: {type: string}      # full の写し（役の節の 1 行が Read させる。包みの無い起動の既定）
              attempt: {type: integer}
              out_path: {type: string}
              node: {type: string}
              already: {type: boolean}
              variants_file: {type: string}    # 2 つの形の控え <名>.variants.json {full, delta, rules_sha, iteration, sections}
              iteration: {type: integer, minimum: 1}   # この周の輪の何回目か（fix-accept が 3 回目の拒否で done を立てる）

        - id: fix
          prompt: 指示書 `$fix-prep.output.prompt_file` を Read で全部読み、その指示に従え。返すのは指示書が名指す欄の JSON だけ。
          depends_on: [fix-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          # Agent は修正の形 g1 で SDD の型の下請けを起こす口（seat.g1_section）。宣言は静的で、g1 の外は包みが拒む（fixshape.denied_tools）
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Agent]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # recount.FIX_OUTPUT_FORMAT（写しの p3.fix の schema に印 works-node: fix）を貼った物（tests/test_blk_fix.py が一致を見る）
          output_format:
            description: 'works-node: fix'
            type: object
            required: &fix_required
            - changes
            - fix_closure
            - gates_changed
            - interactions
            - mechanism_changed
            - not_done
            - path_changed
            - plan_faces
            - premise_drift
            - seams_changed
            - security_surface_changed
            - wrote_refs
            additionalProperties: false
            properties: &fix_properties
              changes:
                type: array
                items:
                  type: object
                  required:
                  - breaks
                  - bypass_tried
                  - closure
                  - files
                  - root_or_symptom
                  - unit_key
                  - what
                  - precedent
                  additionalProperties: false
                  properties:
                    unit_key:
                      type: string
                    what:
                      type: string
                    closure:
                      type: object
                      required:
                      - mechanism
                      - fix_mechanism
                      - verified_how
                      - sites
                      additionalProperties: false
                      properties:
                        mechanism:
                          type: string
                        fix_mechanism:
                          type: string
                        verified_how:
                          type: string
                        sites:
                          type: array
                          items:
                            type: object
                            required:
                            - site
                            - red_seen
                            additionalProperties: false
                            properties:
                              site:
                                type: string
                              red_seen:
                                type: boolean
                              path:
                                type: string
                    files:
                      type: array
                      minItems: 1
                      items:
                        type: string
                    coverage:
                      type: object
                      additionalProperties: false
                      properties:
                        how:
                          type: object
                          required:
                          - patterns
                          - paths
                          - count
                          additionalProperties: false
                          properties:
                            patterns:
                              type: array
                              minItems: 1
                              maxItems: 20
                              items:
                                type: string
                                minLength: 1
                                pattern: ^[^\n\r\x00]+$
                            fixed:
                              type: boolean
                            paths:
                              type: array
                              minItems: 1
                              maxItems: 50
                              items:
                                type: string
                                minLength: 1
                                pattern: ^[^\n\r\x00]+$
                            count:
                              type: string
                              enum:
                              - lines
                              - files
                            untracked:
                              type: boolean
                            ignore_case:
                              type: boolean
                            word:
                              type: boolean
                        counts:
                          type: string
                          enum:
                          - defects
                          - population
                        remaining:
                          type: string
                    root_or_symptom:
                      type: object
                      required:
                      - kind
                      - why
                      additionalProperties: false
                      properties:
                        kind:
                          type: string
                          enum:
                          - root
                          - symptom
                        why:
                          type: string
                          minLength: 1
                    bypass_tried:
                      type: string
                      minLength: 1
                    breaks:
                      type: object
                      required:
                      - how
                      - result
                      additionalProperties: false
                      properties:
                        how:
                          type: string
                          minLength: 1
                        result:
                          type: string
                          minLength: 1
                        accepted:
                          type: string
                    precedent:
                      type: object
                      required:
                      - verdict
                      - reason
                      additionalProperties: false
                      properties:
                        problem:
                          type: string
                        source:
                          type: string
                        verdict:
                          type: string
                          enum:
                          - adopt
                          - adapt
                          - does_not_apply
                          - not_found
                        reason:
                          type: string
                          minLength: 4
                        searched:
                          type: string
                        from_judge_row:
                          type: boolean
                      allOf:
                      - if:
                          not:
                            required:
                            - from_judge_row
                            properties:
                              from_judge_row:
                                const: true
                        then:
                          required:
                          - problem
                          properties:
                            problem:
                              type: string
                              minLength: 4
                      - if:
                          allOf:
                          - not:
                              required:
                              - from_judge_row
                              properties:
                                from_judge_row:
                                  const: true
                          - required:
                            - verdict
                            properties:
                              verdict:
                                const: not_found
                        then:
                          required:
                          - searched
                          properties:
                            searched:
                              type: string
                              minLength: 4
                      - if:
                          allOf:
                          - not:
                              required:
                              - from_judge_row
                              properties:
                                from_judge_row:
                                  const: true
                          - required:
                            - verdict
                            properties:
                              verdict:
                                not:
                                  const: not_found
                        then:
                          required:
                          - source
                          properties:
                            source:
                              type: string
                              minLength: 4
              not_done:
                type: array
                items:
                  type: object
                  required:
                  - unit_key
                  - why
                  additionalProperties: false
                  properties:
                    unit_key:
                      type: string
                    why:
                      type: string
              fix_closure:
                type: object
                required:
                - status
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - found
                    - clean
                    - carried_over
                    - not_applicable
                    - awaiting_human
                    - not_run
                  count:
                    type: integer
                    minimum: 0
                  detail:
                    type: string
                  checked:
                    type: string
                  reason:
                    type: string
                  from_round:
                    type: integer
                    minimum: 1
              mechanism_changed:
                type: boolean
              premise_drift:
                type: boolean
              premise_drift_note:
                type: string
              gates_changed:
                type: boolean
              seams_changed:
                type: boolean
              security_surface_changed:
                type: boolean
              path_changed:
                type: boolean
              decision_records_changed:
                type: boolean
              rejudge_requested:
                type: string
              interactions:
                type: array
                items:
                  type: object
                  required:
                  - surface
                  - checked
                  additionalProperties: false
                  properties:
                    surface:
                      type: string
                      minLength: 1
                    checked:
                      type: string
                      minLength: 1
                    combined_effect:
                      type: string
              wrote_refs:
                type: array
                maxItems: 50
                items:
                  type: object
                  required:
                  - kind
                  - target
                  - where
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      enum:
                      - file
                      - text
                    cite:
                      type: string
                      minLength: 1
                      maxLength: 500
                    target:
                      type: string
                      minLength: 1
                      maxLength: 300
                    where:
                      type: string
                      minLength: 1
                      maxLength: 300
              plan_faces:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - key
                  - handled
                  - how
                  properties:
                    key:
                      type: string
                      minLength: 8
                    handled:
                      type: string
                      enum:
                      - absorbed
                      - declared
                    how:
                      type: string
                      minLength: 20
              x_scalars:
                type: object
                additionalProperties: false
                patternProperties:
                  ^x_[a-z0-9_]+$:
                    type: number
              # 食い違いの申し出（任意。conflict.CONFLICTS_SCHEMA。受け付けが名指しを現物で確かめ、盤面に渡す前に外す）
              conflicts:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [unit_key, between, why_both_cannot_hold, which_is_right, kind]
                  properties:
                    unit_key: {type: string, minLength: 1}
                    between:
                      type: array
                      minItems: 2
                      items: {type: string, minLength: 3}
                    why_both_cannot_hold: {type: string, minLength: 10}
                    which_is_right: {type: string, enum: [request, test, code, unknown, query]}
                    correct_lines:
                      type: array
                      minItems: 1
                      maxItems: 20
                      items: {type: string, minLength: 1}
                    kind: {type: string, enum: [brief_vs_judgment, unnamed_test_broke, not_red, scope_needed, query_hits_fixed, needs_context]}
              # Bash で書いたファイルの申告（任意。writes.BASH_WRITES_SCHEMA。受け付けが書き込みの記録と突き合わせ、盤面に渡す前に外す）
              bash_writes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, why]
                  properties:
                    path: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}

        - id: fix-accept
          script: accept
          runtime: uv
          depends_on: [fix]
          timeout: 1728000000
          with:
            reply: {from: "$fix.output"}
            base_rev: $INPUTS.base_rev
            tdd_state: $tdd-start.output.state_file   # 輪で凍ったテストのファイルを修正役が変えていないか・選んで回す試験の元の結末（空は実行器の無い run）
            iteration: $fix-prep.output.iteration     # 輪の何回目か（3 回目の拒否で done。R50）
            pass: "first"
            tdd_suite: $INPUTS.tdd_suite              # 事後の関門の束の実行器（空は受け入れのテストの赤緑を確かめない run）
          output_format:
            type: object
            required: [ok, reason, reason_file, changes, done]
            properties:
              ok: {type: boolean}
              done: {type: boolean}           # 輪を抜ける旗（通った時か 3 回目。3 回目は拒否の行を単位に結んで止め、受けた単位で通す）
              reason: {type: string}
              reason_file: {type: string}     # 拒否の理由の本文を書いた盤面のファイル（通れば空。script_io）
              changes: {type: array}
              rejects: {type: array}          # 拒否の行ごとの確かめの id と文（[{check, text}]。reason の行と同じ並び。表は accept.CHECKS）
              parked: {type: boolean}         # 食い違いの申し出で単位を止め、盤面に渡さずに抜けた（裁定の輪の後に渡す）

  # 食い違いの申し出（修正役か TDD の輪の役が返し、名指しが現物に在った物）で止めた単位が在るか。裁定の輪と 2 回目の修正役の
  # when: はこの欄だけを読む（盤面の今の周の conflicts.json）
  - id: conflict-check
    script: conflict_check
    runtime: uv
    depends_on: [fix-loop]
    timeout: 1728000000
    output_format:
      type: object
      additionalProperties: false
      required: [go, count, file]
      properties:
        go: {type: boolean}
        count: {type: integer, minimum: 0}
        file: {type: string}

  # 裁定の輪（持ち主 2026-09-28「おしで」）。役 rule は輪のただ 1 つの AI の節（TA13）で読むだけ。持ち主の決まり
  # （rules/principles.md）で fix_test_scope・fix_code_as・ask_human・replace_query（置き換えた問いは機械が例で試す）・fix_plan_item のどれかに裁く。3 回目の拒否で裁かれていない申し出を人へ回し、
  # done で抜ける（max_iterations で落とさない。R50）。理由の文は rule-prep が次の指示書の 1 行目でパスを名指す（R44）
  - id: rule-loop
    depends_on: [conflict-check]
    when: "$conflict-check.output.go == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $rule-accept.output.done = true
      nodes:
        - id: rule-prep
          script: rule_prep
          runtime: uv
          timeout: 1728000000
          with:
            judgment_file: $INPUTS.judgment_file
            policy_path: $INPUTS.policy_path
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, iteration]
            properties:
              prompt_file: {type: string}
              iteration: {type: integer, minimum: 1}

        - id: rule
          model: opus                 # 役 judge の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
          effort: high                # 役 judge の前付けの effort（段は前付けを読まない。tests/test_tool_parity.py の RoleModelCase が縛る）
          prompt: 指示書 `$rule-prep.output.prompt_file` を Read で全部読み、その指示に従え。返すのは指示書の「返す JSON」の形の JSON だけ。
          depends_on: [rule-prep]
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]   # 読むだけ。本線の judge の定義の道具（web を含む）
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # ruling.RULE_OUTPUT_FORMAT（tests/test_blk_fix_conflict.py が一致を見る）
          output_format:
            description: 'works-node: rule'
            type: object
            additionalProperties: false
            required: [rulings]
            properties:
              rulings:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [id, decision, text, limits]
                  properties:
                    id: {type: string, minLength: 1}
                    decision: {type: string, enum: [fix_test_scope, fix_code_as, ask_human, replace_query, fix_plan_item]}
                    text: {type: string, minLength: 10}
                    limits:
                      type: array
                      items: {type: string, minLength: 1}
                    grounds:                       # 裁きの出どころ（<パス>:<行>。依頼の行・判定・テスト・コード。機械が現物に在るかを見る）
                      type: array
                      items: {type: string, minLength: 3}
                    request_searched: {type: string, minLength: 10}   # 依頼で何を探して答えが無かったか（依頼の在る run の ask_human）
                    query:
                      type: object
                      additionalProperties: false
                      required: [how, counts, hits, misses]
                      properties:
                        how: {type: object}
                        counts: {type: string, enum: [defects, population]}
                        hits:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1}
                          minItems: 1
                        misses:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1}

        - id: rule-accept
          script: rule_accept
          runtime: uv
          depends_on: [rule]
          timeout: 1728000000
          with:
            reply: {from: "$rule.output"}
            base_rev: $INPUTS.base_rev
            iteration: $rule-prep.output.iteration
          output_format:
            type: object
            required: [ok, done, reason, reason_file, rulings_file, counts]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              rulings_file: {type: string}   # 裁定の文（2 回目の修正役の指示書の 1 行目が名指す）
              counts: {type: object}         # {parked, unruled, fix_test_scope, fix_code_as, ask_human[, replace_query][, fix_plan_item]}

  # 裁定の後の 2 回目の修正役（印 continue=fix: 包みが修正役の会話を継ぐ）。1 回目は裁定の文のファイルを名指し、直す裁定でない
  # 裁定（ask_human・fix_plan_item。fix_plan_item は案を直して戻るまで）の単位は直す義務から外れる（conflict.owed_units_but_asked）。盤面の p3.fix に渡すのはここ（1 回目は申し出で止めて渡していない）
  - id: fix-ruled-loop
    depends_on: [conflict-check, rule-loop]
    when: "$conflict-check.output.go == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $fix-ruled-accept.output.done = true
      nodes:
        - id: fix-ruled-prep
          script: fix_prep
          runtime: uv
          timeout: 1728000000
          with:
            judgment_file: $INPUTS.judgment_file
            open_units: $INPUTS.open_units
            plan_file: $INPUTS.plan_file
            policy_path: $INPUTS.policy_path
            notes_file: $INPUTS.notes_file
            summary_file: $tdd-start.output.summary_file
            base_rev: $INPUTS.base_rev
            pass: "ruled"
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, attempt, out_path, node, already, variants_file, iteration]
            properties:
              prompt_file: {type: string}
              attempt: {type: integer}
              out_path: {type: string}
              node: {type: string}
              already: {type: boolean}
              variants_file: {type: string}
              iteration: {type: integer, minimum: 1}

        - id: fix-ruled
          prompt: 指示書 `$fix-ruled-prep.output.prompt_file` を Read で全部読み、その指示に従え。返すのは指示書が名指す欄の JSON だけ。
          depends_on: [fix-ruled-prep]
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Agent]   # 修正役と同じ
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # recount.RULED_OUTPUT_FORMAT（修正役と同じ欄。印だけが違う）
          output_format:
            description: 'works-node: fix-ruled continue=fix'
            type: object
            required: *fix_required
            additionalProperties: false
            properties: *fix_properties

        - id: fix-ruled-accept
          script: accept
          runtime: uv
          depends_on: [fix-ruled]
          timeout: 1728000000
          with:
            reply: {from: "$fix-ruled.output"}
            base_rev: $INPUTS.base_rev
            tdd_state: $tdd-start.output.state_file
            iteration: $fix-ruled-prep.output.iteration
            pass: "ruled"
            tdd_suite: $INPUTS.tdd_suite
          output_format:
            type: object
            required: [ok, reason, reason_file, changes, done]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              changes: {type: array}
              rejects: {type: array}
              parked: {type: boolean}

  # 修正役が残した git が無視するファイル（控えに無かった物だけ）を消す。差分には載らないが、テストの緑赤を左右する
  - id: clean
    script: clean
    runtime: uv
    depends_on: [fix-loop, conflict-check, rule-loop, fix-ruled-loop]
    trigger_rule: none_failed_min_one_success   # 申し出が無い run は裁定の輪と 2 回目の修正の輪が飛ばされる
    timeout: 1728000000
    # 消したパスの全件は盤面の今の scope の根の fix-removed.json に書き、出口は件数とそのパスだけ（件数に上限が無く、子の stdout には上限が在る）
    output_format:
      type: object
      required: [ok, count, file]
      properties:
        ok: {type: boolean}
        count: {type: integer, minimum: 0}
        file: {type: string}

  - id: assert-changed
    script: assert_changed
    runtime: uv
    depends_on: [clean]
    timeout: 1728000000
    with:
      base_rev: $INPUTS.base_rev
      accepted: $fix-loop.output
      ruled: {from: "$fix-ruled-loop.output", if_skipped: null}   # 2 回目の修正の輪が走れば、その受け付けの出力を使う
    # 通らない（申告が空（直す義務が残らず、答え待ち・ask_human で外れた単位が在る時を除く）・申告したのに変わっていない）時は run を落とさずに盤面を理由つきで止め
    # （by works:fix。R50）、ok: false と reason を出す。後ろの段は境の節が飛ばし、報告と書き出しは走る（run 26）
    output_format:
      type: object
      required: [ok, files]
      properties:
        ok: {type: boolean}
        files:
          type: array
          items: {type: string}
        reason: {type: string}

  # 読んだ証拠（受け付けの条件にしない。今の scope の周の reads-fix.json。collect が reads_file で出口に出す）。機械が渡したパスは判定のファイルと、
  # fix-prep が今の周に組んだ指示書（fixrules.reads_more。輪の外の節は輪の中の出力を引けないので盤面の置き場から）
  - id: fix-reads
    script: reads
    runtime: uv
    depends_on: [assert-changed]
    timeout: 1728000000
    with:
      must: '["$INPUTS.judgment_file"]'
    output_format:
      type: object
      additionalProperties: false
      required: [ok, reads_file]
      properties:
        ok: {type: boolean}
        sources: {type: object}
        missing: {type: array, items: {type: string}}
        reads_file: {type: string}

  - id: collect
    script: collect
    runtime: uv
    depends_on: [fix-reads]
    timeout: 1728000000
    with:
      accepted: $fix-loop.output
      ruled: {from: "$fix-ruled-loop.output", if_skipped: null}
      changed: {from: "$assert-changed.output"}
      cleaned: {from: "$clean.output"}
      tdd: {from: "$tdd-start.output"}   # tdd-start はいつも走る（飛ばされない）
    output_format:
      type: object
      required: [ok, files, changes_file, removed, tdd]
      properties:
        ok: {type: boolean}
        files:
          type: array
          items: {type: string}
        changes_file: {type: string}
        removed:   # clean の出口の件数と全件のファイルをそのまま通す
          type: object
          required: [count, file]
          properties:
            count: {type: integer, minimum: 0}
            file: {type: string}
        # TDD の輪の結果 {ran, suite, reason, units: [{unit_key, route, why, tests, test_files, red, green, refactor,
        # gave_up, problems, red_kinds, test_cmd, refactor_why}], test_cmd: {gate, note}, calls: [{n, phase, unit_key, ok, runs,
        # secs}]}。実行器の無い run は ran: false・units は空で test_cmd・calls の欄も無い（tddloop.exit_fields・FIELDS）
        tdd: {type: object}
        # 盤面の欄（〔線A計〕T17。recount.collect）: 受けた修正の返答のファイル・直せなかった単位の数・単位ごとの前後の件数・読んだ証拠
        fix_file: {type: string}
        not_done: {type: integer, minimum: 0}
        coverage: {type: object}
        reads_file: {type: string}
        reason: {type: string}          # 止めた出口（ok: false。assert-changed が止めた盤面の理由）
