          idle_timeout: 1728000000
          output_format:
            description: 'works-node: plan-answer-lane-2 continue=fix-planner fork map'
            type: object
            additionalProperties: false
            required: [answers]
            properties:
              answers:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [ask, decision, paths, tests, spec, reason]
                  properties:
                    ask: {type: integer, minimum: 1}
                    decision: {type: string, enum: [allow, deny, defer]}
                    paths: {type: array, items: {type: string, minLength: 1}}
                    tests: {type: array, items: {type: string, minLength: 1}}
                    spec: {type: string}
                    reason: {type: string, minLength: 10}

        - id: fix-lane-consult-check-2
          script: consult_check
          runtime: uv
          depends_on: [fix-lane-consult-2, plan-answer-lane-2]
