name: blk-material
description: |
  素材集めのブロック（本線 graphloops の BLOCKS.md の R3「素材集め」、差し込み口 material）。判定の前に、差分を P1 の目 9 本
  （局所レビュー・整合性と迂回・衛生・外部標準照合・手順トレース・ゲートの実効性・代役の忠実性・主経路の観測・根拠の出所）と
  先行議論の突合・目的の審査に見せ、素材（material）を集める。回すかどうかは盤面の ready（写しの graph の条件と節の表）だけで
  決まり、ブロックは条件を持たない（判定から入る run の 1 周目は写しの条件で P1 の目が na になり、先行議論の突合だけが回る）。
  役は同じ層で並んで走り（graphloops の engine が P1 の役を並べて起こすのと同じ）、受け付けは盤面の錠の中で 1 本ずつ書く。
  指示書は本線の a1202d0 の指示書を engine と同じ描き方で描いた物（prep が盤面の prompts/r<N>/ に書く。拒否の後は理由を頭に置く。R44）。
  拒否されたら同じ会話で出し直させ、3 回目の拒否で受け付けが done（give_up）を出して輪を抜ける（R50）。collect が盤面を止める。
  同じ波の 1 本の目が盤面を止めた後は、他の目の支度が stopped を返して役を飛ばし、受け付けが止まった旨の done で輪を抜ける
  （輪を落とさず collect まで届き、collect が止めた理由を返す）。
  機械の節 p1.worktree_before・p1.worktree_after と engine が走らせる p0.parallel_pr は盤面（settle・start）が回す。
  ラインから include で使う。前に p0.local_checks・p0.parallel_pr・p0.premises を済ませておく（P1 の目の依存）。
  出口 collect: {ok, reason, ran, skipped, materials, snapshot, exit_file}（本線の R3 の出口 snapshot・materials を含む）。

inputs:
  base_rev:
    default: ""
    description: 周の頭で固めた版（ラインの口を他のブロックと揃える。スクリプトは読まない——版は盤面が持つ）
  adapter:
    default: ""
    description: |
      run が宣言した包みの形（線の start の出口 adapter。空は包みを通す run、optional は包み無しで回す run）。空の run は、
      Bash を持つ役（旗 no-post・no-tree-write）を回す前に切符を確かめ、受け付けで役の起動に包みの柵が掛かったかを見る
  purpose_file:
    default: ""
    description: |
      目的の文のファイル（blk-purpose の出口 purpose_file）。盤面に p0.purpose が無いラインで、指示書の目的の欄を埋める。
      空なら「目的の文はこの run に無い」と書く（目的を作らない）

returns: collect
outcome_field: ok

nodes:
  # 盤面を settle し、ready の素材集めの節の役に真を立てる。役を起こす前の作業ツリーの姿を周に 1 度置く。
  # 包みを宣言した run で切符が無ければ盤面を止めて stopped（どの輪も when: で飛ぶ）
  - id: mat-route
    script: route
    runtime: uv
    timeout: 1728000000
    with:
      adapter: $INPUTS.adapter
    output_format:
      type: object
      additionalProperties: false
      required:
      - ok
      - stopped
      - why
      - snapshot_file
      - prior_decisions
      - purpose_review
      - local_review
      - consistency_bypass
      - hygiene
      - external_standards
      - procedure_trace
      - gate_efficacy
      - test_double_fidelity
      - main_path_observation
      - provenance
      properties:
        ok:
          type: boolean
        stopped:
          type: boolean
        why:
          type: string
        snapshot_file:
          type: string
        prior_decisions:
          type: boolean
        purpose_review:
          type: boolean
        local_review:
          type: boolean
        consistency_bypass:
          type: boolean
        hygiene:
          type: boolean
        external_standards:
          type: boolean
        procedure_trace:
          type: boolean
        gate_efficacy:
          type: boolean
        test_double_fidelity:
          type: boolean
        main_path_observation:
          type: boolean
        provenance:
          type: boolean

  # p0.prior_decisions（investigator）: Bash は sandbox の中で網を閉じ（包みが strictAllowlist を足す）、読むだけの口 works-gh だけを外に出す。旗 no-post・no-tree-write で包みが gh の書き込みと作業ツリーを止める。output_format は material.output_format("prior-decisions")（写しの schema に印）を貼った物
  - id: prior-decisions-loop
    depends_on:
    - mat-route
    when: $mat-route.output.prior_decisions == true
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $prior-decisions-accept.output.done = true
      nodes:
      - id: prior-decisions-prep
        script: prep
        runtime: uv
        timeout: 1728000000
        with:
          role: prior-decisions
          purpose_file: $INPUTS.purpose_file
        output_format:
          type: object
          additionalProperties: false
          required:
          - prompt_file
          - prompt_text
          - attempt
          - out_path
          - node
          - already
          - stopped
          properties:
            prompt_file:
              type: string
            prompt_text:
              type: string
            attempt:
              type: integer
            out_path:
              type: string
            node:
              type: string
            already:
              type: boolean
            stopped:
              type: boolean
      # 同じ波の別の目が盤面を止めた後の周は役を起こさない（受け付けが止まった旨の done を出して輪を抜ける）
      - id: prior-decisions
        model: sonnet   # 役 investigator の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
        effort: medium  # 役 investigator の前付けの effort（段は前付けを読まない。tests/test_tool_parity.py の RoleModelCase が縛る）
        command: prior-decisions
        depends_on:
        - prior-decisions-prep
        when: $prior-decisions-prep.output.stopped == false
        settingSources: [user]
        allowed_tools:
        - Read
        - Grep
        - Glob
        - Bash
        - WebSearch
        - WebFetch
        sandbox:
          enabled: true
          allowUnsandboxedCommands: false
          failIfUnavailable: true
          excludedCommands:
          - 'works-gh:*'
          network:
            allowedDomains: []
        idle_timeout: 1728000000
        output_format:
          description: 'works-node: prior-decisions no-post no-tree-write'
          type: object
          required:
          - material
          - checked
          - searched
          - settled
          additionalProperties: false
          properties:
            material:
              type: object
              required:
              - status
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum:
                  - found
                  - clean
                  - carried_over
                  - not_applicable
                  - awaiting_human
                  - not_run
                count:
                  type: integer
                  minimum: 0
                detail:
                  type: string
                checked:
                  type: string
                reason:
                  type: string
                from_round:
                  type: integer
                  minimum: 1
            checked:
              type: boolean
            searched:
              type: array
              items:
                type: string
            settled:
              type: array
              items:
                type: object
                required:
                - topic
                - decision
                - reason
                - revisit
                additionalProperties: false
                properties:
                  topic:
                    type: string
                  decision:
                    type: string
                  reason:
                    type: string
                  revisit:
                    type: string
                  where:
                    type: string
      - id: prior-decisions-accept
        script: accept
        runtime: uv
        timeout: 1728000000
        depends_on:
        - prior-decisions-prep
        - prior-decisions
        trigger_rule: none_failed_min_one_success   # 役を飛ばした周（盤面が止まっていた）も走り、done を出す
        with:
          role: prior-decisions
          reply:
            from: $prior-decisions.output
            if_skipped: null
          adapter: $INPUTS.adapter
        output_format:
          type: object
          required:
          - ok
          - done
          - give_up
          - reason
          - reason_file
          properties:
            ok:
              type: boolean
            done:
              type: boolean
            give_up:
              type: boolean
            stopped:
              type: boolean
            reason:
              type: string
            reason_file:
              type: string
            node:
              type: string
            status:
              type: string

  # p0.purpose_review（inspector）: 読むだけ（Read・Grep・Glob）。output_format は material.output_format("purpose-review")（写しの schema に印）を貼った物
  - id: purpose-review-loop
    depends_on:
    - mat-route
    when: $mat-route.output.purpose_review == true
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $purpose-review-accept.output.done = true
      nodes:
      - id: purpose-review-prep
        script: prep
        runtime: uv
        timeout: 1728000000
        with:
          role: purpose-review
          purpose_file: $INPUTS.purpose_file
        output_format:
          type: object
          additionalProperties: false
          required:
          - prompt_file
          - prompt_text
          - attempt
          - out_path
          - node
          - already
          - stopped
          properties:
            prompt_file:
              type: string
            prompt_text:
              type: string
            attempt:
              type: integer
            out_path:
              type: string
            node:
              type: string
            already:
              type: boolean
            stopped:
              type: boolean
      # 同じ波の別の目が盤面を止めた後の周は役を起こさない（受け付けが止まった旨の done を出して輪を抜ける）
      - id: purpose-review
        model: sonnet   # 役 inspector の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
        effort: medium  # 役 inspector の前付けの effort（段は前付けを読まない。tests/test_tool_parity.py の RoleModelCase が縛る）
        command: purpose-review
        depends_on:
        - purpose-review-prep
        when: $purpose-review-prep.output.stopped == false
        settingSources: [user]
        allowed_tools:
        - Read
        - Grep
        - Glob
        mutates_checkout: false
        sandbox:
          enabled: true
          allowUnsandboxedCommands: false
        idle_timeout: 1728000000
        output_format:
          description: 'works-node: purpose-review'
          type: object
          required:
          - verdict
          - reason
          - findings
          additionalProperties: false
          properties:
            verdict:
              type: string
              enum:
              - 問題なし
              - 狭めている
            reason:
              type: string
            findings:
              type: array
              items:
                type: object
                required:
                - text
                - cite
                - hits
                additionalProperties: false
                properties:
                  text:
                    type: string
                    minLength: 1
                  cite:
                    type: string
                    minLength: 1
                  hits:
                    type: integer
                    minimum: 0
      - id: purpose-review-accept
        script: accept
        runtime: uv
        timeout: 1728000000
        depends_on:
        - purpose-review-prep
        - purpose-review
        trigger_rule: none_failed_min_one_success   # 役を飛ばした周（盤面が止まっていた）も走り、done を出す
        with:
          role: purpose-review
          reply:
            from: $purpose-review.output
            if_skipped: null
          adapter: $INPUTS.adapter
        output_format:
          type: object
          required:
          - ok
          - done
          - give_up
          - reason
          - reason_file
          properties:
            ok:
              type: boolean
            done:
              type: boolean
            give_up:
              type: boolean
            stopped:
              type: boolean
            reason:
              type: string
            reason_file:
              type: string
            node:
              type: string
            status:
              type: string

  # p1.local_review（skill）: 回す側の会話の skill・agent のレンズを起こす。Bash は sandbox の中で網を閉じ（包みが strictAllowlist を足す）、読むだけの口 works-gh だけを外に出す。settingSources は [user]（選んだ物だけの隔離した設定 dev/toolset.py を読む。skills: の 3 つは Claude Code に同梱の物。pr-review-toolkit の agent のレンズは、利用者が入れた pr-review-toolkit（許す一覧 borrow.json）を dev/toolset.py が隔離した設定に入れる。必須のレンズが起きなければ受け付け（material.take）が拒んで同じ会話で起こし直させ、上限（GIVE_UP_AFTER 回）に届いた時とプラグインが隔離した設定に無い時だけ人に渡す）。output_format は material.output_format("local-review")（写しの schema に印）を貼った物
  - id: local-review-loop
    depends_on:
    - mat-route
    when: $mat-route.output.local_review == true
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $local-review-accept.output.done = true
      nodes:
      - id: local-review-prep
        script: prep
        runtime: uv
        timeout: 1728000000
        with:
          role: local-review
          purpose_file: $INPUTS.purpose_file
        output_format:
          type: object
          additionalProperties: false
          required:
          - prompt_file
          - prompt_text
          - attempt
          - out_path
          - node
          - already
          - stopped
          properties:
            prompt_file:
              type: string
            prompt_text:
              type: string
            attempt:
              type: integer
            out_path:
              type: string
            node:
              type: string
            already:
              type: boolean
            stopped:
              type: boolean
      # 同じ波の別の目が盤面を止めた後の周は役を起こさない（受け付けが止まった旨の done を出して輪を抜ける）
      - id: local-review
        model: sonnet               # 読んで確かめる・まとめる役（前付けの無い役。tests/test_tool_parity.py の表 STAGE_MODEL が縛る。持ち主 2026-10-06）
        effort: medium              # 同じ表の effort（段に書かないと run の既定で黙って走る）
        command: local-review
        depends_on:
        - local-review-prep
        when: $local-review-prep.output.stopped == false
        settingSources: [user]
        allowed_tools:
        - Read
        - Grep
        - Glob
        - Bash
        - WebSearch
        - WebFetch
        - Skill
        - Agent
        skills:
        - code-review
        - simplify
        - security-review
        sandbox:
          enabled: true
          allowUnsandboxedCommands: false
          failIfUnavailable: true
          excludedCommands:
          - 'works-gh:*'
          network:
            allowedDomains: []
        idle_timeout: 1728000000
        output_format:
          description: 'works-node: local-review no-post no-tree-write'
          type: object
          required:
          - material
          - findings
          - simplify_carried
          additionalProperties: false
          properties:
            material:
              type: object
              required:
              - status
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum:
                  - found
                  - clean
                  - carried_over
                  - not_applicable
                  - awaiting_human
                  - not_run
                count:
                  type: integer
                  minimum: 0
                detail:
                  type: string
                checked:
                  type: string
                reason:
                  type: string
                from_round:
                  type: integer
                  minimum: 1
            simplify_carried:
              type: boolean
            findings:
              type: array
              items:
                type: object
                required:
                - skill
                - items
                additionalProperties: false
                properties:
                  skill:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - where
                      - text
                      additionalProperties: false
                      properties:
                        where:
                          type: string
                        text:
                          type: string
                        mechanism:
                          type: string
                        measured:
                          type: string
                        false_positive_if:
                          type: string
                  invoked:
                    type: boolean
                  failed:
                    type: string
      - id: local-review-accept
        script: accept
        runtime: uv
        timeout: 1728000000
        depends_on:
        - local-review-prep
        - local-review
        trigger_rule: none_failed_min_one_success   # 役を飛ばした周（盤面が止まっていた）も走り、done を出す
        with:
          role: local-review
          reply:
            from: $local-review.output
            if_skipped: null
          adapter: $INPUTS.adapter
        output_format:
          type: object
          required:
          - ok
          - done
          - give_up
          - reason
          - reason_file
          properties:
            ok:
              type: boolean
            done:
              type: boolean
            give_up:
              type: boolean
            stopped:
              type: boolean
            reason:
              type: string
            reason_file:
              type: string
            node:
              type: string
            status:
              type: string

  # p1.consistency_bypass（inspector）: 読むだけ（Read・Grep・Glob）。output_format は material.output_format("consistency-bypass")（写しの schema に印）を貼った物
