  # p1.provenance（delegate）: graphloops の任せ先と同じ sandbox（allowWrite ['/']・網）。旗 no-tree-write で包みが作業ツリーを止める（R56）。output_format は material.output_format("provenance")（写しの schema に印）を貼った物
  - id: provenance-loop
    depends_on:
    - mat-route
    when: $mat-route.output.provenance == true
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $provenance-accept.output.done = true
      nodes:
      - id: provenance-prep
        script: prep
        runtime: uv
        timeout: 1728000000
        with:
          role: provenance
          purpose_file: $INPUTS.purpose_file
        output_format:
          type: object
          additionalProperties: false
          required:
          - prompt_file
          - prompt_text
          - attempt
          - out_path
          - node
          - already
          - stopped
          properties:
            prompt_file:
              type: string
            prompt_text:
              type: string
            attempt:
              type: integer
            out_path:
              type: string
            node:
              type: string
            already:
              type: boolean
            stopped:
              type: boolean
      # 同じ波の別の目が盤面を止めた後の周は役を起こさない（受け付けが止まった旨の done を出して輪を抜ける）
      - id: provenance
        model: sonnet               # 読んで確かめる・まとめる役（前付けの無い役。tests/test_tool_parity.py の表 STAGE_MODEL が縛る。持ち主 2026-10-06）
        effort: medium              # 同じ表の effort（段に書かないと run の既定で黙って走る）
        command: provenance
        depends_on:
        - provenance-prep
        when: $provenance-prep.output.stopped == false
        settingSources: [user]
        allowed_tools:
        - Read
        - Grep
        - Glob
        - Bash
        - WebSearch
        - WebFetch
        sandbox:
          enabled: true
          allowUnsandboxedCommands: false
          failIfUnavailable: true
          enableWeakerNetworkIsolation: true
          network:
            allowedDomains:
            - '*'
            allowLocalBinding: true
          filesystem:
            allowWrite:
            - /
        idle_timeout: 1728000000
        output_format:
          description: 'works-node: provenance no-post no-tree-write'
          type: object
          required:
          - material
          - claims
          additionalProperties: false
          properties:
            material:
              type: object
              required:
              - status
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum:
                  - found
                  - clean
                  - carried_over
                  - not_applicable
                  - awaiting_human
                  - not_run
                count:
                  type: integer
                  minimum: 0
                detail:
                  type: string
                checked:
                  type: string
                reason:
                  type: string
                from_round:
                  type: integer
                  minimum: 1
            claims:
              type: array
              items:
                type: object
                required:
                - claim
                - exists_at_base
                - evidence
                additionalProperties: false
                properties:
                  claim:
                    type: string
                  exists_at_base:
                    type: boolean
                  evidence:
                    type: string
      - id: provenance-accept
        script: accept
        runtime: uv
        timeout: 1728000000
        depends_on:
        - provenance-prep
        - provenance
        trigger_rule: none_failed_min_one_success   # 役を飛ばした周（盤面が止まっていた）も走り、done を出す
        with:
          role: provenance
          reply:
            from: $provenance.output
            if_skipped: null
          adapter: $INPUTS.adapter
        output_format:
          type: object
          required:
          - ok
          - done
          - give_up
          - reason
          - reason_file
          properties:
            ok:
              type: boolean
            done:
              type: boolean
            give_up:
              type: boolean
            stopped:
              type: boolean
            reason:
              type: string
            reason_file:
              type: string
            node:
              type: string
            status:
              type: string

  # 出口。輪は飛ばされうる（when:）ので、輪の欄を読まずに合流する。回した後も待っている素材集めの節が在れば盤面を止めて ok: false
  - id: collect
    script: collect
    runtime: uv
    timeout: 1728000000
    depends_on:
    - mat-route
    - prior-decisions-loop
    - purpose-review-loop
    - local-review-loop
    - consistency-bypass-loop
    - hygiene-loop
    - external-standards-loop
    - procedure-trace-loop
    - gate-efficacy-loop
    - test-double-fidelity-loop
    - main-path-observation-loop
    - provenance-loop
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      required:
      - ok
      - reason
      - ran
      - skipped
      - materials
      - snapshot
      - exit_file
      properties:
        ok:
          type: boolean
        reason:
          type: string
        ran:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: object
            required:
            - node
            - why
            properties:
              node:
                type: string
              why:
                type: string
        materials:
          type: object
          additionalProperties:
            type: string
        snapshot:
          type: object
          required:
          - rev
          - diff_file
          - changed_files
          - changed_files_file
          - diff_stat
          - request_wheres
          properties:
            rev:
              type: string
            diff_file:
              type: string
            changed_files:
              type: array
              items:
                type: string
            changed_files_file:
              type: string
            diff_stat:
              type: string
            request_wheres:
              type: array
              items:
                type: string
        exit_file:
          type: string
