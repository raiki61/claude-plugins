# 筋書き pass: 判定から入らない run の 1 周目。盤面の ready に素材集めの役 10 本（P1 の目 9 本と先行議論の突合）が在り、
# mat-route が全部に真を立て、同じ層で並んで回り、どれも 1 回で受け付けに通る。p0.purpose_review は表で absent なので回らない。
# 役の返答は tests/test_blk_material.py の good_reply と同じ中身。スクリプトの節は全部 stub（盤面は dry-run の対象に無い。
# スクリプトの中身は tests/test_blk_material.py が盤面の上で見る）。
# 遮断の役（hygiene）の指示には prep の prompt_text がそのまま貼られる——本文の中の $ARTIFACTS_DIR・$mat-route.output.why が
# 置き換え直されないことを resolved-text-contains で見る（裁定 R44 の形の確かめ）。
