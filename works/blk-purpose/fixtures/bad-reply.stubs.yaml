# 目的の役が毎回同じ悪い返答（source_files が種に無いファイル docs/plan.md を挙げる）を返し、受け付けが拒む筋書き。
# purpose の中身は tests/replies/purpose_missing_source_file.json と同じ。型（output_format）は通る返答にする——型に
# 合わない stub は模擬実行が役の節で落とし、受け付けまで届かない。
# 本番の run では輪が上限（3 回）で purpose-loop が落ちる。dry-run は until_bash を回さず輪を 1 回で済んだと
# みなす（Archon 0.11.1）ので、筋書きでは受け付けが purpose.json を書かなかったことを collect が見つけて落ちる。
fixture:
  expect: failed
  fail-node: collect
  reached:
  - intake
  - purpose
  - purpose-accept
  inputs:
    request: request_ok.json
exec-code: true
purpose:
  purpose_text: stats.py の mean と clamp を、関数名・docstring・テストが期待する振る舞いに直す
  source: ②計画・タスク記述
  known_weaknesses: []
  source_files:
  - docs/plan.md
