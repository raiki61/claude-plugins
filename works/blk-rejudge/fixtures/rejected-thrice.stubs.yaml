# 筋書き rejected-thrice: 受け付けが役の返答を 3 回拒み、3 回目に諦めの印（done: true・give_up: true）を出す。collect は再審の節が
# 待ちのまま残った盤面を見て、最後の拒否の文で盤面を止め、ok: false を返す（輪は max_iterations で落ちないので、collect まで届く）。
# 注意: dry-run は until_bash を回さず、輪を 1 回で済んだとみなす（Archon 0.11.1）。だからこの筋書きは、輪が抜けた後の配線
# （rj-route2 → collect）しか見ない。3 回目の拒否で輪が抜ける式（until_bash の done）は tests/test_blk_rejudge.py の
# test_loop_gives_up_after_three_rejections が、Archon と同じ順でスクリプトを回し、until_bash の式を sh で評価して見る。
rj-snap:
  ok: true
  snapshot_file: board/r1/rejudge-snapshot.json
rj-route1:
  next: rejudge
  node: p2.rejudge
  why: p2.rejudge が ready
  stopped: false
rejudge-prep:
  prompt_file: board/prompts/r1/p2.rejudge.md
  attempt: 1
  out_path: board/out/r1/p2.rejudge.json
  node: p2.rejudge
  already: false
rejudge:
  verdict: 退ける
  new_facts: 回す側の挙げた行を読んだが、確かめた結果はまだ書けない
  reason: 異議に当たらない
  units:
  - key: src/a.py:f — 上限が効かない経路がある
    label: block
  - key: src/b.py:g — 定数の重複
    label: suggest
    disposition: do-now
rejudge-accept:
  ok: false
  done: true
  give_up: true
  reason: 'p2.rejudge: new_facts が空同然——回す側が出した事実を**自分で確かめた結果**を書け'
  node: p2.rejudge
  verdict: ''
rj-route2:
  next: ''
  node: ''
  why: 盤面は止まっている（works:rejudge）
  stopped: true
collect:
  ok: false
  reason: 'p2.rejudge の返答が 3 回とも受け付けで拒まれた（最後の拒否: p2.rejudge: new_facts が空同然）'
  passes: 0
  verdicts: []
  unsettled:
    text: '判定の単位 src/a.py:f — 上限が効かない経路がある について: 修正の後に src/a.py の f へ入る道をもう 1 つ見つけた（呼び出し元の g からの直の呼び出し）。上限は片方の道にしか掛かっておらず、この単位の class_query の数え方も狭い。判定を見直してほしい'
    settled: false
  objection: ''
  new_open_units: []
  lowered: []
  unnamed_changed: []
  diff_file: ''
  reads_file: ''
fixture:
  expect: completed
  reached:
  - rj-snap
  - rj-route1
  - rejudge-prep
  - rejudge
  - rejudge-accept
  - rj-route2
  - collect
