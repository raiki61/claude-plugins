name: blk-rejudge
description: |
  同じ周の再審のブロック（段 1＝写しの graphloops 0.21.0 の形）。修正役が判定に異議（rejudge_requested）を出した周に、判定役の
  会話の続きで判定を考え直させる（採る／退ける／一部採る）。回すかどうかは盤面の ready（写しの条件）だけで決まり、works は往復の
  数も順も持たない。0.21.0 の規則では再審は 1 周に 1 回で、第三の目（rejudge-third）は ready にならない（review-graph 0.21.0 と
  同じ穴。本線 3-6 を写し直すと直る）が、規則が出せばそのまま回る。判定役の会話を確かめられなければ、役を起こさずに盤面を止める。
  指示書は engine と同じ描き方で描いた graphloops の本文（prep が盤面の prompts/r<N>/ に書く）。ラインから include で使う。
  出口 collect: 回した数・答え・決着しなかった異議・新しく直す義務が付いた単位・異議に名指されていない単位の変化（rejudge-diff.json）。

inputs:
  base_rev:
    default: ""
    description: 周の頭で固めた版（ラインの口を他のブロックと揃える。段 1 のスクリプトは読まない——版は盤面が持つ）
  policy_paste:
    default: ""
    description: 人の方針の本文（ラインの口を揃える。段 1 では読まない——方針は盤面の inputs.policy_md から指示書に描かれる）

returns: collect
outcome_field: ok

nodes:
  # 役を起こす前の作業ツリーの写し（読むだけの役が変えていないかを受け付けが比べる）
  - id: rj-snap
    script: snap
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      additionalProperties: false
      required:
      - ok
      - snapshot_file
      properties:
        ok:
          type: boolean
        snapshot_file:
          type: string

  # 段 1: p2.rejudge — 判定役の会話の続き（包みが --resume で継ぐ。拒否の後の出し直しも同じ会話）。回すかは rj-route1 が盤面の ready で決める
  - id: rj-route1
    script: route
    runtime: uv
    timeout: 1728000000
    depends_on: [rj-snap]
    output_format:
      type: object
      additionalProperties: false
      required:
      - next
      - node
      - why
      - stopped
      properties:
        next:
          type: string
        node:
          type: string
        why:
          type: string
        stopped:
          type: boolean

  - id: rejudge-loop
    depends_on: [rj-route1]
    when: "$rj-route1.output.next == 'rejudge'"
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: test $rejudge-accept.output.done = true   # 通った時か、3 回目の拒否で諦めた時（max_iterations で落とさない）
      nodes:
        - id: rejudge-prep
          script: prep
          runtime: uv
          timeout: 1728000000
          with:
            role: rejudge
          output_format:
            type: object
            additionalProperties: false
            required:
            - prompt_file
            - attempt
            - out_path
            - node
            - already
            properties:
              prompt_file:
                type: string
              attempt:
                type: integer
              out_path:
                type: string
              node:
                type: string
              already:
                type: boolean
        - id: rejudge
          model: opus                 # 役 judge の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
          effort: high                # 役 judge の前付けの effort（段は前付けを読まない。tests/test_tool_parity.py の RoleModelCase が縛る）
          command: rejudge
          depends_on: [rejudge-prep]
          context: fresh              # Archon には会話を継がせない。継ぐのは包み（印の continue=judge）
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # rejudge.output_format("p2.rejudge")（写しの schema に印）を貼った物（tests/test_blk_rejudge.py が一致を見る）
          output_format:
            description: 'works-node: rejudge continue=judge'
            type: object
            required:
            - verdict
            - new_facts
            - units
            additionalProperties: false
            properties:
              verdict:
                type: string
                enum:
                - 採る
                - 退ける
                - 一部採る
              new_facts:
                type: string
                minLength: 20
              reason:
                type: string
              units:
                type: array
                items:
                  type: object
                  required:
                  - key
                  - label
                  additionalProperties: true
                  properties:
                    key:
                      type: string
                      minLength: 1
                    label:
                      type: string
                      enum:
                      - block
                      - suggest
                      - nit
                      - question
                      - info
                    disposition:
                      type: string
                      enum:
                      - do-now
                      - defer
                    reason:
                      type: string
                    reopen_evidence:
                      type: string
                    origin_analysis:
                      type: string
                    why_chain:
                      type: array
                      items:
                        type: string
                    prescriptions:
                      type: array
                      items:
                        type: string
                    closed_note:
                      type: string
                    class_query:
                      type: object
                      required:
                      - how
                      - counts
                      - total
                      additionalProperties: false
                      properties:
                        how:
                          type: object
                          required:
                          - patterns
                          - paths
                          - count
                          additionalProperties: false
                          properties:
                            patterns:
                              type: array
                              minItems: 1
                              maxItems: 20
                              items:
                                type: string
                                minLength: 1
                                pattern: ^[^\n\r\x00]+$
                            fixed:
                              type: boolean
                            paths:
                              type: array
                              minItems: 1
                              maxItems: 50
                              items:
                                type: string
                                minLength: 1
                                pattern: ^[^\n\r\x00]+$
                            count:
                              type: string
                              enum:
                              - lines
                              - files
                            untracked:
                              type: boolean
                            ignore_case:
                              type: boolean
                            word:
                              type: boolean
                        counts:
                          type: string
                          enum:
                          - defects
                          - population
                        total:
                          type: integer
                          minimum: 0
                        note:
                          type: string
                        hits:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                            minLength: 1
                            pattern: ^[^\n\r\x00]+$
                        misses:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                            minLength: 1
                            pattern: ^[^\n\r\x00]+$
                        examples_unavailable:
                          type: string
                          minLength: 10
                        misses_omitted_why:
                          type: string
                          minLength: 10
        - id: rejudge-accept
          script: accept
          runtime: uv
          timeout: 1728000000
          depends_on: [rejudge]
          with:
            role: rejudge
            reply: {from: "$rejudge.output"}
          output_format:
            type: object
            required:
            - ok
            - done
            - give_up
            - reason
            properties:
              ok:
                type: boolean
              done:
                type: boolean
              give_up:
                type: boolean
              reason:
                type: string
              node:
                type: string
              verdict:
                type: string

  # 段 2: p2.rejudge_third — 新しい会話（印に continue= が無い。拒否の後の出し直しは fresh_context で新しい会話に理由を貼る）。回すかは rj-route2 が盤面の ready で決める
  - id: rj-route2
    script: route
    runtime: uv
    timeout: 1728000000
    depends_on: [rj-route1, rejudge-loop]
    trigger_rule: none_failed_min_one_success   # 前の段の輪は飛ばされうる。その欄は読まない
    output_format:
      type: object
      additionalProperties: false
      required:
      - next
      - node
      - why
      - stopped
      properties:
        next:
          type: string
        node:
          type: string
        why:
          type: string
        stopped:
          type: boolean

  - id: rejudge-third-loop
    depends_on: [rj-route2]
    when: "$rj-route2.output.next == 'rejudge-third'"
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: test $rejudge-third-accept.output.done = true   # 通った時か、3 回目の拒否で諦めた時（max_iterations で落とさない）
      nodes:
        - id: rejudge-third-prep
          script: prep
          runtime: uv
          timeout: 1728000000
          with:
            role: rejudge-third
          output_format:
            type: object
            additionalProperties: false
            required:
            - prompt_file
            - attempt
            - out_path
            - node
            - already
            properties:
              prompt_file:
                type: string
              attempt:
                type: integer
              out_path:
                type: string
              node:
                type: string
              already:
                type: boolean
        - id: rejudge-third
          model: opus                 # 役 judge の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
          effort: high                # 役 judge の前付けの effort（段は前付けを読まない。tests/test_tool_parity.py の RoleModelCase が縛る）
          command: rejudge-third
          depends_on: [rejudge-third-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # rejudge.output_format("p2.rejudge_third")（写しの schema に印）を貼った物（tests/test_blk_rejudge.py が一致を見る）
          output_format:
            description: 'works-node: rejudge-third'
            type: object
            required:
            - verdict
            - new_facts
            - units
            additionalProperties: false
            properties:
              verdict:
                type: string
                enum:
                - 採る
                - 退ける
                - 一部採る
              new_facts:
                type: string
                minLength: 20
              reason:
                type: string
              units:
                type: array
                items:
                  type: object
                  required:
                  - key
                  - label
                  additionalProperties: true
                  properties:
                    key:
                      type: string
                      minLength: 1
                    label:
                      type: string
                      enum:
                      - block
                      - suggest
                      - nit
                      - question
                      - info
                    disposition:
                      type: string
                      enum:
                      - do-now
                      - defer
                    reason:
                      type: string
                    reopen_evidence:
                      type: string
                    origin_analysis:
                      type: string
                    why_chain:
                      type: array
                      items:
                        type: string
                    prescriptions:
                      type: array
                      items:
                        type: string
                    closed_note:
                      type: string
                    class_query:
                      type: object
                      required:
                      - how
                      - counts
                      - total
                      additionalProperties: false
                      properties:
                        how:
                          type: object
                          required:
                          - patterns
                          - paths
                          - count
                          additionalProperties: false
                          properties:
                            patterns:
                              type: array
                              minItems: 1
                              maxItems: 20
                              items:
                                type: string
                                minLength: 1
                                pattern: ^[^\n\r\x00]+$
                            fixed:
                              type: boolean
                            paths:
                              type: array
                              minItems: 1
                              maxItems: 50
                              items:
                                type: string
                                minLength: 1
                                pattern: ^[^\n\r\x00]+$
                            count:
                              type: string
                              enum:
                              - lines
                              - files
                            untracked:
                              type: boolean
                            ignore_case:
                              type: boolean
                            word:
                              type: boolean
                        counts:
                          type: string
                          enum:
                          - defects
                          - population
                        total:
                          type: integer
                          minimum: 0
                        note:
                          type: string
                        hits:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                            minLength: 1
                            pattern: ^[^\n\r\x00]+$
                        misses:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                            minLength: 1
                            pattern: ^[^\n\r\x00]+$
                        examples_unavailable:
                          type: string
                          minLength: 10
                        misses_omitted_why:
                          type: string
                          minLength: 10
        - id: rejudge-third-accept
          script: accept
          runtime: uv
          timeout: 1728000000
          depends_on: [rejudge-third]
          with:
            role: rejudge-third
            reply: {from: "$rejudge-third.output"}
          output_format:
            type: object
            required:
            - ok
            - done
            - give_up
            - reason
            properties:
              ok:
                type: boolean
              done:
                type: boolean
              give_up:
                type: boolean
              reason:
                type: string
              node:
                type: string
              verdict:
                type: string

  # 出口。回した後も再審の節が ready のまま（3 回とも拒まれた・段の順のずれ）なら盤面を止めて ok: false。
  # 読んだ証拠（Task 6 の reads.py）はまだ無いので rejudge-reads の節は置かない（出口の reads_file は空）
  - id: collect
    script: collect
    runtime: uv
    timeout: 1728000000
    depends_on: [rj-route2, rejudge-third-loop]
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      required:
      - ok
      - reason
      - passes
      - verdicts
      - unsettled
      - objection
      - new_open_units
      - lowered
      - unnamed_changed
      - diff_file
      - reads_file
      properties:
        ok:
          type: boolean
        reason:
          type: string
        passes:
          type: integer
          minimum: 0
        verdicts:
          type: array
          items:
            type: string
        unsettled:
          type: object
          required:
          - text
          - settled
          properties:
            text:
              type: string
            settled:
              type: boolean
        objection:
          type: string
        new_open_units:
          type: array
          items:
            type: string
        lowered:
          type: array
          items:
            type: string
        unnamed_changed:
          type: array
          items:
            type: string
        diff_file:
          type: string
        reads_file:
          type: string
