# 違反: 節の名前が premises でも、blk-premises/blk-premises.yaml の外では Bash を持てない
name: bad-measure-outside-blk-premises
description: 違反の見本
nodes:
  - id: premises
    prompt: 測れ
    settingSources: [user]
    allowed_tools: [Read, Grep, Glob, Bash]
    sandbox: {enabled: true, allowUnsandboxedCommands: false}
    idle_timeout: 1728000000
    output_format: {type: object}
