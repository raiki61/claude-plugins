name: blk-world
description: |
  世界の解のブロック（計画 docs/plans/2026-10-09-world-solution.md の 5.2 節）。依頼の行ごとに、依頼が示した解き方と対象の名を
  外した問題の類に言い直させ（言い直す役。道具ゼロで対象を読まない）、言い直した問題の類・作業・検索語・依頼の解き方だけを
  見せた web の役（web の検索と取得だけ）に、世の中の定石の抜き書きを集めさせ、類ごとの定石と、それがこの依頼にどう
  当たるかと、依頼の解き方が定石と同じか違うかを判断させる。機械が抜き書きを取り直した本文で照らし（字のまま無い抜き書きは
  落ち、それを指す根拠も外れる。残る根拠が無い行は basis: knowledge）、行を世界の解の行のファイル（world.jsonl。行の形は
  world-row.schema.json）に書く。
  web が off の run・網に届かない run も止めず、行は知識だけから書く（basis: knowledge。web で確かめていない）。落ちた段が
  在っても線を止めない（出口の status: failed と reason）。後段が読んでよいのは出口の world_file だけ。
  入力の契約は依頼のファイル・目的の文のファイル（任意）・web の切り替えの 3 つで、この契約を満たすラインなら include で差し込める。

inputs:
  request:
    default: ""
    description: 依頼のファイルのパス（cwd からの相対か絶対）。findings の JSON の配列か {findings, …} の形で、各行は {where, text, …}。空なら依頼の行の無い run（何もせずに空の行のファイルを出す）
  purpose_file:
    default: ""
    description: 目的の文のファイルのパス（任意）。{purpose_text, means?} の JSON（means は依頼が示した解き方の文の配列）。言い直す役に見せる
  web:
    default: "on"
    description: on か off（空は on）。off なら定石を web で集めず、知識だけで行を書く

returns: collect
outcome_field: ok

nodes:
  # 置き場を置き直し、依頼・目的の文を読む。読めない時も止めない（出口が status: failed にする）
  - id: world-intake
    script: intake
    runtime: uv
    timeout: 1728000000
    with:
      request: $INPUTS.request
      purpose_file: $INPUTS.purpose_file
      web: $INPUTS.web
    output_format:
      type: object
      additionalProperties: false
      required: [due, findings, reason]
      properties:
        due: {type: boolean}
        findings: {type: integer, minimum: 0}
        reason: {type: string}

  # 言い直す役の輪。拒否の後は同じ会話で出し直させ、3 回目の拒否で受け付けが done を出して輪を抜ける
  # （max_iterations で落とさない。裁定 R50）
  - id: world-classes-loop
    depends_on: [world-intake]
    when: "$world-intake.output.due == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $world-classes-accept.output.done = true
      nodes:
        - id: world-classes-prep
          script: classes_prep
          runtime: uv
          timeout: 1728000000
          output_format:
            type: object
            additionalProperties: false
            required: [prompt, prompt_file]
            properties:
              prompt: {type: string}
              prompt_file: {type: string}
        - id: world-classes
          model: opus                 # 役 blind-judge の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
          effort: high                # 役 blind-judge の前付けの effort（段は前付けを読まない）
          command: world-classes
          depends_on: [world-classes-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: []   # 道具ゼロ。対象の木を読まずに上に上がる（独立設計の隔てと同じ型）。見せるのは支度が貼る依頼の行・目的の文だけ
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          output_format:
            description: 'works-node: world-classes isolated'
            type: object
            required: [classes]
            additionalProperties: false
            properties:
              classes:
                type: array
                items:
                  type: object
                  required: [finding, problem, activity, proposed, queries]
                  additionalProperties: false
                  properties:
                    finding: {type: integer, minimum: 1}
                    problem: {type: string, minLength: 1}
                    activity: {type: string, minLength: 1}
                    proposed: {type: string}
                    queries: {type: array, items: {type: string}}
        - id: world-classes-accept
          script: classes_accept
          runtime: uv
          timeout: 1728000000
          depends_on: [world-classes]
          with:
            reply: {from: "$world-classes.output"}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}

  # 類を決める。言い直しが通らなかった周・輪が飛んだ周も走り（all_done）、判断する行が無いと出す
  - id: world-plan
    script: plan
    runtime: uv
    timeout: 1728000000
    depends_on: [world-intake, world-classes-loop]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [judge_due]
      properties:
        judge_due: {type: boolean}

  # web の役の輪（言い直す役の輪と同じ形）。web の役が定石を集めて判断し、受け付けが抜き書きを取り直した本文で照らす
  - id: world-judge-loop
    depends_on: [world-plan]
    when: "$world-plan.output.judge_due == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $world-judge-accept.output.done = true
      nodes:
        - id: world-judge-prep
          script: judge_prep
          runtime: uv
          timeout: 1728000000
          output_format:
            type: object
            additionalProperties: false
            required: [prompt, prompt_file]
            properties:
              prompt: {type: string}
              prompt_file: {type: string}
        - id: world-judge
          model: sonnet               # web から集めてまとめる役（前付けの無い役。表 .shared/core/stage-models.json の値で tests/test_tool_parity.py が縛る）
          effort: medium              # 同じ表の effort
          command: world-judge
          depends_on: [world-judge-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: [WebSearch, WebFetch]   # web の検索と取得だけ。対象の木を読まない。見せるのは支度が貼る問題の類・作業・検索語・依頼の解き方だけ
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          output_format:
            description: 'works-node: world-judge'
            type: object
            required: [rows, excerpts]
            additionalProperties: false
            properties:
              rows:
                type: array
                items:
                  type: object
                  required: [finding, practice, sources, applies, not_applies, verdict, challenge]
                  additionalProperties: false
                  properties:
                    finding: {type: integer, minimum: 1}
                    practice: {type: string, minLength: 1}
                    sources: {type: array, items: {type: string}}
                    applies: {type: string}
                    not_applies: {type: string}
                    verdict: {type: string, enum: [same, differs, none]}
                    challenge: {type: string}
              excerpts:
                type: array
                items:
                  type: object
                  required: [id, url, excerpt]
                  additionalProperties: false
                  properties:
                    id: {type: string}
                    url: {type: string}
                    excerpt: {type: string}
        - id: world-judge-accept
          script: judge_accept
          runtime: uv
          timeout: 1728000000
          depends_on: [world-judge]
          with:
            reply: {from: "$world-judge.output"}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}

  # 出口。どの段が飛ばされた・落ちた周も走り（all_done）、落ちの理由を status と reason に残す
  - id: collect
    script: collect
    runtime: uv
    timeout: 1728000000
    depends_on: [world-intake, world-classes-loop, world-plan, world-judge-loop]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, world_file, status, reason, classes, dropped]
      properties:
        ok: {type: boolean}
        world_file: {type: string}
        status: {type: string, enum: [ok, failed]}
        reason: {type: string}
        classes: {type: integer, minimum: 0}
        dropped: {type: integer, minimum: 0}
