    - c1
    applies: 赤の判定の直し
    not_applies: ''
    verdict: differs
    challenge: 依頼は読む役を足す、定石は仮の実装で走らせる。読み込みの失敗が赤でない訳が無い限り定石を選ぶ
    basis: web
world-judge-accept:
