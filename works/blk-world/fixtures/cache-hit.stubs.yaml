# 筋書き cache-hit: 言い直す役が控えの類の id を選び、控えに期限の内の定石が在るので集める役と取り直しを飛ばす（照らしは集める類が
# 無いので返答も出来事も見ない）。判断する役は控えの抜き書き（c1）を材料に web の行を返す。控えから使った類は控えに書き直さない
world-intake:
  due: true
  findings: 1
  reason: ''
world-classes-prep:
  prompt: （言い直す役の描いた指示書。控えの類の一覧つき）
  prompt_file: world/classes-prompt-1.md
  attempt: 1
world-classes:
