# 筋書き pass: 依頼の 1 行を言い直す役が 1 回で問題の類にし、web の役が抜き書きと、web の行（依頼の解き方は定石と違う）を
# 1 回で返し、受け付けが抜き書きを取り直した本文で照らして 1 つ残す。スクリプトの節は全部 stub（中身は tests/test_blk_world.py が
# 関数と子のプロセスで回す）。dry-run は until_bash を回さないので、輪の受け付けの done は輪を抜けた後の姿（真）
world-intake:
  due: true
  findings: 1
  reason: ''
world-classes-prep:
  prompt: （言い直す役の描いた指示書）
  prompt_file: world/classes-prompt-1.md
world-classes:
  classes:
  - finding: 1
    problem: テストを先に書く開発で、まだ無い機能を呼ぶテストを、コンパイルの要る対象でどう赤にするか
    activity: テストを先に書く開発
    proposed: 読むだけの役を足して生のログから判じさせる
    queries:
    - test-first red phase compile error stub
world-classes-accept:
  ok: true
  done: true
  reason: ''
world-plan:
  judge_due: true
world-judge-prep:
  prompt: （web の役の描いた指示書）
  prompt_file: world/judge-prompt-1.md
world-judge:
  rows:
  - finding: 1
    practice: 読み込みの失敗は赤に数えず、最小の仮の実装で走らせてから期待違いの失敗を赤とする
    sources:
    - x1
    applies: 赤の判定の直し
    not_applies: ''
    verdict: differs
    challenge: 依頼は読む役を足す、定石は仮の実装で走らせる。読み込みの失敗が赤でない訳が無い限り定石を選ぶ
  excerpts:
  - id: x1
    url: https://example.org/guide/tdd
    excerpt: A compile error is not a red test; add the smallest stub so the test runs and fails on the expected assertion.
world-judge-accept:
  ok: true
  done: true
  reason: ''
collect:
  ok: true
  world_file: world/world.jsonl
  status: ok
  reason: ''
  classes: 1
  dropped: 0
fixture:
  expect: completed
  reached:
  - world-intake
  - world-classes-prep
  - world-classes
  - world-classes-accept
  - world-plan
  - world-judge-prep
  - world-judge
  - world-judge-accept
  - collect
