# 筋書き pass: 依頼の 1 行を言い直す役が 1 回で問題の類にし、控えに無い類なので集める役が抜き書きを返し、照らしが 1 つ残し、判断する役が
# web の行（依頼の解き方は定石と違う）を 1 回で返す。スクリプトの節は全部 stub（中身は tests/test_blk_world.py が関数と子のプロセスで
# 回す）。dry-run は until_bash を回さないので、輪の受け付けの done は輪を抜けた後の姿（真）
world-intake:
  due: true
  findings: 1
  reason: ''
world-classes-prep:
  prompt: （言い直す役の描いた指示書）
  prompt_file: world/classes-prompt-1.md
  attempt: 1
world-classes:
  classes:
  - finding: 1
    class_id: ''
    problem: テストを先に書く開発で、まだ無い機能を呼ぶテストを、コンパイルの要る対象でどう赤にするか
    activity: テストを先に書く開発
    proposed: 読むだけの役を足して生のログから判じさせる
    queries:
    - test-first red phase compile error stub
    wording: false
world-classes-accept:
  ok: true
  done: true
  give_up: false
  reason: ''
  attempt: 1
world-cache:
  collect_due: true
  judge_due: true
  prompt: （集める役の描いた指示書）
world-collect:
  excerpts:
  - class: w-0123456789ab
    url: https://example.org/guide/tdd
    excerpt: A compile error is not a red test; add the smallest stub so the test runs and fails on the expected assertion.
world-verify:
  kept: 1
  dropped: 0
  offline: false
world-judge-prep:
  prompt: （判断する役の描いた指示書）
  prompt_file: world/judge-prompt-1.md
  attempt: 1
world-judge:
  rows:
  - finding: 1
    practice: 読み込みの失敗は赤に数えず、最小の仮の実装で走らせてから期待違いの失敗を赤とする
    sources:
    - x1
    applies: 赤の判定の直し
    not_applies: ''
    verdict: differs
    challenge: 依頼は読む役を足す、定石は仮の実装で走らせる。読み込みの失敗が赤でない訳が無い限り定石を選ぶ
    basis: web
world-judge-accept:
  ok: true
  done: true
  give_up: false
  reason: ''
  attempt: 1
collect:
  ok: true
  world_file: world/world.jsonl
  status: ok
  reason: ''
  classes: 1
  cached: 0
  skipped: 0
  dropped: 0
fixture:
  expect: completed
  reached:
  - world-intake
  - world-classes-prep
  - world-classes
  - world-classes-accept
  - world-cache
  - world-collect
  - world-verify
  - world-judge-prep
  - world-judge
  - world-judge-accept
  - collect
