# 筋書き wording: 依頼の行が全部、文書のファイルの語の直しだけ（役の申告 wording と、where が全部文書のファイルであることの機械の
# 確かめの両方が要る。確かめは受け付けの中身で、tests/test_blk_world.py が見る）。段は言い直す役 1 回だけで終わり、集める役・照らし・
# 判断する役は飛ぶ。出口は行の無い空のファイルと、飛ばした行の数
world-intake:
  due: true
  findings: 1
  reason: ''
world-classes-prep:
  prompt: （言い直す役の描いた指示書）
  prompt_file: world/classes-prompt-1.md
  attempt: 1
world-classes:
  classes:
  - finding: 1
    class_id: ''
    problem: 文書の誤字を直す
    activity: 文書の校正
    proposed: ''
    queries: []
    wording: true
world-classes-accept:
  ok: true
  done: true
  give_up: false
  reason: ''
  attempt: 1
world-cache:
  collect_due: false
  judge_due: false
  prompt: ''
collect:
  ok: true
  world_file: world/world.jsonl
  status: ok
  reason: ''
  classes: 0
  cached: 0
  skipped: 1
  dropped: 0
fixture:
  expect: completed
  reached:
  - world-intake
  - world-classes-prep
  - world-classes
  - world-classes-accept
  - world-cache
  - collect
