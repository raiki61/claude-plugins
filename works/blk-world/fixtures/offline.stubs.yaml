# 筋書き offline: web が off の run（入力 web=off）。web の役は検索も取得もせず、知識だけの行（basis: knowledge）を返し、
# 受け付けは抜き書きを取り直さない。出口は止めずに「web で確かめていない」を reason に残す。網に届かない run（取り直しが
# 全部落ちる）も web の役から先は同じ道
world-intake:
  due: true
  findings: 1
  reason: ''
world-classes-prep:
  prompt: （言い直す役の描いた指示書）
  prompt_file: world/classes-prompt-1.md
world-classes:
  classes:
  - finding: 1
    problem: テストを先に書く開発で、まだ無い機能を呼ぶテストを、コンパイルの要る対象でどう赤にするか
    activity: テストを先に書く開発
    proposed: 読むだけの役を足して生のログから判じさせる
    queries:
    - test-first red phase compile error stub
world-classes-accept:
  ok: true
  done: true
  reason: ''
world-plan:
  judge_due: true
world-judge-prep:
  prompt: （web の役の描いた指示書）
  prompt_file: world/judge-prompt-1.md
world-judge:
  rows:
  - finding: 1
    practice: 読み込みの失敗は赤に数えず、最小の仮の実装で走らせてから期待違いの失敗を赤とする
    sources: []
    applies: 赤の判定の直し
    not_applies: ''
    verdict: differs
    challenge: 依頼は読む役を足す、定石は仮の実装で走らせる。読み込みの失敗が赤でない訳が無い限り定石を選ぶ
    basis: knowledge
  excerpts: []
world-judge-accept:
  ok: true
  done: true
  reason: ''
collect:
  ok: true
  world_file: world/world.jsonl
  status: ok
  reason: web が off（web で確かめていない）
  classes: 1
  dropped: 0
fixture:
  expect: completed
  inputs:
    web: 'off'
  reached:
  - world-intake
  - world-classes-prep
  - world-classes
  - world-classes-accept
  - world-plan
  - world-judge-prep
  - world-judge
  - world-judge-accept
  - collect
