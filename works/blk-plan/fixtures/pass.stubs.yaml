# 筋書き pass: 独立設計・修正案・事前審査が 1 回ずつ受け付けを通り、穴も narrows も無いので人に聞かない。
# 役の返答は tests/replies/plan_ok.json・plan_review_ok.json と同じ中身（tests/test_blk_plan.py が一致を見る）。スクリプトの節は全部 stub
# （盤面は dry-run の対象に無い。スクリプトの中身は tests/test_blk_plan.py が子のプロセスで回す）。
r2-design-snap:
  ok: true
  go: true
  snapshot_file: board/r1/design-snapshot.json
r2-design-prep:
  prompt: （r2.design の描いた指示書）
  prompt_file: board/r1/prompt-r2.design.md
  node: r2.design
  attempt: 1
  already: false
  role_def: ''
  role_def_missing: ''
r2-design:
  question_stands: true
  reason: 問いは立っている
  design: 上限は入口 1 箇所で掛ける
r2-design-accept:
  ok: true
  done: true
  give_up: false
  skipped: false
  reason: ''
  node: r2.design
  reason_file: ''
plan-snap:
  ok: true
  go: true
  snapshot_file: board/r1/plan-snapshot.json
plan-prep:
  prompt_file: board/r1/prompt-p2.fix_plan.md
  attempt: 1
  out_path: board/out/r1/p2.fix_plan.json
  node: p2.fix_plan
  already: false
plan:
  plan:
  - unit_keys:
    - 'stats.py mean: 分母が len(xs) - 1 になっている'
    - 'stats.py clamp: 上限を超えた値に lo を返す'
    approach: mean の分母を len(xs) に、clamp の上限の枝を hi に直す（定義どおり）
    adds: []
    removes: []
    shrink_first: 足す物は無い。式と戻り値を 1 か所ずつ直すだけで足りる
    narrows: []
    route: tdd
    tests:
    - id: test_stats.py::TestStats::test_mean_of_two
      behavior: 2 つの値の平均がその真ん中の値になる
      path: stats.mean を本物のまま呼び、戻り値を断言する（mock を使わない）
      red_kind: assertion
      red_why: 今の分母は len(xs) - 1 なので mean([1, 3]) が 4.0 を返し、2 との比べが落ちる
    rewrite_tests: []
    refactor:
      declared: false
      why: ''
    allowed_paths:
    - stats.py
    - test_stats.py
    out_of_scope: []
plan-accept:
  ok: true
  done: true
  give_up: false
  reason: ''
  reason_file: ''
  node: p2.fix_plan
  ready:
  - p2.plan_review
  asking: false
  halted: false
  out_file: out/r1/p2.fix_plan.json
plan-review-snap:
  ok: true
  go: true
  snapshot_file: board/r1/plan-review-snapshot.json
plan-review-prep:
  prompt_file: board/r1/prompt-p2.plan_review.md
  attempt: 1
  out_path: board/out/r1/p2.plan_review.json
  node: p2.plan_review
  already: false
plan-review:
  faces: []
  shrink: []
  faces_none: 案の 2 か所を stats.py で読み、写し・入口・後退・方針の穴も別案も無いと確かめた
  reason: 分母と戻り値を 1 行ずつ直す案で、足す物も狭める物も無い
plan-review-accept:
  ok: true
  done: true
  give_up: false
  reason: ''
  reason_file: ''
  node: p2.plan_review
  ready:
  - p3.fix
  asking: false
  halted: false
  out_file: out/r1/p2.plan_review.json
plan-reads:
  ok: true
  reads_file: board/r1/reads-plan-block.json
collect:
  ok: true
  plan_file: board/out/r1/p2.fix_plan.json
  review_file: board/out/r1/p2.plan_review.json
  asks_human: false
  gate_kinds: []
  reads_file: board/r1/reads-plan-block.json
  gave_up: false
  reason_file: ''
fixture:
  inputs:
    judgment_file: board/judgment.json
  expect: completed
  reached:
  - r2-design-snap
  - r2-design-prep
  - r2-design
  - r2-design-accept
  - plan-snap
  - plan-prep
  - plan
  - plan-accept
  - plan-review-snap
  - plan-review-prep
  - plan-review
  - plan-review-accept
  - plan-reads
  - collect
