# 筋書き give-up: 修正案の受け付けが 3 回目の拒否で諦めの印（done: true・give_up: true）を出し、輪が抜ける。p2.plan_review は
# 待たないので plan-review-snap が go: false を返し、事前審査の輪は when: で飛ぶ（役の stub を置かない）。collect は最後の拒否の
# 理由で盤面を止め ok: false・gave_up: true。dry-run は until_bash を回さないので、この筋書きは輪が抜けた後の配線だけを見る。
r2-design-snap:
  ok: true
  go: true
  snapshot_file: board/r1/design-snapshot.json
r2-design-prep:
  prompt: （r2.design の描いた指示書）
  prompt_file: board/r1/prompt-r2.design.md
  node: r2.design
  attempt: 1
  already: false
  role_def: ''
  role_def_missing: ''
r2-design:
  question_stands: true
  reason: 問いは立っている
  design: 上限は入口 1 箇所で掛ける
r2-design-accept:
  ok: true
  done: true
  give_up: false
  skipped: false
  reason: ''
  node: r2.design
  reason_file: ''
plan-snap:
  ok: true
  go: true
  snapshot_file: board/r1/plan-snapshot.json
plan-prep:
  prompt_file: board/r1/prompt-p2.fix_plan.md
  attempt: 1
  out_path: board/out/r1/p2.fix_plan.json
  node: p2.fix_plan
  already: false
plan:
  plan:
  - unit_keys:
    - 'stats.py mean: 分母が len(xs) - 1 になっている'
    approach: mean の分母を len(xs) に直す（clamp は触らない）
    adds: []
    removes: []
    shrink_first: 足す物は無い。式と戻り値を 1 か所ずつ直すだけで足りる
    narrows: []
    route: tdd
    tests:
    - id: test_stats.py::TestStats::test_mean_of_two
      behavior: 2 つの値の平均がその真ん中の値になる
      path: stats.mean を本物のまま呼び、戻り値を断言する（mock を使わない）
      red_kind: assertion
      red_why: 今の分母は len(xs) - 1 なので mean([1, 3]) が 4.0 を返し、2 との比べが落ちる
    rewrite_tests: []
    refactor:
      declared: false
      why: ''
plan-accept:
  ok: false
  done: true
  give_up: true
  reason: 受け付けが拒んだ
  reason_file: board/reject-take_p2_fix_plan-3.txt
  node: p2.fix_plan
plan-review-snap:
  ok: true
  go: false
  snapshot_file: ''
plan-reads:
  ok: true
  reads_file: board/r1/reads-plan-block.json
collect:
  ok: false
  plan_file: ''
  review_file: ''
  asks_human: false
  gate_kinds: []
  reads_file: board/r1/reads-plan-block.json
  gave_up: true
  reason_file: board/reject-take_p2_fix_plan-3.txt
fixture:
  inputs:
    judgment_file: board/judgment.json
  expect: completed
  reached:
  - r2-design-snap
  - r2-design-prep
  - r2-design
  - r2-design-accept
  - plan-snap
  - plan-prep
  - plan
  - plan-accept
  - plan-review-snap
  - plan-reads
  - collect
