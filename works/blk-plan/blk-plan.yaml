name: blk-plan
description: |
  修正案と事前審査のブロック（P1 計画 Task 25。〔線A計〕T11）。判定の後、修正役が直す前に、読むだけの 2 つの役を回す:
  修正案（写しの graph の p2.fix_plan）と、判定をした役とは別の目の事前審査（p2.plan_review）。指示書は本線（graphloops a1202d0）の
  p2.fix_plan.md・p2.plan_review.md そのものを engine と同じ描き方で描いた物（<役>-prep が盤面の今の周の prompt-<節>.md に書く。
  P1-R10）。人の関所の項目（案の narrows・事前審査の後退と方針の穴・方針の文書の変化）は盤面の p2.human_gate が組み、
  出口の asks_human・gate_kinds に出る（関所そのものはラインが開く）。検査の計画の欄は持たない（Phase 3）。
  受け付けは写しの schema・post_check・記録の検査をそのまま当て、役を起こす前と後で作業ツリー（porcelain・差分・git が無視する
  パス・HEAD・枝）が変わっていれば拒む。拒否の理由は盤面のファイルに書き、次の回の指示書の頭の 1 行がそのパスを名指す
  （$LOOP_PREV で貼らない。裁定 R44）。3 回とも拒まれたら輪を抜け（max_iterations で落とさない。裁定 R50）、collect が盤面を止める。
  出口 collect: {ok, plan_file, review_file, asks_human, gate_kinds, reads_file, gave_up, reason_file}。

inputs:
  judgment_file:
    required: true
    description: 受け付けた判定の置き場（ラインの口を他のブロックと揃える。スクリプトは読まない——判定は盤面が持ち、指示書に描かれる）
  base_rev:
    default: ""
    description: 周の頭で固めた版（ラインの口を揃える。スクリプトは読まない——読む版は盤面の inputs.review_rev）
  policy_paste:
    default: ""
    description: 人の方針の本文（ラインの口を揃える。読まない——方針は盤面の inputs.policy_md から指示書に描かれる）
  policy_path:
    default: ""
    description: 人の方針の文書の置き場（ラインの口を揃える。読まない——盤面の inputs.policy_md が正本）
  excluded_file:
    default: ""
    description: 並行 PR の外した範囲のファイル（無ければ空か文字列 null）。在れば 2 つの役の指示書の頭にパスを名指す
  include_id:
    default: planning
    description: ラインがこのブロックを include した id（読んだ証拠が Archon の出来事の節の名 <include>__<輪>.<役> を引くため）

returns: collect
outcome_field: ok

nodes:
  # 役を起こす前の作業ツリーの写し。p2.fix_plan が待っていなければ（直す物の無い判定）go: false で輪を飛ばす
  - id: plan-snap
    script: snap
    runtime: uv
    timeout: 1728000000
    with:
      role: plan
    output_format:
      type: object
      additionalProperties: false
      required: [ok, go, snapshot_file]
      properties:
        ok: {type: boolean}
        go: {type: boolean}
        snapshot_file: {type: string}

  # 修正案の出し直しの輪。拒否の後は新しい会話で、前の拒否の理由のファイルは plan-prep が指示書の頭で名指す（裁定 R44）。
  # 3 回目の拒否で受け付けが done（give_up）を出して輪を抜ける（max_iterations で落とさない。裁定 R50）
  - id: plan-loop
    depends_on: [plan-snap]
    when: "$plan-snap.output.go == true"
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: test $plan-accept.output.done = true
      nodes:
        - id: plan-prep
          script: prep
          runtime: uv
          timeout: 1728000000
          with:
            role: plan
            excluded_file: $INPUTS.excluded_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, attempt, out_path, node, already]
            properties:
              prompt_file: {type: string}
              attempt: {type: integer}
              out_path: {type: string}
              node: {type: string}
              already: {type: boolean}
        - id: plan
          prompt: 指示書 `$plan-prep.output.prompt_file` を Read で読み、その指示に従え。返すのは指示書の JSON Schema に合う JSON だけ。
          depends_on: [plan-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # planblk.output_format("plan")（写しの p2.fix_plan の schema に印 works-node: plan）を貼った物（tests/test_blk_plan.py が一致を見る）
          output_format:
            description: 'works-node: plan'
            type: object
            additionalProperties: false
            required:
            - plan
            properties:
              plan:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - unit_keys
                  - approach
                  - adds
                  - removes
                  - shrink_first
                  - narrows
                  properties:
                    unit_keys:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                    approach:
                      type: string
                      minLength: 20
                    adds:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - kind
                        - name
                        - canonical
                        properties:
                          kind:
                            type: string
                            enum:
                            - function
                            - record_field
                            - guard
                            - prompt
                            - doc
                            - cli
                            - arm
                            - test
                            - config
                            - other
                          name:
                            type: string
                            minLength: 1
                          canonical:
                            type: string
                            minLength: 4
                    removes:
                      type: array
                      items:
                        type: string
                        minLength: 1
                    shrink_first:
                      type: string
                      minLength: 20
                    narrows:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - what
                        - why
                        properties:
                          what:
                            type: string
                            minLength: 4
                          why:
                            type: string
                            minLength: 10
        - id: plan-accept
          script: accept
          runtime: uv
          timeout: 1728000000
          depends_on: [plan]
          with:
            role: plan
            reply: {from: "$plan.output"}
          output_format:
            type: object
            required: [ok, done, give_up, reason_file]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              node: {type: string}
              ready: {type: array, items: {type: string}}
              asking: {type: boolean}
              halted: {type: boolean}
              out_file: {type: string}

  # 事前審査を起こす前の作業ツリーの写し。p2.plan_review が待っていなければ（修正案が 3 回とも拒まれた）go: false で輪を飛ばす
  - id: plan-review-snap
    script: snap
    runtime: uv
    timeout: 1728000000
    depends_on: [plan-snap, plan-loop]
    trigger_rule: none_failed_min_one_success
    with:
      role: plan-review
    output_format:
      type: object
      additionalProperties: false
      required: [ok, go, snapshot_file]
      properties:
        ok: {type: boolean}
        go: {type: boolean}
        snapshot_file: {type: string}

  - id: plan-review-loop
    depends_on: [plan-review-snap]
    when: "$plan-review-snap.output.go == true"
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: test $plan-review-accept.output.done = true
      nodes:
        - id: plan-review-prep
          script: prep
          runtime: uv
          timeout: 1728000000
          with:
            role: plan-review
            excluded_file: $INPUTS.excluded_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, attempt, out_path, node, already]
            properties:
              prompt_file: {type: string}
              attempt: {type: integer}
              out_path: {type: string}
              node: {type: string}
              already: {type: boolean}
        - id: plan-review
          prompt: 指示書 `$plan-review-prep.output.prompt_file` を Read で読み、その指示に従え。返すのは指示書の JSON Schema に合う JSON だけ。
          depends_on: [plan-review-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # planblk.output_format("plan-review")（写しの p2.plan_review の schema に印 works-node: plan-review）を貼った物
          output_format:
            description: 'works-node: plan-review'
            type: object
            additionalProperties: false
            required:
            - faces
            - shrink
            - reason
            properties:
              faces:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - key
                  - unit_keys
                  - kind
                  - where
                  - why
                  - severity
                  properties:
                    key:
                      type: string
                      minLength: 8
                    unit_keys:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                    kind:
                      type: string
                      enum:
                      - copy
                      - entrance
                      - contract_drift
                      - dead_path
                      - scope_creep
                      - regression
                      - policy
                      - precedent
                    where:
                      type: string
                      minLength: 4
                    why:
                      type: string
                      minLength: 20
                    severity:
                      type: string
                      enum:
                      - block
                      - suggest
                    no_add:
                      type: string
              shrink:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - key
                  - unit_keys
                  - alternative
                  - why
                  properties:
                    key:
                      type: string
                      minLength: 8
                    unit_keys:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                    alternative:
                      type: string
                      minLength: 20
                    why:
                      type: string
                      minLength: 20
              faces_none:
                type: string
              reason:
                type: string
                minLength: 20
        - id: plan-review-accept
          script: accept
          runtime: uv
          timeout: 1728000000
          depends_on: [plan-review]
          with:
            role: plan-review
            reply: {from: "$plan-review.output"}
          output_format:
            type: object
            required: [ok, done, give_up, reason_file]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              node: {type: string}
              ready: {type: array, items: {type: string}}
              asking: {type: boolean}
              halted: {type: boolean}
              out_file: {type: string}

  # 読んだ証拠（受け付けの条件にはしない。reads-plan-block.json に {役: reads-<役>.json}）
  - id: plan-reads
    script: reads
    runtime: uv
    timeout: 1728000000
    depends_on: [plan-review-snap, plan-review-loop]
    trigger_rule: none_failed_min_one_success
    with:
      include_id: $INPUTS.include_id
    output_format:
      type: object
      additionalProperties: false
      required: [ok, reads_file]
      properties:
        ok: {type: boolean}
        reads_file: {type: string}

  # 出口。役の節が待ったまま（3 回とも拒まれた）なら、最後の拒否の理由で盤面を止めて（by works:plan）ok: false・gave_up: true
  - id: collect
    script: collect
    runtime: uv
    timeout: 1728000000
    depends_on: [plan-reads]
    output_format:
      type: object
      additionalProperties: false
      required: [ok, plan_file, review_file, asks_human, gate_kinds, reads_file, gave_up, reason_file]
      properties:
        ok: {type: boolean}
        plan_file: {type: string}
        review_file: {type: string}
        asks_human: {type: boolean}
        gate_kinds: {type: array, items: {type: string}}
        reads_file: {type: string}
        gave_up: {type: boolean}
        reason_file: {type: string}
