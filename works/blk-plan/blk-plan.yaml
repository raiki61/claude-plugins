name: blk-plan
description: |
  修正案と事前審査のブロック（P1 計画 Task 25。〔線A計〕T11）。判定の後、修正役が直す前に、役を 3 つ縦に回す（壁打ちの直しの役は下）:
  独立設計（写しの graph の r2.design。道具ゼロの blind-judge が目的と実測した制約・人の関所の答え・依頼が名指した設計書の節から理想解を作る。修正案を見ない）・
  修正案（p2.fix_plan）・判定をした役とは別の目の事前審査（p2.plan_review。指示書の頭に独立設計を貼り、案と設計の構造の
  食い違いを穴に挙げさせる）。独立設計は盤面の節がまだ待っていない（graph では修正の後）ので、受け付けた返答を盤面の根の
  design.json に控える（core の design）。設計が 3 回とも拒まれても止めず、事前審査は「設計が無い」と読んで進む。指示書は本線（graphloops a1202d0）の
  p2.fix_plan.md・p2.plan_review.md そのものを engine と同じ描き方で描いた物（<役>-prep が盤面の今の周の prompt-<節>.md に書く。
  P1-R10）。人の関所の項目（案の narrows・事前審査の後退と方針の穴・方針の文書の変化）は盤面の p2.human_gate が組み（決め手の出どころが在り
  undecided_because が空で柵の印の無い行は聞かずに通す。欄は受け付けが外して盤面の gate-marks.json に置く。gatemarks.py）、
  出口の asks_human・gate_kinds に出る（関所そのものはラインが開く）。検査の計画の欄は持たない（Phase 3）。
  壁打ち（依頼 231。core の converge）: 事前審査は外の輪 converge-loop の中に居る。事前審査が block（直しへ進めない穴）を挙げたら、
  直しの役（plan-revise。修正案の役の会話の続き continue=plan で、盤面の節は p2.fix_plan）に返して案を直させ、新しい会話の
  事前審査に掛け直す（輪の中の輪）。抜けるのは converge-check の done（block が無い・同じ block が続いた・柵の往復・役の諦め・
  盤面が止まった。外の輪も max_iterations で落とさない）。block が残ったまま止まった案は、ラインの修正前の関所が設計だけの行で止める。
  受け付けは写しの schema・post_check・記録の検査をそのまま当て、役を起こす前と後で作業ツリー（porcelain・差分・git が無視する
  パス・HEAD・枝）が変わっていれば拒む。拒否の理由は盤面のファイルに書き、次の回の指示書の頭の 1 行がそのパスを名指す
  （$LOOP_PREV で貼らない。裁定 R44）。3 回とも拒まれたら輪を抜け（max_iterations で落とさない。裁定 R50）、collect が盤面を止める。
  出口 collect: {ok, plan_file, review_file, asks_human, gate_kinds, reads_file, gave_up, reason_file}。

inputs:
  judgment_file:
    required: true
    description: 受け付けた判定の置き場（ラインの口を他のブロックと揃える。スクリプトは読まない——判定は盤面が持ち、指示書に描かれる）
  base_rev:
    default: ""
    description: 周の頭で固めた版（ラインの口を揃える。スクリプトは読まない——読む版は盤面の inputs.review_rev）
  policy_paste:
    default: ""
    description: 人の方針の本文（ラインの口を揃える。読まない——方針は盤面の inputs.policy_md から指示書に描かれる）
  policy_path:
    default: ""
    description: 人の方針の文書の置き場（ラインの口を揃える。読まない——盤面の inputs.policy_md が正本）
  excluded_file:
    default: ""
    description: 並行 PR の外した範囲のファイル（無ければ空か文字列 null）。在れば 2 つの役の指示書の頭にパスを名指す
  include_id:
    default: planning
    description: ラインがこのブロックを include した id（読んだ証拠が Archon の出来事の節の名 <include>__<輪>.<役> を引くため）

returns: collect
outcome_field: ok

nodes:
  # 独立設計（写しの graph の r2.design。役 blind-judge）を修正案より前に作る。盤面の節はまだ待っていない（graph の依存は p4.assemble の
  # 後）ので、受け付けた返答は盤面の根の design.json に控え、盤面が節を待った時にラインが渡す（core の design）。目的の出典が使えない・
  # もう控えが在る・諦めた run は go: false で輪を飛ばす。3 回とも拒まれても止めない（事前審査は設計なしで進む）
  - id: r2-design-snap
    script: snap
    runtime: uv
    timeout: 1728000000
    with:
      role: r2-design
    output_format:
      type: object
      additionalProperties: false
      required: [ok, go, snapshot_file]
      properties:
        ok: {type: boolean}
        go: {type: boolean}
        snapshot_file: {type: string}

  - id: r2-design-loop
    depends_on: [r2-design-snap]
    when: "$r2-design-snap.output.go == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: test $r2-design-accept.output.done = true   # 通った時か、3 回目の拒否で諦めた時（max_iterations で落とさない）
      nodes:
        - id: r2-design-prep
          script: prep
          runtime: uv
          timeout: 1728000000
          with:
            role: r2-design
            excluded_file: $INPUTS.excluded_file
          output_format:
            type: object
            additionalProperties: false
            required:
            - prompt
            - prompt_file
            - node
            - attempt
            - already
            - role_def
            - role_def_missing
            properties:
              prompt:
                type: string
              prompt_file:
                type: string
              node:
                type: string
              attempt:
                type: integer
              already:
                type: boolean
              role_def:
                type: string
              role_def_missing:
                type: string
        - id: r2-design
          model: opus                 # 役 blind-judge の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
          effort: high                # 役 blind-judge の前付けの effort（段は前付けを読まない。tests/test_tool_parity.py の RoleModelCase が縛る）
          command: r2-design
          depends_on: [r2-design-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: []   # 道具ゼロ（graphloops の blind-judge の定義）。包みが旗 isolated を見て Git の外の置き場で起こす（git status が入らない）
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # planblk.output_format("r2-design")（写しの r2.design の schema に印 works-node: r2-design isolated）を貼った物（tests/test_blk_plan.py が一致を見る）
          output_format:
            description: 'works-node: r2-design isolated'
            type: object
            required:
            - question_stands
            - reason
            - design
            additionalProperties: false
            properties:
              question_stands:
                type: boolean
              reason:
                type: string
                minLength: 1
              premise_invalid_reason:
                type: string
              design:
                type: string
        - id: r2-design-accept
          script: accept
          runtime: uv
          timeout: 1728000000
          depends_on: [r2-design]
          with:
            role: r2-design
            reply: {from: "$r2-design.output"}
          output_format:
            type: object
            additionalProperties: false
            required:
            - ok
            - done
            - give_up
            - skipped
            - reason
            - node
            - reason_file
            properties:
              ok:
                type: boolean
              done:
                type: boolean
              give_up:
                type: boolean
              skipped:
                type: boolean
              reason:
                type: string
              node:
                type: string
              reason_file:
                type: string

  # 役を起こす前の作業ツリーの写し。p2.fix_plan が待っていなければ（直す物の無い判定）go: false で輪を飛ばす
  - id: plan-snap
    script: snap
    runtime: uv
    timeout: 1728000000
    depends_on: [r2-design-snap, r2-design-loop]
    trigger_rule: none_failed_min_one_success
    with:
      role: plan
    output_format:
      type: object
      additionalProperties: false
      required: [ok, go, snapshot_file]
      properties:
        ok: {type: boolean}
        go: {type: boolean}
        snapshot_file: {type: string}

  # 修正案の出し直しの輪。拒否の後は新しい会話で、前の拒否の理由のファイルは plan-prep が指示書の頭で名指す（裁定 R44）。
  # 3 回目の拒否で受け付けが done（give_up）を出して輪を抜ける（max_iterations で落とさない。裁定 R50）
  - id: plan-loop
    depends_on: [plan-snap]
    when: "$plan-snap.output.go == true"
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: test $plan-accept.output.done = true
      nodes:
        - id: plan-prep
          script: prep
          runtime: uv
          timeout: 1728000000
          with:
            role: plan
            excluded_file: $INPUTS.excluded_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file, attempt, out_path, node, already]
            properties:
              prompt_file: {type: string}
              attempt: {type: integer}
              out_path: {type: string}
              node: {type: string}
              already: {type: boolean}
        - id: plan
          prompt: 指示書 `$plan-prep.output.prompt_file` を Read で読み、その指示に従え。返すのは指示書の JSON Schema に合う JSON だけ。
          depends_on: [plan-prep]
          settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          # planblk.output_format("plan")（写しの p2.fix_plan の schema に印 works-node: plan）を貼った物。番号の欄は番号でも返せる（tests/test_blk_plan.py が一致を見る）
          output_format:
            description: 'works-node: plan'
            type: object
            additionalProperties: false
            required:
            - plan
            properties:
              plan: &plan_field   # 直しの役 plan-revise の plan の欄も同じ型（*plan_field）
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - unit_keys
                  - approach
                  - adds
                  - removes
                  - shrink_first
                  - narrows
                  - route
                  - tests
                  - rewrite_tests
                  - refactor
                  - allowed_paths
                  - out_of_scope
                  properties:
                    unit_keys:
                      type: array
                      minItems: 1
                      items:
                        type: [integer, string]
                        minLength: 1
                        minimum: 1
                    approach:
                      type: string
                      minLength: 20
                    adds:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - kind
                        - name
                        - canonical
                        properties:
                          kind:
                            type: string
                            enum:
                            - function
                            - record_field
                            - guard
                            - prompt
                            - doc
                            - cli
                            - arm
                            - test
                            - config
                            - other
                          name:
                            type: string
                            minLength: 1
                          canonical:
                            type: string
                            minLength: 4
                    removes:
                      type: array
                      items:
                        type: string
                        minLength: 1
                    shrink_first:
                      type: string
                      minLength: 20
                    narrows:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - what
                        - why
                        - no_narrow
                        properties:
                          what:
                            type: string
                            minLength: 4
                          why:
                            type: string
                            minLength: 10
                          decided_by:
                            type: string
                          undecided_because:
                            type: string
                          fences:
                            type: array
                            uniqueItems: true
                            items:
                              type: string
                              enum:
                              - external_write
                              - irreversible
                              - policy_doc
                              - widen_protection
                              - web_doubt
                          world:
                            type: string
                          no_narrow:
                            type: string
                            minLength: 20
                    route:
                      type: string
                      enum:
                      - tdd
                      - direct
                    route_why:
                      type: string
                    tests:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - behavior
                        - path
                        - red_kind
                        - red_why
                        properties:
                          id:
                            type: string
                            pattern: '::'
                          behavior:
                            type: string
                            minLength: 10
                          path:
                            type: string
                            minLength: 10
                          red_kind:
                            type: string
                            enum:
                            - assertion
                            - exception
                          red_why:
                            type: string
                            minLength: 10
                    rewrite_tests:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - behavior
                        - old
                        - new
                        properties:
                          id:
                            type: string
                            pattern: '::'
                          behavior:
                            type: string
                            minLength: 10
                          old:
                            type: string
                            minLength: 4
                          new:
                            type: string
                            minLength: 10
                    refactor:
                      type: object
                      additionalProperties: false
                      required:
                      - declared
                      - why
                      properties:
                        declared:
                          type: boolean
                        why:
                          type: string
                    allowed_paths:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                    out_of_scope:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - glob
                        - why
                        properties:
                          glob:
                            type: string
                            minLength: 1
                          why:
                            type: string
                            minLength: 10
        - id: plan-accept
          script: accept
          runtime: uv
          timeout: 1728000000
          depends_on: [plan]
          with:
            role: plan
            reply: {from: "$plan.output"}
          output_format:
            type: object
            required: [ok, done, give_up, reason_file]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              node: {type: string}
              ready: {type: array, items: {type: string}}
              asking: {type: boolean}
              halted: {type: boolean}
              out_file: {type: string}

  # 壁打ち: 事前審査が block を挙げたら修正案の役に同じ会話で返して直させ、新しい会話で審査し直す（依頼 231。core の converge）。
  # 抜けるのは converge-check の done（block が無い・同じ block が続いた・柵の往復・役の諦め・盤面が止まった）。max_iterations で
  # 落とさない（R50）。独立設計と最初の修正案はこの輪の外で先に 1 度だけ回る（独立設計は案を見ない）
  - id: converge-loop
    depends_on: [plan-snap, plan-loop]
    trigger_rule: none_failed_min_one_success
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: test $converge-check.output.done = true
      nodes:
        # 直しの役を起こす前の作業ツリーの写し。壁打ちの控えの抜け方が again で p2.fix_plan が待つ時だけ go: true（1 周目は
        # 返した block がまだ無いので go: false で直しの輪を飛ばし、最初の修正案をそのまま審査する）
        - id: plan-revise-snap
          script: snap
          runtime: uv
          timeout: 1728000000
          with:
            role: plan-revise
          output_format:
            type: object
            additionalProperties: false
            required: [ok, go, snapshot_file]
            properties:
              ok: {type: boolean}
              go: {type: boolean}
              snapshot_file: {type: string}

        # 直しの輪。出し直しも修正案の役の会話に積む（fresh_context: false・印 continue=plan。会話を継ぐのは包みで、節に context は
        # 書かない）。3 回目の拒否で受け付けが done（give_up）を出して輪を抜ける（R50）
        - id: plan-revise-loop
          depends_on: [plan-revise-snap]
          when: "$plan-revise-snap.output.go == true"
          loop_group:
            max_iterations: 3
            fresh_context: false
            until_bash: test $plan-revise-accept.output.done = true
            nodes:
              - id: plan-revise-prep
                script: prep
                runtime: uv
                timeout: 1728000000
                with:
                  role: plan-revise
                  excluded_file: $INPUTS.excluded_file
                output_format:
                  type: object
                  additionalProperties: false
                  required: [prompt_file, attempt, out_path, node, already]
                  properties:
                    prompt_file: {type: string}
                    attempt: {type: integer}
                    out_path: {type: string}
                    node: {type: string}
                    already: {type: boolean}
              - id: plan-revise
                prompt: 指示書 `$plan-revise-prep.output.prompt_file` を Read で読み、その指示に従え。返すのは指示書の JSON Schema に合う JSON だけ。
                depends_on: [plan-revise-prep]
                settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
                allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]   # 修正案の役と同じ
                mutates_checkout: false
                sandbox: {enabled: true, allowUnsandboxedCommands: false}
                idle_timeout: 1728000000
                # planblk.output_format("plan-revise")（写しの p2.fix_plan の schema に、返した block への答えの欄 block_answers
                # （converge.with_fields）と印 works-node: plan-revise continue=plan を足した物）を貼った物
                output_format:
                  description: 'works-node: plan-revise continue=plan'
                  type: object
                  additionalProperties: false
                  required:
                  - plan
                  - block_answers
                  properties:
                    plan: *plan_field
                    block_answers:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - key
                        - handled
                        - how
                        properties:
                          key:
                            type: string
                            minLength: 8
                          handled:
                            type: string
                            enum:
                            - fixed
                            - disputed
                          how:
                            type: string
                            minLength: 10
              - id: plan-revise-accept
                script: accept
                runtime: uv
                timeout: 1728000000
                depends_on: [plan-revise]
                with:
                  role: plan-revise
                  reply: {from: "$plan-revise.output"}
                output_format:
                  type: object
                  required: [ok, done, give_up, reason_file]
                  properties:
                    ok: {type: boolean}
                    done: {type: boolean}
                    give_up: {type: boolean}
                    reason: {type: string}
                    reason_file: {type: string}
                    node: {type: string}
                    ready: {type: array, items: {type: string}}
                    asking: {type: boolean}
                    halted: {type: boolean}
                    out_file: {type: string}

        # 事前審査を起こす前の作業ツリーの写し。p2.plan_review が待っていなければ（修正案か直しが 3 回とも拒まれた）go: false で輪を飛ばす
        - id: plan-review-snap
          script: snap
          runtime: uv
          timeout: 1728000000
          depends_on: [plan-revise-snap, plan-revise-loop]
          trigger_rule: none_failed_min_one_success
          with:
            role: plan-review
          output_format:
            type: object
            additionalProperties: false
            required: [ok, go, snapshot_file]
            properties:
              ok: {type: boolean}
              go: {type: boolean}
              snapshot_file: {type: string}

        - id: plan-review-loop
          depends_on: [plan-review-snap]
          when: "$plan-review-snap.output.go == true"
          loop_group:
            max_iterations: 3
            fresh_context: true
            until_bash: test $plan-review-accept.output.done = true
            nodes:
              - id: plan-review-prep
                script: prep
                runtime: uv
                timeout: 1728000000
                with:
                  role: plan-review
                  excluded_file: $INPUTS.excluded_file
                output_format:
                  type: object
                  additionalProperties: false
                  required: [prompt_file, attempt, out_path, node, already]
                  properties:
                    prompt_file: {type: string}
                    attempt: {type: integer}
                    out_path: {type: string}
                    node: {type: string}
                    already: {type: boolean}
              - id: plan-review
                model: opus                 # 役 judge の前付けの model（tests/test_tool_parity.py の RoleModelCase が縛る）
                effort: high                # 役 judge の前付けの effort（段は前付けを読まない。tests/test_tool_parity.py の RoleModelCase が縛る）
                prompt: 指示書 `$plan-review-prep.output.prompt_file` を Read で読み、その指示に従え。返すのは指示書の JSON Schema に合う JSON だけ。
                depends_on: [plan-review-prep]
                settingSources: [user]      # 選んだ物だけの隔離した設定（dev/toolset.py）を読む。対象の CLAUDE.md は読ませない（JSON だけを返す約束）
                allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
                mutates_checkout: false
                sandbox: {enabled: true, allowUnsandboxedCommands: false}
                idle_timeout: 1728000000
                # planblk.output_format("plan-review")（写しの p2.plan_review の schema に印 works-node: plan-review と、壁打ちの任意の欄
                # resolved（前の往復の block のうち消えた key。converge.with_fields）を足した物）を貼った物
                output_format:
                  description: 'works-node: plan-review'
                  type: object
                  additionalProperties: false
                  required:
                  - faces
                  - shrink
                  - reason
                  properties:
                    faces:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - key
                        - unit_keys
                        - kind
                        - where
                        - why
                        - severity
                        properties:
                          key:
                            type: string
                            minLength: 8
                          unit_keys:
                            type: array
                            minItems: 1
                            items:
                              type: [integer, string]
                              minLength: 1
                              minimum: 1
                          kind:
                            type: string
                            enum:
                            - copy
                            - entrance
                            - contract_drift
                            - dead_path
                            - scope_creep
                            - regression
                            - policy
                            - precedent
                          where:
                            type: string
                            minLength: 4
                          why:
                            type: string
                            minLength: 20
                          severity:
                            type: string
                            enum:
                            - block
                            - suggest
                          no_add:
                            type: string
                          decided_by:
                            type: string
                          undecided_because:
                            type: string
                          fences:
                            type: array
                            uniqueItems: true
                            items:
                              type: string
                              enum:
                              - external_write
                              - irreversible
                              - policy_doc
                              - widen_protection
                              - web_doubt
                          world:
                            type: string
                          no_narrow:
                            type: string
                            minLength: 20
                    shrink:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - key
                        - unit_keys
                        - alternative
                        - why
                        properties:
                          key:
                            type: string
                            minLength: 8
                          unit_keys:
                            type: array
                            minItems: 1
                            items:
                              type: [integer, string]
                              minLength: 1
                              minimum: 1
                          alternative:
                            type: string
                            minLength: 20
                          why:
                            type: string
                            minLength: 20
                    faces_none:
                      type: string
                    reason:
                      type: string
                      minLength: 20
                    resolved:
                      type: array
                      items:
                        type: string
              - id: plan-review-accept
                script: accept
                runtime: uv
                timeout: 1728000000
                depends_on: [plan-review]
                with:
                  role: plan-review
                  reply: {from: "$plan-review.output"}
                output_format:
                  type: object
                  required: [ok, done, give_up, reason_file]
                  properties:
                    ok: {type: boolean}
                    done: {type: boolean}
                    give_up: {type: boolean}
                    reason: {type: string}
                    reason_file: {type: string}
                    node: {type: string}
                    ready: {type: array, items: {type: string}}
                    asking: {type: boolean}
                    halted: {type: boolean}
                    out_file: {type: string}

        # 壁打ちの出口。抜け方が again でない・今の往復の役が諦めた・盤面が止まった時に done（外の輪の until_bash が読む）
        - id: converge-check
          script: converge
          runtime: uv
          timeout: 1728000000
          depends_on: [plan-review-snap, plan-review-loop]
          trigger_rule: none_failed_min_one_success
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, outcome, record_file]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              outcome: {type: string}
              record_file: {type: string}

  # 読んだ証拠（受け付けの条件にはしない。reads-plan-block.json に {役: reads-<役>.json}。直しの役は起きた周だけ）
  - id: plan-reads
    script: reads
    runtime: uv
    timeout: 1728000000
    depends_on: [converge-loop]
    trigger_rule: none_failed_min_one_success
    with:
      include_id: $INPUTS.include_id
    output_format:
      type: object
      additionalProperties: false
      required: [ok, reads_file]
      properties:
        ok: {type: boolean}
        reads_file: {type: string}

  # 出口。役の節が待ったまま（3 回とも拒まれた）なら、最後の拒否の理由で盤面を止めて（by works:plan）ok: false・gave_up: true
  - id: collect
    script: collect
    runtime: uv
    timeout: 1728000000
    depends_on: [plan-reads]
    output_format:
      type: object
      additionalProperties: false
      required: [ok, plan_file, review_file, asks_human, gate_kinds, reads_file, gave_up, reason_file]
      properties:
        ok: {type: boolean}
        plan_file: {type: string}
        review_file: {type: string}
        asks_human: {type: boolean}
        gate_kinds: {type: array, items: {type: string}}
        reads_file: {type: string}
        gave_up: {type: boolean}
        reason_file: {type: string}
