# 部署の成果を本流に入れる決まり（works-dispatch の --land）。持ち主の方針（2026-10-16）: CI は待たない。
# 関門は部署が手元で回した、触ったプラグインの試験で、ここでは写しの一致だけを機械で確かめる。版は取り込むときに上げる
[land]
mode = "ff-after-ci"
gate = "check"
check = "python3 scripts/shared-copies.py"
bump = "marketplace"

# 組織の決まり（この会社の作り方。スキルの決まりではない）
# - 呼び名: 持ち主を社長と見立てる。持ち主と話して各社の部に頼む会話は社長室（前の呼び名は窓口）。
#   部（総務部・審査部・技術部・秘書室・広報部・品質保証部）は受け持ち（プラグインかフォルダ）ごとの常設の部署で、役職は 2 つ。
#   管理者は各部に常設で 1 人いて、頼みを受け、自分で進めるか、並べたいときは作業者に頼む。作業者は一度きりの作業をする一時の人。
#   役の名前は「<部>の管理者」と「作業者」にし、宛先（--ask claude-plugins/<役>）で部と役職が分かるようにする。
# - 管理者と作業者: 管理者の部署は --resident で立て、片付けで畳まれず、次の頼みを同じ会話で受ける。
#   同じ受け持ちの直しは部の中で順番に進むので、同じファイルの取り合いにならない。作業者は一時の部署で、頼みごとに立って入れたら畳まれる。
#   作業者を使うのは、受け持ちの無い一度きりの作業（根の scripts/・tests/・.github/ や会社の形など）と、管理者が並べて進めたいとき。
#   管理者がまだ立っていないときに役で頼む（--ask claude-plugins/<部>の管理者）なら、--task <部署の名前> --branch <枝> に --resident を添える（添えないと都度の部署が立ち、次の頼みがその部署を見つけない）。
#   作業者を --task で直に立てるときは --role 作業者 を添える（省くと works-dispatch の既定の役「作業役」になり、作業者の本文と設定が効かない。--ask claude-plugins/作業者 なら役が渡る）。
#   設計は docs/specs/2026-10-16-company-shape-design.md の 4.12。
# - 部どうしの連携: 管理者は、ほかの部の管理者と作業者に頼む命令（--ask claude-plugins/<役>）で頼んでよい。頼んだ管理者が上役になり、納品はその管理者に返る。
# - works と works-factory は持ち主が別に自動で回している所なので、部を作らず、どの部も触らない。
# - 部署の名前（--task・--ask に渡す名前。会話・herdr のペインの名前になる）は、会社＋部＋役職が分かる名前にし、作業者には作業の中身を括弧で添える
#   （例: 「claude-plugins総務部の管理者」「claude-plugins総務部の作業者（README の直し）」。社長室が部を通さずに頼む作業者は「claude-pluginsの作業者（CI の直し）」）。
#   社長室も会社が分かる名前にする（例: 「my_notes社長室」）。「社長室」だけでは、どの会社の社長室かが分からない。
# - 枝の名前は英小文字とハイフンにする（git と GitHub の URL で崩れないため）。直しは fix/…、足すものは feat/…、調べや下書きは work/…。
# - 社長室とのやり取りは頼む命令（--ask）と納品の命令（--deliver）。途中で頼みを変えるときは、部署の窓に直接話しかける。
