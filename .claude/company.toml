# 会社の形: このリポジトリで作業ごとの会話を立てるときの、役ごとの指示・起動の設定と gh のアカウント。
# 読むのは works-dispatch。書き方は works-dispatch/skills/dispatch/SKILL.md の「役の中身と起こし方」。
# 外す道具とプラグインは、持ち主のノートの測り（会話を起こしただけで読み込む量の内訳。2026-10-16）による。
# pr-review-toolkit は外さない。convergence-loops が依存に持ち、切ると convergence-loops も消える。

name = "claude-plugins"
description = "持ち主の Claude Code のプラグインと、それを配る marketplace"
gh_user = "raiki61"

default_role = "作業"   # --task で --role を省いたときの役

[[skills]]
id = "plugin-fix"
name = "一度きりの直し"
description = "受け持ちの無い一度きりの直しと、担当が並べて進めたい直しを、一時の作業の部署で受ける"
role = "作業"

[[skills]]
id = "dispatch"
name = "割り振り"
description = "works-dispatch と tiers の直し（部署の立て方・頼みと納品・本流に入れる命令と、道具の点検）"
role = "担当"

[[skills]]
id = "gates"
name = "点検"
description = "gates の直し（書き込み前の関門・初見読みなど）と、CI・根の tests/ の直し"
role = "担当"

[[skills]]
id = "convergence"
name = "見直し"
description = "convergence-loops と graphloops の直し（レビュー・調べ・初見読みなどの収束の工程と、そのグラフ）"
role = "担当"

[[skills]]
id = "attention"
name = "見渡し"
description = "attention の直し（自分の番の PR の見渡しと /catchup）"
role = "担当"

[[skills]]
id = "docs"
name = "説明書"
description = "プラグインをまたぐ文書（根の README・CLAUDE.md・CONTRIBUTING.md・docs/。docs/trials/ は除く）と、会社の形（.claude/company.toml と設計の docs/specs/2026-10-16-company-shape-design.md）の直し。会社の形の中身を決めるのは持ち主と窓口で、説明書は書く"
role = "担当"

[[skills]]
id = "trials"
name = "試し"
description = "まっさらな環境・Windows・Linux（Colima の Docker）でプラグインを入れて試し、詰まりを docs/trials/ に記録する"
role = "担当"

# 担当: 受け持ちごとに常設で 1 つ（resident = true なので、--resident を付けなくても常駐の部署で立つ）。受け持ちは部署の名前で決まる
[[roles]]
name = "担当"
resident = true
instructions = "受け持ちを常設で預かる。自分の受け持ちは作業場の名前（部署の名前）で決まり、その中身は会話の始まりに足される。境目: プラグインのフォルダの中（README・tests など）はそのプラグインの担当の物。works と works-factory は誰の受け持ちでもなく、触らない。試しの担当はプラグインを直さず、直しはその受け持ちの担当に頼む。頼みを受け、自分で進めるか、並べたいときは作業に頼む（--ask claude-plugins/作業 に --task <受け持ち>：<何をするか> --branch <枝> を添える）。常設なので、作業場は同じまま、頼みごとに git fetch origin してから origin/main から決まりどおりの名前の枝を切って作業する。済んだら、自分で works-dispatch の本流に入れる命令（--land <自分の部署の名前>）を打つ。本流が先に進んでいて止まったら、自分で origin/main の上に載せ直して push し、打ち直す。入ったら納品の命令で返す。版は上げない・CI は待たない・試験は触ったプラグインの物だけ。納品の後は commit しない（初見読みの指摘は入れる前に直す）。納品の後に窓口や持ち主の判断が要ることが出たら（手元に残った変更の扱い・次の頼みの候補など）、画面に書いて止まらず、もう一度納品の命令（--deliver）で返す（画面にだけ書いた問いは窓口に届かない）。受け持ちの外のファイルを変える必要が出たら、その受け持ちの担当に部署の名前で頼む（--ask <受け持ち>）。受け持ちの無いファイル（根の scripts/ など）は作業に頼む。"
[roles.settings]
permissions = { deny = ["Artifact", "Workflow", "ScheduleWakeup", "SendFeedback", "ReportFindings"] }
enabledPlugins = { "superpowers@superpowers-marketplace" = false, "attention@raiki61" = false, "graphloops@raiki61" = false, "works@raiki61" = false, "works-factory@raiki61" = false, "document-skills@anthropic-agent-skills" = false }
skillOverrides = { dataviz = "off" }

# 作業: 一度きりの作業をする一時の部署。頼みごとに立ち、本流に入れたら畳まれる
[[roles]]
name = "作業"
instructions = "頼まれたプラグインを直す。試験は触ったプラグインの物だけを回し、CI は待たない。版は上げない（本流に入れる命令が上げる）。済んだら、自分で works-dispatch の本流に入れる命令（--land <自分の部署の名前>）を打つ。本流が先に進んでいて止まったら、自分で origin/main の上に載せ直して push し、打ち直す。入ったら納品の命令で返す。納品の後は commit しない（初見読みの指摘は入れる前に直す）。納品の後に窓口や持ち主の判断が要ることが出たら（手元に残った変更の扱い・次の頼みの候補など）、画面に書いて止まらず、もう一度納品の命令（--deliver）で返す（画面にだけ書いた問いは窓口に届かない）。"
[roles.settings]
permissions = { deny = ["Artifact", "Workflow", "ScheduleWakeup", "SendFeedback", "ReportFindings"] }
enabledPlugins = { "superpowers@superpowers-marketplace" = false, "attention@raiki61" = false, "graphloops@raiki61" = false, "works@raiki61" = false, "works-factory@raiki61" = false, "document-skills@anthropic-agent-skills" = false }
skillOverrides = { dataviz = "off" }

# 部署の成果を本流に入れる決まり（works-dispatch の --land）。持ち主の方針（2026-10-16）: CI は待たない。
# 関門は部署が手元で回した、触ったプラグインの試験で、ここでは写しの一致だけを機械で確かめる。版は取り込むときに上げる
[land]
mode = "ff-after-ci"
gate = "check"
check = "python3 scripts/shared-copies.py"
bump = "marketplace"

# 組織の決まり（この会社の作り方。スキルの決まりではない）
# - 名前は日本語の短い言葉にする（英語や会社らしい呼び名にしない。持ち主 2026-10-16「会社っぽくなくていい」「日本語で」）。
#   herdr のサイドバーには、作業場の木（親＝リポジトリ、子＝worktree）と、会話の行（作業場の名前・役・枝）が出る。
#   会社の名前は親の作業場にだけ出るので、部署の名前（--task・--ask に渡す名前。作業場・会話の名前になる）に会社を付けない。
# - 役は 4 つ: 窓口（持ち主と話す本社の会話。役の項目は要らない）・担当（受け持ちに常設）・作業（一度きり）・相談（この会社の形には置かない）。
# - 担当: 受け持ちごとに 1 つ。部署の名前を受け持ちの名前にし、自分の受け持ちはその名前で決まる。
#   受け持ちの表は [[skills]] の 1 か所に置く（name が部署の名前、description が中身。works-dispatch の役を足すフックが、
#   部署の名前と同じ name の description を会話の始まりに足す）。役の本文と、このコメントに写さない。
#   試しの担当はプラグインを直さず、直しはその受け持ちの担当に頼む。
#   プラグインのフォルダの中（README・tests など）は、そのプラグインの担当の物。
#   works と works-factory は持ち主が別に回している所なので、受け持ちを作らず、どの担当も触らない。
#   担当への頼みは部署の名前で宛てる（--ask 割り振り。works-dispatch は部署の名前を役より先に当てる。
#   別の会社に同じ名前の部署が有れば --ask claude-plugins/割り振り）。担当は 1 つの会社に幾つも有るので、役（--ask claude-plugins/担当）では宛てない。
#   担当がまだ居ない受け持ちは --task <受け持ち> --branch work/<英小文字> --role 担当 --resident で立てる。
#   担当の部署は片付けで畳まれず、次の頼みを同じ会話で受ける。同じ受け持ちの直しは担当の中で順番に進むので、同じファイルの取り合いにならない。
# - 作業: 頼みごとに立って入れたら畳まれる一時の部署。受け持ちの無い一度きりの作業（根の scripts/ など。CI と根の tests/ は点検、会社の形は説明書の受け持ち）と、
#   担当が並べて進めたいとき（触るファイルが重ならない作業に限る）に使う。--ask claude-plugins/作業 に --task <名前> --branch <枝> を添えるか、
#   --task で直に立てる（--role を省けば default_role の作業になる）。
#   名前は「<受け持ち>：<何をするか>」（例: 「点検：文書の環境変数」）。作業場の名前になるので 12 字くらいまで。受け持ちの無い作業は何をするかだけでよい。
# - 担当どうしの連携: 担当は、ほかの担当と作業に頼む命令（--ask）で頼んでよい。頼んだ担当が頼み元になり、納品はその担当に返る。
# - 枝の名前は英小文字とハイフンにする（git と GitHub の URL で崩れないため）。直しは fix/…、足すものは feat/…、調べや下書きは work/…。
# - 窓口とのやり取りは頼む命令（--ask）と納品の命令（--deliver）。途中で頼みを変えるときは、部署の窓に直接話しかける。
# - 設計は docs/specs/2026-10-16-company-shape-design.md の 4.12。
