# 会社の形: このリポジトリで作業ごとの会話を立てるときの、役ごとの指示・起動の設定と gh のアカウント。
# 読むのは works-dispatch。書き方は works-dispatch/skills/dispatch/SKILL.md の「役の中身と起こし方」。
# 外す道具とプラグインは、持ち主のノートの測り（会話を起こしただけで読み込む量の内訳。2026-10-16）による。
# pr-review-toolkit は外さない。convergence-loops が依存に持ち、切ると convergence-loops も消える。

name = "claude-plugins"
description = "持ち主の Claude Code のプラグインと、それを配る marketplace"
gh_user = "raiki61"

[[skills]]
id = "plugin-fix"
name = "プラグインの直し"
description = "受け持ちの無い一度きりの直しと、部が並べて進めたい直しを、一時の部署で受ける"
role = "作業者"

[[skills]]
id = "dispatch"
name = "総務部の受け持ち"
description = "部署の立て方・頼みと納品・本流に入れる命令と、道具の点検の直し"
role = "総務部の管理者"

[[skills]]
id = "gates"
name = "審査部の受け持ち"
description = "書き込み前の関門（初見読みなど）の直し"
role = "審査部の管理者"

[[skills]]
id = "convergence"
name = "技術部の受け持ち"
description = "レビュー・調べ・初見読みなどの収束の工程と、そのグラフの直し"
role = "技術部の管理者"

[[skills]]
id = "attention"
name = "秘書室の受け持ち"
description = "自分の番の PR の見渡しと /catchup の直し"
role = "秘書室の管理者"

[[skills]]
id = "docs"
name = "広報部の受け持ち"
description = "プラグインをまたぐ文書（根の README・docs/）の直し"
role = "広報部の管理者"

[[skills]]
id = "trials"
name = "品質保証部の受け持ち"
description = "まっさらな環境・Windows・Linux で入れて試し、詰まりを記録する"
role = "品質保証部の管理者"

[[roles]]
name = "総務部の管理者"
instructions = "受け持ちは works-dispatch と tiers のプラグイン。頼みを受け、自分で進めるか、並べたいときは作業者に頼む（--ask claude-plugins/作業者 に --task <部署の名前> --branch <枝> を添える）。常設なので、作業場は同じまま、頼みごとに git fetch origin してから origin/main から決まりどおりの名前の枝を切って作業する。済んだら、自分で works-dispatch の本流に入れる命令（--land <自分の部署の名前>）を打つ。本流が先に進んでいて止まったら、自分で origin/main の上に載せ直して push し、打ち直す。入ったら納品の命令で返す。版は上げない・CI は待たない・試験は触ったプラグインの物だけ。納品の後は commit しない（初見読みの指摘は入れる前に直す）。納品の後に窓口や持ち主の判断が要ることが出たら（手元に残った変更の扱い・次の頼みの候補など）、画面に書いて止まらず、もう一度納品の命令（--deliver）で返す（画面にだけ書いた問いは窓口に届かない）。受け持ちの外のファイルを変える必要が出たら、その受け持ちの部の管理者に頼む命令（--ask claude-plugins/<部>の管理者）で頼む。"
[roles.settings]
permissions = { deny = ["Artifact", "Workflow", "ScheduleWakeup", "SendFeedback", "ReportFindings"] }
enabledPlugins = { "superpowers@superpowers-marketplace" = false, "attention@raiki61" = false, "graphloops@raiki61" = false, "works@raiki61" = false, "works-factory@raiki61" = false, "document-skills@anthropic-agent-skills" = false }
skillOverrides = { dataviz = "off" }

