# 会社の形: このリポジトリで作業ごとの会話を立てるときの、役ごとの指示・起動の設定と gh のアカウント。
# 読むのは works-dispatch。書き方は works-dispatch/skills/dispatch/references/roles.md の「役の中身と起動方法」。
# 外すツールとプラグインは、持ち主のノートの測り（会話を起動しただけで読み込む量の内訳。2026-10-16）による。
# pr-review-toolkit は外さない。convergence-loops が依存に持ち、切ると convergence-loops も消える。
# AskUserQuestion と EnterWorktree も外す（割り振りの測り 2026-10-17。2 つで最初の要求が約 3k トークン減る）。部署の問いは納品で返す決まりで、画面で聞いても誰も答えない。
# 部署は dispatch が先に作った作業場で働くので、別の worktree に移るツールは要らない。
# pr-review-toolkit のサブエージェントも一覧から外さない（Agent(<名前>) の deny）。/review-loop が使う review-pr が 6 つとも呼ぶ。
# 長い文字列は """ で囲み、文の切れ目の行末に \ を置いて折る。行末の \ は改行と次の行の頭の空白を消すので、会話に入る字は 1 行で書いた時と同じ。

name = "claude-plugins"
description = "持ち主の Claude Code のプラグインと、それを配る marketplace"
gh_user = "raiki61"
# 窓口は本社（代表の clone ~/src/claude-plugins。main を出しておく）の会話で、役は下の [[roles]] の「窓口」（持ち主 2026-10-26「はい。窓口たてていいよ。mainに」）。
# 前は my_notes の司令塔が兼ねていた（業務改革の案 1-3、社長室の答え bce452）。司令塔はこれまでどおり、この会社の部署へ部署の名前で直に頼んでよい
desk_role = "窓口"   # --desk で --role を省いたときの役（本社の会話の役）
# 本社の会話が --desk で名付くまでの窓口。works-dispatch は本社に名付いた窓口が在ればそちらを先に引き、無いときだけこれを使う。
# 消すと、名付くまで会社の名前だけで宛てた頼み（--ask claude-plugins）が止まる（nodes/deliver.py の「窓口が名付けられていない」）
desk = "my_notes/司令塔"

default_role = "作業"   # --task で --role を省いたときの役

# 受け持ちごとの model・effort（2026-10-17。持ち主「雑用っぽい部署はsonnetでいい」「全部がopus highで都度も常設も動いてるのもあるのでは」）。
# 手元の測りでは決めず、公開の指針で決める（my_notes の AGENTS.md の「モデル」。仕事ごとの格と effort の成績・費用の目安は works-dispatch/skills/dispatch/references/models.md）。
# - 安いモデル（Sonnet）は、正確に言い表せる決まった仕事だけ（"Pick a smaller model when the work is routine."）。
# - プラグインのコードを直す受け持ちは Opus・high（"Long-horizon coding is where effort genuinely buys accuracy."）。
#   アカウントの既定は high（main・p1・p2）と medium（p3。Opus 5.5 の既定）で割れるので、high を書いてそろえる。
# - 文書と判断の受け持ちは Opus・medium（調べものと知識の仕事の計測で "medium matched the default's accuracy"。Fable 5 での測り。5.5 では未測定）。
#   原文の照合と規約の判断は能力の高い側のモデルに残し、下げるのは effort だけにする。
# - ただし model は受け持ちに書かず、役（担当・作業）のフィールドに model = "opus" と書く（受け持ちに model が無ければ役の値で起動する）。書かないと、
#   部署はアカウントの既定のモデル（/model で替わり、そのアカウントの新しい会話の既定として保存される）で起き、会社の形を読んでも決まらない。
#   書いた日（2026-10-18）は main・p1・p2・p3 の 4 アカウントの ~/.claude*/settings.json がどれも "model": "opus" で、動くモデルは変わらない。
#   ただし毎回クリアする部署は、起動したときの値と違うので、次の頼みの前に一度起動し直される。
#   my_notes の .claude/company.toml（my_notes の 4 役とも model = "opus"）と同じ書き方（受付 a41972）。
# 毎回クリアする担当は、次の頼みの前に新しい値で起動し直す。入れた後の外れは手元の測り（docs/model-replay.md）で見つけ、戻すのは my_notes の司令塔が持つ

# 永続の部署と、オンデマンド（頼まれたときだけ立てる）の部署（持ち主 2026-10-17「そうね。そうして」「作業量が増えたり依頼がふえたらスケール出来るようにね」。社長室の受付 813bb8）
# - 永続に残す: 仕組み（と、本社の窓口。my_notes の司令塔・調べもの・ノートの手入れは my_notes の会社の形）。
# - オンデマンド（on_demand = true）: 点検・見直し・見渡し・説明書・標準・業務改革・試し。--ask claude-plugins/<受け持ち> で、
#   その受け持ちの名前のエフェメラルの部署が立ち（ブランチは受付番号から作る）、納品して main に入れたら --done で畳まれる。受け持ちの範囲と、誰が触って
#   よいかの区切りは変えない。同じ受け持ちの部署は名前で 1 つに決まるので、立っている間の次の頼みはその部署の順番待ちに積まれる。
# - 増えたときの広げ方: 1 つの部署に頼みが重なったら、互いに関わらない仕事を作業（--task）に分けて並べる。読む量が多いだけの仕事は、
#   その会話の中でサブエージェントに分けて読ませる。アカウントは使用枠に空きのあるものを自動で選ぶ。
#   オンデマンドの受け持ちで、1 日 20 件を超える日が続くか、頼みの待ちの上位 1 割が 30 分を超えたら、業務改革が台帳から
#   数えて永続に上げる（on_demand を外す）。下回れば下げる。上げ下げは持ち主に問わず、my_notes の司令塔に報告だけする。20 件・30 分は 10-17 の
#   数から置いた目安で原典は無く、業務改革が次の回に測り直す。
[[skills]]
id = "plugin-fix"
name = "一度きりの直し"
description = "受け持ちの無い一度きりの直しと、担当が並べて進めたい直しを、一時の作業の部署で受ける"
role = "作業"

# 仕組み: 前の名前は「割り振り」（works-dispatch の働き「部署に仕事を割り振る」から付けた）。部署の名前としては「仕事を振り分ける所」と読め、
# 自分で直す中身と食い違うので、中身に合わせて替えた（持ち主 2026-10-24「割り振りって作業する場所じゃないよね」、業務改革の案 41106c-1 に「はい。」。
# 司令塔の受付 a18228）。振り分けは窓口の仕事で、この受け持ちは works-dispatch・tiers・rent-or-buy を自分で直す。id は替えない
[[skills]]
id = "dispatch"
name = "仕組み"
description = "works-dispatch・tiers・rent-or-buy の直し（部署の立て方・頼みと納品・main に入れるコマンドと、ツールの点検と、借りるか買うかの費用の判断の部品）"
role = "担当"
effort = "high"   # コード（works-dispatch の Python）

[[skills]]
id = "gates"
name = "点検"
on_demand = true   # オンデマンド（持ち主 2026-10-17 承認。受付 813bb8）
standing = false   # 前の版の works-dispatch が読むキー（on_demand と同じ意味）。前の版が使われなくなったら消す
description = "gates の直し（書き込み前のゲート・初見読みなど）と、CI・ルートの tests/ の直し"
role = "担当"
effort = "high"   # コード（gates のフック・CI・ルートの tests/）

[[skills]]
id = "convergence"
name = "見直し"
on_demand = true   # オンデマンド（持ち主 2026-10-17 承認。受付 813bb8）
standing = false   # 前の版の works-dispatch が読むキー（on_demand と同じ意味）。前の版が使われなくなったら消す
description = "convergence-loops と graphloops の直し（レビュー・調べ・初見読みなどの収束の工程と、そのグラフ）"
role = "担当"
effort = "high"   # コード（graphloops の Python とグラフ）と、レビューの工程の判断

[[skills]]
id = "attention"
name = "見渡し"
on_demand = true   # オンデマンド（持ち主 2026-10-17 承認。受付 813bb8）
standing = false   # 前の版の works-dispatch が読むキー（on_demand と同じ意味）。前の版が使われなくなったら消す
description = "attention の直し（自分の番の PR の見渡しと /catchup）"
role = "担当"
effort = "high"   # コード（attention の Python）

[[skills]]
id = "docs"
name = "説明書"
on_demand = true   # オンデマンド（持ち主 2026-10-17 承認。受付 813bb8）
standing = false   # 前の版の works-dispatch が読むキー（on_demand と同じ意味）。前の版が使われなくなったら消す
description = """\
プラグインをまたぐ文書（ルートの README・CLAUDE.md・CONTRIBUTING.md・docs/。docs/trials/・docs/standards/・docs/reform/ は除く）と、会社の形（.claude/company.toml と設計の docs/specs/2026-10-16-company-shape-design.md）の直し。\
会社の形の中身を決めるのは持ち主と窓口で、説明書は書く（業務改革の案から承認された組織の直しは、業務改革が自分で入れる）"""
role = "担当"
effort = "medium"   # 文書と会社の形を書く。原文の照合があるのでモデルは Opus のまま

[[skills]]
id = "standards"
name = "標準"
on_demand = true   # オンデマンド（持ち主 2026-10-17 承認。受付 813bb8）
standing = false   # 前の版の works-dispatch が読むキー（on_demand と同じ意味）。前の版が使われなくなったら消す
description = """\
プラグインをまたぐ標準（書き方・作りの揃え方）を docs/standards/ に作り、プラグインごとのずれを見つけて綺麗にし続ける。\
ずれの直しは各プラグインの担当に、標準を機械で守らせる検査（CI・ルートの tests/）は点検に、ルートの README・CLAUDE.md・CONTRIBUTING.md から標準を指す直しは説明書に頼む"""
role = "担当"
effort = "medium"   # 標準を書き、ずれを見つけて頼む。規約の判断なのでモデルは Opus のまま
# 起動方法: 持ち主が my_notes の司令塔から呼びたいときに --start claude-plugins/標準 の 1 行で起動する（every を書かないので周期では起きない。
# 持ち主 2026-10-17「一旦cronは不要で。役や部署として書いておき。呼び出したいときに呼び出せたらいいです」）。
# 返す先と起動してよい会話は、同じ形の my_notes の業務改革にそろえて司令塔。部署がまだ無ければこの名前で立ち、在れば順番待ちに積む。
[skills.start]
report_to = "my_notes/司令塔"
by = ["司令塔"]
text = """\
標準として、プラグインをまたぐ標準（docs/standards/。まだ無ければ作る所から）と各プラグインの今の作りを見比べ、\
ずれの大きい順に 1〜3 個を選んで片付けてください（プラグインの中の直しはその担当に頼む）。\
前の回からの続きは docs/standards/ から拾ってください。\
前提が違う・今は要らないと思ったら、作らずにそう返してください。"""

# 業務改革: claude-plugins の組織（部署・役・頼みの流れ）を外から点検し、案から、承認された直しを自分で入れて効いたかの報告までを通しでやる受け持ち（オンデマンド。上の段）。
# my_notes の業務改革（受付 4582e6）と同じ形にそろえる（持ち主 2026-10-17「claudepluginsにもつくってあげて。」受付 7f0b16）。
# 2 つが同じ物を重ねて点検しないよう、こちらは claude-plugins の組織だけを見る（my_notes の組織は my_notes の業務改革）。
# 一度きりでは案を返すと畳まれ、持ち主が呼び直さなければ誰も見届けない（持ち主 2026-10-17「業務改革部署がたちあがったのに、
# 割り振りにふってすぐclearされたら、最後まで面倒見ないかもしれない」「社長室を戦力換算しないで。組織でイメージして」）ので担当にする。
# 2026-10-17 の承認（813bb8）でオンデマンドの形にした後も、司令塔の答えを待つ間は、自分の出した頼みに返事が来ていなければ --done が断るので、畳まれずに見届ける。
# 会話は担当のまま fresh で、続きは改善の台帳と受付箱の台帳から読む。進め方は担当の本文でなく下の description に書く
# （受け持ちの中身は [[skills]] の 1 か所に置く決まりで、description は業務改革の部署にだけ足される）。
# 改善の台帳は docs/reform/ に置き、説明書の受け持ちから外す（試しの docs/trials/・標準の docs/standards/ と同じ切り方。
# 受付箱の .git/company/ は commit されず、案と承認と結果は持ち主の決めごとの記録なので残す）。
# 承認の問いは my_notes の司令塔へ頼み、直しの結果の報告は起動のきっかけになった頼みへの納品（--deliver --for）で司令塔に返す。承認された組織の直し（会社の形・設計の文書・ルートの CLAUDE.md の会社の決まり）は業務改革が自分で入れ、
# プラグインの直しが要る案だけ my_notes の司令塔へ頼む（部署へ配るのは司令塔。下の組織の決まりの「通し」）。
# 司令塔へ頼むコマンドは持ち主の判断が要る問いだけにする（持ち主 2026-10-17「へんじのいらないしらせは社長室にいらない」、my_notes の受付 20261017-072823-b538b0。
# my_notes の会社の形の業務改革と同じ形。my_notes で知らせの形の頼むコマンドを止めるフック tools/no_notice.py は claude-plugins の会話のコマンドを見ないので、ここは決まりの文で塞ぐ）。
# 起動方法は標準と同じく --start claude-plugins/業務改革 の 1 行で、every を書かない（持ち主 2026-10-17「一旦cronは不要で。…呼び出したいときに呼び出せたらいいです。」）。
[[skills]]
id = "reform"
name = "業務改革"
on_demand = true   # オンデマンド（持ち主 2026-10-17 承認。受付 813bb8）
standing = false   # 前の版の works-dispatch が読むキー（on_demand と同じ意味）。前の版が使われなくなったら消す
description = """\
claude-plugins の組織（会社の形 .claude/company.toml が表す部署・役・頼みの流れ）を外から点検し、改善の案から、承認された直しを自分で入れて、効いたかを my_notes の司令塔へ報告するまで通しでやる。\
受け持ちのファイルは改善の台帳（docs/reform/ledger.md）と、承認された直しが触る所（会社の形・設計の docs/specs/2026-10-16-company-shape-design.md・ルートの CLAUDE.md の会社の決まり）。my_notes の組織は my_notes の業務改革が見る。\
頼みも納品も届くたびに会話が空なので、まず改善の台帳と受付箱の台帳で、どの案がどこまで進んだかと、この会社の納品の残った疑問のうち担当者が業務改革への頼みの受付番号の物（後でしか測れない効き目など。--todo の続きに出る）を読み、点検で確かめる。台帳を書いたら commit して --land で入れる。\
オンデマンドの受け持ち（on_demand = true）の上げ下げも受け持つ: 1 日 20 件を超える日が続くか、頼みの待ちの上位 1 割が 30 分を超えた受け持ちは、受付箱の台帳から数えて会社の形の on_demand を外して永続に上げ、下回れば on_demand = true に下げる。上げ下げは持ち主に問わず、司令塔への報告にだけ書く（20 件・30 分は 10-17 の数から置いた目安なので、点検の回ごとに測り直す）。\
司令塔へ頼むコマンド（--ask my_notes/司令塔）で送るのは、持ち主の判断が要る問いだけにし、返事の要らない知らせ（入った・頼んだ・済んだ・測った）は送らず、問いにも添えない。\
進め方: 1. 起動されたら点検し、案を承認の問いとして司令塔に頼む（--ask my_notes/司令塔 --forward。案が幾つでも 1 つの問いにまとめ〔--forward は 1 回しか打てない〕、本文に「問い」と書く。起動のきっかけになった頼みはこれで閉じる）。案が無ければ、問わずに起動のきっかけになった頼みへの納品（--for を付けない --deliver）で閉じる。\
2. 司令塔の答え（納品。持ち主の言葉付き）が届いたら、台帳に承認を書き、採られた案の直しをこの会話で、届いたターンの中で入れ終える（直す → 検証 → --land）。\
入れる前に、書いた文脈を渡さずに立てた見直しの目（convergence-loops の inspector か初見の読み手）に直しを見せ、指摘を直す。\
プラグインの直しが要る案は、そのプラグインの担当に 1 つの会話で通しでやるよう司令塔に頼む（--ask my_notes/司令塔。元の受付番号と持ち主の言葉を添える）。会社の形の直しとプラグインの直しが引き合う案は割らず、全体をそのプラグインの担当 1 つに頼む。\
3. 入ったか（commit が main に在るか）と、その場で測れる分の効いたかを確かめて台帳に書き、司令塔に報告する。報告は司令塔が出した頼みの結果なので、頼むコマンドでなく、1 で回して閉じた頼み（この回を起動した頼み）への納品で返す（`--deliver <要約のファイル> --for <1 で司令塔に頼んだ問いの受付>`。その受付は、司令塔の答えの納品の頭の「受付 <番号>」に在り、--for は回した先の受付も引き当てる。決め手には直しの commit か台帳の GitHub の URL を書く。司令塔以外の中継は挟まない）。\
2 で司令塔に頼んだ分は、司令塔がその受付番号への納品で返してくるので、届いたら同じに確かめて報告する。\
すぐ測れない効き目は、次に起動された回に確かめ、前の回の問いの受付への納品（--for）で報告する（その回の問いには添えない）。持ち主が報告を見て直しを言えば、司令塔から頼みで届くので、2 から進めて納品で閉じる。"""
role = "担当"
effort = "medium"   # 台帳を読んで組織を点検し、案と報告を書く。判断なのでモデルは Opus のまま
[skills.start]
report_to = "my_notes/司令塔"
by = ["司令塔"]
text = """\
業務改革として、claude-plugins の部署の組織を外から点検し、改善点を大きい順に挙げてください。\
前提が違う、点検しない方がいい、と思ったら、そう返してください。\
材料: 頼みと納品は、この会社の代表の clone の .git/company/inbox/ と、my_notes の代表の clone の同じ所（ほかの会社から頼まれた分は頼み元の受付箱に入る。\
場所は dispatch.py --tree の会社の行）にあり、台帳は log.jsonl。claude-plugins の部署が宛先か頼み元の行を、前の回からの分だけ見る\
（前の回は、この会社の台帳の kind が start で skill が 業務改革 の行）。\
会社の形 .claude/company.toml の、誰が何を受け持ち、誰に頼み、誰に返すかも点検の対象にする。\
前の回までの案ごとの承認・頼んだ受付・入ったか・効いたかは改善の台帳 docs/reform/ledger.md（無ければこの回に作る）。\
見るもの: 役ごとのモデルと effort、部署の読み込み、使う量（測りが有れば使い、無ければ重ねて測らない）、順番待ちの長さ、頼みの流れの手数、\
異論と差し戻しの数、組織そのものへの仕事の割合、前の回の改善点が効いたか。\
改善点ごとに、回す先（部署）と、持ち主の判断が要るか（CLAUDE.md と company.toml の決まりで答えが出るか）と、確かめ方を書く。"""

# 試しは Opus で起動する（ほかの担当と同じく受け持ちには model を書かず、役「担当」の model = "opus" で起動する）。
# 一度 Sonnet にした（2026-10-17。持ち主「あと雑用っぽい部署はsonnetでいいとかね。」、根拠は "Pick a smaller model when the work is routine."）が、
# 「記録の漏れや誤りが増えたら Opus に戻す」と決めてあり、同じ日に戻した。2 回目の試しを Sonnet でやり直すと、
# Opus で回した前の記録の詰まりのうち、同じ条件で起こりうる 10 件で、見落とし 2 件・一部だけ書いた 1 件が出た（数え方は docs/trials/2026-10-17-sonnet-replay.md）。
# 1 回だけなので、Sonnet のせいか回ごとのばらつきかは分けていない。それでも決まりどおり戻し、もう 1 回回して確かめることはしない
# （my_notes の段取りの頼み 20261017-091106-9b6d67）。
[[skills]]
id = "trials"
name = "試し"
on_demand = true   # オンデマンド（持ち主 2026-10-17 承認。受付 813bb8）
standing = false   # 前の版の works-dispatch が読むキー（on_demand と同じ意味）。前の版が使われなくなったら消す
description = "まっさらな環境・Windows・Linux（Colima の Docker）でプラグインを入れて試し、詰まりを docs/trials/ に記録する"
role = "担当"
effort = "high"   # 長い手順で入れて動かし、見たことを漏らさず記録する仕事なので下げない

# 担当: 受け持ちごとに 1 つ（persistent = true なので、--persistent を付けなくても永続の部署で立つ。受け持ちが on_demand = true ならエフェメラルの部署で立つ）。受け持ちは部署の名前で決まる
# fresh = true で、頼みごとに空の会話で受ける（永続・毎回クリア。持ち主の決め 2026-10-17「担当＝常設・毎回空」。--ask が前の頼みを納品し終えた担当に /clear を打ってから頼む）
[[roles]]
name = "担当"
model = "opus"   # 理由は頭の「受け持ちごとの model・effort」のコメントの「ただし model は」の項
persistent = true
resident = true   # 前の版の works-dispatch が読むキー（persistent と同じ意味）。前の版が使われなくなったら消す
fresh = true
# keepalive: 部署が頼みの途中でターンを終えて待つ間（裏の処理・出した頼みの納品）、待ち受けがキャッシュの寿命の前に短い文を送ってキャッシュを保つ。
# 送る時刻と止め時は rent-or-buy の部品が決める（works-dispatch 0.122.0 から。works-dispatch/skills/dispatch/references/roles.md の「仕事が終わるまでの keepalive」）。
# 寿命は 1 時間（[roles.settings] の promptCacheTtl）。my_notes の部署の 5 分と違うのは、この会社の部署の働き方を測った結果（業務改革の頼み b5b5c1。docs/reform/ledger.md の「頼み b5b5c1」）。
# 結論: 5 分と 1 時間の費用はほぼ同点（差は 2〜3%）なので、今の動きのまま 1 時間にした。
# 数: 2026-10-24 11〜21 時の要求 1,154 回で、5 分を超えて 1 時間以内の間が 27 回、そのうち keepalive を書いても送られない間（ターンの中の前景の --land や、何も待たずにターンを終えた後）が 14 回。
# 条件: my_notes の指南 llm-agent-workflow-cost-design-guide.md の 3.3 の「1 時間が得 ⇔ 5 分で切れて書き直す量 Q が、書き込み W0 の 0.625 倍を超える」。この窓では Q 165 万・0.625 × W0 185 万、10-21〜24 の窓では Q 438 万・407 万
keepalive = true
# 残った疑問（要約の頭書きの [[open]]）の 1 件ごとの担当者（holder）を --deliver が確かめる。書けるのは受付番号・owner:choose・owner:confirm・頼み元の名前（my_notes の司令塔は持ち主への中継を兼ねるので除く。受付 24e521・b6778d）
holders = ["司令塔"]
deliver_check = "python3 works-dispatch/dispatch/terms.py --deliver"   # 要約に works-dispatch/dispatch/terms.py の語の一覧の言い方（IT の定着語でない物）が有れば止める。「」・`` ` `` の中、引用の行、コードブロックは見ない
instructions = """\
受け持ちを預かる。\
自分の受け持ちは作業場の名前（部署の名前）で決まり、その中身は会話の始まりに足される。\
受け持ちがオンデマンドなら（会話の始まりに「この受け持ちはオンデマンド（頼まれたときだけ立てる）で、この部署はエフェメラルの部署」と出る）、頼みを納品して main に入れたら dispatch.py --done を打ってターンを終える（順番待ちに頼みが在れば断られるので、待ち受けが渡す次の頼みを済ませてから打つ）。\
1 つの頼みの中の仕事は部署に回さず、この会話の中で進める。読む量が多いだけの仕事は、この会話の中でサブエージェントに分けて読ませる。\
境目: プラグインのフォルダの中（README・tests など）はそのプラグインの担当の物。\
works と works-factory は誰の受け持ちでもなく、触らない。\
試しと標準の担当はプラグインを直さず、直しはその受け持ちの担当に頼む。\
頼みの前提や作り方に異論・代案があるとき、または頼みそのものが受け持ちの外のときは、頼みに「その通りに進めて」とあっても作らず、それだけを納品で返す（結論に「異論があるので作っていない」と要点を、決め手に根拠の URL〔原典か、根拠のファイルの GitHub の URL〕を、残った疑問に代案か回す先の部署の名前を、1 件ごとに担当者を付けて書く。回す先へは --ask で回し、その受付を担当者に書く）。\
頼みを受け、自分で進めるか、互いに独立した仕事を並べたいときは作業に頼む（--ask claude-plugins/作業 に --task <受け持ち>：<何をするか> --branch <ブランチ> を添える）。\
永続の部署なら、作業場は同じまま、頼みごとに git fetch origin してから origin/main から決まりどおりの名前のブランチを切って作業する。\
済んだら、自分で works-dispatch の main に入れるコマンド（--land <自分の部署の名前>）を打つ。\
main が先に進んでいて止まったら、自分で origin/main の上にリベースして push し、打ち直す。\
入ったら納品のコマンドで返す。\
--land が自動の権限の判定（auto mode）に止められたら、打ち直さず、窓口に --land <部署の名前> を打って入れてほしいと --ask claude-plugins で頼み、その受付を納品の残った疑問の担当者に書いて返す（残った疑問に書くだけでは窓口に届かない）。\
版は上げない・CI は待たない・試験は触ったプラグインの物だけ。\
納品の後は commit しない（初見読みの指摘は入れる前に直す）。\
納品の後に窓口や持ち主の判断が要ることが出たら（手元に残った変更の扱い・次の頼みの候補など）、画面に書いて止まらず、もう一度納品のコマンド（--deliver に --again を付ける）で返す（画面にだけ書いた問いは窓口に届かない）。\
受け持ちの外のファイルを変える必要が出たら、その受け持ちの担当に部署の名前で頼む（--ask <受け持ち>）。\
受け持ちの無いファイル（ルートの scripts/ など）は作業に頼む。\
ただし、組織やツールそのものの直しで（試しと標準の担当は除く）、受け持ちの外の変更が自分の直しと互いに引き合う（片方だけ入れると食い違う）ときは、割って頼まず、この会話で通しで直して入れ、触った受け持ちの名前を納品に書く。\
入れる前に、書いた文脈を渡さずに立てた見直しの目（convergence-loops の inspector か初見の読み手）に見せ、指摘を直す。\
持ち主に問うこと・持ち主に打たせる手順・残った疑問を納品に書く前に、会社の中（ほかの部署・ツール）で済ませられないかを確かめ、済むならそこで済ませる（自分で打てるコマンドは自分で打つ。受け持ちの外は --ask で回す。ツールに口が無ければツールの直しをその担当に頼む）。\
持ち主に問うのは、価値で選ぶこと（何を作るか・どれを採るか）と、確認してからやること（ルートの CLAUDE.md の「判断の線」の、外への書き込みと取り消せない操作）だけにする。\
残った疑問は、要約の頭書き（1 行目と閉じの行が +++ の TOML）の [[open]] に 1 件ずつ question（疑問）と holder（最後まで追う担当者）で書く（無ければ open = []。本文に残った疑問の見出しは書かない）。\
holder は、--ask で回した頼みの受付番号にする（部署の名前は --todo が追えない）。回す先を決められなければ、頼み元の名前（頼み元が自分で持つ）。\
持ち主に向けるものだけ holder を owner:choose（価値で選ぶ）か owner:confirm（確認してからやる）にする。\
my_notes の司令塔は持ち主への中継を兼ねるので、担当者にしない。"""
[roles.settings]
permissions = { deny = ["Artifact", "Workflow", "ScheduleWakeup", "SendFeedback", "ReportFindings", "AskUserQuestion", "EnterWorktree"] }
enabledPlugins = { "superpowers@superpowers-marketplace" = false, "attention@raiki61" = false, "graphloops@raiki61" = false, "works@raiki61" = false, "works-factory@raiki61" = false, "document-skills@anthropic-agent-skills" = false }
skillOverrides = { dataviz = "off" }
# 会話がこの長さ（トークン）に達したら自動で縮める（compact）。1M の窓のモデルは既定では約 967K まで縮めず、長い会話の読み直しが費用の大きな分を占めた
# （最長は作業「割り振り：止まった担当を戻す」の 96.4 万トークン・$80。https://code.claude.com/docs/en/model-config "Models running with a native 1M window compact before the window fills, at about 967K tokens by default."）。
# 20 万は良い値を測った原典が無く、Anthropic の記事が以前の安全網の位置に挙げる値に合わせた（https://claude.com/resources/articles/maximizing-the-value-of-your-claude-code-sessions "would rather have the auto-compact safety net where it used to be, /autocompact 200k puts it back"）。my_notes の会社の形の担当と作業と同じ値（社長室の受付 d543d2 の案 2 で承認。頼み 009c72）
autoCompactWindow = 200000
# キャッシュの寿命。理由は役「担当」の keepalive のコメント（書かないと works-dispatch は 1 時間と見るが、会社の形で決めておく）
promptCacheTtl = "1h"
# autoMode.allow は、自動の権限の判定（auto mode）の組み込みの拒否への例外（"$defaults" で組み込みの決まりを残す）。--land は main へ fast-forward するので
# 「Merge Without Review」として止められることがある。人のレビューの代わりに [land] のゲートを通す決まりだと書いて止めない（https://code.claude.com/docs/en/auto-mode-config）
autoMode = { allow = ["$defaults", """\
この部署が works-dispatch の --land（dispatch.py --land <自分の部署の名前>）で自分のブランチを main に入れること。\
main への取り込みは、人のレビューの代わりに、会社の形（.claude/company.toml）の [land] のゲートを通してから fast-forward する決まりで、持ち主がこの会社の部署に許している。"""] }

# 窓口: 本社（代表の clone）で持ち主と話し、頼みを部署へ配る会話（持ち主 2026-10-26「はい。窓口たてていいよ。mainに」）。--desk で名付き、永続で引き継ぐ。
# model・effort は my_notes の司令塔（同じく持ち主と話して配る会話。opus・medium）にそろえる。配る判断は誤りを後ろで止める仕組みが無いので opus に残す
[[roles]]
name = "窓口"
model = "opus"
effort = "medium"
keepalive = true   # 理由は役「担当」の keepalive のコメント
holders = ["司令塔"]   # 理由は役「担当」の holders のコメント（窓口も部署の頼みに納品で返す）
deliver_check = "python3 works-dispatch/dispatch/terms.py --deliver"   # 役「担当」と同じ
instructions = """\
claude-plugins の窓口。本社（代表の clone ~/src/claude-plugins）で持ち主と話し、頼みを部署へ配る。\
自分では直さない。プラグインの直しは会社の形 .claude/company.toml の [[skills]] の受け持ちの名前で、その担当に頼む（--ask claude-plugins/<受け持ち>）。\
受け持ちの無い一度きりの直しは作業に頼む（--ask claude-plugins/作業 に --task <何をするか> --branch <ブランチ> を添える）。\
組織やツールそのものの直しは割らずに 1 つの部署へ通しで頼み、並べるのは互いに独立した仕事だけにする。\
頼む前に --todo で部署の処理中と順番待ちを見る。\
部署から会社の名前で届く頼み（--ask claude-plugins）も受ける: 自動の権限の判定に止められた --land は、頼んだ部署の名前で --land <部署> を打ち直し、入ったかを納品で返す。\
--clean の一覧に残った部屋は、訳を読んで畳むかを決め、畳むなら --retire <部署> を打つ。\
部署の納品の残った疑問のうち、担当者が owner:choose か owner:confirm の物だけを持ち主に問う。\
本社には main を出しておき、ブランチを切り替えず、本社で直さない（本社を直に読む会話が main の今の中身を読むため。ルートの CLAUDE.md の「手元の操作」）。\
my_notes の司令塔もこの会社の部署へ直に頼むので、司令塔の頼みを取り次がない。"""
[roles.settings]
promptCacheTtl = "1h"   # 理由は役「担当」の keepalive のコメント
autoCompactWindow = 200000   # 理由は役「担当」の [roles.settings] の autoCompactWindow のコメント
# 止められた部署の --land を打ち直すので、部署と同じ例外を書く（https://code.claude.com/docs/en/auto-mode-config）
autoMode = { allow = ["$defaults", """\
この会社の窓口が works-dispatch の --land（dispatch.py --land <部署の名前>）で、部署のブランチを main に入れること。\
main への取り込みは、人のレビューの代わりに、会社の形（.claude/company.toml）の [land] のゲートを通してから fast-forward する決まりで、持ち主がこの会社の窓口と部署に許している。"""] }

# 作業: 一度きりの作業をする一時の部署。頼みごとに立ち、main に入れたら畳まれる
# effort は medium（2026-10-17。使う量と 5 時間の上限を減らすため。モデルは替えず effort を下げる。済んだ頼み 2 件の再演で、
# Opus・medium は費用が high の 56% で、漏れと誤りは high と同じ 2 件。docs/model-replay.md）。担当の effort は受け持ち（[[skills]]）ごとに書く
[[roles]]
name = "作業"
model = "opus"   # 理由は頭の「受け持ちごとの model・effort」のコメントの「ただし model は」の項
effort = "medium"
keepalive = true   # 理由は役「担当」の keepalive のコメント
# 残った疑問（要約の頭書きの [[open]]）の 1 件ごとの担当者（holder）を --deliver が確かめる。書けるのは受付番号・owner:choose・owner:confirm・頼み元の名前（my_notes の司令塔は持ち主への中継を兼ねるので除く。受付 24e521・b6778d）
holders = ["司令塔"]
deliver_check = "python3 works-dispatch/dispatch/terms.py --deliver"   # 要約に works-dispatch/dispatch/terms.py の語の一覧の言い方（IT の定着語でない物）が有れば止める。「」・`` ` `` の中、引用の行、コードブロックは見ない
instructions = """\
頼みの前提や作り方に異論・代案があるとき、または頼みそのものが受け持ちの外のときは、頼みに「その通りに進めて」とあっても作らず、それだけを納品で返す（結論に「異論があるので作っていない」と要点を、決め手に根拠の URL〔原典か、根拠のファイルの GitHub の URL〕を、残った疑問に代案か回す先の部署の名前を、1 件ごとに担当者を付けて書く。回す先へは --ask で回し、その受付を担当者に書く）。\
作業にとっての受け持ちの外は、受け持ちの有るファイル（[[skills]] の表）の直しを、その担当からでなく頼まれたとき。\
担当の順番待ちから --take で回された頼み（works-dispatch/docs/specs/2026-10-17-reception-design.md の 4.3）と、窓口が組織やツールの直しを通しで頼んだ頼みは、受け持ちの外でない。\
頼まれたプラグインを直す。\
組織やツールそのものの直し（会社の形・役の本文・ルートの CLAUDE.md の決まり・プラグイン）を受けたら、部分をほかの部署に割って回さず、この会話で直して入れる（版は main に入れるコマンドが上げる）。\
入れる前に、書いた文脈を渡さずに立てた見直しの目（convergence-loops の inspector か初見の読み手）に見せ、指摘を直す。\
その場で測れる効き目は確かめて納品に書き、後でしか測れない効き目は残った疑問に残し、測る頼みを業務改革に --ask で回してその受付を担当者に書く。\
試験は触ったプラグインの物だけを回し、CI は待たない。\
版は上げない（main に入れるコマンドが上げる）。\
済んだら、自分で works-dispatch の main に入れるコマンド（--land <自分の部署の名前>）を打つ。\
main が先に進んでいて止まったら、自分で origin/main の上にリベースして push し、打ち直す。\
入ったら納品のコマンドで返す。\
--land が自動の権限の判定（auto mode）に止められたら、打ち直さず、窓口に --land <部署の名前> を打って入れてほしいと --ask claude-plugins で頼み、その受付を納品の残った疑問の担当者に書いて返す（残った疑問に書くだけでは窓口に届かない）。\
納品の後は commit しない（初見読みの指摘は入れる前に直す）。\
納品の後に窓口や持ち主の判断が要ることが出たら（手元に残った変更の扱い・次の頼みの候補など）、画面に書いて止まらず、もう一度納品のコマンド（--deliver に --again を付ける）で返す（画面にだけ書いた問いは窓口に届かない）。\
持ち主に問うこと・持ち主に打たせる手順・残った疑問を納品に書く前に、会社の中（ほかの部署・ツール）で済ませられないかを確かめ、済むならそこで済ませる（自分で打てるコマンドは自分で打つ。受け持ちの外は --ask で回す。ツールに口が無ければツールの直しをその担当に頼む）。\
持ち主に問うのは、価値で選ぶこと（何を作るか・どれを採るか）と、確認してからやること（ルートの CLAUDE.md の「判断の線」の、外への書き込みと取り消せない操作）だけにする。\
残った疑問は、要約の頭書き（1 行目と閉じの行が +++ の TOML）の [[open]] に 1 件ずつ question（疑問）と holder（最後まで追う担当者）で書く（無ければ open = []。本文に残った疑問の見出しは書かない）。\
holder は、--ask で回した頼みの受付番号にする（部署の名前は --todo が追えない）。回す先を決められなければ、頼み元の名前（頼み元が自分で持つ）。\
持ち主に向けるものだけ holder を owner:choose（価値で選ぶ）か owner:confirm（確認してからやる）にする。\
my_notes の司令塔は持ち主への中継を兼ねるので、担当者にしない。\
作業の部署は納品の後に畳まれるので、自分を担当者にしない。\
最後に、ブランチを main に入れて納品し終えたら（commit の無い頼みなら納品の後）、dispatch.py --done を打ってターンを終える（そのターンの終わりに部屋が畳まれる）。\
--done が断ったら、納品していない頼みは納品してから、ブランチが main に入っていないと出たら git fetch origin してから打ち直す。\
それ以外の訳（未コミットの変更・main に無い commit など）は、消したり commit したりせず、訳を書いてもう一度納品のコマンド（--deliver に --again を付ける）で返し、印は打たずに止まる（窓口が --clean の一覧で見て、畳むかを決める）。\
--land を窓口に打ってもらう形のときも、入ったと知らされたら git fetch origin してから打ち、知らされなければ打たずに止まる。"""
[roles.settings]
permissions = { deny = ["Artifact", "Workflow", "ScheduleWakeup", "SendFeedback", "ReportFindings", "AskUserQuestion", "EnterWorktree"] }
enabledPlugins = { "superpowers@superpowers-marketplace" = false, "attention@raiki61" = false, "graphloops@raiki61" = false, "works@raiki61" = false, "works-factory@raiki61" = false, "document-skills@anthropic-agent-skills" = false }
skillOverrides = { dataviz = "off" }
# 会話がこの長さ（トークン）に達したら自動で縮める（compact）。1M の窓のモデルは既定では約 967K まで縮めず、長い会話の読み直しが費用の大きな分を占めた
# （最長は作業「割り振り：止まった担当を戻す」の 96.4 万トークン・$80。https://code.claude.com/docs/en/model-config "Models running with a native 1M window compact before the window fills, at about 967K tokens by default."）。
# 20 万は良い値を測った原典が無く、Anthropic の記事が以前の安全網の位置に挙げる値に合わせた（https://claude.com/resources/articles/maximizing-the-value-of-your-claude-code-sessions "would rather have the auto-compact safety net where it used to be, /autocompact 200k puts it back"）。my_notes の会社の形の担当と作業と同じ値（社長室の受付 d543d2 の案 2 で承認。頼み 009c72）
autoCompactWindow = 200000
# キャッシュの寿命。理由は役「担当」の keepalive のコメント（書かないと works-dispatch は 1 時間と見るが、会社の形で決めておく）
promptCacheTtl = "1h"
# autoMode.allow は、自動の権限の判定（auto mode）の組み込みの拒否への例外（"$defaults" で組み込みの決まりを残す）。--land は main へ fast-forward するので
# 「Merge Without Review」として止められることがある。人のレビューの代わりに [land] のゲートを通す決まりだと書いて止めない（https://code.claude.com/docs/en/auto-mode-config）
autoMode = { allow = ["$defaults", """\
この部署が works-dispatch の --land（dispatch.py --land <自分の部署の名前>）で自分のブランチを main に入れること。\
main への取り込みは、人のレビューの代わりに、会社の形（.claude/company.toml）の [land] のゲートを通してから fast-forward する決まりで、持ち主がこの会社の部署に許している。"""] }

# 配布: 機械だけの役（machine = true。AI の部署を持たない）。ツール「全アカウントに配る」（scripts/spread-plugins.py）だけを持つ。
# main に入れるたびに下の [[land.after]] の合図で呼ばれ、片づかなければ（1 つでも失敗したら）作業に回る（名前「配布：全アカウントに配る」の部署が立つ）。
# 手で呼ぶなら dispatch.py --call 配布 spread-plugins（--input '{"dry_run": true}' で空打ち）。どの会話に /reload-plugins を打つか
# （部署と窓口だけ）はこの組織の決まりなのでスクリプトに置き、その人だけの除外は ~/.config/claude-plugins/spread.toml の skip に置く。
# 配る先は works-dispatch の設定のアカウントと、同じ手元の設定の accounts（Claude Code を使うが部署は起動しないアカウント）
[[roles]]
name = "配布"
machine = true

[[roles.tools]]
name = "spread-plugins"
title = "全アカウントに配る"
description = "works-dispatch の設定と手元の設定（~/.config/claude-plugins/spread.toml の accounts）の全アカウントで、この marketplace と入っているそのプラグインを更新し、marketplace に載っているのに入っていないプラグインを入れ（手元の設定の no_install の物は除く）、全アカウントに配った後に、入った版を origin/main の plugin.json の版と照合し（そろわなければ失敗に数える）、部署と窓口の会話に /reload-plugins を打つ（ターンの途中の会話と、入力フィールドに字の在る会話は飛ばす）"
inputSchema = { type = "object", properties = { dry_run = { type = "boolean", description = "true なら、することを出すだけで何も打たない" } }, additionalProperties = false }
command = "python3 scripts/spread-plugins.py"
fallback_role = "作業"

# CI の見張り: 機械だけの役（machine = true）。ツール「main の CI を見る」（tests/ci-watch.py）だけを持つ。
# main に入れるたびに下の [[land.after]] の合図で呼ばれ、知らせる物（main の CI の赤・止まった定期の workflow など。下の description）が在れば（ツールが 1 で終わったら）、出力を添えた頼みが点検に回る
# （CI の赤を直すのは点検。標準 docs/standards/breakage-detection.md の決まり 6）。
# fallback_role に受け持ちの名前を書けるのは works-dispatch 0.80.1 から（受付 d0818d・34ce75）。それより前の works-dispatch はツールごと外して呼ばない。
# ツールは頼みの題の「/ci-watch 」で自分が回した頼みを見分けるので、name を変えない。
# 手で呼ぶなら dispatch.py --call "CI の見張り" ci-watch（--input '{"dry_run": true}' で、知らせる物を出すだけで覚えない）
[[roles]]
name = "CI の見張り"
machine = true

[[roles.tools]]
name = "ci-watch"
title = "main の CI を見る"
description = "GitHub に登録された全部の workflow の main の run を読み、赤（最新の決着した run が失敗。最後の緑から最新の赤までの commit の範囲を添える）・止まった定期（最後の schedule の run が、過去の間隔の一番長い物と 1 日を足した長さより古い）・1 度も回っていない workflow・止められた workflow（状態が active でない）を知らせる。知らせた件は覚え、回した頼みが閉じていないうちは同じ件を知らせ直さない"
inputSchema = { type = "object", properties = { dry_run = { type = "boolean", description = "true なら、知らせる物を出すだけで覚えない" } }, additionalProperties = false }
command = "python3 tests/ci-watch.py"
fallback_role = "点検"

# 工場の版の見張り（受付 20261026-055008-8aa008。頼み元は works-factory の窓口）: works-factory プラグインの PIN より先に、工場 raiki61/works-factory の
# main で CI が緑の commit が在れば上げる。スキルに効く変更の照合に当たりが無ければ、AI を立てずにツールが PIN と CHANGELOG を書いて --land で入れる
# （機械の上げ。持ち主 2026-10-28「いやLLMも要らないような自動のあげかた」。設計の 3.7）。照合に当たったときと機械の上げが失敗したときだけ、
# 上げる頼みを作業に回す。作業は --write で PIN と CHANGELOG を書き、照合で当たればスキルも直して --land で入れる。
# main に入れるたびに下の [[land.after]] の合図で呼ばれる。工場の CI の緑だけで上げる（持ち主 2026-10-26「おし」で案 A。設計 docs/specs/2026-10-26-works-factory-pin-design.md の 1）。
# 手で呼ぶなら dispatch.py --call claude-plugins/工場の版の見張り works-factory-pin（--input '{"dry_run": true}' で、知らせる物を出すだけで覚えない）
[[roles]]
name = "工場の版の見張り"
machine = true

[[roles.tools]]
name = "works-factory-pin"
title = "工場の版の上げ先を見る"
description = "works-factory プラグインの工場の固定 commit（works-factory/PIN）の後に、raiki61/works-factory の main で CI（check の名 tests）が緑の commit が在るかを見る。在れば、スキルに効く変更を照合する（スキルが引いた語・パスの消え、本線と周の鎖の入力の出入り、WORKS_FACTORY_* の出入り、工場の README と殻の変更）。当たりが無ければ、代表の clone に一時のブランチを作って PIN と CHANGELOG を commit し、--land で main に入れて 0 で終わる（機械の上げ。その --land の合図で呼ばれたら黙る）。当たりが在るか機械の上げが失敗したら、上げ先・取り込む PR・照合の結果と、上げる手順（python3 scripts/works-factory-pin.py --write <上げ先の sha>）を出して 1 で終わり、作業に回る。知らせた上げ先は覚え、回した頼みが開いている間（工場を読む前に見る）と、閉じた後の同じ上げ先では知らせ直さない"
inputSchema = { type = "object", properties = { dry_run = { type = "boolean", description = "true なら、知らせる物を出すだけで覚えず、機械の上げも打たない" } }, additionalProperties = false }
command = "python3 scripts/works-factory-pin.py"
fallback_role = "作業"

# 部署の成果を main に入れる決まり（works-dispatch の --land）。持ち主の方針（2026-10-16）: CI は待たない。
# 部署は触ったプラグインの試験を手元で回し、ここでは下の check の順に機械で確かめる。版は取り込むときに上げる
# 件数のチェック（tests/run.sh の EXPECTED_CHECKS と pytest の EXPECTED_ITEMS）も、試験を走らせずに数えて確かめる（tests/count-fences.sh。10 秒ほど）
# 文の IT の定着語でない言い方が、ファイルごとの基準の件数より増えていないかも確かめる（scripts/terms.py。辞書は works-dispatch/dispatch/terms.py）
# 機械が読む値の受け渡しの決まり 3・4 に当たる所の件数が、ファイルごとの基準と違わないかも確かめる（tests/value-rules.py。標準 docs/standards/machine-readable-values.md。数えるだけで数秒）
# ルートの試験（tests/run.sh）のうち、この変更が入力に当たる検査だけを、graphloops の模擬実行を見送って回し、赤の名前を一覧 tests/land-known-red.txt と照合する
# （tests/land-check.py。works-dispatch だけを変えた回で、混んだ機械で 8 分ほど。tests/run.sh を変えた回は全部を回すので 25 分ほど）。
# 一覧に無い赤と、一覧に在るのに緑の検査で止める。main に入った後の CI でしか回っていなかったため、入るたびに赤が積み上がった（2026-10-19、頼み b9ab0d）
# 最後に、ブランチが書いた文書を初見の読み手に読ませ、詰まりが在れば止める（gates の branch-check。推測で埋めた箇所だけなら通す。読み 1 回に 2〜4 分。
# 同じ中身の判定は覚えるので、リベースの打ち直しでは読み直さない）。安いゲートを先に、遅い初見読みを最後に並べる
# 初見読みには --fixer で語の一覧の置き換え（works-dispatch/dispatch/terms.py の fix_text）を渡し、IT の定着語に語を置き換えただけの行は
# 書き換えに数えない（置き換えは文書の全体に散り、文書を丸ごと読み直させて、元からある書き方の詰まりで止めた。2026-10-19、頼み 109fb3）
# mode の名前 ff-after-ci は「ゲートの後に fast-forward」の意味で、ゲートが CI とは限らない。ここは gate = "check"（手元の検証）なので CI を待たない
[land]
mode = "ff-after-ci"
gate = "check"
# 順は、軽い検査（scripts/light-check.sh。数十秒）→ この変更が入力に当たるテストだけ（tests/land-check.py）→ 初見の読み手（gates の branch-check。AI を起動するので最後）。
# 全部のテストは main に入った後の CI が回す。どのテストをどこで回すかは docs/adr/0076-land-runs-affected-tests.md
# 軽い検査は、main への push の前のフック（.githooks/pre-push）も回す。急ぎで --land を通さない push でも飛ばせない（受付 2ee37b）
# （2026-10-20 の 19:45 から、この組み直しが入るまでは、検査 1 回が混んだ機械で 45 分かかったため tests/land-check.py を外していた。持ち主「一旦テストは全部飛ばしてclaudepluginsはいれましょう。」）
check = "bash scripts/light-check.sh && python3 tests/land-check.py && python3 gates/hooks/coldread-gate.py branch-check --fixer works-dispatch/dispatch/terms.py"
bump = "marketplace"
# 同じ clone で同時に打った --land を、申し出た順に 1 本ずつ通す列（works-dispatch の docs/land.md の queue。2026-10-20 に --land 7 本が取り合った）
queue = "land-queue"

# main に入れた後の合図: 全アカウントに配る（出荷のたびに窓口が手で配っていた物。片づかなければ作業に回り、頼み元は main に入れた部署の頼み元）
[[land.after]]
role = "配布"
tool = "spread-plugins"

# main に入れた後の合図: main の CI を見る（配布の後）。持ち主は cron などの定期の起動を置かないので、main へ入れる動きに乗せる。
# main へ誰も入れない間は見張りも止まる（標準 docs/standards/breakage-detection.md の決まり 2 の最後の項）
[[land.after]]
role = "CI の見張り"
tool = "ci-watch"

# main に入れた後の合図: 工場の版の上げ先を見る（CI の見張りの後）。工場の main に CI の緑の新しい commit が在れば、上げる頼みが作業に回る
[[land.after]]
role = "工場の版の見張り"
tool = "works-factory-pin"

# 組織の決まり（この会社の作り方。スキルの決まりではない）
# - 名前は日本語の短い言葉にする（英語や会社らしい呼び名にしない。持ち主 2026-10-16「会社っぽくなくていい」「日本語で」）。
#   herdr のサイドバーには、作業場の木（親＝リポジトリ、子＝worktree）と、会話の行（作業場の名前・役・ブランチ）が出る。
#   会社の名前は親の作業場にだけ出るので、部署の名前（--task・--ask に渡す名前。作業場・会話の名前になる）に会社を付けない。
# - 役は 5 つ: 窓口（頼みを配り、片付けの判断〔--clean・--retire〕と止められた --land の打ち直しを受ける本社の会話。
#   役の本文は [[roles]] の「窓口」。2026-10-26 までは my_notes の司令塔が兼ねていた〔業務改革の案 1-3〕）・担当（受け持ちに 1 つ。永続か、オンデマンド）・作業（一度きり）・機械だけの役（配布・CI の見張り・工場の版の見張り）・相談（この会社の形には置かない）。
# - 担当: 受け持ちごとに 1 つ。部署の名前を受け持ちの名前にし、自分の受け持ちはその名前で決まる。
#   受け持ちの表（どの受け持ちが何のファイルを持つか）は [[skills]] の 1 か所に置く（name が部署の名前、description が中身。works-dispatch の
#   役を足すフックが、部署の名前と同じ name の description を会話の始まりに足す）。役の本文と、このコメントに写さない。
#   役の本文とここに書くのは、表に載らない境目の決まりだけ（次の 3 行）:
#   試しと標準の担当はプラグインを直さず、直しはその受け持ちの担当に頼む。
#   プラグインのフォルダの中（README・tests など）は、そのプラグインの担当の物。
#   works と works-factory は持ち主が別に回している所なので、受け持ちを作らず、どの担当も触らない。
#   担当への頼みは部署の名前で宛てる（--ask 仕組み。works-dispatch は部署の名前を役より先に当てる。
#   別の会社に同じ名前の部署が有れば --ask claude-plugins/仕組み）。担当は 1 つの会社に幾つも有るので、役（--ask claude-plugins/担当）では宛てない。
#   担当がまだ居ない永続の受け持ちは --task <受け持ち> --branch work/<英小文字> --role 担当 --persistent で立てる（起動方法 [skills.start] の有る受け持ちは --start <受け持ち> でも立つ）。
#   オンデマンドの受け持ちは、--ask claude-plugins/<受け持ち> だけで立つ。
#   永続の担当の部署は片付けで畳まれず、次の頼みを同じ作業場と窓で、空にした会話で受ける（fresh = true）。同じ受け持ちの直しは担当の中で順番に進むので、同じファイルの取り合いにならない。
# - 作業: 頼みごとに立って入れたら畳まれる一時の部署。畳むきっかけは、作業が最後に自分で打つ終わりの印（dispatch.py --done。打つ時は作業の本文）で、
#   印のターンの終わりに works-dispatch が会話を止めて部屋を片付ける。印の無いまま残った部屋は、dispatch.py --clean の一覧に
#   「頼みは納品済みで、終わりの印が無い」「終わりの印で畳もうとして残った: …」などの訳と並ぶので、窓口が止めるか残すかを決め、止めるなら --retire <部署> を打つ。
#   使うのは、受け持ちの無い一度きりの作業（ルートの scripts/ など。どれに受け持ちが有るかは [[skills]]）と、
#   担当が互いに独立した仕事を並べて進めたいときに使う（下の「並べるのは独立した仕事だけ」）。--ask claude-plugins/作業 に --task <名前> --branch <ブランチ> を添えるか、
#   --task で直に立てる（--role を省けば default_role の作業になる）。
#   名前は「<受け持ち>：<何をするか>」（例: 「点検：文書の環境変数」）。作業場の名前になるので 12 字くらいまで。受け持ちの無い作業は何をするかだけでよい。
# - 担当どうしの連携: 担当は、ほかの担当と作業に頼むコマンド（--ask）で頼んでよい。頼んだ担当が頼み元になり、納品はその担当に返る。
# - 異論は作る前に返させる（持ち主 2026-10-17「トップダウンすぎ。部署にも反論させてよい」）。担当と作業は、頼みの前提や作り方への異論・代案と、
#   受け持ちの外の頼みを、作らずに納品で返す。返す口は今は納品しかないので、その書き方を担当と作業の本文に同じ文で持つ（TOML に共通の本文を引く書き方が無いため）。
#   担当の「受け持ちの外のファイルを変える必要が出たら頼む」は作っている途中の決まりで、頼みそのものが外のときのこの決まりとは別。
# - 並べるのは独立した仕事だけ: 部署を並べて頼むのは、互いに独立した仕事（調べもの・別々の PR・試しや測りなど）だけにする。
#   組織やツールそのものの直し（会社の形・役の本文・ルートの CLAUDE.md の決まり・プラグインのように互いに引き合う物）は、割らずに 1 つの部署で通しで、
#   直して入れて（版は --land が上げる）効いたかまで進める。担当は、自分の直しと引き合う受け持ちの外の変更も割らずに入れ、触った受け持ちを納品に書く。
#   業務改革の案から来た組織の直しは業務改革が自分で入れ、プラグインの直しはその担当か作業 1 つが通しでやる。
#   通しでやるのは部署で、司令塔にはしない（持ち主「社長室を戦力換算しないで。組織でイメージして」、my_notes の受付 4582e6）。
#   書いた会話と別の、文脈を持たない見直しの目（inspector・初見の読み手）は残す。
#   持ち主 2026-10-17、社長室の「賛成。条件を 2 つ付けて採る」に「さっきの問いはどうぞ。」（my_notes の受付 d4200c。my_notes の会社の形の commit 96b2d7b7・912307a5 と同じ形）。
#   反対の理由として示したもの: 1 本の会話が長く走って文脈が太る。直しが 1 本ずつになり、急ぎが重なると待ちが出る。
#   根拠（my_notes の reference/primary/ai/ に写し）:
#     https://cognition.ai/blog/dont-build-multi-agents "Actions carry implicit decisions, and conflicting decisions carry bad results"
#     https://cognition.ai/blog/multi-agents-working "multi-agent systems work best today when writes stay single-threaded"
#     https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence "If the work is one chain, fits in one context without a long cost tail, or a single model at lower effort already meets your bar, don't build an orchestrator."
