# 会社の形: このリポジトリの部署の役・受け持ち・起動の設定と、main に入れる決まり。読むのは works-dispatch（書き方は works-dispatch/skills/dispatch/references/roles.md）。
# 決めた経緯と根拠は docs/reform/ledger.md（2026-11-09 までのコメントは「頼み e068e7」に移した）。ここには決まりの 1 行だけ書く。
# 役の settings で pr-review-toolkit とそのサブエージェントは切らない（convergence-loops が依存し、/review-loop が呼ぶ）。
# 長い文字列は """ で囲み、文の切れ目の行末に \ を置いて折る（行末の \ は改行と次の行の頭の空白を消す）。

name = "claude-plugins"
description = "持ち主の Claude Code のプラグインと、それを配る marketplace"
gh_user = "raiki61"
desk_role = "窓口"   # 本社（代表の clone。main を出しておく）の会話の役
desk = "my_notes/司令塔"   # 本社の会話が --desk で名付くまでの窓口（消すと --ask claude-plugins が止まる）
default_role = "作業"   # --task で --role を省いたときの役

# 担当と作業の部署に共通の本文（窓口には足されない）。AI だけが読む文なので英語で書く（ルートの CLAUDE.md の「会話」）
# terms: english-begin
shared_instructions = """\
If you disagree with the premise or approach of an ask, have an alternative, or the ask itself is outside your duty, do not build it even if the ask says to go ahead as written; deliver only that (in 「結論」 write 「異論があるので作っていない」 and the gist; in 「決め手」 the URLs behind it [the primary source, or the GitHub URL of the file that grounds it]; in the open questions, the alternative or the department to route it to, one item each with a holder. Route it with --ask and write that ask's id as the holder). \
Run only the tests of the plugins you touched, do not wait for CI, and do not bump versions (--land bumps them). \
Before landing, show your changes to a fresh reviewer launched without your conversation context (convergence-loops' inspector or a cold reader) and fix what it points out. \
When done, run --land <your department's name> yourself; if main has moved ahead and it stops, rebase onto origin/main, push, and run it again. Once it is in, deliver. \
If auto mode's permission check blocks --land, do not retry; ask the front desk with --ask claude-plugins to run --land <department name> for you, write that ask's id as the holder of an open question in the delivery, and deliver; run --done only after you are told it is in (git fetch origin first). \
Do not commit after delivering. If something needing the front desk's or the owner's judgment comes up after delivering, do not write it on the screen and stop; send it with --deliver --again. \
After delivering and landing (after delivering, for an ask with no commits), run dispatch.py --done and end the turn. If it refuses over uncommitted changes or commits not in main, do not delete or commit anything; send the reason with --deliver --again and stop. \
Before writing a question for the owner, steps for the owner to run, or open questions, check whether it can be settled inside the company (other departments, tools), and if so settle it there (run the commands you can run yourself; route what is outside your duty with --ask; if a tool has no entry point for it, ask that tool's 「担当」 to fix the tool). \
Ask the owner only about choices of value (what to build, which to adopt) and things to confirm before doing (outward writes and irreversible operations in 「判断の線」 of the root CLAUDE.md). \
Write each open question in [[open]] of the summary's front matter with question and holder (open = [] if none); --deliver checks the holder and lists the allowed values. \
At a break in the middle of an ask (a part of the work is done and more follows), run dispatch.py --compact <the ask id and the next step> and do what its output says; put what is too long for the focus in compact-next.md in `git rev-parse --git-dir` and write that path in the focus. Not when delivery looks closer than about 30 requests, and never after delivering. \
Language: everything the owner reads (delivery summaries, questions, docs, commit messages, the screen) stays in Japanese, as 「会話」 of the root CLAUDE.md says; only text that AI alone reads, like this text, is in English. Terms: duty = 「受け持ち」 (one entry of [[skills]]), department = 「部署」, ask = 「頼み」, delivery = 「納品」, holder = 「担当者」, front desk = 「窓口」, control tower = 「司令塔」."""
# terms: english-end

# 受け持ちの model は書かず、役の model = "opus" で起動する。effort はコードを直す受け持ちと試しが high、文書と判断の受け持ちが medium。
# 担当の受け持ちはどれも until-idle（頼まれたときに立て、手が空いたら畳む）。always への上げ下げは業務改革が台帳から数えて決める（業務改革の description）。
[[skills]]
id = "plugin-fix"
name = "一度きりの直し"
description = "受け持ちの無い一度きりの直しと、担当が並べて進めたい直しを、一時の作業の部署で受ける"
role = "作業"

[[skills]]
id = "dispatch"   # 名前は「割り振り」から替えた。id は替えない
name = "仕組み"
lifetime = "until-idle"
description = "works-dispatch・tiers・rent-or-buy の直し（部署の立て方・頼みと納品・main に入れるコマンドと、ツールの点検と、借りるか買うかの費用の判断の部品）"
role = "担当"
effort = "high"

[[skills]]
id = "gates"
name = "点検"
lifetime = "until-idle"
description = "gates の直し（書き込み前のゲート・初見読みなど）と、CI・ルートの tests/ の直し"
role = "担当"
effort = "high"

[[skills]]
id = "convergence"
name = "見直し"
lifetime = "until-idle"
description = "convergence-loops と graphloops の直し（レビュー・調べ・初見読みなどの収束の工程と、そのグラフ）"
role = "担当"
effort = "high"

[[skills]]
id = "attention"
name = "見渡し"
lifetime = "until-idle"
description = "attention の直し（自分の番の PR の見渡しと /catchup）"
role = "担当"
effort = "high"

[[skills]]
id = "docs"
name = "説明書"
lifetime = "until-idle"
description = """\
プラグインをまたぐ文書（ルートの README・CLAUDE.md・CONTRIBUTING.md・docs/。docs/trials/・docs/standards/・docs/reform/ は除く）と、会社の形（.claude/company.toml と設計の docs/specs/2026-10-16-company-shape-design.md）の直し。\
会社の形の中身を決めるのは持ち主と窓口で、説明書は書く（業務改革の案から承認された組織の直しは、業務改革が自分で入れる）"""
role = "担当"
effort = "medium"

[[skills]]
id = "standards"
name = "標準"
lifetime = "until-idle"
description = """\
プラグインをまたぐ標準（書き方・作りの揃え方）を docs/standards/ に作り、プラグインごとのずれを見つけて綺麗にし続ける。\
ずれの直しは各プラグインの担当に、標準を機械で守らせる検査（CI・ルートの tests/）は点検に、ルートの README・CLAUDE.md・CONTRIBUTING.md から標準を指す直しは説明書に頼む"""
role = "担当"
effort = "medium"
# 起動は司令塔から --start claude-plugins/標準 の 1 行（every を書かないので周期では起きない）
[skills.start]
report_to = "my_notes/司令塔"
by = ["司令塔"]
text = """\
標準として、プラグインをまたぐ標準（docs/standards/。まだ無ければ作る所から）と各プラグインの今の作りを見比べ、\
ずれの大きい順に 1〜3 個を選んで片付けてください（プラグインの中の直しはその担当に頼む）。\
前の回からの続きは docs/standards/ から拾ってください。\
前提が違う・今は要らないと思ったら、作らずにそう返してください。"""

# 業務改革: claude-plugins の組織だけを点検する（my_notes の組織は my_notes の業務改革）。改善の台帳 docs/reform/ は説明書の受け持ちから外す。
[[skills]]
id = "reform"
name = "業務改革"
lifetime = "until-idle"
# terms: english-begin
description = """\
Inspect claude-plugins' organization (departments, roles, and the ask flow in the company shape .claude/company.toml) from outside and carry it end to end: proposals, landing approved fixes yourself, and reporting to `my_notes/司令塔` (the control tower) whether they worked. \
Your files: the improvement ledger (docs/reform/ledger.md) and what approved fixes touch (the company shape, docs/specs/2026-10-16-company-shape-design.md, and the company rules in the root CLAUDE.md). my_notes' 「業務改革」 watches my_notes' organization. \
Each ask and delivery arrives in an empty conversation, so first read the improvement ledger and the inbox ledger (how far each proposal has gone) and this company's open questions whose holder is an ask to 「業務改革」 (effects measurable only later; --todo lists them as follow-ups), and confirm them in the inspection. After writing the ledger, commit it and land it with --land. \
You also raise and lower until-idle duties (lifetime = "until-idle"): counted from the inbox ledger, a duty with over 20 asks a day on consecutive days, or whose top 10% of ask waits exceed 30 minutes, becomes always (set lifetime = "always" in the company shape); set lifetime = "until-idle" again when it falls below. Do not ask the owner about this; write it only in the report to the control tower (20 asks and 30 minutes are rules of thumb from the numbers of 2026-10-17; re-measure them in every inspection). \
Use `--ask my_notes/司令塔` only for questions that need the owner's judgment; do not send notices that need no reply (landed, asked, done, measured), and do not attach them to questions. \
Procedure: 1. When started, inspect, and ask the control tower your proposals as one approval question (`--ask my_notes/司令塔 --forward`; --forward can be used only once, so put all proposals in it; write 「問い」 in the body; this closes the starting ask). With no proposals, close the starting ask with a delivery (--deliver without --for). \
2. When the control tower's answer (a delivery with the owner's words) arrives, write the approval in the ledger and land the adopted fixes in this conversation within that turn (fix, verify, --land). \
For a proposal needing a plugin fix, ask the control tower (`--ask my_notes/司令塔`, with the original ask id and the owner's words) to have that plugin's 「担当」 do it end to end in one conversation. Do not split a proposal whose company-shape fix and plugin fix pull on each other; ask the whole of it to that 「担当」. \
3. Check that it went in (the commit is in main) and, as far as you can measure on the spot, that it worked; write that in the ledger and report to the control tower, not with --ask but with a delivery to the question ask from 1 (`--deliver <要約のファイル> --for <1 で司令塔に頼んだ問いの受付>`; the id is in 「受付 <番号>」 at the head of the control tower's answer, and --for also resolves the routed-to ask's id; in 「決め手」 write the GitHub URL of the fix commit or the ledger; no relay other than the control tower in between). \
What you asked the control tower in 2 comes back as a delivery to that ask id; check it the same way and report. \
Check effects not measurable right away in the next round you are started, and report them with a delivery (--for) to the previous round's question ask (not attached to that round's question). If the owner reads the report and asks for a fix, it arrives as an ask from the control tower: proceed from 2 and close it with a delivery."""
# terms: english-end
role = "担当"
effort = "medium"
# 起動は司令塔から --start claude-plugins/業務改革 の 1 行（every を書かない）
[skills.start]
report_to = "my_notes/司令塔"
by = ["司令塔"]
text = """\
業務改革として、claude-plugins の部署の組織を外から点検し、改善点を大きい順に挙げてください。\
前提が違う、点検しない方がいい、と思ったら、そう返してください。\
材料: 頼みと納品は、この会社の代表の clone の .git/company/inbox/ と、my_notes の代表の clone の同じ所（ほかの会社から頼まれた分は頼み元の受付箱に入る。\
場所は dispatch.py --tree の会社の行）にあり、台帳は log.jsonl。claude-plugins の部署が宛先か頼み元の行を、前の回からの分だけ見る\
（前の回は、この会社の台帳の kind が start で skill が 業務改革 の行）。\
会社の形 .claude/company.toml の、誰が何を受け持ち、誰に頼み、誰に返すかも点検の対象にする。\
前の回までの案ごとの承認・頼んだ受付・入ったか・効いたかは改善の台帳 docs/reform/ledger.md（無ければこの回に作る）。\
見るもの: 役ごとのモデルと effort、部署の読み込み、使う量（測りが有れば使い、無ければ重ねて測らない）、順番待ちの長さ、頼みの流れの手数、\
異論と差し戻しの数、組織そのものへの仕事の割合、前の回の改善点が効いたか。\
改善点ごとに、回す先（部署）と、持ち主の判断が要るか（CLAUDE.md と company.toml の決まりで答えが出るか）と、確かめ方を書く。"""

[[skills]]
id = "trials"
name = "試し"
lifetime = "until-idle"
description = "まっさらな環境・Windows・Linux（Colima の Docker）でプラグインを入れて試し、詰まりを docs/trials/ に記録する"
role = "担当"
effort = "high"   # 一度 Sonnet にして記録の漏れが出たので Opus・high に戻した

# 担当: 受け持ちごとに 1 つ。部署の名前が受け持ちの名前で、頼みごとに空の会話で受ける（context = "new"）
[[roles]]
name = "担当"
model = "opus"
lifetime = "always"   # 受け持ちの lifetime が先に効く（今はどれも until-idle）
context = "new"
holders = ["司令塔"]   # 残った疑問の担当者を --deliver が確かめる。司令塔は持ち主への中継なので担当者にさせない
deliver_check = "python3 works-dispatch/dispatch/terms.py --deliver"   # 要約の IT の定着語でない言い方で止める
# terms: english-begin
instructions = """\
You hold a duty. Your duty is set by the workspace name (the department name), and its content is added at the start of the conversation. \
Do the work of one ask in this conversation; do not route it to departments. Split work that is just a lot of reading to subagents in this conversation. \
Boundaries: the inside of a plugin's folder (README, tests, etc.) belongs to that plugin's 「担当」. \
works and works-factory belong to no duty; do not touch them. \
The 「担当」 of 「試し」 and 「標準」 do not fix plugins; they ask the 「担当」 of the duty for the fix. \
When you take an ask, either do it yourself or, to run mutually independent work in parallel, ask 「作業」 (`--ask claude-plugins/作業` with `--task <受け持ち>：<何をするか> --branch <ブランチ>`). \
If you need to change a file outside your duty, ask that duty's 「担当」 by its department name (--ask <duty>). \
Ask 「作業」 for files with no duty (the root scripts/, etc.). \
However, in a fix to the organization or tools themselves (except for the 「担当」 of 「試し」 and 「標準」), when a change outside your duty and your fix pull on each other (landing only one leaves them inconsistent), do not split it into asks; fix and land it end to end in this conversation, and write the names of the duties you touched in the delivery."""
# terms: english-end
[roles.settings]
permissions = { deny = ["Artifact", "Workflow", "ScheduleWakeup", "SendFeedback", "ReportFindings", "AskUserQuestion", "EnterWorktree"] }
enabledPlugins = { "superpowers@superpowers-marketplace" = false, "attention@raiki61" = false, "graphloops@raiki61" = false, "works@raiki61" = false, "works-factory@raiki61" = false, "document-skills@anthropic-agent-skills" = false }
skillOverrides = { dataviz = "off" }
autoCompactWindow = 1000000   # モデルの文脈の上限の近く（roles.md の「起動の設定」の 3）
promptCacheTtl = "1h"   # 5 分と 1 時間の費用はほぼ同点だった（台帳の「頼み b5b5c1」）
# --land が auto mode に「Merge Without Review」で止められないための例外（https://code.claude.com/docs/en/auto-mode-config）
autoMode = { allow = ["$defaults", """\
この部署が works-dispatch の --land（dispatch.py --land <自分の部署の名前>）で自分のブランチを main に入れること。\
main への取り込みは、人のレビューの代わりに、会社の形（.claude/company.toml）の [land] のゲートを通してから fast-forward する決まりで、持ち主がこの会社の部署に許している。"""] }

# 窓口: 本社で持ち主と話し、頼みを部署へ配る会話。--desk で名付き、会話は引き継ぐ。配る判断は後ろで止める仕組みが無いので opus
[[roles]]
name = "窓口"
model = "opus"
effort = "medium"
holders = ["司令塔"]   # 役「担当」と同じ
deliver_check = "python3 works-dispatch/dispatch/terms.py --deliver"   # 役「担当」と同じ
# terms: english-begin
instructions = """\
You are the front desk of claude-plugins. You talk with the owner in the head office (the representative clone) and route asks to departments. \
Do not fix things yourself. Ask for plugin fixes by the duty name in [[skills]] of the company shape .claude/company.toml, to that duty's 「担当」 (`--ask claude-plugins/<受け持ち>`). \
Ask 「作業」 for one-off fixes with no duty (`--ask claude-plugins/作業` with `--task <何をするか> --branch <ブランチ>`). \
Ask for a fix to the organization or tools themselves end to end in one department without splitting it; run in parallel only mutually independent work. \
Before asking, look at the departments' in-progress and queued asks with --todo. \
Also take asks that departments send by company name (--ask claude-plugins): for a --land blocked by auto mode's permission check, rerun --land <department> with the asking department's name and reply with a delivery saying whether it went in. \
For rooms left in the --clean list, read the reasons and decide whether to clean them up; if so, run --retire <department>. \
Of the open questions in departments' deliveries, ask the owner only those whose holder is owner:choose or owner:confirm. \
Keep main checked out in the head office; do not switch branches there and do not edit there (so conversations that read the head office directly see the current main; 「手元の操作」 of the root CLAUDE.md). \
`my_notes/司令塔` (the control tower) also asks this company's departments directly, so do not relay its asks. \
Language: talk with the owner in Japanese, and keep everything the owner reads in Japanese, as 「会話」 of the root CLAUDE.md says; only text that AI alone reads, like this role text, is in English. Terms: duty = 「受け持ち」 (one entry of [[skills]]), department = 「部署」, ask = 「頼み」, delivery = 「納品」, holder = 「担当者」, front desk = 「窓口」, control tower = 「司令塔」."""
# terms: english-end
[roles.settings]
promptCacheTtl = "1h"
autoCompactWindow = 1000000
# 止められた部署の --land を打ち直すので、部署と同じ例外を書く
autoMode = { allow = ["$defaults", """\
この会社の窓口が works-dispatch の --land（dispatch.py --land <部署の名前>）で、部署のブランチを main に入れること。\
main への取り込みは、人のレビューの代わりに、会社の形（.claude/company.toml）の [land] のゲートを通してから fast-forward する決まりで、持ち主がこの会社の窓口と部署に許している。"""] }

# 作業: 一度きりの作業をする一時の部署。頼みごとに立ち、main に入れたら畳まれる
[[roles]]
name = "作業"
model = "opus"
effort = "medium"   # 再演で high の 56% の費用、漏れと誤りは同じだった（docs/model-replay.md）
holders = ["司令塔"]   # 役「担当」と同じ
deliver_check = "python3 works-dispatch/dispatch/terms.py --deliver"   # 役「担当」と同じ
# terms: english-begin
instructions = """\
For 「作業」, outside your duty means being asked to change a file that has a duty (the [[skills]] table) by someone other than that duty's 「担当」. \
An ask handed over with --take from a 「担当」's queue (4.3 of works-dispatch/docs/specs/2026-10-17-reception-design.md) and an ask in which the front desk (「窓口」) asks for an end-to-end fix of the organization or tools are not outside your duty. \
Fix the plugin you are asked to fix. \
When you receive a fix to the organization or tools themselves (the company shape, role texts, the rules in the root CLAUDE.md, plugins), do not split parts off to other departments; fix and land it in this conversation. \
Measure the effects you can measure on the spot and write them in the delivery; leave effects measurable only later as open questions, route a request to measure them to 「業務改革」 with --ask, and write that ask's id as the holder."""
# terms: english-end
[roles.settings]
permissions = { deny = ["Artifact", "Workflow", "ScheduleWakeup", "SendFeedback", "ReportFindings", "AskUserQuestion", "EnterWorktree"] }
enabledPlugins = { "superpowers@superpowers-marketplace" = false, "attention@raiki61" = false, "graphloops@raiki61" = false, "works@raiki61" = false, "works-factory@raiki61" = false, "document-skills@anthropic-agent-skills" = false }
skillOverrides = { dataviz = "off" }
autoCompactWindow = 1000000   # 役「担当」と同じ
promptCacheTtl = "1h"   # 役「担当」と同じ
autoMode = { allow = ["$defaults", """\
この部署が works-dispatch の --land（dispatch.py --land <自分の部署の名前>）で自分のブランチを main に入れること。\
main への取り込みは、人のレビューの代わりに、会社の形（.claude/company.toml）の [land] のゲートを通してから fast-forward する決まりで、持ち主がこの会社の部署に許している。"""] }

# 配布: 機械だけの役。main に入れるたびに [[land.after]] で呼ばれ、片づかなければ作業に回る（手で呼ぶなら dispatch.py --call 配布 spread-plugins）
[[roles]]
name = "配布"
machine = true

[[roles.tools]]
name = "spread-plugins"
title = "全アカウントに配る"
description = "works-dispatch の設定と手元の設定（~/.config/claude-plugins/spread.toml の accounts）の全アカウントで、この marketplace と入っているそのプラグインを更新し、marketplace に載っているのに入っていないプラグインを入れ（手元の設定の no_install の物は除く）、全アカウントに配った後に、入った版を origin/main の plugin.json の版と照合し（そろわなければ失敗に数える）、部署と窓口の会話に /reload-plugins を打つ（ターンの途中の会話と、入力フィールドに字の在る会話は飛ばす）"
inputSchema = { type = "object", properties = { dry_run = { type = "boolean", description = "true なら、することを出すだけで何も打たない" } }, additionalProperties = false }
command = "python3 scripts/spread-plugins.py"
fallback_role = "作業"

# CI の見張り: 機械だけの役。main に入れるたびに呼ばれ、知らせる物が在れば点検に回る。ツールは頼みの題の「/ci-watch 」で自分の頼みを見分けるので name を変えない
[[roles]]
name = "CI の見張り"
machine = true

[[roles.tools]]
name = "ci-watch"
title = "main の CI を見る"
description = "GitHub に登録された全部の workflow の main の run を読み、赤（最新の決着した run が失敗。最後の緑から最新の赤までの commit の範囲を添える）・止まった定期（最後の schedule の run が、過去の間隔の一番長い物と 1 日を足した長さより古い）・1 度も回っていない workflow・止められた workflow（状態が active でない）を知らせる。知らせた件は覚え、回した頼みが閉じていないうちは同じ件を知らせ直さない"
inputSchema = { type = "object", properties = { dry_run = { type = "boolean", description = "true なら、知らせる物を出すだけで覚えない" } }, additionalProperties = false }
command = "python3 tests/ci-watch.py"
fallback_role = "点検"

# 工場の版の見張り: 機械だけの役。main に入れるたびと部署が立つたびに呼ばれ、工場の CI の緑の新しい commit が在れば PIN を上げる（設計 docs/specs/2026-10-26-works-factory-pin-design.md）
[[roles]]
name = "工場の版の見張り"
machine = true

[[roles.tools]]
name = "works-factory-pin"
title = "工場の版の上げ先を見る"
description = "works-factory プラグインの工場の固定 commit（works-factory/PIN）の後に、raiki61/works-factory の main で CI（check の名 tests）が緑の commit が在るかを見る。在れば、スキルに効く変更を照合する（スキルが引いた語・パスの消え、本線と周の鎖の入力の出入り、WORKS_FACTORY_* の出入り、工場の README と殻の変更）。当たりが無ければ、代表の clone に一時のブランチを作って PIN と CHANGELOG を commit し、--land で main に入れて 0 で終わる（機械の上げ。その --land の合図で呼ばれたら黙る）。当たりが在るか機械の上げが失敗したら、上げ先・取り込む PR・照合の結果と、上げる手順（python3 scripts/works-factory-pin.py --write <上げ先の sha>）を出して 1 で終わり、作業に回る。知らせた上げ先は覚え、回した頼みが開いている間（工場を読む前に見る）と、閉じた後の同じ上げ先では知らせ直さない"
inputSchema = { type = "object", properties = { dry_run = { type = "boolean", description = "true なら、知らせる物を出すだけで覚えず、機械の上げも打たない" } }, additionalProperties = false }
command = "python3 scripts/works-factory-pin.py"
fallback_role = "作業"

# main に入れる決まり（works-dispatch の --land）。CI は待たず、check を手元で回してから fast-forward する（ff-after-ci の「ci」は check のこと）
[land]
mode = "ff-after-ci"
gate = "check"
# 軽い検査 → この変更が入力に当たるテスト → 初見の読み手の順（どのテストをどこで回すかは docs/adr/0076-land-runs-affected-tests.md）
check = "bash scripts/light-check.sh && python3 tests/land-check.py && python3 gates/hooks/coldread-gate.py branch-check --fixer works-dispatch/dispatch/terms.py"
bump = "marketplace"
queue = "land-queue"   # 同じ clone で同時に打った --land を 1 本ずつ通す列
batch = 4   # 列の先頭が後ろのブランチを最大 3 本重ねて 1 回の check で入れる。check は一時の worktree で回るので、追跡外のファイルに頼らない

[[land.after]]
role = "配布"
tool = "spread-plugins"

[[land.after]]
role = "CI の見張り"
tool = "ci-watch"

[[land.after]]
role = "工場の版の見張り"
tool = "works-factory-pin"

[[task.after]]
role = "工場の版の見張り"
tool = "works-factory-pin"

# 組織の決まり（スキルの決まりではない。設計は docs/specs/2026-10-16-company-shape-design.md の 4.12）
# - 名前は日本語の短い言葉にし、部署の名前に会社を付けない。ブランチの名前は英小文字とハイフン（fix/…・feat/…・work/…）。
# - 受け持ちの表は [[skills]] の 1 か所に置き、役の本文とコメントに写さない。担当への頼みは部署の名前で宛てる（--ask claude-plugins/<受け持ち>）。
# - 作業の名前は「<受け持ち>：<何をするか>」で 12 字くらいまで。並べるのは互いに独立した仕事だけで、組織やツールの直しは 1 つの部署で通しでやる。
# - 担当どうしも --ask で頼んでよい（役の名前 claude-plugins/担当 では宛てない）。順番待ちの 1 件は受付番号で --first・--withdraw・--take で扱う。
# - 頼んだ後の変更は --note <受付>、返事の要らない一言は --say <宛先> で送り、ほかの会話のペインに直に打たない（works-dispatch/docs/specs/2026-10-17-reception-design.md の 4.4・4.5）。
