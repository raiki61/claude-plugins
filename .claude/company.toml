# 会社の形: このリポジトリで作業ごとの会話を立てるときの、役ごとの指示・起動の設定と gh のアカウント。
# 読むのは works-dispatch。書き方は works-dispatch/skills/dispatch/SKILL.md の「役の中身と起こし方」。
# 外す道具とプラグインは、持ち主のノートの測り（会話を起こしただけで読み込む量の内訳。2026-10-16）による。
# pr-review-toolkit は外さない。convergence-loops が依存に持ち、切ると convergence-loops も消える。
# AskUserQuestion と EnterWorktree も外す（割り振りの測り 2026-10-17。2 つで最初の要求が約 3k トークン減る）。部署の問いは納品で返す決まりで、画面で聞いても誰も答えない。
# 部署は dispatch が先に作った作業場で働くので、別の worktree に移る道具は要らない。
# pr-review-toolkit のサブエージェントも一覧から外さない（Agent(<名前>) の deny）。/review-loop が使う review-pr が 6 つとも呼ぶ。
# 長い文字列は """ で囲み、文の切れ目の行末に \ を置いて折る。行末の \ は改行と次の行の頭の空白を消すので、会話に入る字は 1 行で書いた時と同じ。

name = "claude-plugins"
description = "持ち主の Claude Code のプラグインと、それを配る marketplace"
gh_user = "raiki61"

default_role = "作業"   # --task で --role を省いたときの役

[[skills]]
id = "plugin-fix"
name = "一度きりの直し"
description = "受け持ちの無い一度きりの直しと、担当が並べて進めたい直しを、一時の作業の部署で受ける"
role = "作業"

[[skills]]
id = "dispatch"
name = "割り振り"
description = "works-dispatch と tiers の直し（部署の立て方・頼みと納品・本流に入れる命令と、道具の点検）"
role = "担当"

[[skills]]
id = "gates"
name = "点検"
description = "gates の直し（書き込み前の関門・初見読みなど）と、CI・根の tests/ の直し"
role = "担当"

[[skills]]
id = "convergence"
name = "見直し"
description = "convergence-loops と graphloops の直し（レビュー・調べ・初見読みなどの収束の工程と、そのグラフ）"
role = "担当"

[[skills]]
id = "attention"
name = "見渡し"
description = "attention の直し（自分の番の PR の見渡しと /catchup）"
role = "担当"

[[skills]]
id = "docs"
name = "説明書"
description = """\
プラグインをまたぐ文書（根の README・CLAUDE.md・CONTRIBUTING.md・docs/。docs/trials/ と docs/standards/ は除く）と、会社の形（.claude/company.toml と設計の docs/specs/2026-10-16-company-shape-design.md）の直し。\
会社の形の中身を決めるのは持ち主と窓口で、説明書は書く"""
role = "担当"

[[skills]]
id = "standards"
name = "標準"
description = """\
プラグインをまたぐ標準（書き方・作りの揃え方）を docs/standards/ に作り、プラグインごとのずれを見つけて綺麗にし続ける。\
ずれの直しは各プラグインの担当に、標準を機械で守らせる検査（CI・根の tests/）は点検に、根の README・CLAUDE.md・CONTRIBUTING.md から標準を指す直しは説明書に頼む"""
role = "担当"

[[skills]]
id = "trials"
name = "試し"
description = "まっさらな環境・Windows・Linux（Colima の Docker）でプラグインを入れて試し、詰まりを docs/trials/ に記録する"
role = "担当"

# 担当: 受け持ちごとに常設で 1 つ（resident = true なので、--resident を付けなくても常設の部署で立つ）。受け持ちは部署の名前で決まる
# fresh = true で、頼みごとに空の会話で受ける（持ち主の決め 2026-10-17「担当＝常設・毎回空」。--ask が前の頼みを納品し終えた担当に /clear を打ってから頼む）
[[roles]]
name = "担当"
resident = true
fresh = true
instructions = """\
受け持ちを常設で預かる。\
自分の受け持ちは作業場の名前（部署の名前）で決まり、その中身は会話の始まりに足される。\
境目: プラグインのフォルダの中（README・tests など）はそのプラグインの担当の物。\
works と works-factory は誰の受け持ちでもなく、触らない。\
試しと標準の担当はプラグインを直さず、直しはその受け持ちの担当に頼む。\
頼みの前提や作り方に異論・代案があるとき、または頼みそのものが受け持ちの外のときは、頼みに「その通りに進めて」とあっても作らず、それだけを納品で返す（結論に「異論があるので作っていない」と要点を、決め手に根拠の URL〔原典か、根拠のファイルの GitHub の URL〕を、残った疑問に代案か回す先の部署の名前を書く）。\
頼みを受け、自分で進めるか、並べたいときは作業に頼む（--ask claude-plugins/作業 に --task <受け持ち>：<何をするか> --branch <枝> を添える）。\
常設なので、作業場は同じまま、頼みごとに git fetch origin してから origin/main から決まりどおりの名前の枝を切って作業する。\
済んだら、自分で works-dispatch の本流に入れる命令（--land <自分の部署の名前>）を打つ。\
本流が先に進んでいて止まったら、自分で origin/main の上に載せ直して push し、打ち直す。\
入ったら納品の命令で返す。\
--land が自動の権限の判定（auto mode）に止められたら、打ち直さず、止められたことを納品の残った疑問に書いて返す（窓口が --land <部署の名前> を打って入れる）。\
版は上げない・CI は待たない・試験は触ったプラグインの物だけ。\
納品の後は commit しない（初見読みの指摘は入れる前に直す）。\
納品の後に窓口や持ち主の判断が要ることが出たら（手元に残った変更の扱い・次の頼みの候補など）、画面に書いて止まらず、もう一度納品の命令（--deliver）で返す（画面にだけ書いた問いは窓口に届かない）。\
受け持ちの外のファイルを変える必要が出たら、その受け持ちの担当に部署の名前で頼む（--ask <受け持ち>）。\
受け持ちの無いファイル（根の scripts/ など）は作業に頼む。"""
[roles.settings]
permissions = { deny = ["Artifact", "Workflow", "ScheduleWakeup", "SendFeedback", "ReportFindings", "AskUserQuestion", "EnterWorktree"] }
enabledPlugins = { "superpowers@superpowers-marketplace" = false, "attention@raiki61" = false, "graphloops@raiki61" = false, "works@raiki61" = false, "works-factory@raiki61" = false, "document-skills@anthropic-agent-skills" = false }
skillOverrides = { dataviz = "off" }
# autoMode.allow は、自動の権限の判定（auto mode）の組み込みの拒否への例外（"$defaults" で組み込みの決まりを残す）。--land は本流へ早送りするので
# 「Merge Without Review」として止められることがある。人のレビューの代わりに [land] の関門を通す決まりだと書いて止めない（https://code.claude.com/docs/en/auto-mode-config）
autoMode = { allow = ["$defaults", """\
この部署が works-dispatch の --land（dispatch.py --land <自分の部署の名前>）で自分の枝を本流に入れること。\
本流への取り込みは、人のレビューの代わりに、会社の形（.claude/company.toml）の [land] の関門を通してから早送りする決まりで、持ち主がこの会社の部署に許している。"""] }

# 作業: 一度きりの作業をする一時の部署。頼みごとに立ち、本流に入れたら畳まれる
# effort は medium（2026-10-17。使う量と 5 時間の上限を減らすため。モデルは替えず effort を下げる。済んだ頼み 2 件の再演で、
# Opus・medium は費用が high の 56% で、漏れと誤りは high と同じ 2 件。docs/model-replay.md）。担当は今回は既定のまま
[[roles]]
name = "作業"
effort = "medium"
instructions = """\
頼みの前提や作り方に異論・代案があるとき、または頼みそのものが受け持ちの外のときは、頼みに「その通りに進めて」とあっても作らず、それだけを納品で返す（結論に「異論があるので作っていない」と要点を、決め手に根拠の URL〔原典か、根拠のファイルの GitHub の URL〕を、残った疑問に代案か回す先の部署の名前を書く）。\
作業にとっての受け持ちの外は、受け持ちの有るファイル（[[skills]] の表）の直しを、その担当からでなく頼まれたとき。\
頼まれたプラグインを直す。\
試験は触ったプラグインの物だけを回し、CI は待たない。\
版は上げない（本流に入れる命令が上げる）。\
済んだら、自分で works-dispatch の本流に入れる命令（--land <自分の部署の名前>）を打つ。\
本流が先に進んでいて止まったら、自分で origin/main の上に載せ直して push し、打ち直す。\
入ったら納品の命令で返す。\
--land が自動の権限の判定（auto mode）に止められたら、打ち直さず、止められたことを納品の残った疑問に書いて返す（窓口が --land <部署の名前> を打って入れる）。\
納品の後は commit しない（初見読みの指摘は入れる前に直す）。\
納品の後に窓口や持ち主の判断が要ることが出たら（手元に残った変更の扱い・次の頼みの候補など）、画面に書いて止まらず、もう一度納品の命令（--deliver）で返す（画面にだけ書いた問いは窓口に届かない）。"""
[roles.settings]
permissions = { deny = ["Artifact", "Workflow", "ScheduleWakeup", "SendFeedback", "ReportFindings", "AskUserQuestion", "EnterWorktree"] }
enabledPlugins = { "superpowers@superpowers-marketplace" = false, "attention@raiki61" = false, "graphloops@raiki61" = false, "works@raiki61" = false, "works-factory@raiki61" = false, "document-skills@anthropic-agent-skills" = false }
skillOverrides = { dataviz = "off" }
# autoMode.allow は、自動の権限の判定（auto mode）の組み込みの拒否への例外（"$defaults" で組み込みの決まりを残す）。--land は本流へ早送りするので
# 「Merge Without Review」として止められることがある。人のレビューの代わりに [land] の関門を通す決まりだと書いて止めない（https://code.claude.com/docs/en/auto-mode-config）
autoMode = { allow = ["$defaults", """\
この部署が works-dispatch の --land（dispatch.py --land <自分の部署の名前>）で自分の枝を本流に入れること。\
本流への取り込みは、人のレビューの代わりに、会社の形（.claude/company.toml）の [land] の関門を通してから早送りする決まりで、持ち主がこの会社の部署に許している。"""] }

# 配布: 機械だけの役（machine = true。AI の部署を持たない）。道具「全アカウントに配る」（scripts/spread-plugins.py）だけを持つ。
# 本流に入れるたびに下の [[land.after]] の合図で呼ばれ、片づかなければ（1 つでも失敗したら）作業に回る（名前「配布：全アカウントに配る」の部署が立つ）。
# 手で呼ぶなら dispatch.py --call 配布 spread-plugins（--input '{"dry_run": true}' で空打ち）。どの会話に /reload-plugins を打つか
# （部署と窓口だけ）はこの組織の決まりなのでスクリプトに置き、その人だけの除外は ~/.config/claude-plugins/spread.toml の skip に置く。
# 配る先は works-dispatch の設定のアカウントと、同じ手元の設定の accounts（Claude Code を使うが部署は起こさないアカウント）
[[roles]]
name = "配布"
machine = true

[[roles.tools]]
name = "spread-plugins"
title = "全アカウントに配る"
description = "works-dispatch の設定と手元の設定（~/.config/claude-plugins/spread.toml の accounts）の全アカウントで、この marketplace と入っているそのプラグインを更新し、全アカウントに配った後に、入った版を本流（origin/main）の plugin.json の版と照らし（そろわなければ失敗に数える）、部署と窓口の会話に /reload-plugins を打つ（番の途中の会話と、入力欄に字の在る会話は飛ばす）"
inputSchema = { type = "object", properties = { dry_run = { type = "boolean", description = "true なら、することを出すだけで何も打たない" } }, additionalProperties = false }
command = "python3 scripts/spread-plugins.py"
fallback_role = "作業"

# 部署の成果を本流に入れる決まり（works-dispatch の --land）。持ち主の方針（2026-10-16）: CI は待たない。
# 関門は部署が手元で回した、触ったプラグインの試験で、ここでは写しの一致を機械で確かめる。版は取り込むときに上げる
# 件数の柵（tests/run.sh の EXPECTED_CHECKS と pytest の EXPECTED_ITEMS）も、試験を走らせずに数えて確かめる（tests/count-fences.sh。10 秒ほど）
# 最後に、枝が書いた文書を初見の読み手に読ませ、詰まりが在れば止める（gates の branch-check。推測で埋めた箇所だけなら通す。読み 1 回に 2〜4 分。
# 同じ中身の判定は覚えるので、載せ直しの打ち直しでは読み直さない）。安い関門を先に、遅い初見読みを最後に並べる
# mode の名前 ff-after-ci は「関門の後に早送り」の意味で、関門が CI とは限らない。ここは gate = "check"（手元の検証）なので CI を待たない
[land]
mode = "ff-after-ci"
gate = "check"
check = "python3 scripts/shared-copies.py && bash tests/count-fences.sh && python3 gates/hooks/coldread-gate.py branch-check"
bump = "marketplace"

# 本流に入れた後の合図: 全アカウントに配る（出荷のたびに窓口が手で配っていた物。片づかなければ作業に回り、頼み元は本流に入れた部署の頼み元）
[[land.after]]
role = "配布"
tool = "spread-plugins"

# 組織の決まり（この会社の作り方。スキルの決まりではない）
# - 名前は日本語の短い言葉にする（英語や会社らしい呼び名にしない。持ち主 2026-10-16「会社っぽくなくていい」「日本語で」）。
#   herdr のサイドバーには、作業場の木（親＝リポジトリ、子＝worktree）と、会話の行（作業場の名前・役・枝）が出る。
#   会社の名前は親の作業場にだけ出るので、部署の名前（--task・--ask に渡す名前。作業場・会話の名前になる）に会社を付けない。
# - 役は 5 つ: 窓口（持ち主と話す本社の会話。役の項目は要らない）・担当（受け持ちに常設）・作業（一度きり）・配布（機械だけ）・相談（この会社の形には置かない）。
# - 担当: 受け持ちごとに 1 つ。部署の名前を受け持ちの名前にし、自分の受け持ちはその名前で決まる。
#   受け持ちの表（どの受け持ちが何のファイルを持つか）は [[skills]] の 1 か所に置く（name が部署の名前、description が中身。works-dispatch の
#   役を足すフックが、部署の名前と同じ name の description を会話の始まりに足す）。役の本文と、このコメントに写さない。
#   役の本文とここに書くのは、表に載らない境目の決まりだけ（次の 3 行）:
#   試しと標準の担当はプラグインを直さず、直しはその受け持ちの担当に頼む。
#   プラグインのフォルダの中（README・tests など）は、そのプラグインの担当の物。
#   works と works-factory は持ち主が別に回している所なので、受け持ちを作らず、どの担当も触らない。
#   担当への頼みは部署の名前で宛てる（--ask 割り振り。works-dispatch は部署の名前を役より先に当てる。
#   別の会社に同じ名前の部署が有れば --ask claude-plugins/割り振り）。担当は 1 つの会社に幾つも有るので、役（--ask claude-plugins/担当）では宛てない。
#   担当がまだ居ない受け持ちは --task <受け持ち> --branch work/<英小文字> --role 担当 --resident で立てる。
#   担当の部署は片付けで畳まれず、次の頼みを同じ作業場と窓で、空にした会話で受ける（fresh = true）。同じ受け持ちの直しは担当の中で順番に進むので、同じファイルの取り合いにならない。
# - 作業: 頼みごとに立って入れたら畳まれる一時の部署。受け持ちの無い一度きりの作業（根の scripts/ など。どれに受け持ちが有るかは [[skills]]）と、
#   担当が並べて進めたいとき（触るファイルが重ならない作業に限る）に使う。--ask claude-plugins/作業 に --task <名前> --branch <枝> を添えるか、
#   --task で直に立てる（--role を省けば default_role の作業になる）。
#   名前は「<受け持ち>：<何をするか>」（例: 「点検：文書の環境変数」）。作業場の名前になるので 12 字くらいまで。受け持ちの無い作業は何をするかだけでよい。
# - 担当どうしの連携: 担当は、ほかの担当と作業に頼む命令（--ask）で頼んでよい。頼んだ担当が頼み元になり、納品はその担当に返る。
# - 異論は作る前に返させる（持ち主 2026-10-17「トップダウンすぎ。部署にも反論させてよい」）。担当と作業は、頼みの前提や作り方への異論・代案と、
#   受け持ちの外の頼みを、作らずに納品で返す。返す口は今は納品しかないので、その書き方を担当と作業の本文に同じ文で持つ（TOML に共通の本文を引く書き方が無いため）。
#   担当の「受け持ちの外のファイルを変える必要が出たら頼む」は作っている途中の決まりで、頼みそのものが外のときのこの決まりとは別。
# - 枝の名前は英小文字とハイフンにする（git と GitHub の URL で崩れないため）。直しは fix/…、足すものは feat/…、調べや下書きは work/…。
# - 窓口とのやり取りは頼む命令（--ask）と納品の命令（--deliver）。途中で頼みを変えるときは、部署の窓に直接話しかける。
# - 設計は docs/specs/2026-10-16-company-shape-design.md の 4.12。
