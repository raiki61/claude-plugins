[pytest]
testpaths = .
# 期待外れの通過（XPASS）を失敗にする。xfail そのものは fence.py が飛ばしとして失敗にする
xfail_strict = true
addopts = -ra --strict-markers --strict-config
# -O（PYTHONOPTIMIZE）の下でも、pytest が書き換えるテストのモジュールの assert は効く。効かなくなるのは書き換えない物——runpy で
# 同じプロセスに起こす検証器（scripts/review-record.py）の不変条件の assert（PYTHONOPTIMIZE なら、環境を継ぐ子プロセスの側も）。
# pytest はその状態を PytestConfigWarning（"assertions not in test modules or plugins will be ignored"）で知らせるので、
# 警告を誤りにして設定の段で止める
filterwarnings =
    error::pytest.PytestConfigWarning
