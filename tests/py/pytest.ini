[pytest]
testpaths = .
# 期待外れの通過（XPASS）を失敗にする。xfail そのものは fence.py が飛ばしとして失敗にする
xfail_strict = true
addopts = -ra --strict-markers --strict-config
# -O（PYTHONOPTIMIZE）の下では assert が消え、判定が全部緑になる。pytest 自身がそれを PytestConfigWarning で知らせるので、
# 警告を誤りにして設定の段で止める（tests/run.sh が冒頭で同じ状態を止めているのと同じ意図）
filterwarnings =
    error::pytest.PytestConfigWarning
