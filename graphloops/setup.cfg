# 変異テストの道具 mutmut の設定。開発の間だけ使い、プラグインの実行時には誰も読まない。
# 回し方（作業ツリーの一時の写しの上で撃つ手順）の正本は graphloops/README.md の「検査」節。
# mutmut は import 名と置き場所が合う必要があるので、engine パッケージの親（この graphloops/）で回し、
# 作業用の写しを graphloops/mutants/ に作る。
# 鍵の名前は mutmut 3 の物（3.8.0 で確かめた。2 系の paths_to_mutate・tests_dir とは違う）。only_mutate を外すと
# engine/ の 9 本全部が撃たれ、付けると schema.py だけになる（2026-09-25 に両方を撃ち比べた）
[mutmut]
source_paths = engine/
only_mutate = engine/schema.py
# medium の印のテスト（子プロセス・git・盤面を端から端まで回す）は選ばない——変異 1 本ごとに走ると手で撃つ 1 回が大きく延びる。
# 1 行が 1 つの引数になる（mutmut 3 は値を改行で割る）
pytest_add_cli_args_test_selection =
    tests/py/
    -m
    not medium
also_copy =
    tests/
    scripts/
    graphs/
    prompts/
    rules/
    hooks/
    .claude-plugin/
