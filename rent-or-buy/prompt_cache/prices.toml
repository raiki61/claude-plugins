# LiteLLM に無い値。測った日と出どころを付ける。呼ぶ側が上書きできる。

[keepalive]
# keepalive 1 本がキャッシュに書くトークン数
write_tokens = 380
# keepalive 1 本の出力のトークン数
output_tokens = 5
# キャッシュの寿命が切れる何秒前に次の keepalive を送るか
margin_s = 60
measured = "2026-10-24"
source = "measured on one keepalive prompt; other prompts differ"

[compact]
# compact の後の文脈のトークン数
after_tokens = 25000
# compact の要約の出力のトークン数
summary_tokens = 5000
measured = "2026-10-24"
source = "example values, not measured"
