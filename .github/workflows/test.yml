name: test

# **起こすのは出荷の時の 1 回だけ**（持ち主の決め 2026-10-04）: release/** への push と手での起動（gh workflow run test.yml --ref <枝>）。
# wip/* と main への push・pull_request では走らせない——main へは release/* で緑になった同じ sha を早送りするので回し直さない。
# 版の据え置きを赤にする検査（tests/run.sh の VERSION_BUMP_OK）は release/* で厳しく効く。形は tests/run.sh の CI_LINT_OK が縛る
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

# checkout して台本を走らせるだけなので、GITHUB_TOKEN は読むだけにする
permissions:
  contents: read

# **job は 4 種**（2026-09-29）: 重い筋書きの台本の一式を OS × 組（shard）に分けて並べる test、pytest の置き場を丸ごと回す pytest、
# 全組の名簿を集めて件数の和と全台本の和で見る検査を 1 か所で当てる shards、works の試験の全段を回す works。1 job に閉じていた頃は Windows が 18 分で律速だった
# （tests/run.sh 962 秒のうち graphloops の台本が 808 秒。runner の CPU は 4 で、job の中の並列はそこで頭打ち）。
# 組の数 4 は macOS の同時実行の枠 5（組 4＋pytest 1）と全体の枠 20（組 12＋pytest 3＋まとめ 1）から。works の 1 本を足すと
# macOS は 6 本で 1 本が列に並び、全体は 17 本（待ちの延びは持ち主が通した。2026-09-29）。
jobs:
  test:
    strategy:
      # 片方が落ちてももう片方の結果を見る。ここで直したバグは 2 件とも Windows 固有で、
      # 「他の OS では通っていた」ことが分かって初めて原因が絞れた。
      fail-fast: false
      matrix:
        os: &os [ubuntu-latest, macos-latest, windows-latest]
        # 組の番号は 0..N-1 を欠けなく並べ、N を下の段の GL_SHARD_TOTAL に書く（食い違えば tests/run.sh の CI_LINT_OK が赤にする）
        shard: [0, 1, 2, 3]
        # **欠けてよい能力の一覧（tests/run.sh の SKIP_ALLOW）は OS ごとに書き、既定は空。** include に無い OS は何も許さない。
        # 書くのはその OS で本当にできない物だけ——道具で無くせる見送り（shellcheck）は道具を入れて無くす。
        # 名前は見送りの行の「# SKIP <能力>:」の頭。一覧に無い名前の見送りは、下の FAIL_ON_SKIP=1 で赤になる
        # version-bump だけは OS でなく枝の都合: 版の据え置きは main・release/* の枝でだけ赤にし、ほかの枝（手での起動）では見送りで一覧を出す
        # （tests/run.sh の VERSION_BUMP_OK）。main・release/* ではその検査が見送りを出さないので、許しても効かない
        include: &skip_allow
          - os: ubuntu-latest
            skip_allow: "version-bump"
          - os: macos-latest
            skip_allow: "version-bump"
          - os: windows-latest
            skip_allow: "posix-mode process-group fifo read-permission version-bump"
    runs-on: ${{ matrix.os }}
    steps:
      # 履歴を丸ごと取る。tests/run.sh の VERSION_BUMP_OK が、plugin.json の version を最後に変えた commit より後の変更を
      # 履歴から引く（既定の深さ 1 では辿れず、その検査は赤になる）
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # **README が宣言した最小版を 1 本固定して測る。** runner の既定に任せると、宣言した下限で
      # 通るかを誰も測っていない状態になる（実測 2026-09-12: 必須要件が 3.8 のまま graphcheck.py が
      # graphlib（3.9 追加）を import していたのに、版を固定していないので CI は緑のままだった）。
      # 数値は README の「必須」の行と揃える——片方を上げたらもう片方も上げる（tests/run.sh の突合が両方向で赤くする）。
      # 3.9 から 3.12 へ上げた（2026-09-13）: 手元の python は 3.14 で、3.9 でだけ落ちる構文（f-string の中の
      # 同じ引用符の入れ子は 3.12 以降）が手元の全件緑をすり抜けて 3 OS すべてを赤にした。ast.parse の
      # feature_version=(3,9) もこの差を捕まえない（構文木でなくトークナイザの違い）。**測れない下限を宣言しない**
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # **shell の静的検査は定番解（shellcheck）で。** 自作の正規表現は for の位置しか見なかった。
      # runner の既定では ubuntu にしか無く（版も手元と違う）、tests/run.sh の中の同じ検査が macOS と Windows で
      # 見送りになっていた。3 OS とも PyPI のホイールで同じ版を入れ、見送り自体を無くす（pytest と同じく版を固定する）。
      - name: install shellcheck
        shell: bash
        run: python -m pip install shellcheck-py==0.11.0.1
      # 独立した段は 3 OS のうち 1 本だけで回す（tests/run.sh の中の同じ検査と ubuntu で二重に走るのは数秒で、段を残しても能力は減らない）。深さは tests/run.sh の
      # 手元の検査と同じ -S warning——片方だけ深くすると、手元で緑・CI で赤（またはその逆）になって、どちらが正本か分からなくなる。
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 0
        shell: bash
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S warning
      # shell: bash を明示しないと Windows では PowerShell になり、pipefail も付かない。
      # 組の指定は段の env で渡す（runner の文脈は job の env では使えない）。tests/run.sh は graphloops の 1 検査にだけ渡す
      - name: tests/run.sh
        shell: bash
        env:
          GL_SHARD_TOTAL: "4"
          GL_SHARD_INDEX: ${{ matrix.shard }}
          GL_SHARD_GROUP: ${{ matrix.os }}
          GL_SHARD_MANIFEST: ${{ runner.temp }}/gl-shard
          FAIL_ON_SKIP: "1"
          SKIP_ALLOW: ${{ matrix.skip_allow }}
        run: bash tests/run.sh
      # 組の名簿（件数・台本の本数・全台本の和で見る検査の到達）を shards へ渡す。名前は組ごとに別（v4 は同じ名前を複数の job から上げられない）
      - name: upload shard manifest
        uses: actions/upload-artifact@v4
        with:
          name: gl-shard-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/gl-shard
          if-no-files-found: error
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: *os
        include: *skip_allow
    runs-on: ${{ matrix.os }}
    steps:
      # 台帳（graphloops/tests/py/ledger.py）は前の版で見張っていた台本を基の git の版から読むので、全履歴を取る
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # **pytest の置き場（graphloops/tests/py/）を丸ごと回す。** 依存は開発の間だけで、ここで入れる（README の必須には
      # 足さない）。版を固定するのは、手元と CI で柵（fence.py）が使う pytest のフックの振る舞いを揃えるため。
      # 置き場を丸ごと渡すので件数の柵（conftest.py の EXPECTED_ITEMS ほか）が当たる——パスを絞ると柵が外れる。
      # -n（pytest-xdist）でプロセス単位に並べる。柵は worker の数えた値を controller が集めて当てる（fence.py）。
      # 台帳の基の版は push の直前の版（buf-action の breaking_against の既定と同じ向き。新しい枝の最初の push は 0 の sha、手での起動は空で、
      # どちらも台帳は HEAD と main との merge-base に戻る）
      # **pytest の CPU 時間をログに残す**（効き目の報告。段の秒は REST の jobs の started_at・completed_at で取れるが CPU は取れない）。
      # bash の組み込み times の 2 行目が子の user と sys の和で、pytest の前後の差が pytest（と xdist の worker）の CPU。
      # GitHub の bash は -e で起こすので、終了コードは rc に受けてから times を打ち、最後に返す
      - name: pytest
        shell: bash
        env:
          GL_LEDGER_BASE: ${{ github.event.before }}
          SKIP_ALLOW: ${{ matrix.skip_allow }}
        run: |
          python -m pip install pytest==9.1.1 pytest-xdist==3.8.0
          times
          rc=0; python -m pytest -n auto graphloops/tests/py || rc=$?
          times
          exit "$rc"
      # **ルートの pytest の置き場（tests/py/。検証器 scripts/review-record.py の表の検査）は別の起動で回す。** 柵（fence.py）は
      # 1 回の起動に 1 つの置き場しか載せない。件数の柵（tests/py/conftest.py の EXPECTED_ITEMS）が当たるよう置き場を丸ごと渡す
      - name: root pytest
        shell: bash
        env:
          SKIP_ALLOW: ${{ matrix.skip_allow }}
        run: |
          times
          rc=0; python -m pytest tests/py || rc=$?
          times
          exit "$rc"
  # **works の試験の全段（works/tests/run.sh を WORKS_TESTS 無しで）を回す。** 手元の入口と段分けはそのまま起こし、版は CI の側で揃える。
  # OS は全段が今緑の物だけ（持ち主の条件: 共有の門を赤にしない）。ubuntu と windows は試験の側に macOS／POSIX の前提が残る
  # （ubuntu: test_adapter.py の FenceCase が一時の置き場の実体を /private/var と決め打つ。windows: 全段を実機で回して測っていない
  # ——読み込みで落ちる os.geteuid と、プロセスのグループの見送りの名前は直した）。直してから os に足す——continue-on-error で黙って通さない
  works:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        # 許しの一覧は works の job が自前で持ち、works が実際に出す能力の名前だけを OS ごとに include に書く（共有の *skip_allow は引かない
        # ——works が出さない名前まで許す）。鍵の名前と 1 行の形は共有の一覧と分けるため（graphloops/tests/py/test_mutate_shard.py
        # が「- os: … / skip_allow:」の行を共有の一覧として読む）。名前は works/tests の見送りの「SKIP <能力>:」の頭:
        # local-branch は checkout が枝をローカルに作らないので test_adapter の wip/works-a2 が引けない（全履歴の commit を引く見送りの
        # git-history は許さない——fetch-depth: 0 で引けるはずで、引けなければ台帳の commit が届かない赤として門で止める）。
        # board-replay-full は通しの再生の全部を WORKS_BOARD_REPLAY=full の時だけ回す明示の選択（持ち主の条件: 手元の見送りの数は残す）
        include:
          - {os: macos-latest, works_skip_allow: "local-branch board-replay-full"}
    runs-on: ${{ matrix.os }}
    steps:
      # works の試験は git の全履歴を引く（test_adapter・test_impact ほか）
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      # **依存の版は setup-python の解釈系に入れて固定する。** run.sh の uv run --with pyyaml（と dev/tdd-suite.sh の --with pytest）は、
      # 基の解釈系が要件を満たせばそれを使い、網から最新を引かない（uv の「Base environment satisfies requirements」）。
      # uv の UV_CONSTRAINT・UV_EXCLUDE_NEWER は --with の解決に効かない（uv 0.11.29 で実測 2026-09-29）。pytest は pytest の job と同じ版
      - name: install works test deps
        shell: bash
        run: python -m pip install pyyaml==6.0.3 pytest==9.1.1
      # uv の版は mutation.yml の setup_uv と同じ値（tests/run.sh の CI_LINT_OK が一致を見る）
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.29"
      # UV_PYTHON で uv が起こす解釈系を上の 3.12 に決める（uv の既定は自分の管理する版を選びうる）。落とし直しも禁じる
      - name: works/tests/run.sh
        shell: bash
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
          SKIP_ALLOW: ${{ matrix.works_skip_allow }}
          FAIL_ON_SKIP: "1"
        run: sh works/tests/run.sh
  # **全組を待って和を検算する。** 組は自分の分しか数えないので、件数の柵（EXPECTED_CHECKS・EXPECTED_TESTS）と全台本の和で見る
  # 検査（判定語彙の到達・渡し方の当たり）はここでしか当たらない。--groups は test の matrix の os と同じ並び（CI_LINT_OK が縛る）
  shards:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: download shard manifests
        uses: actions/download-artifact@v4
        with:
          pattern: gl-shard-*
          path: gl-shards
      - name: shards
        shell: bash
        run: python graphloops/tests/parallel.py merge --groups ubuntu-latest,macos-latest,windows-latest gl-shards/*
