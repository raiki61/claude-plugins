name: mutation-shards

# 版の関門（仕組みと運用の正本は graphloops/README.md の「版の関門」）。
# 台本（tests/mutate.py の DRIVERS）に触れた push は、柵の側を緩めた変更を差分の腕では拾えないので一覧の腕を全部撃つ
on:
  push:
    branches: [main, "release/**"]
  # 見逃しを殺すテストだけを足した push では元の差分の腕が作られないので、元の基点を渡して手で撃ち直す口
  workflow_dispatch:
    inputs:
      base:
        description: 撃ち直す差分の基点（findings の measured に在る基点。空なら push と同じ決め方）
        required: false
        default: ""

# checkout と成果物の上げ下ろしだけなので、GITHUB_TOKEN は読むだけにする。secrets は使わない
permissions:
  contents: read

jobs:
  shards:
    runs-on: ${{ matrix.os }}
    strategy:
      # 生き残りで exit 1 になった組が兄弟の組を取り消すと、まとめる job が組の欠けで赤になり結果が読めない
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 組の数 n は下の --shard に 8 と書く。ここの一覧と食い違えば、まとめる側の和の検算が組の欠けで赤にする
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
        with:
          # 基点の commit が要る（既定の 1 では git diff が落ちる）
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # shell: bash を明示しないと Windows では PowerShell になる。python3 は Windows の runner に無いので python で呼ぶ
      - name: 基点と撃ち方を決める
        id: plan
        shell: bash
        # 手で打つ入力は run の本文に式で埋めず、中間の環境変数で受けて SHA に直してから出力する
        env:
          BASE_IN: ${{ inputs.base }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref_name }}
        run: |
          # 基点: 入力が在ればそれ（引けなければ既定に倒さず赤）、無ければ push の前の版、それも無い・引けない（枝を作った
          # push・強制 push・手の起動）なら、今の枝を除く版の枝のうち版名が最大の枝との分岐点、無ければ main との分岐点
          if [ -n "$BASE_IN" ]; then
            base=$(git rev-parse --verify --quiet "$BASE_IN^{commit}") || { echo "::error::入力の基点 $BASE_IN を引けない"; exit 1; }
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            prev=$(git for-each-ref --sort=-v:refname --format='%(refname:short)' 'refs/remotes/origin/release/' | grep -vx "origin/$REF" | head -n 1)
            base=$(git merge-base HEAD "${prev:-origin/main}")
          fi
          drivers=$(python -c "import sys; sys.path.insert(0, 'tests'); import mutate; print(' '.join(mutate.DRIVERS))")
          # shellcheck disable=SC2086
          if git diff --quiet "$base" HEAD -- $drivers; then
            echo "narrow=--changed-since $base" >> "$GITHUB_OUTPUT"
          else
            echo "narrow=" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: tests/mutate.py（${{ matrix.os }} の組 ${{ matrix.shard }}/8）
        # 組の赤（生き残り・撃つ腕 0 本）は job を止めずに報告へ残し、関門の判定はまとめる job の 1 か所で行う
        # （欠け・撃ち切っていない組はまとめる側の和の検算が赤にする）
        continue-on-error: true
        shell: bash
        run: >-
          python tests/mutate.py -j 4 --confirm-survivors --auto "${{ steps.plan.outputs.base }}" ${{ steps.plan.outputs.narrow }}
          --shard ${{ matrix.shard }}/8 --out shard-${{ matrix.shard }}.json
      - name: 組の報告を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # v4 は同じ名前へ複数の job から上げられない
          name: mutation-shard-${{ matrix.os }}-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # OS ごとにまとめる（同じ腕でも OS で結果が分かれうる。混ぜると同じ k が OS の数だけ重なり、和の検算が赤になる）
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 成果物ごとに別のディレクトリへ展開する（merge-multiple は使わない。同じファイル名がぶつかったときの結果が定まっていない）
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-${{ matrix.os }}-*
          path: shards
      - name: 組をまとめる（和の検算）
        id: merge
        shell: bash
        run: |
          set +e
          python tests/mutate.py --merge shards/*/shard-*.json --out merged.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: 証拠にならない腕を findings に
        # まとめる段が赤（生き残りが在る）の回こそ findings が要る——前の段の結果で飛ばさない
        if: always()
        shell: bash
        run: python tests/mutate.py --findings merged.json > findings.json
      - name: まとめた報告と findings を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-merged-${{ matrix.os }}
          path: |
            merged.json
            findings.json
      - name: 関門の結果
        if: always()
        shell: bash
        env:
          RC: ${{ steps.merge.outputs.rc }}
        run: |
          # 全組が『撃つ腕が 0 本』で揃った回（変異の腕に当たらない push）は赤にしない。それ以外はまとめる段の終了コード
          if python -c "import json, sys; d = json.load(open('merged.json', encoding='utf-8')); sys.exit(0 if d.get('empty') and not d.get('merge_problems') else 1)"; then
            echo "撃つ腕が 0 本の push"; exit 0
          fi
          exit "${RC:-1}"

  # pytest が覆うモジュールの変異（mutmut。設定は graphloops/setup.cfg）。生き残りの数で落とす形は作れない（文言だけの変異が残る）
  # ので job は赤にしない。mutmut は Windows で動かないので 2 OS
  mutmut:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: mutmut
        shell: bash
        working-directory: graphloops
        run: |
          python -m pip install mutmut==3.8.0 pytest==9.1.1
          set +e
          mutmut run --max-children 4
          echo "mutmut run の終了コード: $?" > ../mutmut-results.txt
          mutmut results >> ../mutmut-results.txt
          exit 0
      - name: mutmut の結果を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results-${{ matrix.os }}
          path: mutmut-results.txt
          if-no-files-found: error
