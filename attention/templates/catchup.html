<!--
catchup の雛形（1 件の PR に戻ってきた当事者向け）

■ 差し込み口（埋めるのは attention/scripts/lib/catchup_html.py。手で埋めない）
  - <title>: 件と件名
  - id="catchup-index": 一覧（index.html）の 1 行。一覧は各ページの頭のこれだけを読んで組み直す
  - id="data": {"data": catchup.py が組んだ事実（見出し・ターン・出来事・指摘・CI・差分・手元）, "fields": AI が書いたフィールド
    （headline・where・turn・next・unseen・explain・figure）}。形は catchup_html.py と attention/docs/catchup-spec.md のセクション 5
  PR でない対象（issue・commit・commit の範囲・手元のブランチ・会話の話題）は、材料の無いセクションを出さないだけで同じ雛形を使う。

■ 読者の仕事から組んだ 3 段（Endsley の状況認識: 知覚 → 理解 → 予測）
  5 秒  いまのターン: 誰のターンか・次の 1 手・止めているもの（CI・承認・未解決の会話）。最初の画面にこれだけを置く。
  1 分  この PR がすること（ページの主役。件名の直下に誰のターンの 1 行だけを置き、その下に来る）: ひとこと → 図 → 段落 → 変更点。
        図の形は AI が中身から選ぶ（箱と線・やり取り・画面・表・手順・値の対照・自由な HTML）。置き場所と動きは機械が持つ。
        いまのターン: ターン・次にやること・止めているもの（短い表）・前回から（文と、畳んだ出来事の記録）を 1 つのセクションに。同じことを 2 回出さない。
  5 分  指摘: GitHub のレビューのスレッドと同じ形（コードの断片 → 相手の発言 → その後の変更）。返事を書く所まで。
        変更: Files changed 相当。既定は「前回から」（私の最後の発言の後の commit）で、「PR 全体」に切り替えられる。

■ 削ったもの・畳んだもの
  - 材料の ASCII の帯（┏━━・#│・▼）は使わない。差分は本物の unified diff から作る。
  - 「その後に起きたこと」の 1 件ずつの行は出さない。ターンの受け渡しの図にまとめ、発言の本文は指摘のスレッドで読む。
  - 「つながっている先」は、閉じる issue だけを見出しに出す。ほかの番号は本文の中でリンクになる。
  - 変更ファイルの木・同じ階層の既存ファイル・PR の本文の写しは出さない（GitHub の Files changed へのリンクで足りる）。
  - 「見ていないもの」は末尾に畳む。

■ 先行例から採ったもの（原典は各製品の公式の文書と画面）
  - 誰のターンかを一番上に、理由つきで: Gerrit の Attention Set（ダッシュボードの一番上が「Your turn」、なぜ足されたかを出す）、
    Reviewable の「waiting on」、Graphite の inbox の「Returned to you」。ここでは「私の番」の札と、止めているものの行に理由を書く。
  - 止めているものの一覧: GitHub のマージボックス（merge box。checks・review の要否・未解決の会話を行で並べる）の形をそのまま使う。
  - 既定は「前回から」の差分: Reviewable は開くと次に見るべきと考える差分を出し（前回見ていたものとは限らない）、file の行列で
    最後に review した revision から最新までに一度で揃えられる。Graphite は review の後に
    更新されると「hide reviewed changes」で最後に見た版との比べに替え、Gerrit は前に見た patch set と今の patch set を比べられる。
    GitHub は Viewed の後で file が変わると「Changed since last view」を付ける。ここでは「前回から変更あり / 変わっていない」の札と、
    変更のセクションの既定を「前回から（私の最後の発言の後の commit）」にした。
  - 指摘は GitHub のレビューのスレッドの形（コードの断片 → 発言の順）。resolved のスレッドは GitHub が畳むので、材料も未解決だけを出す。
    発言の本文は GitHub と同じく Markdown として描く（太字・コードの囲み・箇条・リンク）。
  - ターンの動き: GitHub の PR の会話の流れ（左の縦線の上に出来事の印、横に誰が・何を・いつ）。以前の横の帯の図は、字が小さく
    点の名前が重なって読めなかった（2026-10-16）ので替えた。
■ 先行例から採らなかったもの
  - タブ（GitHub の Conversation / Files changed、Gerrit のコメントのタブ）: 1 列の webview で上から読むので、3 段を 1 枚に縦に並べた。
  - Viewed の印・review 済みの印（GitHub・Gerrit・Reviewable）: 印の状態は GitHub 側にあり、この 1 枚は読むだけで書き戻さない。
  - Reviewable の討議の disposition（Blocking・Satisfied など）と Graphite の stack: GitHub に対応するフィールドが無い。

■ 採ったもの（部品）
  - 見た目の土台: GitHub Primer の色の token（@primer/primitives 11.10.0（MIT）の functional/themes の light / dark の値。10.3.4 と同じ値）。
    token の名前も Primer のまま使う（--fgColor-default など）。文字は GitHub の system font と mono の並び。
  - 差分: diff2html 3.4.56（MIT, https://github.com/rtfpessoa/diff2html）の diff2html-ui-base を埋め込み、
    line-by-line・行の対応づけ（matching: lines）・行の中の差（diffStyle: word）で描く。色は Primer の diffBlob の token に差し替え。
  - 構文の色: highlight.js 11.12.0（BSD-3-Clause, https://highlightjs.org/）の common の bundle を埋め込み、
    GitHub / GitHub Dark の theme（highlight.js 同梱の styles/github(-dark).css）の色を token にした。
  - 発言の Markdown: marked 15.0.12（MIT, https://github.com/markedjs/marked）の marked.min.js を埋め込み、GitHub Flavored Markdown
    （gfm・改行をそのまま改行に）で描く。生の HTML は描かずに文字としてエスケープし、リンクは http(s)・mailto・ページ内・相対だけ、
    画像は読み込まずにリンクにする（外を読まない・スクリプトを差し込ませない）。コードの囲みは highlight.js で色を付ける。
  - 図の箱と線の置き場所: @dagrejs/dagre 3.1.1（MIT, https://github.com/dagrejs/dagre）の dist/dagre.min.js を埋め込んだ。AI は箱と関係だけを
    宣言し、座標は書かない（LLM が SVG の座標を直に書くと崩れうる。関係を宣言して置き場所をツールに決めさせる形を採った）。
  - 出どころ: 5 つとも cdnjs / jsDelivr の版を固定した配布物を、作るときに取って下にそのまま埋め込んだ。実行時は外を読まない。
■ 採らなかったもの
  - diff2html の「Viewed」の印（fileContentToggle）: 印を付けると畳む作りで、畳んだ file が「見た」と読めてしまう。見出しを押して畳む形を自前で付けた。
  - diff2html の file の一覧（drawFileList）: 各 file の見出しが +/- と一緒に並ぶので重複する。
  - side-by-side: 表示の幅が 700〜1000px の 1 列なので、左右に割ると 1 行が短くなりすぎる。
-->

  line-height: 22px; border-radius: 2em; border: 1px solid var(--borderColor-default); color: var(--fgColor-muted); white-space: nowrap; }
.label.severe { background: var(--bgColor-severe-emphasis); border-color: transparent; color: var(--fgColor-onEmphasis); font-weight: 600; }
.label.severe-outline { border-color: var(--fgColor-severe); color: var(--fgColor-severe); }
.who-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--fgColor-muted); font-size: 13px; }
.headline { margin: 0; font-size: 15px; font-weight: 400; line-height: 1.6; }
.next { margin: 0; padding: 12px 16px; list-style: none; counter-reset: step; border-radius: 6px;
  background: var(--bgColor-accent-muted); border: 1px solid var(--borderColor-accent-muted); display: grid; gap: 4px; }
.next li { counter-increment: step; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: baseline;
  color: var(--fgColor-muted); font-size: 13px; line-height: 1.6; }
.next li::before { content: counter(step); font: 600 12px/20px var(--fontStack-mono); text-align: center; color: var(--fgColor-muted);
  border-radius: 50%; width: 20px; height: 20px; background: var(--bgColor-default); border: 1px solid var(--borderColor-default); }
.next li:first-child { color: var(--fgColor-default); font-size: 16px; font-weight: 600; padding-bottom: 6px; }
.next li:first-child::before { background: var(--bgColor-accent-emphasis); color: var(--fgColor-onEmphasis); border-color: transparent; }
.next .go { font-size: 13px; font-weight: 500; margin-left: 6px; white-space: nowrap; }
.checks { list-style: none; margin: 0; padding: 0; background: var(--bgColor-muted); }
.checks li { display: grid; grid-template-columns: 24px 7.5em minmax(0, 1fr); gap: 8px; align-items: center;
  padding: 8px 16px; border-top: 1px solid var(--borderColor-default); font-size: 13px; }
.checks .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--fgColor-onEmphasis); }
.checks .ok .ic { background: var(--bgColor-success-emphasis); }
.checks .warn .ic { background: var(--bgColor-attention-emphasis); }
.checks .mine .ic { background: var(--bgColor-severe-emphasis); }
.checks .neutral .ic { background: var(--bgColor-neutral-emphasis); }
.checks .bad .ic { background: var(--bgColor-danger-emphasis); }
.checks .k { font-weight: 600; }
.checks .v { color: var(--fgColor-muted); min-width: 0; }

/* ── セクション ── */
section.sec { margin-top: 40px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--borderColor-muted); }
.sec-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
.sec-head .sub { color: var(--fgColor-muted); font-size: 13px; }
.sec-head .tools { margin-left: auto; }

/* ── いまのターン（ターン・次の一手・止めているもの・前回から を 1 つのセクションに） ── */
#now .sec-head .label { align-self: center; }
#now .headline { max-width: var(--measure); margin: 0 0 14px; font-size: 17px; font-weight: 600; line-height: 1.6; }
.nb-card { max-width: calc(var(--measure) * 1.25); border: 1px solid var(--borderColor-default); border-radius: 8px; padding: 16px 18px; }
.nb-card .next.rest { margin-top: 6px; }
.next-more > summary { cursor: pointer; font-size: 12.5px; color: var(--fgColor-muted); margin-top: 6px; }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; padding: 0; }
.chips li { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border: 1px solid var(--borderColor-default); border-radius: 999px; font-size: 13px; }
.chips i { width: 8px; height: 8px; border-radius: 50%; background: var(--bgColor-neutral-emphasis); }
.chips .ok i { background: var(--bgColor-success-emphasis); } .chips .warn i { background: var(--bgColor-attention-emphasis); }
.chips .mine i { background: var(--bgColor-severe-emphasis); } .chips .bad i { background: var(--bgColor-danger-emphasis); }
.chips b { font-weight: 600; } .chips span { color: var(--fgColor-default); }
.nb-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px 32px; max-width: calc(var(--measure) * 2 + 32px); }
/* 図と変えたことの凡例を横に並べる（窓が 1200px 以上のとき）。凡例はスクロールしても見えたままにする */
.fig-key { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.fk-key { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.fk-key .pts-head { margin-top: 0; }
.fk-key .pk-body { padding-left: 14px; }
/* 目次（窓が 1200px 以上）。本文の左に固定する */
body.toc-on .wrap { padding-left: 236px; }
.toc { display: none; }
body.toc-on .toc { display: block; position: fixed; top: 16px; left: max(16px, calc((100vw - 1600px) / 2 + 16px)); width: 196px; max-height: calc(100vh - 32px); overflow: auto; font-size: 13px; }
.toc-h { font: 600 12px/1.4 var(--fontStack-mono); color: var(--fgColor-muted); margin: 6px 0 8px 10px; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li a { display: flex; gap: 6px; align-items: baseline; padding: 5px 10px; border-left: 2px solid var(--borderColor-muted); color: var(--fgColor-default); text-decoration: none; }
.toc li.toc-sub a { padding-left: 22px; font-size: 12.5px; color: var(--fgColor-muted); }
.toc li a:hover { background: var(--bgColor-muted); }
.toc li.cur a { border-left-color: var(--fgColor-accent); color: var(--fgColor-accent); font-weight: 600; }
.toc-n { margin-left: auto; font-size: 11.5px; color: var(--fgColor-muted); font-weight: 400; white-space: nowrap; }
/* 説明の右に「このセクションの語」。スクロールしても見えたまま */
.ex-row { display: grid; grid-template-columns: minmax(0, var(--measure)) minmax(240px, 420px); gap: 32px; align-items: start; }
.ex-side { position: sticky; top: 12px; }
.ex-side .terms { margin-top: 0; }
.ex-side .terms dl { grid-template-columns: minmax(0, 1fr); gap: 0; }
.ex-side .terms dd { margin-bottom: 8px; }
/* コードの大きな窓 */
.code-dlg { width: min(92vw, 1500px); max-height: 88vh; padding: 0; border: 1px solid var(--borderColor-default); border-radius: 10px; background: var(--bgColor-default); color: var(--fgColor-default); }
.code-dlg::backdrop { background: rgba(0, 0, 0, .45); }
.code-dlg-head { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: baseline; padding: 12px 16px; background: var(--bgColor-default); border-bottom: 1px solid var(--borderColor-default); }
.code-dlg-head .muted { font-size: 12px; overflow-wrap: anywhere; }
.code-dlg-head button { margin-left: auto; flex: none; padding: 3px 10px; border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--control-bgColor-rest); color: var(--fgColor-default); cursor: pointer; }
.code-dlg-body { padding: 12px 16px 16px; }
.nb-col .nb-turn, .nb-col .nb-where { margin: 0; }
.nb-h { font-size: 12px; font-weight: 600; color: var(--fgColor-muted); margin: 0 0 6px; letter-spacing: .02em; }
.nb-turn { margin: 8px 0 0; font-size: 14px; line-height: 1.65; }
.facts { padding-left: 1.2em; }
.facts li + li { margin-top: 4px; }
.facts li::marker { color: var(--fgColor-muted); }
#since .nb-h .muted { font-weight: 400; margin-left: 4px; }
.nb-where { margin: 0 0 8px; font-size: 14px; line-height: 1.7; }
.evlog > summary { cursor: pointer; width: max-content; max-width: 100%; font-size: 12px; color: var(--fgColor-accent); }
.evlog ol { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12.5px; display: grid; gap: 2px; }
.evlog li { display: grid; grid-template-columns: 9.5em max-content minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 2px 0; }
.evlog .t { font: 12px/1.6 var(--fontStack-mono); color: var(--fgColor-muted); }
.evlog li.me b { color: var(--fgColor-severe); }
/* ── 最初の画面: 誰のターンの 1 行（詳しくは「いまのターン」のセクション） ── */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: -8px 0 28px; padding: 8px 12px;
  border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-muted); font-size: 13px; }
.strip .nx { font-weight: 600; color: var(--fgColor-default); min-width: 0; }
.strip .go { margin-left: auto; white-space: nowrap; }

/* ── この PR がすること（ページの主役。要点 → 図 → 段落 → 変更点） ── */
.about .lead { max-width: var(--measure); margin: 0 0 18px; font-size: 19px; line-height: 1.7; font-weight: 500; text-wrap: pretty; }
.terms { max-width: var(--measure); margin: 4px 0 18px; padding: 10px 14px; border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-muted); font-size: 13px; }
.terms-h { font-size: 12px; font-weight: 600; color: var(--fgColor-muted); margin-bottom: 6px; }
.terms dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 0; color: var(--fgColor-default); }
.term { text-decoration: underline dotted var(--fgColor-muted); text-underline-offset: 3px; cursor: help; }
.terms .term { text-decoration: none; cursor: auto; }
figure.fig { margin: 0 0 20px; padding: 16px; border: 1px solid var(--borderColor-default); border-radius: 6px; overflow-x: auto; }
figure.fig figcaption { font-size: 12px; color: var(--fgColor-muted); margin-top: 10px; }
/* 図（graph）: AI が宣言した箱と線を、dagre が置き場所を決めて描く。前後で在る無しが違えば、同じ置き場所の
   まま「変更前」「変更後」の 2 枚に分けて上下に並べる（同じ箱は同じ位置に来るので、変わった所だけが目に入る） */
.g-scroll { overflow-x: auto; }
/* 窓より狭い図は真ん中に置く（左に寄ると右が空いて、図が小さく見える） */
.g-scroll > .g-panel { margin: 0 auto; }
.g-scroll > .g-row { justify-content: center; }
.g-row { display: grid; grid-template-columns: 3.5em max-content; align-items: start; gap: 8px; }
.g-row + .g-row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--borderColor-default); }
.g-row .ph { font-size: 12px; font-weight: 600; color: var(--fgColor-muted); padding-top: 14px; }
.g-side { display: flex; justify-content: center; align-items: flex-start; gap: 48px; }
.g-col .ph { font-size: 12px; font-weight: 600; color: var(--fgColor-muted); margin-bottom: 6px; }
.g-col + .g-col { border-left: 1px dashed var(--borderColor-default); padding-left: 24px; margin-left: -24px; }
.g-panel { position: relative; }
.g-svg { position: absolute; inset: 0; overflow: visible; }
.g-node, .g-measure .g-node { position: absolute; box-sizing: border-box; max-width: 210px; padding: 7px 11px; border-radius: 6px;
  border: 1px solid var(--borderColor-default); background: var(--bgColor-default); font-size: 13px; line-height: 1.45;
  text-align: center; overflow-wrap: anywhere; box-shadow: 0 1px 0 var(--borderColor-translucent); }
.g-measure { position: absolute; visibility: hidden; left: -9999px; top: 0; }
.g-measure .g-node, .g-measure .g-elabel { position: static; display: inline-block; }
.g-node .s { display: block; font-size: 11.5px; color: var(--fgColor-muted); margin-top: 2px; }
.g-node .tag { display: inline-block; font-size: 10.5px; font-weight: 700; line-height: 16px; padding: 0 5px; border-radius: 4px; margin-right: 4px; vertical-align: 1px; }
.g-node .chips { justify-content: center; margin-top: 5px; }
.g-node.good, .g-node.new { background: var(--bgColor-success-muted); border: 2px solid var(--fgColor-success); font-weight: 600; }
.g-node.bad { background: var(--bgColor-danger-muted); border: 2px solid var(--fgColor-danger); font-weight: 600; }
.g-node.gone { background: var(--bgColor-danger-muted); border: 2px dashed var(--fgColor-danger); color: var(--fgColor-danger); }
.g-node.new .tag { background: var(--fgColor-success); color: var(--fgColor-onEmphasis); }
.g-node.gone .tag { background: var(--fgColor-danger); color: var(--fgColor-onEmphasis); }
.g-node.hit { cursor: pointer; }
.g-node.hit:hover { border-color: var(--fgColor-accent); }
.g-node.sel { outline: 3px solid var(--fgColor-accent); outline-offset: 2px; }
.g-group { fill: var(--bgColor-muted); stroke: var(--borderColor-default); stroke-dasharray: 4 3; }
.g-glabel { position: absolute; font-size: 11.5px; font-weight: 600; color: var(--fgColor-muted); white-space: nowrap; }
.g-edge { fill: none; stroke: var(--fgColor-muted); stroke-width: 1.5; }
.g-edge.good { stroke: var(--fgColor-success); stroke-width: 2.2; }
.g-edge.bad { stroke: var(--fgColor-danger); stroke-width: 2; stroke-dasharray: 5 4; }
.g-edge.dashed { stroke-dasharray: 5 4; }
.g-elabel { position: absolute; transform: translate(-50%, -50%); max-width: 200px; padding: 1px 6px; border-radius: 4px; font-size: 11.5px;
  line-height: 1.4; text-align: center; color: var(--fgColor-muted); background: var(--bgColor-default); overflow-wrap: anywhere; }
.g-elabel.hit { cursor: pointer; border: 1px solid var(--borderColor-default); }
.g-elabel.hit:hover { border-color: var(--fgColor-accent); }
.g-elabel .chips { display: inline-flex; gap: 3px; margin: 0 0 0 4px; vertical-align: 1px; }
.g-elabel.good { color: var(--fgColor-success); font-weight: 600; } .g-elabel.bad { color: var(--fgColor-danger); } .g-elabel.gone { text-decoration: line-through; }
.g-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fgColor-muted); margin-top: 10px; }
.g-legend i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; font-style: normal; }
.g-legend .lg-new { background: var(--bgColor-success-muted); border: 2px solid var(--fgColor-success); }
.g-legend .lg-gone { background: var(--bgColor-danger-muted); border: 2px dashed var(--fgColor-danger); }
.g-legend .lg-hit { border: 1px solid var(--fgColor-accent); }
/* 箱を押すと、図のすぐ下に、その箱の変更点とコードを開く */
.g-detail { margin: -8px 0 20px; padding: 12px 16px; border: 2px solid var(--fgColor-accent); border-radius: 6px; }
.g-detail[hidden] { display: none; }
.g-detail-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.g-detail-head b { font-size: 14px; }
.g-detail-head button { margin-left: auto; font: inherit; font-size: 12px; border: 0; background: none; color: var(--fgColor-accent); cursor: pointer; }
.g-detail .pt-list { margin-bottom: 8px; }
/* やり取り（sequence）: 役者を列に、やり取りを上から順に。列の位置は機械が等分で決める */
.seq { min-width: calc(var(--n) * 130px); }
.seq-head { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 0 12px; margin-bottom: 4px; }
.seq-actor { justify-self: center; max-width: 100%; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--borderColor-default);
  background: var(--bgColor-muted); font-size: 13px; font-weight: 600; text-align: center; overflow-wrap: anywhere; }
.seq-body { position: relative; padding: 4px 0 10px; }
.seq-life { position: absolute; top: 0; bottom: 0; border-left: 1.5px dashed var(--borderColor-default); }
.seq-row { position: relative; padding: 6px 0 4px; }
.seq-msg { position: relative; border-top: 1.5px solid var(--fgColor-muted); margin-top: 3px; }
.seq-msg::after { content: ""; position: absolute; top: -5.5px; border: 5px solid transparent; }
.seq-msg.r::after { right: -2px; border-left: 7px solid var(--fgColor-muted); border-right: 0; }
.seq-msg.l::after { left: -2px; border-right: 7px solid var(--fgColor-muted); border-left: 0; }
.seq-lb { text-align: center; font-size: 12.5px; line-height: 1.4; padding: 0 6px; overflow-wrap: anywhere; }
.seq-row .no { font: 600 10.5px/1 var(--fontStack-mono); color: var(--fgColor-muted); margin-right: 4px; }
.seq-self { width: max-content; max-width: 45%; padding: 2px 8px; border-left: 3px solid var(--fgColor-muted); font-size: 12.5px; line-height: 1.4;
  background: var(--bgColor-muted); border-radius: 0 4px 4px 0; overflow-wrap: anywhere; }
.seq-msg.good { border-top: 2.5px solid var(--fgColor-success); } .seq-msg.good.r::after { border-left-color: var(--fgColor-success); } .seq-msg.good.l::after { border-right-color: var(--fgColor-success); }
.seq-row.good .seq-lb, .seq-self.good { color: var(--fgColor-success); font-weight: 600; } .seq-self.good { border-left-color: var(--fgColor-success); background: var(--bgColor-success-muted); }
.seq-msg.bad { border-top: 2px dashed var(--fgColor-danger); } .seq-msg.bad.r::after { border-left-color: var(--fgColor-danger); } .seq-msg.bad.l::after { border-right-color: var(--fgColor-danger); }
.seq-row.bad .seq-lb, .seq-self.bad { color: var(--fgColor-danger); } .seq-self.bad { border-left-color: var(--fgColor-danger); background: var(--bgColor-danger-muted); }
.seq-row.gone .seq-lb span:last-child, .seq-self.gone span:last-child { text-decoration: line-through; }
/* 値の前後: 名前・変更前・変更後を 1 行に */
.cmp { display: grid; grid-template-columns: minmax(6em, max-content) minmax(0, 1fr) 20px minmax(0, 1fr); gap: 0 10px; font-size: 13px; }
.cmp > div { padding: 7px 0; border-top: 1px solid var(--borderColor-muted); overflow-wrap: anywhere; }
.cmp .h { border-top: 0; font-size: 12px; font-weight: 600; color: var(--fgColor-muted); padding-top: 0; }
.cmp .nm { font-weight: 600; }
.cmp .bf { color: var(--fgColor-muted); }
.cmp .ar { color: var(--fgColor-muted); text-align: center; }
.cmp .af { font-weight: 600; }
.cmp .bad.af, .cmp .bad.bf { color: var(--fgColor-danger); } .cmp .good.af { color: var(--fgColor-success); }
.cmp .none { color: var(--fgColor-muted); font-style: italic; font-weight: 400; }
/* コマ送り（play）の操作と、光らせ方 */
.player { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: -4px 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--borderColor-muted); }
.pl-btn { font: inherit; font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  background: var(--bgColor-accent-emphasis); color: var(--fgColor-onEmphasis); }
.pl-btn.ghost { background: var(--control-bgColor-rest); color: var(--fgColor-default); border-color: var(--borderColor-default); font-weight: 500; }
.pl-dots { display: inline-flex; gap: 4px; }
.pl-dot { font: 600 11px/1 var(--fontStack-mono); width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 1px solid var(--borderColor-default);
  background: var(--bgColor-default); color: var(--fgColor-muted); }
.pl-dot.on { background: var(--bgColor-accent-emphasis); color: var(--fgColor-onEmphasis); border-color: transparent; }
.pl-cap { font-size: 13px; color: var(--fgColor-muted); min-width: 0; flex: 1 1 16em; }
.pl-cap b { color: var(--fgColor-accent); font-family: var(--fontStack-mono); font-size: 12px; }
.g-node, .g-edge, .g-elabel, .g-glabel, .seq-row, .st-card { transition: opacity .6s ease, box-shadow .5s ease, stroke .5s ease; }
.pl-bar { flex: 1 0 100%; height: 2px; background: var(--borderColor-muted); border-radius: 1px; overflow: hidden; }
.pl-bar i { display: block; height: 100%; background: var(--fgColor-accent); transform-origin: left center; transform: scaleX(0); }
.g-run { animation: g-dot 1.9s ease forwards; }
@keyframes g-dot { 0% { opacity: 0; } 12%, 78% { opacity: 1; } 100% { opacity: 0; } }
.playing .g-node:not(.on), .playing .g-elabel:not(.on), .playing .g-glabel { opacity: .28; }
.playing .g-edge:not(.on) { opacity: .2; }
.g-node.on { box-shadow: 0 0 0 3px var(--bgColor-default), 0 0 0 6px var(--fgColor-accent); }
.g-edge.on { stroke: var(--fgColor-accent); stroke-width: 2.6; stroke-dasharray: 7 5; animation: g-flow .9s linear infinite; opacity: 1; }
.g-elabel.on { color: var(--fgColor-accent); font-weight: 600; }
.g-run { fill: var(--fgColor-accent); }
@keyframes g-flow { to { stroke-dashoffset: -12; } }
.seq.playing .seq-row:not(.on) { opacity: .25; }
.seq-row.on .seq-msg { animation: s-grow 1.2s cubic-bezier(.45, 0, .25, 1); }
.seq-row.on .seq-msg.r { transform-origin: left center; } .seq-row.on .seq-msg.l { transform-origin: right center; }
.seq-row.on .seq-lb, .seq-row.on .seq-self { color: var(--fgColor-accent); font-weight: 600; }
@keyframes s-grow { from { transform: scaleX(0); } }
.st-grid.playing .st-card:not(.on) { opacity: .3; }
.st-card.on { box-shadow: 0 0 0 3px var(--bgColor-default), 0 0 0 6px var(--fgColor-accent); }
@media (prefers-reduced-motion: reduce) { .g-edge.on, .seq-row.on .seq-msg { animation: none; } }
/* 画面の見取り図（screen） */
.sc-panes { display: grid; gap: 16px; }
.sc-panes.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sc-pane .ph { font-size: 12px; font-weight: 600; color: var(--fgColor-muted); margin-bottom: 6px; }
.sc-win { border: 1px solid var(--borderColor-default); border-radius: 8px; overflow: hidden; background: var(--bgColor-default); box-shadow: 0 1px 3px var(--borderColor-translucent); }

  const mineEl = th.mine && th.mine.quote ? el("div", { class: "comment" }, avatar("私"),
    el("div", {}, el("div", { class: "c-head" }, el("b", {}, "私"), ` · ${th.mine.when}（冒頭だけ）`), body(th.mine.quote, "c-body clamp"))) : null;
  const theirEl = th.quote ? el("div", { class: "comment" }, avatar(th.who || "?"),
    el("div", {}, el("div", { class: "c-head" }, el("b", {}, th.who), ` · ${th.when}`), body(th.quote))) : null;
  box.append(...(th.my_turn || th.side_last ? [mineEl, theirEl] : [theirEl, mineEl]).filter(Boolean));
  const f = th.changed && sinceView ? sinceView.files.find(x => x.path === th.path) : null;
  if (f) box.append(el("div", { class: "after" },
    el("div", { class: "after-head" }, icon("dot"), el("span", {}, "このあと ", el("b", {}, rich(sinceView.label)), " でこの file が変わった"),
      el("span", { class: "add" }, `+${f.add}`), el("span", { class: "del" }, `−${f.del}`), jump(f, "差分を読む ↓"))));
  if (th.href) box.append(el("div", { class: "thread-foot" }, el("a", { class: "btn", href: th.href }, "GitHub で開いて返信")));

if ((M.threads || []).length) {
  const mineN = M.threads.filter(t => t.my_turn).length;
  app.append(section("threads", "指摘", `${M.threads.length} 件${mineN ? ` · うち ${mineN} 件が私の返すターン` : ""}`, M.threads.map(thread)));
}

// ── 5 分: CI（落ちたチェックごとに、失敗した step のログの末尾） ──
function ciBox(c) {
  const lines = c.log || [];
  const err = [...lines].reverse().find(l => l.includes("##[error]"));
  return el("article", { class: "thread" },
    el("div", { class: "thread-head" }, el("b", {}, c.name),
      el("span", { class: "right" }, c.url ? el("a", { class: "btn", href: c.url }, "ログを開く") : null)),
    err ? el("div", { class: "ci-err" }, err.replace(/^.*##\[error\]/, "")) : null,
    lines.length ? el("pre", { class: "log" }, lines.map(l => [el("span", { class: l.includes("##[error]") ? "err" : null }, l), "\n"]))
      : el("div", { class: "ci-err muted" }, c.note || "ログを取れなかった。"));
}
if ((M.ci || []).length) app.append(section("ci", "CI", `${M.ci.length} 件が赤`, M.ci.map(ciBox)));

// ── 5 分: 変更（前回から / 全体 などの見え方を切り替える） ──
if (views.length) {
  const holder = el("div", { class: "files" });
  const noteEl = el("p", { class: "note" });
  const draw = v => {
    holder.replaceChildren();
    noteEl.replaceChildren(...[v.note || null, v.url ? [v.note ? " " : null, el("a", { href: v.url }, "GitHub で開く")] : null].flat().filter(Boolean));
    if (!v.text) return;
    drawDiff(holder, v.text);
    // file の箱と v.files は同じ diff の同じ順（v.files は parse_diff）なので、数が合えば順で組む。名前の後ろ一致で
    // 組むと、package.json が packages/web/package.json の箱を取り、同じ階層の改名（src/{a.py → b.py}）はどれにも当たらない
    const wrappers = [...holder.querySelectorAll(".d2h-file-wrapper")];
    const named = name => v.files.filter(x => name.endsWith(x.path)).sort((a, b) => b.path.length - a.path.length)[0];
    wrappers.forEach((w, i) => {
      const f = (wrappers.length === v.files.length ? v.files[i] : named(fileName(w))) || byPath.get(fileName(w));
      const head = w.querySelector(".d2h-file-header");
      if (f) w.id = "file-" + f.anchor;
      head.prepend(el("span", { class: "chev", "aria-hidden": "true" }, "▾"));
      head.setAttribute("role", "button"); head.setAttribute("tabindex", "0"); head.setAttribute("aria-expanded", "true");
      const toggle = () => { w.classList.toggle("collapsed"); head.setAttribute("aria-expanded", String(!w.classList.contains("collapsed"))); };
      head.addEventListener("click", e => { if (!e.target.closest("a")) toggle(); });
      head.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      if (f) head.append(el("span", { class: "fh-extra" }, el("span", { class: "add" }, `+${f.add}`), el("span", { class: "del" }, `−${f.del}`),
        M.kind === "pr" && H.url ? el("a", { href: `${H.url}/files#${f.anchor}`, title: "GitHub の Files changed でこの file を開く" }, "GitHub") : null));
      // 全体では、前回から変わっていない file を畳んで見出しだけにする
      if (v.id === "all" && sinceView && f && !sinceView.files.some(x => x.path === f.path)) toggle();
    });
  };
  const buttons = views.map(v => el("button", { type: "button", "aria-pressed": "false", onclick: () => select(v) }, v.name));
  let current = null;
  const select = v => { if (v === current) return; current = v; buttons.forEach((b, i) => b.setAttribute("aria-pressed", String(views[i] === v))); draw(v); };
  window.__selectView = id => { const v = views.find(x => x.id === id); if (v) select(v); };
  const sec = section("changes", "変更", M.scale || null, noteEl, holder);
  if (views.length > 1) sec.querySelector(".sec-head").append(el("div", { class: "seg tools", role: "group", "aria-label": "差分の範囲" }, buttons));
  app.append(sec);
  select(views[0]);
}

// ── 手元（機械の行のまま） ──
if (M.local) app.append(section("local", "手元", null, el("pre", { class: "log plain" }, M.local)));

// ── 末尾: 見ていないもの ──
const unseen = [...new Set([...(A.unseen || []), ...(M.unseen || [])])];
if (unseen.length) app.append(el("details", { class: "foot" }, el("summary", {}, `この報告が見ていないもの（${unseen.length} 件）`), el("ul", {}, unseen.map(s => el("li", {}, rich(s))))));
// 目次: 窓が広ければ左に置き、セクションと件数を並べる。押すとそのセクションへ飛び、読んでいるセクションが光る（7 万 px を超えるページで迷わない）
if (WIDE) {
  const secs = [...app.querySelectorAll("section.sec")];
  const subOf = { about: [["points", "変えたこと"], ["explain", "説明"]], now: [["since", "前回から"]] };
  const items = secs.flatMap(sec => {
    const h = sec.querySelector(".sec-head h2"), sub = sec.querySelector(".sec-head .sub");
    const head = el("li", { "data-for": sec.id }, el("a", { href: `#${sec.id}` }, h ? h.textContent : sec.id,
      sub && /\d/.test(sub.textContent) && sub.textContent.length <= 16 ? el("span", { class: "toc-n" }, sub.textContent) : null));
    const kids = (subOf[sec.id] || []).filter(([id]) => document.getElementById(id))
      .map(([id, t]) => el("li", { class: "toc-sub", "data-for": id }, el("a", { href: `#${id}` }, t)));
    return [head, ...kids];
  });
  const toc = el("nav", { class: "toc", "aria-label": "目次" }, el("div", { class: "toc-h" }, H.number ? `#${H.number}` : "目次"), el("ol", {}, items));
  document.body.append(toc);
  if ("IntersectionObserver" in window) {
    const marks = new Map(items.map(li => [li.dataset.for, li]));
    const io = new IntersectionObserver(es => {
      for (const e of es) if (e.isIntersecting) {
        items.forEach(li => li.classList.remove("cur"));
        const li = marks.get(e.target.id);
        if (li) li.classList.add("cur");
      }
    }, { rootMargin: "-10% 0px -80% 0px" });
    for (const id of marks.keys()) { const t = document.getElementById(id); if (t) io.observe(t); }
  }
}
});
