<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 外のサイトから何も読まない（ページの中のスクリプトと style だけ。/catchup の雛形と同じ決まり） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>milestone-map</title>
<!--
マイルストーンの地図の雛形。埋めるのは attention/scripts/milestone-map.py（手で埋めない）。
  - body の頭の差し込み口: 見出し・数・クリティカルパスの 1 行・ツールバー・地図の入れ物
  - id="map-data": 地図の材料（列・マイルストーン・issue・線）。形は milestone-map.py の view()
どの列に置くかは Python が決め、画面の上の座標はこのスクリプトが決める（枠の開け閉めで置き直すため）。
色は /catchup と同じ Primer の functional の token（@primer/primitives）。VS Code の暗い色の設定にも合わせる。
-->
<style>
:root {
  --bgColor-default: #ffffff; --bgColor-muted: #f6f8fa; --bgColor-inset: #f6f8fa; --bgColor-neutral-muted: #818b981f;
  --bgColor-accent-muted: #ddf4ff; --bgColor-accent-emphasis: #0969da;
  --bgColor-success-muted: #dafbe1; --bgColor-success-emphasis: #1f883d;
  --bgColor-danger-muted: #ffebe9; --bgColor-danger-emphasis: #cf222e;
  --bgColor-severe-muted: #fff1e5; --bgColor-neutral-emphasis: #59636e;
  --fgColor-default: #1f2328; --fgColor-muted: #59636e; --fgColor-accent: #0969da; --fgColor-onEmphasis: #ffffff;
  --fgColor-success: #1a7f37; --fgColor-danger: #d1242f; --fgColor-severe: #bc4c00; --fgColor-done: #8250df;
  --borderColor-default: #d1d9e0; --borderColor-muted: #d1d9e0b3; --borderColor-translucent: #1f232826;
  --frame-bg: #f6f8fab3; --col-alt: #f6f8fa80; --col-late: #ffebe94d; --shadow: 0 1px 2px #1f23281a, 0 3px 8px #1f23280f;
  --fontStack-system: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
  --fontStack-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not(:has(body.vscode-light)) {
    --bgColor-default: #0d1117; --bgColor-muted: #151b23; --bgColor-inset: #010409; --bgColor-neutral-muted: #656c7633;
    --bgColor-accent-muted: #388bfd1a; --bgColor-accent-emphasis: #1f6feb;
    --bgColor-success-muted: #2ea04326; --bgColor-success-emphasis: #238636;
    --bgColor-danger-muted: #f851491a; --bgColor-danger-emphasis: #da3633;
    --bgColor-severe-muted: #db6d281a; --bgColor-neutral-emphasis: #656c76;
    --fgColor-default: #f0f6fc; --fgColor-muted: #9198a1; --fgColor-accent: #4493f8; --fgColor-onEmphasis: #ffffff;
    --fgColor-success: #3fb950; --fgColor-danger: #f85149; --fgColor-severe: #db6d28; --fgColor-done: #ab7df8;
    --borderColor-default: #3d444d; --borderColor-muted: #3d444db3; --borderColor-translucent: #ffffff26;
    --frame-bg: #151b23b3; --col-alt: #151b2380; --col-late: #f851490f; --shadow: 0 1px 2px #0006, 0 3px 8px #0004;
    color-scheme: dark;
  }
}
:root:has(body.vscode-dark) {
  --bgColor-default: #0d1117; --bgColor-muted: #151b23; --bgColor-inset: #010409; --bgColor-neutral-muted: #656c7633;
  --bgColor-accent-muted: #388bfd1a; --bgColor-accent-emphasis: #1f6feb;
  --bgColor-success-muted: #2ea04326; --bgColor-success-emphasis: #238636;
  --bgColor-danger-muted: #f851491a; --bgColor-danger-emphasis: #da3633;
  --bgColor-severe-muted: #db6d281a; --bgColor-neutral-emphasis: #656c76;
  --fgColor-default: #f0f6fc; --fgColor-muted: #9198a1; --fgColor-accent: #4493f8; --fgColor-onEmphasis: #ffffff;
  --fgColor-success: #3fb950; --fgColor-danger: #f85149; --fgColor-severe: #db6d28; --fgColor-done: #ab7df8;
  --borderColor-default: #3d444d; --borderColor-muted: #3d444db3; --borderColor-translucent: #ffffff26;
  --frame-bg: #151b23b3; --col-alt: #151b2380; --col-late: #f851490f; --shadow: 0 1px 2px #0006, 0 3px 8px #0004;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
/* ページ自体はスクロールさせず、地図の領域だけを動かす（見出しとツールバーはいつも見えている）。
   地図の領域の高さはスクリプトが窓の下の端までに合わせる。VS Code の HTML を見る拡張（simple-html-viewer）は body の中身を
   自分の div で包むので、body の flex や height: 100% に頼ると地図の高さが 0 になり、何も出ない */
body { margin: 0; overflow: hidden; background: var(--bgColor-default);
  color: var(--fgColor-default); font: 14px/1.5 var(--fontStack-system); }
a { color: var(--fgColor-accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.muted { color: var(--fgColor-muted); }

/* ── 見出し ── */
.top { padding: 14px 24px 8px; }
.hrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.top h1 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; }
.top h1 .repo { font-weight: 400; color: var(--fgColor-muted); margin-left: 6px; }
.meta { margin: 6px 0 6px; font-size: 12px; color: var(--fgColor-muted); }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; }
.chips li { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px; border: 1px solid var(--borderColor-default);
  border-radius: 999px; font-size: 13px; color: var(--fgColor-muted); }
.chips b { color: var(--fgColor-default); font-weight: 600; font-variant-numeric: tabular-nums; }
.chips i { width: 9px; height: 9px; border-radius: 50%; background: var(--bgColor-neutral-emphasis); }
.chips .blocked i { background: var(--bgColor-danger-emphasis); }
.chips .pr i { background: var(--bgColor-success-emphasis); }
.path { margin: 0 0 4px; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.path.bad { color: var(--fgColor-danger); }
.path .arrow { color: var(--fgColor-muted); }
.path a { font-family: var(--fontStack-mono); font-size: 12.5px; font-weight: 600; }
.label { display: inline-flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 600; line-height: 22px;
  border-radius: 2em; border: 1px solid var(--borderColor-default); color: var(--fgColor-muted); }
.label.crit { background: var(--fgColor-done); border-color: transparent; color: var(--fgColor-onEmphasis); }

/* ── 期間と人（地図の上の帯） ── */
#pulse { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: flex-start; padding: 10px 24px 12px; border-top: 1px solid var(--borderColor-default); }
.span-pick { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--fgColor-muted); }
.span-pick .lab { font-weight: 600; color: var(--fgColor-default); }
.seg { display: inline-flex; border: 1px solid var(--borderColor-default); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; padding: 3px 10px; border: 0; border-right: 1px solid var(--borderColor-default); background: var(--bgColor-default);
  color: var(--fgColor-default); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--bgColor-accent-emphasis); color: var(--fgColor-onEmphasis); }
.span-pick input { font: inherit; padding: 2px 6px; border: 1px solid var(--borderColor-default); border-radius: 6px;
  background: var(--bgColor-default); color: var(--fgColor-default); }
.tcol { display: flex; gap: 20px; align-items: center; }
.big { display: flex; flex-direction: column; gap: 6px; }
.big div { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--fgColor-muted); white-space: nowrap; }
.big b { min-width: 2.2em; font-size: 22px; font-weight: 700; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; color: var(--fgColor-default); }
.big .shut b { color: var(--fgColor-success); }
.big .made b { color: var(--fgColor-accent); }
.big .left b { color: var(--fgColor-done); }
#trend { display: block; overflow: visible; }
#trend .bc { fill: var(--bgColor-success-emphasis); }
#trend .bm { fill: var(--bgColor-accent-emphasis); opacity: .55; }
#trend .ln { fill: none; stroke: var(--fgColor-done); stroke-width: 2.5; stroke-linejoin: round; }
#trend .ar { fill: var(--fgColor-done); opacity: .1; }
#trend .ax { stroke: var(--borderColor-default); }
#trend .td { stroke: var(--bgColor-accent-emphasis); stroke-dasharray: 3 3; }
#trend text { font: 11px var(--fontStack-system); fill: var(--fgColor-muted); }
#trend text.v { font-weight: 700; fill: var(--fgColor-done); }
#trend .hit { fill: transparent; }
#trend .hit:hover { fill: var(--bgColor-neutral-muted); }
.people { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; flex: 1 1 360px; max-height: 122px; overflow: auto; }  /* 見出しと 3 段がちょうど入る高さ。4 段目からは中で送る */
.people .lab { width: 100%; font-size: 12.5px; font-weight: 600; }
.who { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 3px; border: 1px solid var(--borderColor-default); border-radius: 999px;
  background: var(--bgColor-default); font: inherit; font-size: 12.5px; color: var(--fgColor-default); cursor: pointer; }
.who:hover { border-color: var(--fgColor-accent); }
.who.on { border-color: var(--fgColor-accent); background: var(--bgColor-accent-muted); }
.tour { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; font-weight: 400; color: var(--fgColor-muted); }
.tour button { font: inherit; padding: 0 8px; border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-default);
  color: var(--fgColor-default); cursor: pointer; }
.tour button:hover { border-color: var(--fgColor-accent); }
.who small { color: var(--fgColor-muted); font-size: 11.5px; }
.who small b { color: var(--fgColor-default); font-weight: 600; }
.av { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; flex: none;
  font-size: 10px; font-weight: 700; color: #fff; letter-spacing: -.3px; }
.av.etc { background: var(--bgColor-neutral-emphasis); }

/* ── ツールバー ── */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 24px; border-top: 1px solid var(--borderColor-default);
  border-bottom: 1px solid var(--borderColor-default); background: var(--bgColor-muted); font-size: 12.5px; }
.bar input { width: 220px; font: inherit; padding: 4px 10px; border: 1px solid var(--borderColor-default); border-radius: 6px;
  background: var(--bgColor-default); color: var(--fgColor-default); }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--fgColor-muted); }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.ln { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--fgColor-muted); }
.ln.crit { border-top: 4px solid var(--fgColor-done); }
.ln.late { border-top: 2px dashed var(--fgColor-severe); }
.tools { margin-left: auto; display: flex; gap: 4px; }
.tools button { font: inherit; padding: 3px 10px; border: 1px solid var(--borderColor-default); border-radius: 6px;
  background: var(--bgColor-default); color: var(--fgColor-default); cursor: pointer; }
.tools button:hover { background: var(--bgColor-neutral-muted); }

/* ── 期日の列の見出し（地図の上に固定。字は拡大・縮小しても同じ大きさ） ── */
#axis { position: relative; height: 34px; overflow: hidden; border-bottom: 1px solid var(--borderColor-default); background: var(--bgColor-default); }
#axis .h { position: absolute; top: 0; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 14px;
  font-weight: 600; color: var(--fgColor-muted); white-space: nowrap; overflow: hidden; }
#axis .h.late { color: var(--fgColor-danger); }
#axis .now { position: absolute; top: 7px; transform: translateX(-50%); padding: 0 8px; line-height: 20px; border-radius: 2em; font-size: 11.5px;
  font-weight: 700; color: var(--fgColor-onEmphasis); background: var(--bgColor-accent-emphasis); white-space: nowrap; z-index: 1; }

/* ── 地図 ── */
#view { position: relative; height: 70vh; overflow: hidden; touch-action: none; background: var(--bgColor-default); cursor: grab; outline: none; }
#view.drag { cursor: grabbing; user-select: none; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.col { position: absolute; top: 0; }
.col.alt { background: var(--col-alt); }
.col.late { background: var(--col-late); }
.today { position: absolute; top: 0; width: 0; border-left: 2px dashed var(--bgColor-accent-emphasis); opacity: .7; z-index: 1; }
/* 枠は見出しの帯と、issue の在る列ごとの区画でできる（早い列へ寄せた issue が在ると、帯が列をまたいで区画をつなぐ。
   間の列は空くので、ほかの枠が入れる） */
.frame, .pane { position: absolute; border: 1px solid var(--borderColor-default); background: var(--frame-bg); z-index: 1; }
.frame { border-radius: 12px 12px 0 0; border-bottom-color: transparent; }
/* マイルストーンの付いていない issue の枠（野良の組）は点線で、マイルストーンの枠と見分ける */
.frame.loose, .pane.loose { border-style: dashed; }
.frame.shut, .frame.bare { border-radius: 12px; border-bottom-color: var(--borderColor-default); }
.pane { border-top: none; border-radius: 0 0 12px 12px; }
.frame.wide { border-radius: 12px; border-bottom-color: var(--borderColor-default); }
.pane.wide { border-top: 1px solid var(--borderColor-default); border-radius: 0 0 12px 12px; }
.fhead { position: absolute; left: 0; right: 0; top: 0; height: 104px; padding: 10px 16px 0 34px; cursor: pointer; user-select: none;
  border-radius: 12px 12px 0 0; background: var(--bgColor-neutral-muted); }
.frame.shut .fhead, .frame.bare .fhead, .frame.wide .fhead { border-radius: 12px; }
.fhead::before { content: ""; position: absolute; left: 14px; top: 19px; border: 5px solid transparent; border-top-color: var(--fgColor-muted);
  border-bottom-width: 0; transition: transform .2s; }
.frame.shut .fhead::before { transform: rotate(-90deg); }
.fname { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 44px; font-size: 15.5px; font-weight: 700; line-height: 22px; }
.fname .no { color: var(--fgColor-muted); font-weight: 400; font-family: var(--fontStack-mono); font-size: 13px; }
.fname .no { margin-right: 6px; }
.fname a { font-size: 12px; font-weight: 400; margin-left: 4px; }
.fmeta { display: flex; gap: 10px; align-items: center; font-size: 12.5px; line-height: 22px; color: var(--fgColor-muted); white-space: nowrap; overflow: hidden; }
.fmeta .over { color: var(--fgColor-danger); font-weight: 600; }
.fpulse { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 22px; color: var(--fgColor-muted); white-space: nowrap; overflow: hidden; }
.fpulse b { color: var(--fgColor-default); font-variant-numeric: tabular-nums; }
.fpulse .c b { color: var(--fgColor-success); }
.fpulse .m b { color: var(--fgColor-accent); }
.fpulse svg { flex: none; }
.fpulse .l { fill: none; stroke: var(--fgColor-done); stroke-width: 1.5; }
.fpulse .a { fill: var(--fgColor-done); opacity: .12; }
.stack { display: inline-flex; width: 80px; height: 7px; border-radius: 3px; overflow: hidden; background: var(--bgColor-neutral-muted); flex: none; }
.stack i { display: block; height: 100%; }
.stack .blocked { background: var(--bgColor-danger-emphasis); }
.stack .pr { background: var(--bgColor-success-emphasis); }
.stack .idle { background: var(--bgColor-neutral-emphasis); opacity: .45; }
.frame:not(.bare) .empty { display: none; }
.empty { position: absolute; left: 34px; top: 106px; font-size: 12px; color: var(--fgColor-muted); }
.card { position: absolute; z-index: 3; display: block; padding: 8px 12px 8px 14px; border: 1px solid var(--borderColor-default);
  border-radius: 8px; background: var(--bgColor-default); color: var(--fgColor-default); box-shadow: var(--shadow); text-decoration: none;
  overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: transparent; }
.card.blocked::before { background: var(--bgColor-danger-emphasis); opacity: 1; }
.card.pr::before { background: var(--bgColor-success-emphasis); opacity: 1; }
.card.blocked { background: var(--bgColor-danger-muted); border-color: var(--fgColor-danger); }
.card.pr { background: var(--bgColor-success-muted); border-color: var(--fgColor-success); }
.card:hover { text-decoration: none; border-color: var(--fgColor-accent); }
.card.crit { border: 2px solid var(--fgColor-done); }
/* 期間の中で閉じた issue: 薄い点線のカードで残す */
.card.done { opacity: .62; background: var(--bgColor-default); border-style: dashed; }
.card.done .tt { text-decoration: line-through; text-decoration-color: var(--fgColor-muted); }
.card .tag.shut { color: var(--fgColor-done); border: 1px solid var(--fgColor-done); }
.card .tag.new { color: var(--fgColor-accent); border: 1px solid var(--fgColor-accent); }
.card .avs { margin-left: auto; display: inline-flex; padding-left: 4px; }
.card .avs .av { width: 22px; height: 22px; margin-left: -6px; border: 2px solid var(--bgColor-default); }
.card .avs .av.by { border-style: dashed; border-color: var(--fgColor-success); }
.card .row { display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; font-size: 12.5px; line-height: 18px; color: var(--fgColor-muted); }
.card .num { font-family: var(--fontStack-mono); font-weight: 600; }
.card .tag { padding: 0 7px; border-radius: 2em; font-size: 11.5px; font-weight: 600; line-height: 17px; }
.card .tag.blocked { color: var(--fgColor-danger); border: 1px solid var(--fgColor-danger); }
.card .tag.pr { color: var(--fgColor-success); border: 1px solid var(--fgColor-success); }
.card .tag.crit { color: var(--fgColor-onEmphasis); background: var(--fgColor-done); }
.card .tt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; font-size: 14px; line-height: 20px; }
/* 閉じた枠のカードと区画は見えなくし、押せなくする（押せると枠の見出しの上でクリックを取り、枠が開けなくなる） */
.more { position: absolute; z-index: 3; padding: 0 12px; border: 1px dashed var(--borderColor-default); border-radius: 8px; background: transparent;
  color: var(--fgColor-muted); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.more:hover { color: var(--fgColor-accent); border-color: var(--fgColor-accent); }
#world.focus .more { opacity: .28; }
.card.gone, #world.focus .card.gone, .pane.off, #world.focus .pane.off, .more.gone { opacity: 0; pointer-events: none; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 2; transition: opacity .15s; }
#wires path { fill: none; stroke: var(--fgColor-muted); stroke-width: 2; opacity: .8; }
#wires path.crit { stroke: var(--fgColor-done); stroke-width: 4; opacity: 1; }
#wires path.late { stroke: var(--fgColor-severe); stroke-dasharray: 6 4; opacity: 1; }
/* 線の上の、押せる太い透明の帯。押すと線の遠い方の端のカードへ飛ぶ */
#wires path.grab { stroke: transparent; stroke-width: 16; opacity: 1; pointer-events: stroke; cursor: pointer; }
#wires text { font: 600 12.5px var(--fontStack-system); fill: var(--fgColor-muted); paint-order: stroke; stroke: var(--bgColor-default); stroke-width: 3px; }
.anim .frame, .anim .pane, .anim .card, .anim .more { transition: left .25s ease, top .25s ease, width .25s ease, height .25s ease, opacity .2s; }
/* 載せたカードの前後の鎖・探した字に当たったカードだけを濃く出す */
#world.focus .card:not(.hot), #world.focus .frame:not(.hot), #world.focus .pane:not(.hot) { opacity: .28; }
#world.focus .card.done.hot { opacity: .8; }
#world.focus .card.gone, #world.focus .card.done.gone { opacity: 0; }   /* 隠したカードは、光らせている間も出さない */
#world.focus #wires path:not(.hot), #world.focus #wires text:not(.hot) { opacity: .08; }
#world.focus #wires path.hot { stroke-width: 3; opacity: 1; }
.card.hit { outline: 3px solid var(--fgColor-accent); outline-offset: 2px; }
/* 送った先の今のカード。探して当たったカード（.hit）とも見分けられるよう、太い枠と外の帯を付ける */
.card.cur, .card.hit.cur { outline: 4px solid var(--fgColor-accent); outline-offset: 4px; box-shadow: 0 0 0 12px color-mix(in srgb, var(--fgColor-accent) 40%, transparent); z-index: 5; }
/* 見取り図（右下） */
.mini { position: absolute; right: 16px; bottom: 16px; z-index: 10; border: 1px solid var(--borderColor-default); border-radius: 8px;
  background: var(--bgColor-default); box-shadow: var(--shadow); overflow: hidden; cursor: pointer; touch-action: none; }
.mini svg { position: absolute; left: 0; top: 0; }
.mini .mf { fill: var(--bgColor-neutral-muted); }
.mini .mc { fill: var(--borderColor-default); }
.mini .mc.blocked { fill: var(--bgColor-danger-emphasis); }
.mini .mc.pr { fill: var(--bgColor-success-emphasis); }
.mini .mc.done { fill: var(--fgColor-done); opacity: .45; }
.mview { position: absolute; border: 2px solid var(--fgColor-accent); background: #0969da14; border-radius: 3px; pointer-events: none; }
.none { position: absolute; left: 24px; top: 24px; color: var(--fgColor-muted); white-space: nowrap; }
</style>
</head>
<body>
<!--__BODY__-->
<script type="application/json" id="map-data">/*__DATA__*/null</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("map-data").textContent)
    || { columns: [], today: { at: 0, label: "" }, milestones: [], edges: [], path: [], late: [] };
  // カード・枠・列の大きさ（px）。カードの大きさを決め打ちにして、字を測らずに置く
  const CW = 280, CH = 74, G = 12, PAD = 14, HEAD = 104, SHUT_W = 320, COLGAP = 96, FGAP = 32, TOP = 22, LEFT = 32, BOTTOM = 60;
  const $ = id => document.getElementById(id);
  // 期間: 日付は YYYY-MM-DD の文字（Python が手元の時刻の日付に直して渡す）。文字のまま比べる
  const dayAdd = (d, n) => { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const TODAY = D.today.day || new Date().toISOString().slice(0, 10);
  const md = d => d.slice(0, 4) === TODAY.slice(0, 4) ? d.slice(5) : d;
  let P = { from: dayAdd(TODAY, -13), to: TODAY };
  const inP = d => !!d && d >= P.from && d <= P.to;
  const days = () => { const out = []; for (let d = P.from; d <= P.to && out.length < 400; d = dayAdd(d, 1)) out.push(d); return out; };
  // その日の終わりに残っていた数: 作られていて、まだ閉じていなかった issue（今そのマイルストーンに在る物で数える）
  const leftOn = (list, d) => list.reduce((k, i) => k + (i.made <= d && !(i.shut && i.shut <= d) ? 1 : 0), 0);
  // 人の頭文字の丸。色は login から決める（同じ人はどのページでも同じ色）
  const hue = w => { let h = 7; for (const ch of w) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 58% 42%)`; };
  const ini = w => (w.replace(/[^A-Za-z0-9]/g, "").slice(0, 2) || w.slice(0, 1)).toUpperCase();
  const view = $("view"), world = $("world");
  const NS = "http://www.w3.org/2000/svg";
  const key = e => e[0] + ">" + e[1];
  const onPath = new Set(D.path.map(key)), late = new Set(D.late.map(key));
  // by は担当者のフィールドに居ない人の言い方（点線の丸）。無ければ担当者
  const avatar = (w, by) => el("span", { class: "av" + (by ? " by" : ""), style: `background:${hue(w)}`,
    title: (by || "担当") + ": " + w }, ini(w));
  // 実質の担当: 担当者のフィールドの人と、閉じる PR を出した人（担当者のフィールドに居ない人は点線の丸）
  const doers = i => i.who.concat(i.prBy.filter(w => !i.who.includes(w)));
  function avatars(i) {
    const list = doers(i);
    if (!list.length) return null;
    const by = i.state !== "done" ? "閉じる PR を出した人（担当者ではない）" : i.how === "pr" ? "閉じた PR を出した人（担当者ではない）" : "閉じた人（担当者は居ない）";
    return el("span", { class: "avs" }, list.slice(0, 3).map(w => avatar(w, i.who.includes(w) ? null : by)),
      list.length > 3 ? el("span", { class: "av etc", title: list.slice(3).join("・") }, "+" + (list.length - 3)) : null);
  }
  const el = (tag, attrs, ...kids) => {
    const n = tag.startsWith("svg:") ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
    for (const k in attrs || {}) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    for (const c of kids.flat()) if (c != null) n.append(c);
    return n;
  };
  const axis = el("div", { id: "axis" });
  view.before(axis);

  // 線: 止めている側と待つ側のつながり（鎖を濃く出すのと、枠の中で鎖を横 1 本に並べるのに使う）
  const adj = { up: new Map(), down: new Map() };
  for (const [a, b] of D.edges) {
    if (!adj.down.has(a)) adj.down.set(a, []); adj.down.get(a).push(b);
    if (!adj.up.has(b)) adj.up.set(b, []); adj.up.get(b).push(a);
  }
  // 線の端に在る issue は、列の中の段（依存の順番。止めている側ほど左）に置く。線の無い issue は、その下に格子で並べる。
  // 地図に線が 1 本でも在るときは、線の無い issue のうち赤でも緑でもない物を、枠ごとに畳む（押すと開く）
  const linkedSet = new Set(D.edges.flat());
  const FOLD = D.edges.length > 0, CHIP = 34, step = CW + G, rowH = CH + G, rstep = CW + 64;   // rstep: 段と段の間（矢印が見える幅を空ける）
  // 列ごとに、線の無い issue を横に何枚まで並べるか（K[c]）。最初に、地図全体が画面の形にいちばん大きく収まる K を選ぶ
  let K = D.columns.map(() => 1);
  const across = (n, c) => Math.max(1, Math.min(n, K[c]));
  function part(c, list, done) {
    const linked = list.filter(i => linkedSet.has(i.n)), loose = list.filter(i => !linkedSet.has(i.n));
    const ranks = linked.map(i => i.rank);
    // 段ごとに上から詰める。止めている側が同じ区画に在れば、その行より上には置かない（鎖が横 1 本に並ぶように）
    const row = new Map(), free = new Map(), FAR = 1e9;
    const pre = i => Math.min(FAR, ...(adj.up.get(i.n) || []).filter(n => row.has(n)).map(n => row.get(n)));
    for (const r of [...new Set(ranks)].sort((a, b) => a - b)) {
      const here = linked.filter(i => i.rank === r).map(i => ({ i, p: pre(i) }))
        .sort((a, b) => a.p - b.p || (b.i.crit - a.i.crit) || a.i.n - b.i.n);
      for (const { i, p } of here) { const y = Math.max(free.get(r) || 0, p === FAR ? 0 : p); row.set(i.n, y); free.set(r, y + 1); }
    }
    return { c, list, linked, loose, done, fold: FOLD ? loose.filter(i => i.state === "idle") : [],
      r0: ranks.length ? Math.min(...ranks) : 0, r1: ranks.length ? Math.max(...ranks) : -1, row, nrows: Math.max(0, ...[...row.values()].map(y => y + 1)) };
  }
  // 人を選んでいる間は、畳んだ所からもその人のカードだけを出す（畳みを全部開くと、ほかの人のカードで地図が組み変わるため）
  let picked = null;
  const shown = (p, f) => f.folded ? p.loose.filter(i => i.state !== "idle" || (picked && picked.has(i.n))) : p.loose;
  const doneIn = p => p.done.filter(i => inP(i.shut));   // 期間の中で閉じた issue（線の無いカードの後ろに薄く並べる）
  const live = p => p.list.length + doneIn(p).length > 0;
  const off = p => p.r0 * rstep;   // 区画の左の端の、列の左の端からのずれ（いちばん左の段の位置）
  // 区画の中身の大きさ。open が真なら畳んだ issue も開いたとして数える（列の幅を開け閉めで動かさないため）
  function partSize(p, f, open) {
    const n = (open ? p.loose.length : shown(p, f).length) + doneIn(p).length, k = across(n, p.c);
    const hs = [p.nrows * rowH - G, n ? Math.ceil(n / k) * rowH - G : 0, p.fold.length ? CHIP : 0].filter(h => h > 0);
    return { w: Math.max(p.nrows ? (p.r1 - p.r0) * rstep + CW : 0, n ? k * step - G : 0, p.fold.length ? CW : 0),
      h: hs.reduce((a, b) => a + b, 0) + (hs.length - 1) * G };
  }

  const frames = D.milestones.map(m => {
    const parts = new Map();
    for (const i of m.issues) { if (!parts.has(i.col)) parts.set(i.col, []); parts.get(i.col).push(i); }
    // 閉じた issue の by は、閉じた PR を出した人（PR でなく手で閉じ、担当者も居なければ閉じた人）。open の PR を出した人と同じ扱いにする
    for (const i of m.done) Object.assign(i, { state: "done", prBy: i.by ? [i.by] : [], prOf: [] });
    if (m.done.length && !parts.has(m.col)) parts.set(m.col, []);
    for (const [c, list] of parts) parts.set(c, part(c, list, c === m.col ? m.done : []));
    const cs = [...parts.keys(), m.col];
    return { m, parts, c0: Math.min(...cs), c1: Math.max(...cs), shut: false, box: null, folded: FOLD,
      linked: m.issues.some(i => linkedSet.has(i.n)), crit: m.issues.some(i => i.crit) };
  });
  const frameOf = new Map(), issueOf = new Map(), doneAll = [];
  for (const f of frames) for (const i of f.m.issues) { frameOf.set(i.n, f); issueOf.set(i.n, i); }
  for (const f of frames) for (const i of f.m.done) { frameOf.set(i.n, f); doneAll.push(i); }
  const openAll = [...issueOf.values()];

  // 列の幅は、開いたときの枠が入る幅（開け閉めで列が動かないよう、閉じた枠・畳んだ issue も開いたときの幅で数える）
  let W = [], X = [], worldW = 600;
  function measure() {
    W = D.columns.map((_, c) => Math.max(SHUT_W, ...frames.map(f => f.parts.has(c) ? off(f.parts.get(c)) + partSize(f.parts.get(c), f, true).w + 2 * PAD : 0)));
    X = [];
    W.forEach((w, c) => X.push(c ? X[c - 1] + W[c - 1] + COLGAP : LEFT));
    worldW = W.length ? X[W.length - 1] + W[W.length - 1] + LEFT : 600;
  }

  // ── 部品を作る ──
  const cols = D.columns.map((c, k) => el("div", { class: "col" + (c.late ? " late" : k % 2 ? " alt" : "") }));
  const todayLine = el("div", { class: "today" });
  const svg = el("svg:svg", { id: "wires", "aria-hidden": "true" });
  world.append(...cols, todayLine, svg);
  if (!frames.length) world.append(el("div", { class: "none" }, "open のマイルストーンが無い"));

  for (const f of frames) {
    const m = f.m, tot = Math.max(1, m.open);
    const stack = el("span", { class: "stack", title: `止められている ${m.count.blocked}・PR が出ている ${m.count.pr}・それ以外 ${m.count.idle}` },
      ["blocked", "pr", "idle"].map(s => el("i", { class: s, style: `width:${100 * m.count[s] / tot}%` })));
    const head = el("div", { class: "fhead", role: "button", tabindex: "0", title: "押すと開け閉めする" },
      el("div", { class: "fname" }, m.none ? null : el("span", { class: "no" }, "#" + m.n), el("span", { class: "tt", title: m.title }, m.title),
        el("a", { href: m.url, title: m.none ? "GitHub でマイルストーンの付いていない open の issue を全部開く（日付ごとの枠に分けた物も含む）" : "GitHub のマイルストーンを開く" }, "↗")),
      el("div", { class: "fmeta" }, el("span", {}, m.due), m.overdue ? el("span", { class: "over" }, `期日切れ ${m.overdue} 日`) : null,
        el("span", {}, `残り ${m.open}・閉じた ${m.closed}`), m.open ? stack : null),
      f.pulse = el("div", { class: "fpulse" }));
    head.querySelector("a").addEventListener("click", ev => ev.stopPropagation());
    const toggle = () => { f.shut = !f.shut; layout(); };
    head.addEventListener("click", toggle);
    head.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); } });
    f.el = el("div", { class: "frame" + (m.none ? " loose" : ""), "data-m": m.n }, head, el("div", { class: "empty" }, "open の issue は無い"));
    f.panes = new Map([...f.parts.keys()].map(c => [c, el("div", { class: "pane" + (m.none ? " loose" : "") })]));
    world.append(f.el, ...f.panes.values());
    f.chips = new Map();
    for (const [c, p] of f.parts) if (p.fold.length) {
      const chip = el("button", { class: "more", type: "button" });
      chip.addEventListener("click", () => { f.folded = !f.folded; layout(); });
      f.chips.set(c, chip);
      world.append(chip);
    }
    for (const i of m.issues) {
      i.newTag = el("span", { class: "tag new", title: "期間の中で作られた" }, "新");
      const tags = [i.crit ? el("span", { class: "tag crit" }, "クリティカル") : null, i.newTag,
        i.blockers ? el("span", { class: "tag blocked" }, `止め ${i.blockers}`) : null,
        i.prs.length ? el("span", { class: "tag pr" }, "PR " + i.prs.map(p => "#" + p).join(" ")) : null];
      i.el = el("a", { class: `card ${i.state}${i.crit ? " crit" : ""}`, id: "i" + i.n, href: i.url, title: i.tip,
        style: `width:${CW}px;height:${CH}px` },
        el("div", { class: "row" }, el("span", { class: "num" }, "#" + i.n), tags, avatars(i)), el("div", { class: "tt" }, i.title));
      i.el.addEventListener("mouseenter", () => focusOn(chain(i.n)));
      i.el.addEventListener("mouseleave", () => focusOn(resting()));
      world.append(i.el);
    }
    for (const i of m.done) {
      i.el = el("a", { class: "card done", id: "i" + i.n, href: i.url, style: `width:${CW}px;height:${CH}px`,
        title: [`#${i.n} ${i.title}`, "閉じた日: " + i.shut, "作られた日: " + i.made].concat(i.who.length ? ["担当: " + i.who.join("・")] : [],
          i.by ? [(i.how === "pr" ? "閉じた PR を出した人: " : "閉じた人: ") + i.by] : []).join("\n") },
        el("div", { class: "row" }, el("span", { class: "num" }, "#" + i.n), el("span", { class: "tag shut" }, "閉じた " + md(i.shut)), avatars(i)),
        el("div", { class: "tt" }, i.title));
      world.append(i.el);
    }
  }

  // ── 置く: 枠を期日の列に置き、上から空いている所へ詰める（列の幅より狭い枠は、列の中で左右にずらして隙間を探す）。
  // 枠の形は見出しの帯 1 本と列ごとの区画。重なりは帯と区画の 1 つずつで見るので、帯の下の空いた列にはほかの枠が入る ──
  let worldH = 400;
  function shape(f, x) {
    // x は 1 列だけで線の無い枠の左の端（列の中で左右にずらせる）。線の在る枠は、段の位置に合わせて置き場が決まる。
    // 戻り値は枠の帯と区画（y は枠の上の端からの距離）。
    // 閉じた枠も、issue の在る列の幅に帯を残す（線を issue の列の位置から引き、左から右の流れを保つため）
    const one = f.c0 === f.c1, x1 = one && f.linked ? X[f.c0] + off(f.parts.get(f.c0)) : x;
    const any = [...f.parts.values()].some(live);
    if (f.shut || !any) {
      const w = one ? (f.shut ? SHUT_W : W[f.c0]) : X[f.c1] + SHUT_W - X[f.c0];
      return { head: { x: one ? x1 : X[f.c0], w, h: HEAD + (any ? 0 : 26) }, panes: [], bare: !any };
    }
    const panes = [...f.parts].filter(([, p]) => live(p)).map(([c, p]) => {
      const sz = partSize(p, f);
      return { c, x: one ? x1 : X[c] + off(p), w: sz.w + 2 * PAD, h: sz.h + PAD };
    });
    const x0 = Math.min(...panes.map(p => p.x)), xe = Math.max(...panes.map(p => p.x + p.w));
    return { head: { x: x0, w: Math.max(SHUT_W, xe - x0), h: HEAD }, panes: panes.map(p => Object.assign(p, { y: HEAD })) };
  }
  // 枠を置く場所だけを決める（画面には触らない。K を選ぶ試しでも使う）。クリティカルパスの在る枠から先に上へ置き、
  // 鎖が地図の上に横 1 本で通るようにする。列をまたぐ枠は帯が横に長く、下の枠を押し下げるので、同じ組の中では後に置く
  function place() {
    const placed = [], out = [];
    const bottom = f => { const s = shape(f, X[f.c0]); return Math.max(s.head.h, ...s.panes.map(p => p.y + p.h)); };
    const order = frames.slice().sort((a, b) => (b.crit - a.crit) || (b.linked - a.linked) || (a.c1 - a.c0) - (b.c1 - b.c0) || a.c0 - b.c0 || bottom(b) - bottom(a));
    for (const f of order) {
      let xs = [0];
      if (f.c0 === f.c1 && !f.linked) {
        const c = f.c0, w = shape(f, 0).head.w;
        xs = [];
        for (let x = X[c]; x <= X[c] + W[c] - w + 0.5; x += step) xs.push(x);
        if (!xs.length || xs[xs.length - 1] < X[c] + W[c] - w) xs.push(X[c] + W[c] - w);
      }
      let best = null;
      for (const x of xs) {
        const s = shape(f, x), rects = [{ x: s.head.x, w: s.head.w, dy: 0 }, ...s.panes.map(p => ({ x: p.x, w: p.w, dy: p.y }))];
        let y = TOP;
        for (const r of rects) for (const p of placed) if (p.x < r.x + r.w && r.x < p.x + p.w) y = Math.max(y, p.y + p.h + FGAP - r.dy);
        if (!best || y < best.y) best = { x, y, s };
      }
      const { y, s } = best;
      placed.push({ x: s.head.x, w: s.head.w, y, h: s.head.h }, ...s.panes.map(p => ({ x: p.x, w: p.w, y: y + p.y, h: p.h })));
      out.push({ f, y, s });
    }
    return { out, h: Math.max(400, ...placed.map(p => p.y + p.h + BOTTOM)) };
  }
  // K を選ぶ: 列ごとの高さの目安をそろえる候補を作り、実際に置いてみて、画面に全体を収めたときの倍率がいちばん大きい物を採る
  function optimize() {
    const vw = Math.max(400, view.clientWidth), vh = Math.max(300, view.clientHeight);
    // 線の無いカードは畳まずに数える（開いたときに 1 列で縦に伸びないよう。列の幅も開いたときの形で決めている）
    const sizes = D.columns.map((_, c) => frames.filter(f => f.parts.has(c)).map(f => ({ p: f.parts.get(c), n: f.parts.get(c).loose.length + doneIn(f.parts.get(c)).length })));
    const kmax = sizes.map(l => Math.max(1, ...l.map(x => x.n)));
    const est = (c, k) => sizes[c].reduce((h, { p, n }) => h + HEAD + PAD + FGAP + (p.nrows + (n ? Math.ceil(n / Math.min(n, k)) : 0)) * rowH + (p.fold.length ? CHIP : 0), 0);
    const targets = new Set();
    sizes.forEach((_, c) => { for (let k = 1; k <= kmax[c]; k++) targets.add(est(c, k)); });
    let best = null;
    const seen = new Set();
    for (const t of targets) {
      K = kmax.map((m, c) => { let k = 1; while (k < m && est(c, k) > t) k++; return k; });
      const id = K.join(",");
      if (seen.has(id)) continue;
      seen.add(id);
      measure();
      const h = place().h, fit = Math.min(vw / worldW, vh / h), area = worldW * h;
      if (!best || fit > best.fit + 1e-9 || (Math.abs(fit - best.fit) <= 1e-9 && area < best.area)) best = { fit, area, K: K.slice() };
    }
    if (best) K = best.K;
    measure();
  }
  function layout() {
    const { out, h } = place();
    for (const { f, y, s } of out) {
      f.box = { x: s.head.x, y, w: s.head.w, h: s.head.h };
      const wide = s.panes.length > 1 || (s.panes.length === 1 && s.panes[0].w < s.head.w - 1);
      f.el.classList.toggle("shut", f.shut);
      f.el.classList.toggle("bare", !!s.bare);
      f.el.classList.toggle("wide", wide);
      Object.assign(f.el.style, { left: f.box.x + "px", top: y + "px", width: f.box.w + "px", height: s.head.h + "px" });
      for (const [c, pane] of f.panes) {
        const p = s.panes.find(q => q.c === c);
        pane.classList.toggle("wide", wide);
        pane.classList.toggle("off", !p);
        if (p) Object.assign(pane.style, { left: p.x + "px", top: y + p.y + (wide ? 4 : 0) + "px", width: p.w + "px", height: p.h - (wide ? 4 : 0) + "px" });
        else Object.assign(pane.style, { left: f.box.x + "px", top: y + "px", width: f.box.w + "px", height: HEAD + "px" });
      }
      for (const [c, part] of f.parts) {
        const p = s.panes.find(q => q.c === c), chip = f.chips.get(c);
        const put = (i, pos, gone) => { i.pos = pos; i.el.classList.toggle("gone", gone); Object.assign(i.el.style, { left: pos.x + "px", top: pos.y + "px" }); };
        if (!p) {
          for (const i of part.list.concat(part.done)) put(i, { x: f.box.x + PAD, y: y + 8 }, true);
          if (chip) chip.classList.add("gone");
          continue;
        }
        const bx = p.x + PAD, y0 = y + HEAD + (wide ? 4 : 0);
        for (const i of part.linked) put(i, { x: bx + (i.rank - part.r0) * rstep, y: y0 + part.row.get(i.n) * rowH }, false);
        let yy = y0 + part.nrows * rowH;
        const ls = shown(part, f).concat(doneIn(part)), k = across(ls.length, c);
        ls.forEach((i, j) => put(i, { x: bx + (j % k) * step, y: yy + Math.floor(j / k) * rowH }, false));
        if (ls.length) yy += Math.ceil(ls.length / k) * rowH;
        const on = new Set(ls);
        for (const i of part.loose.concat(part.done)) if (!on.has(i)) put(i, { x: bx, y: yy }, true);
        if (chip) {
          chip.classList.remove("gone");
          chip.textContent = `依存も PR も無い issue ${part.fold.length} 件 ${f.folded ? "▸ 開く" : "▾ 畳む"}`;
          chip.title = "blocked by で、ほかの issue を止めてもいないし止められてもいない。open の PR も無い issue。" + (f.folded ? "押すと開く" : "押すと畳む");
          Object.assign(chip.style, { left: bx + "px", top: yy + "px", width: CW + "px", height: CHIP + "px" });
        }
      }
    }
    worldH = h;
    cols.forEach((e, c) => Object.assign(e.style, { left: X[c] - COLGAP / 2 + "px", width: W[c] + COLGAP + "px", height: worldH + "px" }));
    const at = D.today.at;
    const tx = !W.length ? -1 : at <= 0 ? X[0] - COLGAP / 2 : at >= W.length ? X[W.length - 1] + W[W.length - 1] + COLGAP / 2 : X[at] - COLGAP / 2;
    Object.assign(todayLine.style, { left: tx + "px", height: worldH + "px", display: tx < 0 ? "none" : "" });
    world.style.width = worldW + "px";
    world.style.height = worldH + "px";
    svg.style.opacity = 0;
    wires();
    setTimeout(() => { svg.style.opacity = 1; }, world.classList.contains("anim") ? 260 : 0);
    fillMini();
    apply();
  }

  // ── 線: 止めている側の右の端から、待つ側の左の端へ。閉じた枠の issue は枠の端から引き、同じ端どうしは 1 本にまとめて本数を添える ──
  function end(n, out) {
    const f = frameOf.get(n), i = issueOf.get(n);
    if (!f) return null;
    if (f.shut) {
      if (f.c0 === f.c1) return { id: "m" + f.m.n, x: out ? f.box.x + f.box.w : f.box.x, y: f.box.y + HEAD / 2 };
      return { id: "m" + f.m.n + ":" + i.col, x: out ? Math.min(f.box.x + f.box.w, X[i.col] + SHUT_W) : X[i.col], y: f.box.y + HEAD / 2 };
    }
    return { id: "i" + n, x: out ? i.pos.x + CW : i.pos.x, y: i.pos.y + CH / 2 };
  }
  function wires() {
    svg.textContent = "";
    svg.setAttribute("width", worldW);
    svg.setAttribute("height", worldH);
    const mk = (id, color) => el("svg:marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 10, markerHeight: 10,
      markerUnits: "userSpaceOnUse", orient: "auto" }, el("svg:path", { d: "M0,0 L10,5 L0,10 z", style: `fill:${color};stroke:none` }));
    svg.append(el("svg:defs", {}, mk("ar-plain", "var(--fgColor-muted)"), mk("ar-crit", "var(--fgColor-done)"), mk("ar-late", "var(--fgColor-severe)")));
    const groups = new Map();
    for (const e of D.edges) {
      const a = end(e[0], true), b = end(e[1], false);
      if (!a || !b || a.id === b.id) continue;
      const kind = onPath.has(key(e)) ? "crit" : late.has(key(e)) ? "late" : "plain";
      const g = groups.get(a.id + ">" + b.id) || { a, b, n: [], kind: "plain" };
      g.n.push(e);
      if (kind === "crit" || (kind === "late" && g.kind === "plain")) g.kind = kind;
      groups.set(a.id + ">" + b.id, g);
    }
    for (const g of groups.values()) {
      const { a, b } = g, dx = Math.max(40, Math.abs(b.x - a.x) / 2);
      const ns = g.n.flat().join(" ");
      const d = `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x - 2},${b.y}`;
      svg.append(el("svg:path", { class: g.kind === "plain" ? null : g.kind, "data-n": ns, "marker-end": `url(#ar-${g.kind})`, d }));
      svg.append(grab(g, d));
      if (g.n.length > 1) svg.append(el("svg:text", { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 6, "text-anchor": "middle", "data-n": ns }, g.n.length + " 本"));
    }
  }

  // 線に載せると線の両端の鎖を光らせ、押すと遠い方の端（押した所から離れた方）のカードへ飛ぶ。依存の相手を目で探さずに済むように。
  // 何本かをまとめた線は、遠い方の端の 1 件目へ飛ぶ
  function grab(g, d) {
    const froms = [...new Set(g.n.map(e => e[0]))], tos = [...new Set(g.n.map(e => e[1]))];
    const p = el("svg:path", { class: "grab", d }, el("svg:title", {},
      g.n.map(e => `#${e[0]} → #${e[1]}`).join("\n") + "\n押すと遠い方の端のカードへ飛ぶ"));
    const set = new Set(froms.concat(tos).flatMap(n => [...chain(n)]));
    p.addEventListener("mouseenter", () => focusOn(set));
    p.addEventListener("mouseleave", () => focusOn(resting()));
    p.addEventListener("click", ev => {
      const r = view.getBoundingClientRect(), x = (ev.clientX - r.left - tx) / z;
      jump((Math.abs(x - g.a.x) > Math.abs(x - g.b.x) ? froms : tos)[0]);
    });
    return p;
  }
  // 1 件のカードへ飛ぶ。枠が閉じていれば開いてから、真ん中へ動かして今のカードの枠を付ける
  function jump(n) {
    const i = issueOf.get(n) || doneAll.find(x => x.n === n), f = frameOf.get(n);
    if (!i || !f) return;
    if (f.shut) { f.shut = false; layout(); }   // 線の端のカードは畳まないので、開くのは閉じた枠だけ
    if (curEl) curEl.classList.remove("cur");
    curEl = i.el;
    curEl.classList.add("cur");
    centerOn(i);
  }

  // ── 載せたカードの前後の鎖を濃く出す ──
  function chain(n) {
    const seen = new Set([n]);
    for (const dir of ["up", "down"]) {
      const todo = [n];
      while (todo.length) for (const x of adj[dir].get(todo.pop()) || []) if (!seen.has(x)) { seen.add(x); todo.push(x); }
    }
    return seen;
  }
  function focusOn(set) {
    world.classList.toggle("focus", !!set);
    for (const i of openAll.concat(doneAll)) i.el.classList.toggle("hot", !!set && set.has(i.n));
    for (const f of frames) {
      const hot = !!set && f.m.issues.concat(f.m.done).some(i => set.has(i.n));
      f.el.classList.toggle("hot", hot);
      for (const p of f.panes.values()) p.classList.toggle("hot", hot);
    }
    for (const p of svg.querySelectorAll("[data-n]")) {
      const ns = p.getAttribute("data-n").split(" ").map(Number);
      let hot = false;
      for (let k = 0; k < ns.length; k += 2) if (set && set.has(ns[k]) && set.has(ns[k + 1])) hot = true;
      p.classList.toggle("hot", hot);
    }
  }
  // 上のクリティカルパスの番号: 載せると鎖を光らせ、押すと地図のそのカードへ飛ぶ（Ctrl か Cmd を押しながらなら GitHub を開く）
  for (const a of document.querySelectorAll(".path a[data-n]")) {
    const set = new Set(D.path.flat());
    a.title = "押すと地図のこのカードへ飛ぶ（Ctrl か Cmd を押しながらなら GitHub で開く）";
    a.addEventListener("mouseenter", () => focusOn(set));
    a.addEventListener("mouseleave", () => focusOn(resting()));
    a.addEventListener("click", ev => {
      if (ev.ctrlKey || ev.metaKey) return;
      ev.preventDefault();
      jump(Number(a.dataset.n));
    });
  }

  // ── 探す: 番号か題名に当たったカードに印を付け、閉じた枠は開く。Enter で当たったカードへ順に送る（go）──
  const q = $("q"), hits = $("hits");
  let hitList = [];
  function searched() { return q.value.trim() ? new Set(hitList.map(i => i.n)) : null; }
  // カードから離れたときに戻す光り方: 選んだ人 → 探した字 → なし
  function resting() { return whoSet() || searched(); }
  q.addEventListener("input", () => {
    const s = q.value.trim().toLowerCase().replace(/^#/, "");
    hitList = s ? [...issueOf.values()].filter(i => String(i.n) === s || i.title.toLowerCase().includes(s)) : [];
    const hs = new Set(hitList);
    for (const i of issueOf.values()) i.el.classList.toggle("hit", hs.has(i));
    if (s) { who = null; drawPeople(); }
    refresh(false);
  });
  // 日本語の変換を確定する Enter では送らない。まだ送っていなければ、Enter は 1 件目へ、Shift と Enter は最後へ
  q.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" || ev.isComposing) return;
    const d = ev.shiftKey ? -1 : 1;
    go(sent ? at + d : d > 0 ? 0 : -1);
  });

  // ── 期間と人: 期間を選ぶと、その間に閉じた・作られた数と残りの数の動きを描き、閉じた issue を枠に薄く残す ──
  const pulse = $("pulse") || el("section");
  const seg = el("div", { class: "seg" }, [1, 3, 7, 14, 30, 90].map(n => el("button", { type: "button", "data-n": n, title: n === 1 ? "今日だけ" : `今日までの ${n} 日` }, n + " 日")));
  const fromI = el("input", { type: "date", "aria-label": "期間の始め" }), toI = el("input", { type: "date", "aria-label": "期間の終わり" });
  const big = el("div", { class: "big" }), trend = el("svg:svg", { id: "trend", "aria-hidden": "true" }), people = el("div", { class: "people" });
  pulse.append(el("div", { class: "span-pick" }, el("span", { class: "lab" }, "期間"), seg, el("div", {}, fromI, " 〜 ", toI)),
    el("div", { class: "tcol" }, big, trend), people);
  seg.addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (b) setPeriod(dayAdd(TODAY, 1 - Number(b.dataset.n)), TODAY);
  });
  const typed = () => { if (fromI.value && toI.value && fromI.value <= toI.value) setPeriod(fromI.value, toI.value); };
  fromI.addEventListener("change", typed);
  toI.addEventListener("change", typed);
  const all = openAll.concat(doneAll);

  // 線（残りの数）と棒（日ごとに閉じた数・作られた数）。日に載せると数が出る
  function drawTrend() {
    const ds = days(), n = ds.length, TW = 560, TH = 104, top = 14, bot = TH - 18, bh = 30;
    const shut = ds.map(d => doneAll.filter(i => i.shut === d).length), made = ds.map(d => all.filter(i => i.made === d).length);
    const left = ds.map(d => leftOn(all, d));
    const lo = Math.min(...left), hi = Math.max(...left), bmax = Math.max(1, ...shut, ...made);
    const xw = TW / n, x = k => (k + 0.5) * xw, ly = v => top + (hi === lo ? 0.5 : (hi - v) / (hi - lo)) * (bot - bh - top - 6);
    trend.textContent = "";
    trend.setAttribute("width", TW);
    trend.setAttribute("height", TH);
    trend.setAttribute("viewBox", `0 0 ${TW} ${TH}`);
    const pts = left.map((v, k) => `${x(k).toFixed(1)},${ly(v).toFixed(1)}`);
    trend.append(el("svg:line", { class: "ax", x1: 0, x2: TW, y1: bot, y2: bot }),
      el("svg:path", { class: "ar", d: `M${x(0)},${bot} L${pts.join(" L")} L${x(n - 1)},${bot} Z` }),
      el("svg:path", { class: "ln", d: "M" + pts.join(" L") }));
    const bw = Math.max(1, Math.min(10, xw * 0.36));
    ds.forEach((d, k) => {
      if (shut[k]) trend.append(el("svg:rect", { class: "bc", x: x(k) - bw, width: bw, y: bot - shut[k] / bmax * bh, height: shut[k] / bmax * bh, rx: 1 }));
      if (made[k]) trend.append(el("svg:rect", { class: "bm", x: x(k), width: bw, y: bot - made[k] / bmax * bh, height: made[k] / bmax * bh, rx: 1 }));
      trend.append(el("svg:rect", { class: "hit", x: k * xw, width: xw, y: 0, height: bot },
        el("svg:title", {}, `${md(d)}　閉じた ${shut[k]}・作られた ${made[k]}・残り ${left[k]}`)));
    });
    // 1 日だけのときは、始めと終わりの字が重なるので 1 つだけ真ん中に出す
    if (n === 1) trend.append(el("svg:text", { x: TW / 2, y: TH - 4, "text-anchor": "middle" }, md(ds[0])),
      el("svg:text", { class: "v", x: TW / 2, y: ly(left[0]) - 5, "text-anchor": "middle" }, left[0]));
    else trend.append(el("svg:text", { x: 0, y: TH - 4 }, md(ds[0])), el("svg:text", { x: TW, y: TH - 4, "text-anchor": "end" }, md(ds[n - 1])),
      el("svg:text", { class: "v", x: x(0) + 4, y: ly(left[0]) - 5 }, left[0]),
      el("svg:text", { class: "v", x: x(n - 1) - 4, y: ly(left[n - 1]) - 5, "text-anchor": "end" }, left[n - 1]));
    const c = shut.reduce((a, b) => a + b, 0), m = made.reduce((a, b) => a + b, 0), l0 = leftOn(all, dayAdd(P.from, -1));
    big.textContent = "";
    big.append(el("div", { class: "shut" }, el("b", {}, c), "閉じた"), el("div", { class: "made" }, el("b", {}, m), "作られた"),
      el("div", { class: "left" }, el("b", {}, left[n - 1]), `残り（始めは ${l0}）`));
  }

  // 枠の見出しの 3 段目: そのマイルストーンの期間の数と、残りの数の小さな線
  function drawFramePulse(f) {
    const list = f.m.issues.concat(f.m.done), ds = days(), every = Math.max(1, Math.ceil(ds.length / 60));
    const at = ds.filter((_, k) => k % every === 0 || k === ds.length - 1), left = at.map(d => leftOn(list, d));
    const c = f.m.done.filter(i => inP(i.shut)).length, m = list.filter(i => inP(i.made)).length;
    const hi = Math.max(1, ...left), SW = 84, SH = 18, xs = k => at.length > 1 ? k / (at.length - 1) * SW : SW / 2;
    const pts = left.map((v, k) => `${xs(k).toFixed(1)},${(SH - 1 - v / hi * (SH - 3)).toFixed(1)}`);
    f.pulse.textContent = "";
    f.pulse.append(el("svg:svg", { width: SW, height: SH, viewBox: `0 0 ${SW} ${SH}` },
        el("svg:path", { class: "a", d: `M0,${SH} L${pts.join(" L")} L${SW},${SH} Z` }), el("svg:path", { class: "l", d: "M" + pts.join(" L") })),
      el("span", { class: "c" }, "閉じた ", el("b", {}, c)), el("span", { class: "m" }, "新 ", el("b", {}, m)),
      el("span", {}, "残り ", el("b", {}, left[0]), " → ", el("b", {}, left[left.length - 1])));
    f.pulse.title = `期間 ${P.from} 〜 ${P.to}`;
  }

  // 人の一覧: 担当している open の issue・出している open の PR・期間の中で閉じた issue の数。押すとその人のカードだけ光る
  let who = null;
  const NOBODY = "\u0000";

  // 光らせる組（選んだ人のカードか、探して当たったカード）が替わったときの描き直し。組のカードが閉じた枠に在れば枠を開き、
  // 畳んだ所に在ればそのカードだけを出す（shown）。地図を組み直すのは、出すカードが替わったときだけ（relayout を渡せばそれで組む）
  const inFold = set => set ? [...set].filter(n => { const i = issueOf.get(n); return i && i.state === "idle" && frameOf.get(n).folded; }).join() : "";
  function refresh(move, relayout) {
    const set = resting(), before = inFold(picked);
    let opened = false;
    if (set) for (const n of set) { const f = frameOf.get(n); if (f.shut) { f.shut = false; opened = true; } }
    picked = set;
    if (relayout) relayout();
    else if (opened || before !== inFold(set)) layout();
    focusOn(set);
    retour(move);
  }

  // 組のカードへ画面を送る（持ち主は、選んだ人が今どこを攻めているかを見たい）。送る順は、人を選んでいるときは、その人が open の
  // PR を出しているカード → 期間の中で閉じたカード（新しい順）→ ほかの担当の open のカード。探したときと、同じ順の中は左の列から
  let tour = [], at = 0, sent = false, curEl = null;
  const tourNav = el("span", { class: "tour" });
  function retour(move) {
    const set = resting();
    tour = set ? all.filter(i => set.has(i.n) && i.pos) : [];
    for (const i of tour) i.kind = i.state === "done" ? 1 : who != null && i.prBy.includes(who) ? 0 : 2;
    tour.sort((a, b) => a.kind - b.kind || (a.kind === 1 ? b.shut.localeCompare(a.shut) : a.pos.x - b.pos.x || a.pos.y - b.pos.y));
    go(0, move);
  }
  function go(k, move = true) {
    at = tour.length ? (k + tour.length) % tour.length : 0;
    const i = tour[at];
    sent = !!i && move;
    if (curEl) curEl.classList.remove("cur");
    curEl = sent ? i.el : null;
    if (sent) {
      // 人を選んだ後や探した後に枠を手で閉じていれば、送る先のカードは枠の見出しに隠れているので、枠を開いて組み直す
      const f = frameOf.get(i.n);
      if (f.shut) { f.shut = false; layout(); }
      curEl.classList.add("cur");
      centerOn(i);
    }
    drawTour();
  }
  function drawTour() {
    const where = sent ? `（${at + 1}/${tour.length}）` : "";
    hits.textContent = q.value.trim() ? `${hitList.length} 件${where}` : "";
    tourNav.textContent = "";
    if (who == null || !tour.length) return;
    const i = tour[at], btn = (t, title, k) => {
      const b = el("button", { type: "button", title }, t);
      b.addEventListener("click", () => go(k));
      return b;
    };
    tourNav.append(btn("‹", "前のカードへ", at - 1), btn(`#${i.n}`, "このカードへ画面を送る", at),
      ` ${["PR を出している", "閉じた", "担当"][i.kind]}${where}`, btn("›", "次のカードへ", at + 1));
  }
  function whoSet() {
    if (who == null) return null;
    if (who === NOBODY) return new Set(openAll.filter(i => !doers(i).length).map(i => i.n));
    return new Set(all.filter(i => doers(i).includes(who) && (i.state !== "done" || inP(i.shut))).map(i => i.n));
  }
  function drawPeople() {
    const t = new Map(), get = w => t.get(w) || (t.set(w, { open: 0, prs: new Set(), done: 0 }), t.get(w));
    for (const i of openAll) { for (const w of doers(i)) get(w).open++; for (const [p, w] of i.prOf) if (w) get(w).prs.add(p); }
    for (const i of doneAll) if (inP(i.shut)) for (const w of doers(i)) get(w).done++;
    const rows = [...t].sort((a, b) => (b[1].open + b[1].done) - (a[1].open + a[1].done) || a[0].localeCompare(b[0]));
    const nobody = openAll.filter(i => !doers(i).length).length;
    const num = (label, v) => v ? [label, el("b", {}, v), " "] : [];
    people.textContent = "";
    people.append(el("span", { class: "lab" }, "誰が進めているか", tourNav));
    for (const [w, v] of rows) {
      const b = el("button", { type: "button", class: "who" + (who === w ? " on" : ""),
        title: w + "（押すと、その人のカードへ画面を送る。‹ › で次のカードへ）\n担当: 担当者のフィールドに居るか、閉じる PR を出している open の issue\nPR: 出している open の PR\n閉じた: 期間の中で閉じた issue のうち、担当者のフィールドに居たか、閉じた PR を出した物（PR でなく手で閉じ担当者も居ない物は、閉じた人）" }, avatar(w), w,
        el("small", {}, ...num("担当 ", v.open), ...num("PR ", v.prs.size), ...num("閉じた ", v.done)));
      b.addEventListener("click", () => pick(w));
      people.append(b);
    }
    if (nobody) {
      const b = el("button", { type: "button", class: "who" + (who === NOBODY ? " on" : "") }, el("span", { class: "av etc" }, "?"), "担当なし",
        el("small", {}, el("b", {}, nobody)));
      b.addEventListener("click", () => pick(NOBODY));
      people.append(b);
    }
  }
  function pick(w) {
    who = who === w ? null : w;
    if (who != null && q.value) { q.value = ""; hitList = []; hits.textContent = ""; for (const i of openAll) i.el.classList.remove("hit"); }
    drawPeople();
    refresh(who != null);
  }

  function drawPeriod() {
    fromI.value = P.from;
    toI.value = P.to;
    for (const b of seg.children) b.classList.toggle("on", P.to === TODAY && P.from === dayAdd(TODAY, 1 - Number(b.dataset.n)));
    for (const i of openAll) i.newTag.style.display = inP(i.made) ? "" : "none";
    drawTrend();
    for (const f of frames) drawFramePulse(f);
    drawPeople();
  }
  function setPeriod(from, to) {
    // 選べる期間の上限。スクリプトは、ページを作った日から since_days 日の分の閉じた issue を取った（マイルストーンの
    // 付いていない物）ので、終わりの日を前へずらしても、始まりはその日より前にしない
    const first = dayAdd(TODAY, 1 - D.since_days);
    P = { from: from < first ? first : from, to };
    drawPeriod();
    refresh(false, () => { optimize(); layout(); });
  }

  // ── 拡大・縮小と、動かす。ブラウザのスクロールに頼らず、地図を translate と scale で動かす
  // （HTML を見る窓の作りによってはスクロールが効かないため。ホイール・ドラッグ・矢印のキー・見取り図のどれでも動く） ──
  let z = 1, tx = 0, ty = 0;
  const M = 48;  // 地図の端を越えて動かせる余白（px）
  function clamp() {
    const vw = view.clientWidth, vh = view.clientHeight, w = worldW * z, h = worldH * z;
    tx = w + 2 * M <= vw ? (vw - w) / 2 : Math.min(M, Math.max(vw - w - M, tx));
    ty = h + 2 * M <= vh ? M / 2 : Math.min(M, Math.max(vh - h - M, ty));
  }
  function apply() {
    clamp();
    world.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
    drawAxis();
    drawMini();
  }
  function zoomTo(nz, cx, cy) {
    nz = Math.min(1.6, Math.max(0.1, nz));
    cx = cx == null ? view.clientWidth / 2 : cx;
    cy = cy == null ? view.clientHeight / 2 : cy;
    const wx = (cx - tx) / z, wy = (cy - ty) / z;
    z = nz;
    tx = cx - wx * z;
    ty = cy - wy * z;
    apply();
  }
  function panBy(dx, dy) { tx -= dx; ty -= dy; apply(); }
  function center(x, y) { tx = view.clientWidth / 2 - x * z; ty = view.clientHeight / 2 - y * z; apply(); }
  // カードを真ん中へ。地図の全体を見ている小ささのままでは字が読めないので、0.8 倍より小さければそこまで寄せる
  function centerOn(i) { if (z < 0.8) z = 0.8; center(i.pos.x + CW / 2, i.pos.y + CH / 2); }
  const heads = D.columns.map(c => el("div", { class: "h" + (c.late ? " late" : "") }, c.label));
  const now = el("div", { class: "now" }, D.today.label);
  axis.append(...heads, now);
  function drawAxis() {
    heads.forEach((h, c) => {
      Object.assign(h.style, { left: X[c] * z + tx + "px", width: W[c] * z + "px" });
      h.textContent = W[c] * z < 110 ? D.columns[c].label.replace(/^期日 /, "") : D.columns[c].label;
    });
    // 今日の印は列の間の隙間に置く。縮めて隙間が狭くなったら「今日」だけにし、さらに狭ければ出さない（期日の字に重ねない）
    const gap = COLGAP * z;
    now.textContent = gap < 100 ? "今日" : D.today.label;
    Object.assign(now.style, { left: parseFloat(todayLine.style.left) * z + tx + "px", display: todayLine.style.display || (gap < 50 ? "none" : "") });
  }

  // 見取り図: 右下に地図全体を縮めて描き、今見えている所を枠で示す。押す・ドラッグするとそこへ動く
  const mini = el("div", { class: "mini", title: "地図全体。押すかドラッグすると、そこへ動く" });
  const msvg = el("svg:svg", {}), mview = el("div", { class: "mview" });
  mini.append(msvg, mview);
  view.append(mini);
  const MINI_W = 220, MINI_H = 150;
  let ms = 1;
  function drawMini() {
    ms = Math.min(MINI_W / worldW, MINI_H / worldH);
    const w = worldW * ms, h = worldH * ms;
    Object.assign(mini.style, { width: w + "px", height: h + "px" });
    Object.assign(mview.style, { left: -tx / z * ms + "px", top: -ty / z * ms + "px",
      width: view.clientWidth / z * ms + "px", height: view.clientHeight / z * ms + "px" });
  }
  function fillMini() {
    msvg.textContent = "";
    ms = Math.min(MINI_W / worldW, MINI_H / worldH);
    Object.assign(msvg.style, { width: worldW * ms + "px", height: worldH * ms + "px" });
    msvg.setAttribute("viewBox", `0 0 ${worldW} ${worldH}`);
    for (const f of frames) {
      if (!f.box) continue;
      msvg.append(el("svg:rect", { class: "mf", x: f.box.x, y: f.box.y, width: f.box.w, height: f.box.h, rx: 12 }));
      for (const i of f.m.issues.concat(f.m.done)) if (!i.el.classList.contains("gone"))
        msvg.append(el("svg:rect", { class: "mc " + i.state, x: i.pos.x, y: i.pos.y, width: CW, height: CH, rx: 8 }));
    }
    drawMini();
  }
  let mdrag = false;
  const miniGo = ev => { const r = mini.getBoundingClientRect(); center((ev.clientX - r.left) / ms, (ev.clientY - r.top) / ms); };
  // 指の捕まえ（pointer capture）は取れなくても動かす（取れないと例外になる環境がある）
  const capture = (node, id) => { try { node.setPointerCapture(id); } catch (e) { /* 捕まえなしで続ける */ } };
  mini.addEventListener("pointerdown", ev => { mdrag = true; capture(mini, ev.pointerId); miniGo(ev); });
  mini.addEventListener("pointermove", ev => { if (mdrag) miniGo(ev); });
  mini.addEventListener("pointerup", () => { mdrag = false; });

  // ホイール: そのまま回すと上下、Shift と一緒なら左右、Ctrl か ⌘ と一緒なら拡大・縮小。トラックパッドの横の動きも効く
  view.addEventListener("wheel", ev => {
    ev.preventDefault();
    const k = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? view.clientHeight : 1;
    if (ev.ctrlKey || ev.metaKey) {
      const r = view.getBoundingClientRect();
      zoomTo(z * Math.exp(-ev.deltaY * k * 0.003), ev.clientX - r.left, ev.clientY - r.top);
    } else if (ev.shiftKey && !ev.deltaX) panBy(ev.deltaY * k, 0);
    else panBy(ev.deltaX * k, ev.deltaY * k);
  }, { passive: false });
  // ドラッグ: カードや枠の見出しの上からでも動かせる。4px より動いたらドラッグとみなし、そのあとのクリック（カードを開く・枠の開け閉め）は捨てる
  let drag = null, dragged = false;
  view.addEventListener("pointerdown", ev => {
    if (ev.button !== 0 || ev.target.closest("input, button, .mini")) return;
    drag = { x: ev.clientX, y: ev.clientY, tx, ty, id: ev.pointerId };
    dragged = false;
  });
  view.addEventListener("pointermove", ev => {
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!dragged && Math.hypot(dx, dy) < 4) return;
    if (!dragged) { dragged = true; view.classList.add("drag"); capture(view, drag.id); }
    tx = drag.tx + dx;
    ty = drag.ty + dy;
    apply();
  });
  const stop = () => { drag = null; view.classList.remove("drag"); };
  view.addEventListener("pointerup", stop);
  view.addEventListener("pointercancel", stop);
  view.addEventListener("click", ev => { if (dragged) { ev.preventDefault(); ev.stopPropagation(); dragged = false; } }, true);
  view.addEventListener("dragstart", ev => ev.preventDefault());
  // キー: 矢印で動かし、+ と - で拡大・縮小、0 で全体
  view.addEventListener("keydown", ev => {
    const step = ev.shiftKey ? 400 : 80, keys = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step],
      PageUp: [0, -view.clientHeight * 0.8], PageDown: [0, view.clientHeight * 0.8] };
    if (keys[ev.key]) { ev.preventDefault(); panBy(...keys[ev.key]); }
    else if (ev.key === "+" || ev.key === "=") zoomTo(z * 1.25);
    else if (ev.key === "-") zoomTo(z / 1.25);
    else if (ev.key === "0") fit();
  });
  function fit() {
    z = Math.min(1, Math.max(0.1, Math.min((view.clientWidth - M) / worldW, (view.clientHeight - M) / worldH)));
    tx = M / 2;
    ty = M / 2;
    apply();
  }
  document.querySelectorAll(".tools button").forEach(b => b.addEventListener("click", () => {
    const act = b.dataset.act;
    if (act === "open" || act === "close") { for (const f of frames) f.shut = act === "close"; layout(); }
    else if (act === "in") zoomTo(z * 1.25);
    else if (act === "out") zoomTo(z / 1.25);
    else if (act === "fit") fit();
    else if (act === "one") zoomTo(1);
  }));
  // 地図の領域を窓の下の端まで伸ばす（拡張が中身を拡大・縮小していても、CSS の px に直して合わせる）
  function fillHeight() {
    const r = view.getBoundingClientRect(), s = view.offsetWidth ? r.width / view.offsetWidth : 1;
    view.style.height = Math.max(240, (window.innerHeight - r.top) / (s || 1) - 2) + "px";
  }
  window.addEventListener("resize", () => { fillHeight(); apply(); });

  // 最初は等倍（字を読める大きさを先にする。ほかの所へはホイール・ドラッグ・見取り図で動き、全体は「全体」で見る）
  drawPeriod();
  fillHeight();
  optimize();
  layout();
  z = 1;
  tx = ty = 0;
  apply();
  view.focus({ preventScroll: true });
  requestAnimationFrame(() => world.classList.add("anim"));
})();
</script>
</body>
</html>
