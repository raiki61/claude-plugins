<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>milestone-map</title>
<style>
:root { --fg: #1f2328; --sub: #59636e; --line: #d1d9e0; --bad: #c62828; --warn: #b26a00; --warnbg: #fff4e5; --bg: #ffffff; --soft: #f6f8fa; }
body { margin: 0; font: 14px/1.6 -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--fg); background: var(--bg); }
main { padding: 20px 28px 60px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 28px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.sub { color: var(--sub); margin: 0 0 12px; }
.headline { font-size: 16px; font-weight: 600; margin: 12px 0 4px; }
.ai { border-left: 4px solid #8250df; padding: 4px 12px; background: var(--soft); }
.ai .tag { color: #8250df; font-size: 12px; }
.fig { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.fig svg { display: block; }
.fig .cand { display: none; }
.toggle { color: var(--sub); }
#showcand { margin: 0 0 8px; }
#showcand:checked ~ .fig .cand { display: inline; }
.legend { color: var(--sub); font-size: 12px; margin: 6px 0 0; }
.legend span { margin-right: 14px; white-space: nowrap; }
.trays { display: flex; flex-wrap: wrap; gap: 8px; }
.tray { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 180px; background: var(--soft); }
.bad { color: var(--bad); font-weight: 600; }
.warn { color: var(--warn); font-weight: 600; }
details { border: 1px solid var(--line); border-radius: 6px; margin: 6px 0; padding: 4px 10px; }
details[open] { padding-bottom: 10px; }
summary { cursor: pointer; font-weight: 600; }
summary .meta { font-weight: 400; color: var(--sub); margin-left: 8px; }
ul { margin: 4px 0; padding-left: 20px; }
li { margin: 1px 0; }
.note { color: var(--sub); font-size: 12px; }
.weeks { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
a { color: #0969da; }
</style>
</head>
<body>
<main>
<!--__BODY__-->
</main>
</body>
</html>
